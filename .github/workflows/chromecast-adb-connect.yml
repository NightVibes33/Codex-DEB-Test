name: Chromecast ADB Connect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/chromecast-adb-connect.yml

permissions:
  contents: read

concurrency:
  group: chromecast-adb-connect
  cancel-in-progress: true

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            -o environments.json
          python3 scripts/resolve-github-environment.py environments.json "$TARGET_ENVIRONMENT_ID" >> "$GITHUB_OUTPUT"

  adb-connect:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Join existing Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install ADB tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends adb netcat-openbsd

      - name: Test ADB endpoint
        env:
          TARGET: "100.81.33.70"
          PORT: "41747"
        run: |
          set -o pipefail
          {
            echo "target=${TARGET}:${PORT}"
            echo "=== tailscale ping ==="
            tailscale ping -c 3 "$TARGET" || true
            echo
            echo "=== tcp probe ==="
            nc -z -v -w 5 "$TARGET" "$PORT" 2>&1 || true
            echo
            echo "=== adb connect ==="
            adb start-server
            adb connect "$TARGET:$PORT" 2>&1 || true
            echo
            echo "=== adb devices ==="
            adb devices -l 2>&1 || true
          } | tee chromecast-adb.txt

      - name: Upload ADB output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromecast-adb-${{ github.run_id }}
          path: chromecast-adb.txt
          if-no-files-found: warn
          retention-days: 1
