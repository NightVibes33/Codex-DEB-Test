name: Check Gif2Ani 3.1.3 Final Build

on:
  push:
    branches: [main]
    paths:
      - triggers/check-gif2ani-313-final-build.txt

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Dark-Boot final builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NightVibes33/Dark-Boot/actions/workflows/build-gif2ani-313-final.yml/runs?per_page=5" > runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          runs=json.load(open('runs.json')).get('workflow_runs',[])
          out=['Gif2Ani 3.1.3 Final Build Status']
          if not runs:
              out.append('no_runs_found=yes')
          else:
              r=runs[0]
              out += [f"run_id={r['id']}",f"status={r['status']}",f"conclusion={r.get('conclusion')}",f"head_sha={r['head_sha']}",f"created_at={r['created_at']}",f"updated_at={r['updated_at']}"]
          Path('remote/gif2ani-313-final-build-status.txt').write_text('\n'.join(out)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add remote/gif2ani-313-final-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 3.1.3 final build status [skip ci]"
            git push origin HEAD:main
          fi
