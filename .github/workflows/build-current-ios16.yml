name: Build Current App IPA and DEB

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-current-ios16.yml
      - upstream/litter/**
      - darksword-overlay/rootd/**
      - darksword-overlay/package/**

permissions:
  contents: write

concurrency:
  group: current-ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_HTTP_MULTIPLEXING: "false"
      IOS_RUST_PROFILE: mobile-release
      RUSTC_WRAPPER: ""
      IOS_MIN: "16.1"
      SOURCE_ROOT: upstream/litter
      ARTIFACT_ROOT: artifacts

    steps:
      - name: Checkout current repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify committed app source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          test -f "$SOURCE_ROOT/apps/ios/project.yml"
          test -d "$SOURCE_ROOT/apps/ios/Sources/Litter"
          test -f "$SOURCE_ROOT/Makefile"
          test -f "$SOURCE_ROOT/SUBMODULES.lock"
          echo "$GITHUB_SHA" > "$ARTIFACT_ROOT/source-sha.txt"

      - name: Restore pinned build dependencies only
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          LOCK="$SOURCE_ROOT/SUBMODULES.lock"
          CODEX_SHA="$(awk -F= '$1=="codex" {print $2}' "$LOCK")"
          GHOSTTY_SHA="$(awk -F= '$1=="ghostty" {print $2}' "$LOCK")"
          test -n "$CODEX_SHA"
          test -n "$GHOSTTY_SHA"
          restore_repo() {
            local url="$1" path="$2" sha="$3"
            rm -rf "$path"
            mkdir -p "$path"
            git -C "$path" init
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch --depth 1 origin "$sha"
            git -C "$path" checkout --detach FETCH_HEAD
            test "$(git -C "$path" rev-parse HEAD)" = "$sha"
          }
          restore_repo https://github.com/NightVibes33/codex.git "$SOURCE_ROOT/shared/third_party/codex" "$CODEX_SHA"
          restore_repo https://github.com/ghostty-org/ghostty.git "$SOURCE_ROOT/shared/third_party/ghostty" "$GHOSTTY_SHA"
          test -f "$SOURCE_ROOT/shared/third_party/codex/codex-rs/Cargo.toml"
          test -f "$SOURCE_ROOT/shared/third_party/ghostty/build.zig"

      - name: Install build dependencies
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$ARTIFACT_ROOT/toolchain.log"
          xcrun --sdk iphoneos --show-sdk-version | tee -a "$ARTIFACT_ROOT/toolchain.log"
          brew install meson ninja xcodegen dpkg cmake pkgconf llvm autoconf automake libtool || true
          if ! command -v ldid >/dev/null 2>&1; then
            brew tap ProcursusTeam/Procursus || true
            brew install ldid || true
          fi
          rustup target add aarch64-apple-ios i686-unknown-linux-musl aarch64-unknown-linux-musl
          command -v xcodegen
          command -v dpkg-deb

      - name: Build current committed runtime and Xcode project
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          HOST_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          HOST_CLANG="$(xcrun --sdk macosx --find clang)"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          IOS_CLANG="$(xcrun --sdk iphoneos --find clang)"
          env \
            -u SDKROOT \
            CC="$HOST_CLANG" \
            HOST_CC="$HOST_CLANG" \
            CFLAGS="-isysroot $HOST_SDK" \
            HOST_CFLAGS="-isysroot $HOST_SDK" \
            CC_aarch64_apple_darwin="$HOST_CLANG" \
            CFLAGS_aarch64_apple_darwin="-isysroot $HOST_SDK" \
            CC_aarch64_apple_ios="$IOS_CLANG" \
            CFLAGS_aarch64_apple_ios="-isysroot $IOS_SDK -arch arm64 -miphoneos-version-min=$IOS_MIN" \
            make -C "$SOURCE_ROOT" rust-ios-device-fast alpine-fs xcgen IOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            2>&1 | tee "$ARTIFACT_ROOT/runtime-build.log"

      - name: Build current committed iOS app
        id: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT/DerivedData"
          xcodebuild \
            -project "$SOURCE_ROOT/apps/ios/Litter.xcodeproj" \
            -scheme Litter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/$ARTIFACT_ROOT/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            LITTER_IOS_BUILD_MODE=full-sideload LITTER_NYXIAN_PRIVATE_BUILD=1 \
            LITTER_PRESERVE_NYXIAN_LIVEPROCESS=1 LITTER_EMBED_UPSTREAM_SOURCE_TREES=1 \
            DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee "$ARTIFACT_ROOT/xcodebuild.log"

      - name: Build rootless daemon
        id: rootd
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min="$IOS_MIN" \
            -O2 -Wall -Wextra darksword-overlay/rootd/main.c -o "$ARTIFACT_ROOT/darksword-rootd" \
            2>&1 | tee "$ARTIFACT_ROOT/rootd-build.log"
          codesign --force --sign - "$ARTIFACT_ROOT/darksword-rootd"

      - name: Package IPA and rootless DEB
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$ARTIFACT_ROOT/DerivedData/Build/Products" -type d -name '*.app' -print -quit)"
          test -n "$APP"
          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          if command -v ldid >/dev/null 2>&1; then
            while IFS= read -r binary; do ldid -S "$binary" || true; done < <(find "$APP" -type f -perm -111)
            ldid -S"$PWD/darksword-overlay/package/app-entitlements.plist" "$APP/$MAIN_EXECUTABLE"
            ldid -S "$ARTIFACT_ROOT/darksword-rootd"
          else
            codesign --force --deep --sign - "$APP"
          fi
          rm -rf "$ARTIFACT_ROOT/Payload"
          mkdir -p "$ARTIFACT_ROOT/Payload"
          cp -R "$APP" "$ARTIFACT_ROOT/Payload/CurrentApp.app"
          (cd "$ARTIFACT_ROOT" && zip -qry CurrentApp-iOS16-unsigned.ipa Payload)
          chmod +x darksword-overlay/package/build-deb.sh
          darksword-overlay/package/build-deb.sh "$APP" "$ARTIFACT_ROOT/darksword-rootd" \
            "$ARTIFACT_ROOT/com.nightvibes.currentapp_0.2.0_iphoneos-arm64.deb"
          test -s "$ARTIFACT_ROOT/CurrentApp-iOS16-unsigned.ipa"
          test -s "$ARTIFACT_ROOT/com.nightvibes.currentapp_0.2.0_iphoneos-arm64.deb"
          dpkg-deb --contents "$ARTIFACT_ROOT/com.nightvibes.currentapp_0.2.0_iphoneos-arm64.deb" | tee "$ARTIFACT_ROOT/deb-contents.log"

      - name: Record build result
        if: always()
        shell: bash
        run: |
          STATUS="$RUNNER_TEMP/CURRENT_BUILD_STATUS.md"
          {
            echo '# Current IPA and DEB build status'
            echo
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Source verification: ${{ steps.source.outcome }}"
            echo "- Pinned dependencies: ${{ steps.dependencies.outcome }}"
            echo "- Build tools: ${{ steps.tools.outcome }}"
            echo "- Runtime/Xcode project: ${{ steps.runtime.outcome }}"
            echo "- iOS application: ${{ steps.app.outcome }}"
            echo "- Root daemon: ${{ steps.rootd.outcome }}"
            echo "- IPA and DEB package: ${{ steps.package.outcome }}"
            echo "- IPA exists: $(test -s "$ARTIFACT_ROOT/CurrentApp-iOS16-unsigned.ipa" && echo yes || echo no)"
            echo "- DEB exists: $(test -s "$ARTIFACT_ROOT/com.nightvibes.currentapp_0.2.0_iphoneos-arm64.deb" && echo yes || echo no)"
            for log in runtime-build xcodebuild rootd-build; do
              echo
              echo "## $log tail"
              echo '```text'
              tail -n 100 "$ARTIFACT_ROOT/$log.log" 2>/dev/null || true
              echo '```'
            done
          } > "$STATUS"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard HEAD
          git pull --rebase origin main || true
          cp "$STATUS" CURRENT_BUILD_STATUS.md
          git add CURRENT_BUILD_STATUS.md
          git commit -m 'Record current IPA and DEB build result' || true
          git push origin HEAD:main || true

      - name: Upload IPA DEB and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Current-App-iOS16-IPA-DEB
          path: |
            artifacts/*.ipa
            artifacts/*.deb
            artifacts/*.log
            artifacts/*.txt
            CURRENT_BUILD_STATUS.md
          if-no-files-found: warn