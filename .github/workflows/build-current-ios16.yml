name: Build Current App IPA and DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-current-ios16.yml
      - upstream/litter/**
      - darksword-overlay/rootd/**
      - darksword-overlay/package/**

permissions:
  contents: write

concurrency:
  group: current-ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      IOS_RUST_PROFILE: mobile-release
      IOS_MIN: "16.1"
      SOURCE_ROOT: upstream/litter
      ARTIFACT_ROOT: artifacts
      LITTER_TESTFLIGHT_FAST: "1"
      LITTER_TESTFLIGHT_SKIP_EMEXDE: "1"
      LITTER_SKIP_ALLEYCAT_UPDATE: "1"
      SCCACHE_BUCKET: rust-cache
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: ci/ios-release
      SCCACHE_LOG: info
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      RUSTY_V8_VERSION: "149.2.0"
      RUSTY_V8_ARCHIVE_NAME: librusty_v8_release_x86_64-apple-darwin.a.gz

    steps:
      - name: Checkout current repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Alley Cat Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install Apple Metal toolchain
        id: metal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          if ! xcrun --sdk iphoneos --find metal >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              echo "Installing MetalToolchain (attempt $attempt/3)..."
              if sudo xcodebuild -downloadComponent MetalToolchain; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                echo "error: MetalToolchain installation failed after 3 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 20))
            done
          fi
          METAL_BIN="$(xcrun --sdk iphoneos --find metal)"
          test -x "$METAL_BIN"
          echo "Metal compiler: $METAL_BIN" | tee "$ARTIFACT_ROOT/metal-toolchain.log"
          xcrun --sdk iphoneos metal --version 2>&1 | tee -a "$ARTIFACT_ROOT/metal-toolchain.log" || true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,i686-unknown-linux-musl

      - name: Verify committed app source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT"
          test -f "$SOURCE_ROOT/apps/ios/project.yml"
          test -d "$SOURCE_ROOT/apps/ios/Sources/Litter"
          test -x "$SOURCE_ROOT/apps/ios/scripts/build-rust.sh"
          test -f "$SOURCE_ROOT/SUBMODULES.lock"
          echo "$GITHUB_SHA" > "$ARTIFACT_ROOT/source-sha.txt"

      - name: Restore pinned Codex and Ghostty sources
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          LOCK="$SOURCE_ROOT/SUBMODULES.lock"
          CODEX_SHA="$(awk -F= '$1=="codex" {print $2}' "$LOCK")"
          GHOSTTY_SHA="$(awk -F= '$1=="ghostty" {print $2}' "$LOCK")"
          test -n "$CODEX_SHA"
          test -n "$GHOSTTY_SHA"
          restore_repo() {
            local url="$1" path="$2" sha="$3"
            rm -rf "$path"
            mkdir -p "$path"
            git -C "$path" init
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch --depth 1 origin "$sha"
            git -C "$path" checkout --detach FETCH_HEAD
            test "$(git -C "$path" rev-parse HEAD)" = "$sha"
          }
          restore_repo https://github.com/NightVibes33/codex.git "$SOURCE_ROOT/shared/third_party/codex" "$CODEX_SHA"
          restore_repo https://github.com/ghostty-org/ghostty.git "$SOURCE_ROOT/shared/third_party/ghostty" "$GHOSTTY_SHA"

      - name: Restore Alley Cat Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-cargo-registry-${{ runner.os }}-${{ hashFiles('upstream/litter/shared/rust-bridge/Cargo.lock', 'upstream/litter/ThirdParty/SideStore/minimuxer/Cargo.lock') }}
          restore-keys: |
            ios-cargo-registry-${{ runner.os }}-

      - name: Restore rusty_v8 archive cache
        id: rusty_v8_cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/.rusty_v8
          key: rusty-v8-${{ env.RUSTY_V8_VERSION }}-${{ runner.os }}-x86_64-apple-darwin
          restore-keys: |
            rusty-v8-${{ env.RUSTY_V8_VERSION }}-${{ runner.os }}-

      - name: Preload rusty_v8 archive
        id: rusty_v8
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cargo/.rusty_v8"
          ARCHIVE="$CACHE_DIR/$RUSTY_V8_ARCHIVE_NAME"
          URL="https://github.com/denoland/rusty_v8/releases/download/v${RUSTY_V8_VERSION}/${RUSTY_V8_ARCHIVE_NAME}"
          mkdir -p "$CACHE_DIR"
          if [[ ! -s "$ARCHIVE" ]]; then
            rm -f "$ARCHIVE.tmp"
            curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 \
              --connect-timeout 30 --max-time 1800 "$URL" -o "$ARCHIVE.tmp"
            test -s "$ARCHIVE.tmp"
            mv "$ARCHIVE.tmp" "$ARCHIVE"
          fi
          gzip -t "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "RUSTY_V8_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Restore Alley Cat generated Rust cache
        id: rust_generated_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/litter/apps/ios/GeneratedRust
            upstream/litter/apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift
          key: ios-testflight-rust-generated-mobile-release-v1-${{ runner.os }}-${{ hashFiles('upstream/litter/apps/ios/scripts/build-rust.sh', 'upstream/litter/apps/ios/scripts/build-ghostty.sh', 'upstream/litter/apps/ios/scripts/sync-ghostty.sh', 'upstream/litter/apps/ios/scripts/sync-codex.sh', 'upstream/litter/shared/rust-bridge/Cargo.lock', 'upstream/litter/shared/rust-bridge/Cargo.toml', 'upstream/litter/shared/rust-bridge/codex-mobile-client/Cargo.toml', 'upstream/litter/shared/rust-bridge/codex-mobile-client/src/**', 'upstream/litter/shared/rust-bridge/codex-slingshot/Cargo.toml', 'upstream/litter/shared/rust-bridge/codex-slingshot/src/**', 'upstream/litter/patches/codex/**', 'upstream/litter/patches/ghostty/**', 'upstream/litter/shared/third_party/codex/**', 'upstream/litter/shared/third_party/ghostty/**') }}
          restore-keys: |
            ios-testflight-rust-generated-mobile-release-v1-${{ runner.os }}-

      - name: Validate generated Rust cache
        id: rust_generated_valid
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.rust_generated_cache.outputs.cache-hit }}" != "true" ]]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          required=(
            "$SOURCE_ROOT/apps/ios/GeneratedRust/ios-device/libcodex_mobile_client.a"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/ios-device/libghostty.a"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/Headers/ghostty.h"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/Headers/codex_mobile_clientFFI.h"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/Headers/codex_mobile_clientFFI.modulemap"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/Headers/module.modulemap"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/.swift-bindings.hash"
            "$SOURCE_ROOT/apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift"
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "hit=false" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo "hit=true" >> "$GITHUB_OUTPUT"

      - name: Setup sccache
        if: env.SCCACHE_ENDPOINT != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Alley Cat build dependencies
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen meson ninja llvm lld dpkg
          if ! command -v ldid >/dev/null 2>&1; then
            brew tap ProcursusTeam/Procursus || true
            brew install ldid || true
          fi
          xcodebuild -version | tee "$ARTIFACT_ROOT/toolchain.log"
          xcrun --sdk iphoneos --show-sdk-version | tee -a "$ARTIFACT_ROOT/toolchain.log"

      - name: Build iOS runtime using Alley Cat cache-first flow
        id: runtime
        working-directory: upstream/litter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.rust_generated_valid.outputs.hit }}" == "true" ]]; then
            echo "Using cached Alley Cat GeneratedRust assets" | tee "$GITHUB_WORKSPACE/$ARTIFACT_ROOT/runtime-build.log"
          else
            ./apps/ios/scripts/sync-codex.sh --preserve-current
            export RUSTY_V8_ARCHIVE="${{ steps.rusty_v8.outputs.archive }}"
            test -s "$RUSTY_V8_ARCHIVE"
            if [[ -n "${SCCACHE_ENDPOINT:-}" && -n "${AWS_ACCESS_KEY_ID:-}" && -n "${AWS_SECRET_ACCESS_KEY:-}" ]] && command -v sccache >/dev/null 2>&1; then
              export RUSTC_WRAPPER=sccache
              sccache --start-server || true
            else
              export SCCACHE_DISABLE=1
              unset RUSTC_WRAPPER SCCACHE_BUCKET SCCACHE_ENDPOINT SCCACHE_REGION SCCACHE_S3_KEY_PREFIX SCCACHE_S3_USE_SSL
              unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
            fi
            ./apps/ios/scripts/build-rust.sh --preserve-current --device-only 2>&1 | tee "$GITHUB_WORKSPACE/$ARTIFACT_ROOT/runtime-build.log"
          fi
          if [[ "${SCCACHE_DISABLE:-0}" == "1" ]]; then
            make RUSTC_WRAPPER= SCCACHE_BUCKET= SCCACHE_ENDPOINT= AWS_ACCESS_KEY_ID= AWS_SECRET_ACCESS_KEY= alpine-fs xcgen IOS_DEPLOYMENT_TARGET="$IOS_MIN"
          else
            make alpine-fs xcgen IOS_DEPLOYMENT_TARGET="$IOS_MIN"
          fi

      - name: Save Alley Cat generated Rust cache
        if: steps.rust_generated_valid.outputs.hit != 'true' && steps.rust_generated_cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            upstream/litter/apps/ios/GeneratedRust
            upstream/litter/apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift
          key: ${{ steps.rust_generated_cache.outputs.cache-primary-key }}

      - name: Build current committed iOS app
        id: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_ROOT/DerivedData"
          xcodebuild -project "$SOURCE_ROOT/apps/ios/Litter.xcodeproj" -scheme Litter -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$GITHUB_WORKSPACE/$ARTIFACT_ROOT/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            LITTER_IOS_BUILD_MODE=full-sideload LITTER_NYXIAN_PRIVATE_BUILD=1 \
            LITTER_PRESERVE_NYXIAN_LIVEPROCESS=1 LITTER_EMBED_UPSTREAM_SOURCE_TREES=1 \
            DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee "$ARTIFACT_ROOT/xcodebuild.log"

      - name: Build rootless daemon
        id: rootd
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min="$IOS_MIN" \
            -O2 -Wall -Wextra darksword-overlay/rootd/main.c -o "$ARTIFACT_ROOT/darksword-rootd" \
            2>&1 | tee "$ARTIFACT_ROOT/rootd-build.log"
          codesign --force --sign - "$ARTIFACT_ROOT/darksword-rootd"

      - name: Package IPA and rootless DEB
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$ARTIFACT_ROOT/DerivedData/Build/Products" -type d -name '*.app' -print -quit)"
          test -n "$APP"
          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          if command -v ldid >/dev/null 2>&1; then
            while IFS= read -r binary; do ldid -S "$binary" || true; done < <(find "$APP" -type f -perm -111)
            ldid -S"$GITHUB_WORKSPACE/darksword-overlay/package/app-entitlements.plist" "$APP/$MAIN_EXECUTABLE"
            ldid -S "$ARTIFACT_ROOT/darksword-rootd"
          else
            codesign --force --deep --sign - "$APP"
          fi
          rm -rf "$ARTIFACT_ROOT/Payload"
          mkdir -p "$ARTIFACT_ROOT/Payload"
          cp -R "$APP" "$ARTIFACT_ROOT/Payload/CurrentApp.app"
          (cd "$ARTIFACT_ROOT" && zip -qry CurrentApp-iOS16-unsigned.ipa Payload)
          chmod +x darksword-overlay/package/build-deb.sh
          darksword-overlay/package/build-deb.sh "$APP" "$ARTIFACT_ROOT/darksword-rootd" "$ARTIFACT_ROOT/com.nightvibes.currentapp_0.2.0_iphoneos-arm64.deb"
          test -s "$ARTIFACT_ROOT/CurrentApp-iOS16-unsigned.ipa"
          test -s "$ARTIFACT_ROOT/com.nightvibes.currentapp_0.2.0_iphoneos-arm64.deb"
          dpkg-deb --contents "$ARTIFACT_ROOT/com.nightvibes.currentapp_0.2.0_iphoneos-arm64.deb" | tee "$ARTIFACT_ROOT/deb-contents.log"

      - name: Record build result
        if: always()
        shell: bash
        run: |
          STATUS="$RUNNER_TEMP/CURRENT_BUILD_STATUS.md"
          {
            echo '# Current IPA and DEB build status'
            echo
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Target: iOS $IOS_MIN+ (iPadOS 16.7.11 supported)"
            echo "- Metal toolchain: ${{ steps.metal.outcome }}"
            echo "- rusty_v8 cache restored: ${{ steps.rusty_v8_cache.outputs.cache-hit }}"
            echo "- Rust cache restored: ${{ steps.rust_generated_cache.outputs.cache-hit }}"
            echo "- Rust cache valid: ${{ steps.rust_generated_valid.outputs.hit }}"
            echo "- Source verification: ${{ steps.source.outcome }}"
            echo "- Pinned dependencies: ${{ steps.dependencies.outcome }}"
            echo "- Build tools: ${{ steps.tools.outcome }}"
            echo "- Alley Cat runtime: ${{ steps.runtime.outcome }}"
            echo "- iOS application: ${{ steps.app.outcome }}"
            echo "- Root daemon: ${{ steps.rootd.outcome }}"
            echo "- IPA and DEB package: ${{ steps.package.outcome }}"
            echo "- IPA exists: $(test -s "$ARTIFACT_ROOT/CurrentApp-iOS16-unsigned.ipa" && echo yes || echo no)"
            echo "- DEB exists: $(test -s "$ARTIFACT_ROOT/com.nightvibes.currentapp_0.2.0_iphoneos-arm64.deb" && echo yes || echo no)"
            for log in metal-toolchain runtime-build xcodebuild rootd-build; do
              echo; echo "## $log tail"; echo '```text'
              tail -n 120 "$ARTIFACT_ROOT/$log.log" 2>/dev/null || true
              echo '```'
            done
          } > "$STATUS"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard HEAD
          git pull --rebase origin main || true
          cp "$STATUS" CURRENT_BUILD_STATUS.md
          git add CURRENT_BUILD_STATUS.md
          git commit -m 'Record current IPA and DEB build result' || true
          git push origin HEAD:main || true

      - name: Upload IPA DEB and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Current-App-iOS16-IPA-DEB
          path: |
            artifacts/*.ipa
            artifacts/*.deb
            artifacts/*.log
            artifacts/*.txt
            CURRENT_BUILD_STATUS.md
          if-no-files-found: warn
