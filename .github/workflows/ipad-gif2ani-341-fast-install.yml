name: Fast Install Gif2Ani 3.4.1 on iPad

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ipad-gif2ani-341-fast-install.yml
      - triggers/ipad-gif2ani-341-fast-install.txt

permissions:
  contents: write

concurrency:
  group: ipad-gif2ani-341-fast-install
  cancel-in-progress: true

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: '18728387881'
        run: |
          set -euo pipefail
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            -o environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          data=json.load(open('environments.json'))
          for item in data.get('environments',[]):
              if int(item.get('id',-1))==target:
                  print('environment_name='+item['name'])
                  raise SystemExit(0)
          raise SystemExit('environment not found')
          PY

  install:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY"
          test -n "$IPAD_PASSWORD"

      - name: Join tailnet without target wait
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Connect and run exact device test
        id: device
        env:
          IPAD_HOST: '100.116.117.65'
          IPAD_PORT: '22'
          IPAD_USER: mobile
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          : > gif2ani-fast-device-output.txt
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo '=== tailnet status ===' | tee -a gif2ani-fast-device-output.txt
          tailscale status 2>&1 | tee -a gif2ani-fast-device-output.txt || true
          echo '=== direct target ping ===' | tee -a gif2ani-fast-device-output.txt
          tailscale ping --timeout=12s "$IPAD_HOST" 2>&1 | tee -a gif2ani-fast-device-output.txt || true
          echo '=== SSH host key ===' | tee -a gif2ani-fast-device-output.txt
          if ! ssh-keyscan -T 15 -H -p "$IPAD_PORT" "$IPAD_HOST" > "$HOME/.ssh/known_hosts" 2>>gif2ani-fast-device-output.txt; then
            echo 'connection_error=ipad_ssh_unreachable' | tee -a gif2ani-fast-device-output.txt
            exit 70
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          set +e
          {
            printf '%s\n' "$IPAD_PASSWORD"
            cat remote/ipad-command.sh
          } | sshpass -e ssh \
                -p "$IPAD_PORT" \
                -o BatchMode=no \
                -o ConnectTimeout=20 \
                -o ConnectionAttempts=2 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=3 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$IPAD_USER@$IPAD_HOST" \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee -a gif2ani-fast-device-output.txt
          ssh_status=${PIPESTATUS[1]}
          set -e
          echo "ssh_exit_code=$ssh_status" | tee -a gif2ani-fast-device-output.txt
          exit "$ssh_status"

      - name: Upload raw device output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif2ani-341-fast-device-output-${{ github.run_id }}
          path: gif2ani-fast-device-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish fast install status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('gif2ani-fast-device-output.txt').read_text(errors='replace') if Path('gif2ani-fast-device-output.txt').exists() else 'No device output was created.'
          password=os.environ.get('IPAD_PASSWORD','')
          if password: text=text.replace(password,'***REDACTED***')
          lines=[
              'Gif2Ani 3.4.1 Fast iPad Install',
              'run_id='+os.environ.get('GITHUB_RUN_ID',''),
              'run_url=https://github.com/'+os.environ.get('GITHUB_REPOSITORY','')+'/actions/runs/'+os.environ.get('GITHUB_RUN_ID',''),
              'commit='+os.environ.get('GITHUB_SHA',''),
              'job_status='+os.environ.get('JOB_STATUS',''),
              'tailscale='+os.environ.get('TAILSCALE_OUTCOME',''),
              'device='+os.environ.get('DEVICE_OUTCOME',''),
              '',
              '--- sanitized device output ---',
          ]
          lines.extend(text.splitlines()[-240:])
          Path('remote/gif2ani-341-fast-install-status.txt').write_text('\n'.join(lines)+'\n')
          PY
          git add remote/gif2ani-341-fast-install-status.txt
          git commit -m 'Record Gif2Ani 3.4.1 fast iPad install status [skip ci]' || exit 0
          git push origin HEAD:main
