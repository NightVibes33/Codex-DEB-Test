name: Build Install Test Gif2Ani Gallery Crash Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-install-test-gif2ani-gallery-crashfix.yml
      - triggers/build-install-test-gif2ani-gallery-crashfix.txt

permissions:
  contents: write

concurrency:
  group: gif2ani-gallery-crashfix-device-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      deb_sha256: ${{ steps.metadata.outputs.deb_sha256 }}
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4

      - name: Clone exact Dark-Boot source
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/NightVibes33/Dark-Boot.git source
          cd source
          git checkout b1409d51e1852483402115b73d91e964c8832038
          test "$(git rev-parse HEAD)" = 'b1409d51e1852483402115b73d91e964c8832038'
          grep -Fq '@interface G2ThemeGalleryController : PSListController' gif2aniprefs/G2ThemeGalleryController.h
          grep -Fq '<string>openAnimationGallery</string>' gif2aniprefs/Resources/Root.plist
          grep -Fq 'initForContentSize:self.view.bounds.size' gif2aniprefs/G2ThemeGalleryController.m

      - name: Install Theos
        env:
          THEOS: /opt/theos
          CI: '1'
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl git libxml2 \
            dpkg-dev unzip xz-utils ca-certificates python3 file
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Build crash-fixed rootless DEB
        working-directory: source
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee ../gallery-crashfix-build.log
          DEB='packages/com.nightvibes33.gif2ani_3.4.1_iphoneos-arm64.deb'
          test -s "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.nightvibes33.gif2ani'
          test "$(dpkg-deb -f "$DEB" Version)" = '3.4.1'
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64'
          rm -rf ../package-root
          dpkg-deb -x "$DEB" ../package-root
          BUNDLE='../package-root/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle'
          test -s "$BUNDLE/Gif2AniPrefs"
          grep -Fq '<string>PSButtonCell</string>' "$BUNDLE/Root.plist"
          grep -Fq '<string>openAnimationGallery</string>' "$BUNDLE/Root.plist"
          test -s "$BUNDLE/OpenThemeCatalog.json"
          python3 - "$BUNDLE/OpenThemeCatalog.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['count']==len(data['themes'])==48
          assert data['liveSnapshotCount']==48
          assert data['repositoryIndexMismatchCount']==47
          assert data['missingPagesPayloadFallbackCount']==1
          print('packaged_verified_springy_catalog=48')
          PY
          cp "$DEB" ../Gif2Ani-3.4.1-gallery-crashfix.deb

      - name: Build arm64 runtime contract probe
        run: |
          set -euo pipefail
          SDK="$(find /opt/theos/sdks -maxdepth 1 -type d -name 'iPhoneOS*.sdk' | sort -V | tail -n1)"
          test -d "$SDK"
          cat > gallery_runtime_probe.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>

          static BOOL HasInstanceMethod(Class cls, const char *name) {
              return cls && class_getInstanceMethod(cls, sel_registerName(name)) != NULL;
          }

          int main(void) {
              @autoreleasepool {
                  NSString *path=@"/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle";
                  NSBundle *bundle=[NSBundle bundleWithPath:path];
                  BOOL loaded=[bundle load];
                  Class gallery=NSClassFromString(@"G2ThemeGalleryController");
                  Class root=NSClassFromString(@"Gif2AniRootListController");
                  Class ps=NSClassFromString(@"PSListController");
                  BOOL inherits=NO;
                  for (Class cls=gallery; cls; cls=class_getSuperclass(cls)) {
                      if (cls==ps) { inherits=YES; break; }
                  }
                  printf("bundle_loaded=%s\n", loaded?"true":"false");
                  printf("gallery_class=%s\n", gallery?class_getName(gallery):"missing");
                  printf("gallery_superclass=%s\n", gallery?class_getName(class_getSuperclass(gallery)):"missing");
                  printf("pslistcontroller_class=%s\n", ps?class_getName(ps):"missing");
                  printf("gallery_inherits_pslistcontroller=%s\n", inherits?"true":"false");
                  const char *gallerySelectors[]={"initForContentSize:","controllerForSpecifier:","setSpecifier:","setRootController:","setParentController:","viewDidLoad"};
                  BOOL ok=loaded && gallery && root && ps && inherits;
                  for (unsigned i=0;i<sizeof(gallerySelectors)/sizeof(gallerySelectors[0]);i++) {
                      BOOL has=HasInstanceMethod(gallery,gallerySelectors[i]);
                      printf("gallery_selector_%s=%s\n",gallerySelectors[i],has?"true":"false");
                      ok=ok && has;
                  }
                  BOOL action=HasInstanceMethod(root,"openAnimationGallery");
                  printf("root_selector_openAnimationGallery=%s\n",action?"true":"false");
                  ok=ok && action;
                  printf("runtime_contract=%s\n",ok?"passed":"failed");
                  return ok?0:41;
              }
          }
          OBJC
          /opt/theos/toolchain/linux/iphone/bin/clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -F"$SDK/System/Library/PrivateFrameworks" \
            -framework Foundation -framework Preferences -lobjc \
            gallery_runtime_probe.m -o gallery-runtime-probe
          /opt/theos/toolchain/linux/iphone/bin/ldid -S gallery-runtime-probe
          file gallery-runtime-probe

      - name: Publish build metadata
        id: metadata
        run: |
          set -euo pipefail
          SHA="$(sha256sum Gif2Ani-3.4.1-gallery-crashfix.deb | awk '{print $1}')"
          echo "deb_sha256=$SHA" >> "$GITHUB_OUTPUT"
          printf 'source_commit=b1409d51e1852483402115b73d91e964c8832038\ndeb_sha256=%s\n' "$SHA" > gallery-build-metadata.txt
          cat gallery-build-metadata.txt

      - name: Upload exact build
        uses: actions/upload-artifact@v4
        with:
          name: Gif2Ani-3.4.1-gallery-crashfix
          path: |
            Gif2Ani-3.4.1-gallery-crashfix.deb
            gallery-runtime-probe
            gallery-build-metadata.txt
            gallery-crashfix-build.log
          if-no-files-found: error
          retention-days: 14

  resolve-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve secret environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: '18728387881'
        run: |
          set -euo pipefail
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            -o environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          data=json.load(open('environments.json'))
          for item in data.get('environments',[]):
              if int(item.get('id',-1))==target:
                  print('environment_name='+item['name'])
                  raise SystemExit(0)
          raise SystemExit('environment not found')
          PY

  install-test:
    needs: [build, resolve-environment]
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact build
        uses: actions/download-artifact@v4
        with:
          name: Gif2Ani-3.4.1-gallery-crashfix
          path: payload

      - name: Verify downloaded build
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.deb_sha256 }}
        run: |
          set -euo pipefail
          test -s payload/Gif2Ani-3.4.1-gallery-crashfix.deb
          test -x payload/gallery-runtime-probe
          test "$(sha256sum payload/Gif2Ani-3.4.1-gallery-crashfix.deb | awk '{print $1}')" = "$EXPECTED_SHA"

      - name: Validate secrets
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY"
          test -n "$IPAD_PASSWORD"

      - name: Join tailnet
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Copy package and runtime probe to iPad
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_HOST: '100.116.117.65'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 15 -H -p 22 "$IPAD_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          sshpass -e scp -P 22 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            payload/Gif2Ani-3.4.1-gallery-crashfix.deb payload/gallery-runtime-probe \
            mobile@"$IPAD_HOST":/var/mobile/Library/Caches/

      - name: Install and test Settings gallery contract
        id: device
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          IPAD_HOST: '100.116.117.65'
          EXPECTED_SHA: ${{ needs.build.outputs.deb_sha256 }}
        run: |
          set -uo pipefail
          : > gallery-crashfix-device-output.txt
          {
            printf '%s\n' "$IPAD_PASSWORD"
            cat <<'REMOTE'
          set -eu
          export PATH="/var/jb/usr/bin:/var/jb/usr/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin:$PATH"
          DEB='/var/mobile/Library/Caches/Gif2Ani-3.4.1-gallery-crashfix.deb'
          PROBE='/var/mobile/Library/Caches/gallery-runtime-probe'
          BUNDLE='/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle'
          MEDIA='/var/mobile/Library/Application Support/Gif2Ani'
          PREFS='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          BACKUP='/var/mobile/Library/Caches/Gif2AniGalleryCrashFixBackup'
          MARKER='/var/mobile/Library/Caches/Gif2AniGalleryCrashFixMarker'
          EXPECTED_SHA='__EXPECTED_SHA__'
          SUCCESS=0

          sha_file() { if [ -f "$1" ]; then sha256sum "$1" | awk '{print $1}'; else printf MISSING; fi; }
          restore_files() {
            echo 'rollback=starting'
            [ ! -d "$BACKUP/bundle" ] || { rm -rf "$BUNDLE"; cp -a "$BACKUP/bundle" "$BUNDLE"; }
            [ ! -f "$BACKUP/Gif2Ani.dylib" ] || cp -p "$BACKUP/Gif2Ani.dylib" /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib
            [ ! -f "$BACKUP/Gif2Ani.plist" ] || cp -p "$BACKUP/Gif2Ani.plist" /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist
            killall -9 Preferences 2>/dev/null || true
            echo 'rollback=complete'
          }
          finish() { code=$?; trap - EXIT INT TERM; [ "$SUCCESS" -eq 1 ] || restore_files || true; rm -f "$DEB" "$PROBE"; exit "$code"; }
          trap finish EXIT INT TERM

          echo '=== Gif2Ani gallery crash-fix device test ==='
          printf 'started_at_utc='; date -u '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || true
          printf 'identity='; id
          printf 'model='; sysctl -n hw.model 2>/dev/null || true
          printf 'active_sha_before=%s\n' "$(sha_file "$MEDIA/Active.gif")"
          printf 'prefs_sha_before=%s\n' "$(sha_file "$PREFS")"
          test "$(sha256sum "$DEB" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.nightvibes33.gif2ani'
          test "$(dpkg-deb -f "$DEB" Version)" = '3.4.1'

          rm -rf "$BACKUP"
          mkdir -p "$BACKUP"
          cp -a "$BUNDLE" "$BACKUP/bundle"
          cp -p /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib "$BACKUP/Gif2Ani.dylib"
          cp -p /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist "$BACKUP/Gif2Ani.plist"

          dpkg -i "$DEB"
          test "$(dpkg-query -W -f='${Version}' com.nightvibes33.gif2ani)" = '3.4.1'
          grep -Fq '<string>PSButtonCell</string>' "$BUNDLE/Root.plist"
          grep -Fq '<string>openAnimationGallery</string>' "$BUNDLE/Root.plist"
          echo 'package_install=passed'

          chmod 0755 "$PROBE"
          "$PROBE"

          killall -9 Preferences 2>/dev/null || true
          rm -f "$MARKER"
          touch "$MARKER"
          if command -v uiopen >/dev/null 2>&1; then
            su mobile -c "uiopen 'prefs:root=Gif2Ani'" >/dev/null 2>&1 || true
            sleep 5
            su mobile -c "uiopen 'prefs:root=Gif2Ani&path=G2ThemeGallery'" >/dev/null 2>&1 || true
          fi
          sleep 12

          echo '=== Preferences process status ==='
          ps -A 2>/dev/null | grep -i '[P]references' || true
          launchctl print gui/501/com.apple.Preferences 2>/dev/null | head -n 30 || true
          crashes="$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f -name 'Preferences-*.ips' -newer "$MARKER" -print 2>/dev/null | wc -l | tr -d ' ')"
          printf 'new_preferences_crashes=%s\n' "$crashes"
          test "$crashes" = '0'
          test -d "$MEDIA/OpenThemeLibrary/io.github.virenmohindra.a-wave"
          test -d "$MEDIA/OpenThemeLibrary/io.github.virenmohindra.swish"
          printf 'a_wave_cache_present=true\nswish_cache_present=true\n'
          printf 'active_sha_after=%s\n' "$(sha_file "$MEDIA/Active.gif")"
          printf 'prefs_sha_after=%s\n' "$(sha_file "$PREFS")"
          test "$(sha_file "$MEDIA/Active.gif")" = "$(sha_file "$MEDIA/Active.gif")"

          SUCCESS=1
          rm -rf "$BACKUP"
          echo 'gallery_crashfix_device_test=success'
          echo 'gallery_runtime_contract=passed'
          echo 'settings_new_crash=false'
          printf 'completed_at_utc='; date -u '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || true
          REMOTE
          } | sed "s/__EXPECTED_SHA__/$EXPECTED_SHA/g" | sshpass -e ssh \
                -p 22 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
                mobile@"$IPAD_HOST" \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/usr/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee gallery-crashfix-device-output.txt
          status=${PIPESTATUS[1]}
          exit "$status"

      - name: Upload device proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif2ani-gallery-crashfix-device-proof-${{ github.run_id }}
          path: gallery-crashfix-device-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish sanitized final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          DEB_SHA: ${{ needs.build.outputs.deb_sha256 }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path('gallery-crashfix-device-output.txt')
          text=source.read_text(errors='replace') if source.exists() else 'No device output was created.'
          password=os.environ.get('IPAD_PASSWORD','')
          if password: text=text.replace(password,'***REDACTED***')
          lines=[
              'Gif2Ani 3.4.1 Gallery Crash-Fix Device Test',
              'run_id='+os.environ.get('GITHUB_RUN_ID',''),
              'run_url=https://github.com/'+os.environ.get('GITHUB_REPOSITORY','')+'/actions/runs/'+os.environ.get('GITHUB_RUN_ID',''),
              'source_commit=b1409d51e1852483402115b73d91e964c8832038',
              'deb_sha256='+os.environ.get('DEB_SHA',''),
              'job_status='+os.environ.get('JOB_STATUS',''),
              'device='+os.environ.get('DEVICE_OUTCOME',''),
              '',
              '--- sanitized device output ---',
          ]
          lines.extend(text.splitlines()[-400:])
          Path('remote/gif2ani-gallery-crashfix-device-status.txt').write_text('\n'.join(lines)+'\n')
          PY
          git add remote/gif2ani-gallery-crashfix-device-status.txt
          git commit -m 'Record Gif2Ani gallery crash-fix device test [skip ci]' || exit 0
          git push origin HEAD:main
