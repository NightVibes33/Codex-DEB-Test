name: Darwin VM Windows 11

on:
  workflow_dispatch:
  push:
    branches:
      - temp/darwin-vm-windows11
    paths:
      - .github/workflows/darwin-vm-windows11.yml
      - darwin-vm/windows-launcher.c
      - darwin-vm/full-ui/**
      - darwin-vm/qemu-patches/**

permissions:
  contents: read

env:
  IPSW_VERSION: "3.1.712"
  DEFAULT_IOS_URL: "https://updates.cdn-apple.com/2026SpringSeed/ad5a4f9d-f005-466b-bbcf-3b466040074b/iPhone17,3_27.0_24A5424a_Restore.ipsw"

jobs:
  prepare-firmware:
    name: Prepare iOS firmware on macOS
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Clone darwin-vm
        run: |
          git clone --depth 1 https://github.com/jprx/darwin-vm.git upstream/darwin-vm

      - name: Install macOS dependencies
        run: |
          set -euxo pipefail
          brew install jq wget
          mkdir -p /tmp/ipsw-install
          curl -fL --retry 3 \
            "https://github.com/blacktop/ipsw/releases/download/v${IPSW_VERSION}/ipsw_${IPSW_VERSION}_macOS_arm64.tar.gz" \
            -o /tmp/ipsw.tar.gz
          tar -xzf /tmp/ipsw.tar.gz -C /tmp/ipsw-install
          IPSW_BIN="$(find /tmp/ipsw-install -type f -name ipsw -print | head -n1)"
          test -n "$IPSW_BIN"
          chmod +x "$IPSW_BIN"
          sudo install -m 0755 "$IPSW_BIN" /usr/local/bin/ipsw
          ipsw version || ipsw --version

      - name: Download and patch default iPhone 16 firmware
        working-directory: upstream/darwin-vm
        run: |
          chmod +x get_files.sh fix_perms.sh
          ./get_files.sh
          printf 'y\n' | ./fix_perms.sh firmware/ramdisk.dmg
          echo "Prepared firmware:"
          du -sh firmware
          ls -lh firmware

      - name: Upload prepared firmware
        uses: actions/upload-artifact@v4
        with:
          name: darwin-vm-firmware
          path: upstream/darwin-vm/firmware
          retention-days: 3
          compression-level: 1

  probe-full-ui:
    name: Probe full iOS UI / driver stack
    runs-on: macos-15
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Install ipsw
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ipsw-install
          curl -fL --retry 3 \
            "https://github.com/blacktop/ipsw/releases/download/v${IPSW_VERSION}/ipsw_${IPSW_VERSION}_macOS_arm64.tar.gz" \
            -o /tmp/ipsw.tar.gz
          tar -xzf /tmp/ipsw.tar.gz -C /tmp/ipsw-install
          IPSW_BIN="$(find /tmp/ipsw-install -type f -name ipsw -print | head -n1)"
          test -n "$IPSW_BIN"
          chmod +x "$IPSW_BIN"
          sudo install -m 0755 "$IPSW_BIN" /usr/local/bin/ipsw
          ipsw version || ipsw --version

      - name: Inventory and mount full iOS filesystem
        env:
          URL: ${{ env.DEFAULT_IOS_URL }}
          EXTRACT_SYSTEM_DMG: "1"
          OUT: ${{ github.workspace }}/full-ui-probe
        run: |
          chmod +x darwin-vm/full-ui/probe-ui-stack.sh
          darwin-vm/full-ui/probe-ui-stack.sh

      - name: Upload full UI probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin-vm-full-ui-probe
          path: full-ui-probe
          retention-days: 3
          compression-level: 1

  build-windows:
    name: Build native Windows 11 executable
    needs: prepare-firmware
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Clone darwin-vm with qemu-sptm
        shell: pwsh
        run: |
          git clone --recurse-submodules https://github.com/jprx/darwin-vm.git upstream/darwin-vm
          git -C upstream/darwin-vm submodule status

      - name: Apply local qemu-sptm patches
        shell: pwsh
        run: |
          $patchDir = Join-Path $env:GITHUB_WORKSPACE "darwin-vm/qemu-patches"
          if (Test-Path $patchDir) {
            Get-ChildItem $patchDir -Filter *.patch | Sort-Object Name | ForEach-Object {
              Write-Host "Applying $($_.FullName)"
              git -C "$env:GITHUB_WORKSPACE/upstream/darwin-vm/qemu-sptm" apply $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } else {
            Write-Host "No local qemu patches yet"
          }

      - name: Download prepared firmware
        uses: actions/download-artifact@v4
        with:
          name: darwin-vm-firmware
          path: upstream/darwin-vm/firmware

      - name: Set up MSYS2 / MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            bison
            diffutils
            flex
            git
            grep
            make
            sed
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-ca-certificates
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-curl-winssl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-libnfs
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-certifi
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-python-wheel
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-rust-bindgen
            mingw-w64-x86_64-zstd

      - name: Build qemu-sptm for Windows
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/upstream/darwin-vm/qemu-sptm"
          mkdir -p build
          cd build
          ../configure \
            --target-list=aarch64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-vnc \
            --disable-opengl \
            --disable-virglrenderer
          make -j"$(nproc)"
          test -f qemu-system-aarch64.exe
          ./qemu-system-aarch64.exe --version
          ./qemu-system-aarch64.exe -machine help | tee machine-help.txt
          grep -i darwin machine-help.txt

      - name: Build portable Windows launcher and bundle
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          DIST="$GITHUB_WORKSPACE/dist/DarwinVM-Windows11"
          QEMU="$GITHUB_WORKSPACE/upstream/darwin-vm/qemu-sptm/build/qemu-system-aarch64.exe"
          mkdir -p "$DIST/firmware"

          cp "$QEMU" "$DIST/qemu-system-aarch64.exe"
          cp -R "$GITHUB_WORKSPACE/upstream/darwin-vm/firmware/." "$DIST/firmware/"

          gcc -O2 -s -municode \
            "$GITHUB_WORKSPACE/darwin-vm/windows-launcher.c" \
            -o "$DIST/DarwinVM-Windows11.exe"

          ldd "$QEMU" | tee "$DIST/qemu-runtime-deps.txt"
          ldd "$QEMU" | awk '/\/mingw64\/bin\// {print $3}' | while read -r dll; do
            [ -f "$dll" ] && cp -n "$dll" "$DIST/"
          done

          cat > "$DIST/README-Windows.txt" <<'EOF'
          Darwin VM - Windows 11 test build

          Run: DarwinVM-Windows11.exe
          Self-test: DarwinVM-Windows11.exe --self-test
          Exit QEMU: Ctrl+A, then X

          Current baseline boots the darwin-vm root-shell environment. The temp branch also contains an active full-UI probe and a qemu patch lane for display/input/network device work.
          Firmware was prepared on a GitHub-hosted macOS runner; qemu-sptm and the launcher were built on a GitHub-hosted Windows runner.
          EOF

          "$DIST/DarwinVM-Windows11.exe" --self-test
          ls -lah "$DIST"
          du -sh "$DIST"

      - name: Upload Windows 11 portable build
        uses: actions/upload-artifact@v4
        with:
          name: DarwinVM-Windows11-portable
          path: dist/DarwinVM-Windows11
          retention-days: 3
          compression-level: 1
