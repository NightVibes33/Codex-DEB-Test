name: iPhone Zebra Sileo Repair

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-sileo-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Repair package managers without deleting data
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          export HOME=/var/mobile
          TS="$(date +%Y%m%d-%H%M%S)"
          BK="/var/mobile/Documents/CodexPackageManagerBackups/$TS"
          mkdir -p "$BK"
          chmod 700 "$BK" 2>/dev/null || true

          echo '=== NON-DESTRUCTIVE IPHONE PACKAGE MANAGER REPAIR ==='
          echo "backup_dir=$BK"
          echo 'policy=no-rm-no-package-removal-no-tweak-removal-no-pref-reset'

          killall Zebra 2>/dev/null || true
          killall Sileo 2>/dev/null || true
          sleep 2

          echo '--- Zebra state discovery ---'
          find /var/mobile/Library /var/jb/var/mobile/Library -maxdepth 6 \
            \( -iname '*zebra*' -o -path '*Zebra*' \) -print 2>/dev/null | head -n 160 || true

          echo '--- Zebra cache/database preservation + rebuild ---'
          ZLIST="$BK/zebra-moved.txt"
          : > "$ZLIST"
          find /var/mobile/Library /var/jb/var/mobile/Library -maxdepth 7 -type f \
            \( -path '*Zebra*' -o -path '*zebra*' \) \
            \( -iname '*.db' -o -iname '*.db-wal' -o -iname '*.db-shm' -o -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*.sqlite-wal' -o -iname '*.sqlite-shm' \) \
            -print 2>/dev/null | while IFS= read -r f; do
              [ -f "$f" ] || continue
              case "$f" in
                *.before-fix-*|*.failed-rebuild-*) continue ;;
              esac
              rel="$(printf '%s' "$f" | sed 's#^/##; s#/#__#g')"
              cp -p "$f" "$BK/$rel" 2>/dev/null || continue
              mv "$f" "$f.before-fix-$TS" 2>/dev/null || continue
              printf '%s\n' "$f" >> "$ZLIST"
              echo "preserved_zebra_db=$f"
          done

          echo '--- Launch Zebra and verify beyond watchdog window ---'
          BEFORE_CR="$(ls -t /var/mobile/Library/Logs/CrashReporter/stacks+Zebra*.ips 2>/dev/null | head -n 1)"
          uiopen 'zbra://' 2>/dev/null || uiopen 'zebra://' 2>/dev/null || uiopen /var/jb/Applications/Zebra.app 2>/dev/null || true
          sleep 8
          printf 'zebra_pid_8s='; pgrep -x Zebra 2>/dev/null | tr '\n' ' '; echo
          sleep 16
          printf 'zebra_pid_24s='; pgrep -x Zebra 2>/dev/null | tr '\n' ' '; echo
          AFTER_CR="$(ls -t /var/mobile/Library/Logs/CrashReporter/stacks+Zebra*.ips 2>/dev/null | head -n 1)"
          echo "zebra_crash_before=$BEFORE_CR"
          echo "zebra_crash_after=$AFTER_CR"
          if pgrep -x Zebra >/dev/null 2>&1; then
            echo 'ZEBRA_REPAIR_VERIFIED=1'
          else
            echo 'ZEBRA_REPAIR_VERIFIED=0'
            echo 'Restoring preserved Zebra databases because launch did not survive.'
            while IFS= read -r orig; do
              [ -n "$orig" ] || continue
              saved="$orig.before-fix-$TS"
              if [ -e "$saved" ]; then
                if [ -e "$orig" ]; then
                  mv "$orig" "$orig.failed-rebuild-$TS" 2>/dev/null || true
                fi
                mv "$saved" "$orig" 2>/dev/null || true
              fi
            done < "$ZLIST"
          fi

          killall Sileo 2>/dev/null || true
          sleep 2

          echo '--- Sileo cache DB/hash preservation ---'
          SLIST="$BK/sileo-moved.txt"
          : > "$SLIST"
          for f in \
            /var/jb/var/mobile/Library/Caches/CydiaClassic/Database/sileo.sqlite3 \
            /var/jb/var/mobile/Library/Caches/CydiaClassic/Database/sileo.sqlite3-wal \
            /var/jb/var/mobile/Library/Caches/CydiaClassic/Database/sileo.sqlite3-shm \
            /var/jb/var/mobile/Library/Caches/Sileo/RepoHashCache.json; do
            [ -f "$f" ] || continue
            rel="$(printf '%s' "$f" | sed 's#^/##; s#/#__#g')"
            cp -p "$f" "$BK/$rel" 2>/dev/null || continue
            mv "$f" "$f.before-fix-$TS" 2>/dev/null || continue
            printf '%s\n' "$f" >> "$SLIST"
            echo "preserved_sileo_state=$f"
          done

          echo '--- Refresh APT indexes in place ---'
          apt-get update 2>&1 | tail -n 80
          echo 'apt_candidate_after_refresh:'
          apt-cache policy xyz.cypwn.python3.12 2>/dev/null || true

          echo '--- Launch Sileo to rebuild its own package cache ---'
          uiopen 'sileo://' 2>/dev/null || uiopen /var/jb/Applications/Sileo.app 2>/dev/null || true
          sleep 35
          SDB=/var/jb/var/mobile/Library/Caches/CydiaClassic/Database/sileo.sqlite3
          RH=/var/jb/var/mobile/Library/Caches/Sileo/RepoHashCache.json
          ls -l "$SDB" "$RH" 2>/dev/null || true
          if [ -f "$SDB" ] && strings -a "$SDB" 2>/dev/null | grep -Fq 'xyz.cypwn.python3.12'; then
            echo 'SILEO_CYPWN_DB_VERIFIED=1'
          else
            echo 'SILEO_CYPWN_DB_VERIFIED=0'
          fi
          if [ -f "$RH" ] && grep -aq 'repo.cypwn.xyz' "$RH" 2>/dev/null; then
            echo 'SILEO_CYPWN_HASH_VERIFIED=1'
          else
            echo 'SILEO_CYPWN_HASH_VERIFIED=0'
          fi
          printf 'sileo_pid='; pgrep -x Sileo 2>/dev/null | tr '\n' ' '; echo

          echo '--- Final invariants ---'
          printf 'zebra_package='; dpkg-query -W -f='${Status} ${Version} ${Architecture}\n' xyz.willy.zebra 2>/dev/null || true
          printf 'sileo_package='; dpkg-query -W -f='${Status} ${Version} ${Architecture}\n' org.coolstar.sileo 2>/dev/null || true
          printf 'ellekit_package='; dpkg-query -W -f='${Status} ${Version} ${Architecture}\n' ellekit 2>/dev/null || true
          printf 'cypwn_records='; grep -c '^Package:' /var/jb/var/lib/apt/lists/repo.cypwn.xyz_._Packages 2>/dev/null || echo 0
          echo 'NO_FILES_DELETED=1'
          echo 'NO_PACKAGES_REMOVED=1'
          echo 'NO_TWEAKS_REMOVED=1'
          echo 'NO_PREFS_RESET=1'
          echo 'IPHONE_REPAIR_COMPLETE=1'
          EOS
          } | sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-sileo-output.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-sileo-repair-${{ github.run_id }}
          path: iphone-zebra-sileo-output.txt
          if-no-files-found: warn
          retention-days: 7
