name: iPhone Zebra Launch Verify

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-launch-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Launch Zebra in SpringBoard bootstrap and verify
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set -u
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          ZDIR='/var/mobile/Library/Application Support/xyz.willy.Zebra'
          ZDB="$ZDIR/zebra.db"
          CRASHDIR='/var/mobile/Library/Logs/CrashReporter'
          TS="$(date +%Y%m%d-%H%M%S)"

          echo '=== ZEBRA SPRINGBOARD LAUNCH VERIFY V2 ==='
          echo 'DELETE_COMMANDS_USED=0'
          echo 'PACKAGES_REMOVED=0'
          echo 'TWEAKS_REMOVED=0'
          echo 'PREFERENCES_RESET=0'
          dpkg-query -W -f='zebra_version=${Version}\n' xyz.willy.zebra 2>/dev/null || true

          echo '--- current clean-state invariant ---'
          ls -la "$ZDIR" | sed -n '1,120p'
          PRESERVED="$(ls -1t "$ZDB".before-fix-* 2>/dev/null | head -n1 || true)"
          echo "preserved_original=$PRESERVED"
          if [ -z "$PRESERVED" ]; then
            echo 'ERROR=no preserved original found; refusing launch experiment'
            exit 41
          fi

          BEFORE="$(ls -1t "$CRASHDIR"/stacks+Zebra*.ips 2>/dev/null | head -n1 || true)"
          echo "watchdog_before=$BEFORE"
          killall Zebra 2>/dev/null || true

          echo '--- process lookup diagnostics ---'
          echo "pgrep_path=$(command -v pgrep 2>/dev/null || true)"
          echo "ps_path=$(command -v ps 2>/dev/null || true)"
          ps aux 2>/dev/null | grep -i '[S]pringBoard' | head -n10 || true

          SBPID=''
          if command -v pgrep >/dev/null 2>&1; then
            SBPID="$(pgrep -x SpringBoard 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SBPID" ]; then
            SBPID="$(ps aux 2>/dev/null | awk '/[S]pringBoard/{print $2; exit}' || true)"
          fi
          if [ -z "$SBPID" ]; then
            SBPID="$(ps -A 2>/dev/null | awk '/[S]pringBoard/{print $1; exit}' || true)"
          fi
          echo "springboard_pid=$SBPID"
          if [ -z "$SBPID" ]; then
            echo 'ERROR=SpringBoard PID unavailable after pgrep and ps fallbacks'
            exit 42
          fi

          echo '--- launchctl capability ---'
          launchctl help 2>&1 | grep -E 'bsexec|asuser|bootstrap|kickstart' | head -n40 || true

          echo 'launch_method=bsexec-root-uiopen'
          launchctl bsexec "$SBPID" /var/jb/usr/bin/uiopen 'zbra://' >/tmp/zebra-bsexec-1.out 2>&1 || true
          sed -n '1,40p' /tmp/zebra-bsexec-1.out 2>/dev/null || true
          sleep 5
          P1="$(ps aux 2>/dev/null | awk '/[Z]ebra.app\/Zebra/{print $2; exit}' || true)"
          [ -z "$P1" ] && P1="$(ps aux 2>/dev/null | awk '$11 ~ /\/Zebra$/ {print $2; exit}' || true)"
          echo "zebra_pid_after_bsexec_root=$P1"

          if [ -z "$P1" ]; then
            echo 'launch_method=bsexec-mobile-uiopen'
            launchctl bsexec "$SBPID" /usr/bin/sudo -u mobile env HOME=/var/mobile PATH=/var/jb/usr/bin:/usr/bin:/bin:/usr/sbin:/sbin /var/jb/usr/bin/uiopen 'zbra://' >/tmp/zebra-bsexec-2.out 2>&1 || true
            sed -n '1,40p' /tmp/zebra-bsexec-2.out 2>/dev/null || true
            sleep 5
          fi

          PID10="$(ps aux 2>/dev/null | awk '/[Z]ebra.app\/Zebra/{print $2; exit}' || true)"
          [ -z "$PID10" ] && PID10="$(ps aux 2>/dev/null | awk '$11 ~ /\/Zebra$/ {print $2; exit}' || true)"
          echo "zebra_pid_10s=$PID10"
          [ -n "$PID10" ] && ps -p "$PID10" -o pid,uid,etime,state,command 2>/dev/null || true

          sleep 22
          PID32="$(ps aux 2>/dev/null | awk '/[Z]ebra.app\/Zebra/{print $2; exit}' || true)"
          [ -z "$PID32" ] && PID32="$(ps aux 2>/dev/null | awk '$11 ~ /\/Zebra$/ {print $2; exit}' || true)"
          echo "zebra_pid_32s=$PID32"
          [ -n "$PID32" ] && ps -p "$PID32" -o pid,uid,etime,state,command 2>/dev/null || true

          AFTER="$(ls -1t "$CRASHDIR"/stacks+Zebra*.ips 2>/dev/null | head -n1 || true)"
          echo "watchdog_after=$AFTER"
          NEW_WATCHDOG=0
          if [ -n "$AFTER" ] && [ "$AFTER" != "$BEFORE" ]; then NEW_WATCHDOG=1; fi
          echo "new_watchdog=$NEW_WATCHDOG"

          NEWDB=0
          if [ -s "$ZDB" ]; then
            NEWDB=1
            echo "rebuilt_db_bytes=$(wc -c < "$ZDB" 2>/dev/null || echo unknown)"
            stat -f 'rebuilt_db_owner=%Su:%Sg mode=%Sp' "$ZDB" 2>/dev/null || stat -c 'rebuilt_db_owner=%U:%G mode=%A' "$ZDB" 2>/dev/null || true
          fi
          echo "new_db_created=$NEWDB"

          if [ -n "$PID32" ] && [ "$NEW_WATCHDOG" -eq 0 ] && [ "$NEWDB" -eq 1 ]; then
            echo 'ZEBRA_REPAIR_VERIFIED=1'
            echo 'RESULT=Zebra launched from SpringBoard bootstrap and survived past watchdog window with rebuilt DB.'
            exit 0
          fi

          if [ "$NEW_WATCHDOG" -eq 1 ]; then
            echo 'RESULT=Clean-state Zebra produced a new watchdog; preserving failed rebuild and restoring original.'
            killall Zebra 2>/dev/null || true
            for f in "$ZDB" "$ZDB-wal" "$ZDB-shm"; do
              if [ -e "$f" ]; then
                mv "$f" "$f.failed-rebuild-$TS"
                echo "preserved_failed_rebuild=$f.failed-rebuild-$TS"
              fi
            done
            if [ ! -e "$ZDB" ] && [ -e "$PRESERVED" ]; then
              mv "$PRESERVED" "$ZDB"
              echo "restored_original=$ZDB"
            fi
            echo 'ROLLBACK_COMPLETED=1'
            echo 'ZEBRA_REPAIR_VERIFIED=0'
            exit 51
          fi

          if [ -z "$PID10" ] && [ -z "$PID32" ] && [ "$NEW_WATCHDOG" -eq 0 ]; then
            echo 'ZEBRA_REMOTE_LAUNCH_UNAVAILABLE=1'
            echo 'ZEBRA_REPAIR_STAGED=1'
            echo 'RESULT=Bootstrap launch did not start Zebra; clean DB state remains staged, originals preserved.'
            exit 0
          fi

          echo 'ZEBRA_REPAIR_VERIFIED=0'
          echo 'RESULT=Launch state inconclusive; no deletion occurred and preserved original remains available.'
          exit 52
          EOS
          } | timeout 180s sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-launch-verify.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-launch-verify-${{ github.run_id }}
          path: iphone-zebra-launch-verify.txt
          if-no-files-found: warn
          retention-days: 7
