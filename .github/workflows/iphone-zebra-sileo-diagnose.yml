name: iPhone Zebra Sileo Diagnose

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-sileo-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Run targeted iPhone-only diagnostics
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          export HOME=/var/mobile
          echo '=== TARGETED IPHONE ZEBRA/SILEO DIAGNOSTICS ==='
          printf 'ios='; sw_vers -productVersion 2>/dev/null || true
          printf 'model='; sysctl -n hw.model 2>/dev/null || true

          echo '--- Zebra watchdog report summary ---'
          CR="$(ls -t /var/mobile/Library/Logs/CrashReporter/stacks+Zebra*.ips 2>/dev/null | head -n 1)"
          echo "crash_file=$CR"
          if [ -n "$CR" ] && [ -f "$CR" ]; then
            grep -a -E -m 8 '"reason"|"exception"|WatchdogEvent|ProcessVisibility|WatchdogVisibility|WatchdogCPUStatistics' "$CR" 2>/dev/null | cut -c1-6000 || true
            echo '--- Zebra process record (trimmed) ---'
            grep -a -E -m 1 '"procname":"Zebra"' "$CR" 2>/dev/null | cut -c1-18000 || true
            echo '--- injected/jailbreak image hints in Zebra stack report ---'
            grep -a -Ei 'MobileSubstrate|DynamicLibraries|ElleKit|/var/jb/|/private/preboot/.*/procursus' "$CR" 2>/dev/null | grep -Ei 'Zebra|dylib|MobileSubstrate|DynamicLibraries|ElleKit' | head -n 120 | cut -c1-3000 || true
          fi

          echo '--- tweak filters explicitly targeting Zebra or broad app injection ---'
          for p in /var/jb/Library/MobileSubstrate/DynamicLibraries/*.plist; do
            [ -f "$p" ] || continue
            TXT="$(plutil -p "$p" 2>/dev/null || strings -a "$p" 2>/dev/null)"
            if printf '%s\n' "$TXT" | grep -Eqi 'xyz\.willy\.Zebra|Zebra|com\.apple\.UIKit|UIKit|SpringBoard'; then
              echo "FILTER=$p"
              printf '%s\n' "$TXT" | grep -Ei 'Bundles|Executables|Classes|xyz\.willy\.Zebra|Zebra|UIKit|SpringBoard' | head -n 50
            fi
          done

          echo '--- CyPwn APT truth ---'
          IDX=/var/jb/var/lib/apt/lists/repo.cypwn.xyz_._Packages
          printf 'cypwn_package_records='; grep -c '^Package:' "$IDX" 2>/dev/null || echo 0
          printf 'iphoneos_arm64_records='; grep -c '^Architecture: iphoneos-arm64$' "$IDX" 2>/dev/null || echo 0
          printf 'iphoneos_arm_records='; grep -c '^Architecture: iphoneos-arm$' "$IDX" 2>/dev/null || echo 0
          printf 'all_arch_records='; grep -c '^Architecture: all$' "$IDX" 2>/dev/null || echo 0
          echo 'apt_candidate:'
          apt-cache policy xyz.cypwn.python3.12 2>/dev/null || true

          echo '--- Sileo repo hash cache ---'
          RH=/var/jb/var/mobile/Library/Caches/Sileo/RepoHashCache.json
          if [ -f "$RH" ]; then
            ls -l "$RH"
            grep -a -io -E '.{0,120}repo\.cypwn\.xyz.{0,240}' "$RH" 2>/dev/null | head -n 20 || true
          fi

          echo '--- Sileo package database ---'
          DB=/var/jb/var/mobile/Library/Caches/CydiaClassic/Database/sileo.sqlite3
          ls -l "$DB" 2>/dev/null || true
          if command -v sqlite3 >/dev/null 2>&1 && [ -f "$DB" ]; then
            echo "sqlite3=$(command -v sqlite3)"
            echo 'tables:'
            sqlite3 "$DB" '.tables' 2>/dev/null || true
            echo 'schema:'
            sqlite3 "$DB" "SELECT name, sql FROM sqlite_master WHERE type='table';" 2>/dev/null | head -c 24000 || true
            echo
            echo 'cypwn_rows_any_table:'
            for t in $(sqlite3 "$DB" "SELECT name FROM sqlite_master WHERE type='table';" 2>/dev/null); do
              cols="$(sqlite3 "$DB" "PRAGMA table_info('$t');" 2>/dev/null | cut -d'|' -f2 | tr '\n' ' ')"
              echo "TABLE=$t COLS=$cols"
              for c in $cols; do
                sqlite3 "$DB" "SELECT '$t.$c', COUNT(*) FROM '$t' WHERE CAST('$c' AS TEXT) LIKE '%cypwn%';" 2>/dev/null | grep -v '|0$' || true
              done
            done
          else
            echo 'sqlite3_unavailable=true'
            strings -a "$DB" 2>/dev/null | grep -Ei 'cypwn|repo\.cypwn\.xyz' | head -n 80 || true
          fi

          echo 'TARGETED_IPHONE_DIAGNOSTICS_COMPLETE=1'
          EOS
          } | sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-sileo-output.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-sileo-${{ github.run_id }}
          path: iphone-zebra-sileo-output.txt
          if-no-files-found: warn
          retention-days: 7
