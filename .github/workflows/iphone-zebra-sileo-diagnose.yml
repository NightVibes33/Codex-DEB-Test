name: iPhone Zebra Exact Watchdog

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-exact-watchdog
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Capture latest Zebra watchdog and state
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          SSH_OPTS=(-o BatchMode=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          ZDIR='/var/mobile/Library/Application Support/xyz.willy.Zebra'
          CRASHDIR='/var/mobile/Library/Logs/CrashReporter'
          echo '=== ZEBRA POST-FAILURE STATE ==='
          echo 'READ_ONLY=YES'
          date
          dpkg-query -W -f='zebra_version=${Version}\n' xyz.willy.zebra 2>/dev/null || true
          echo '--- Zebra support dir ---'
          ls -la "$ZDIR" 2>/dev/null | sed -n '1,120p'
          echo '--- newest Zebra watchdogs ---'
          ls -lT "$CRASHDIR"/stacks+Zebra*.ips 2>/dev/null | tail -n 8 || true
          latest="$(ls -1t "$CRASHDIR"/stacks+Zebra*.ips 2>/dev/null | head -n1)"
          echo "LATEST_REPORT=$latest"
          [ -n "$latest" ] && wc -c "$latest" || true
          echo '--- termination summary ---'
          [ -n "$latest" ] && grep -Eo '0x8badf00d|process-launch|WatchdogEvent|watchdog[^,}\"]*|elapsed[^,}\"]*|CPU[^,}\"]*' "$latest" 2>/dev/null | head -n 50 || true
          echo '--- current Zebra process ---'
          ps aux 2>/dev/null | grep -E '[Z]ebra.app/Zebra|/Zebra$' || true
          EOS
          } | timeout 90s sshpass -e ssh "${SSH_OPTS[@]}" mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee zebra-state.txt

          LATEST=$(grep '^LATEST_REPORT=' zebra-state.txt | tail -n1 | cut -d= -f2-)
          if [ -z "$LATEST" ]; then
            echo 'ERROR=no Zebra watchdog report found'
            exit 20
          fi

          echo "Fetching raw watchdog: $LATEST"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            printf 'cat %q\n' "$LATEST"
          } | timeout 90s sshpass -e ssh "${SSH_OPTS[@]}" mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              > zebra-latest.ips

          python3 - <<'PY' | tee zebra-analysis.txt
          import json, pathlib, re
          p = pathlib.Path('zebra-latest.ips')
          raw = p.read_text(errors='replace')
          print('=== ZEBRA WATCHDOG STRUCTURE ===')
          print('bytes=', len(raw))
          lines = raw.splitlines()
          objs = []
          for i, line in enumerate(lines):
              s=line.strip().lstrip('\ufeff')
              if not s: continue
              try:
                  o=json.loads(s)
                  objs.append((i,o))
              except Exception:
                  pass
          if not objs:
              # Some reports are one JSON document after a small textual prefix.
              first = raw.find('{')
              if first >= 0:
                  try: objs=[(-1,json.loads(raw[first:]))]
                  except Exception as e: print('json_parse_error=',repr(e))
          print('json_objects=', len(objs))

          def short(v, n=240):
              s=str(v).replace('\n',' ')
              return s[:n]

          interesting_keys = {
              'termination','terminationReason','exception','exceptionType','reason','bug_type',
              'procName','processName','pid','path','name','symbol','imageIndex','offsetIntoBinaryTextSegment',
              'userFrames','kernelFrames','threads','threadById','processByPid','usedImages','binaryImages',
              'duration','cpuTime','cpuTimeSec','elapsed','watchdogEvent'
          }

          def walk(o, path='root', depth=0):
              if depth > 12: return
              if isinstance(o, dict):
                  for k,v in o.items():
                      lk=str(k)
                      np=f'{path}.{lk}'
                      if lk in interesting_keys or 'watchdog' in lk.lower() or 'termination' in lk.lower():
                          if isinstance(v,(str,int,float,bool,type(None))):
                              print(f'{np} = {short(v)}')
                          elif lk in ('userFrames','kernelFrames') and isinstance(v,list):
                              print(f'{np} count={len(v)}')
                              for j,fr in enumerate(v[:40]): print(f'  frame[{j}] {short(fr,500)}')
                          elif lk in ('usedImages','binaryImages') and isinstance(v,list):
                              print(f'{np} count={len(v)}')
                              for j,img in enumerate(v):
                                  txt=short(img,600)
                                  if re.search(r'Zebra|ElleKit|Substrate|apt|sqlite|\.dylib|/var/jb|preboot', txt, re.I):
                                      print(f'  image[{j}] {txt}')
                          elif lk in ('threads','threadById','processByPid'):
                              print(f'{np} type={type(v).__name__} size={len(v) if hasattr(v,"__len__") else "?"}')
                      walk(v,np,depth+1)
              elif isinstance(o,list):
                  for i,v in enumerate(o[:500]): walk(v,f'{path}[{i}]',depth+1)

          for idx,o in objs:
              print(f'--- JSON object from line {idx} ---')
              if isinstance(o,dict): print('top_keys=', sorted(o.keys()))
              walk(o)

          print('=== TEXT HITS ===')
          for pat in ['0x8badf00d','process-launch','Zebra','ElleKit','sqlite','libapt','sources.list']:
              hits=[m.start() for m in re.finditer(re.escape(pat), raw, re.I)]
              print(pat, 'hits=',len(hits))
              for pos in hits[:8]:
                  print(' ', raw[max(0,pos-180):pos+360].replace('\n',' ')[:540])
          PY

          echo 'WATCHDOG_CAPTURE_COMPLETE=1'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-exact-watchdog-${{ github.run_id }}
          path: |
            zebra-state.txt
            zebra-latest.ips
            zebra-analysis.txt
          if-no-files-found: warn
          retention-days: 7
