name: iPhone Zebra Sileo Probe

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-sileo-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Read-only iPhone container and launch-context probe
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          echo '=== READ-ONLY IPHONE ZEBRA/SILEO PROBE ==='
          echo 'policy=no-file-moves-no-file-writes-no-rm-no-package-actions-no-pref-changes'
          echo "root_id=$(id 2>/dev/null)"
          echo "root_home=$HOME"
          echo

          echo '--- Installed app registration ---'
          uicache -l 2>/dev/null | grep -Ei 'xyz\.willy\.Zebra|org\.coolstar\.Sileo|Zebra\.app|Sileo\.app' || true
          echo

          echo '--- App data containers by metadata ---'
          for meta in /var/mobile/Containers/Data/Application/*/.com.apple.mobile_container_manager.metadata.plist; do
            [ -f "$meta" ] || continue
            txt="$(plutil -p "$meta" 2>/dev/null || strings -a "$meta" 2>/dev/null)"
            case "$txt" in
              *xyz.willy.Zebra*|*org.coolstar.SileoStore*|*org.coolstar.sileo*)
                dir="${meta%/.com.apple.mobile_container_manager.metadata.plist}"
                echo "CONTAINER=$dir"
                printf '%s\n' "$txt" | head -n 30
                echo '-- matching state files --'
                find "$dir" -maxdepth 6 -type f \
                  \( -iname '*zebra*' -o -iname '*sileo*' -o -iname '*.db' -o -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*RepoHashCache*' -o -iname '*repocache*' \) \
                  -print 2>/dev/null | head -n 120
                echo '-- cache/support directories --'
                find "$dir/Library" -maxdepth 4 -type d \
                  \( -iname '*zebra*' -o -iname '*sileo*' -o -iname 'Caches' -o -iname 'Application Support' \) \
                  -print 2>/dev/null | head -n 80
                echo
                ;;
            esac
          done

          echo '--- Known rootless Sileo state ---'
          for f in \
            /var/jb/var/mobile/Library/Caches/CydiaClassic/Database/sileo.sqlite3 \
            /var/jb/var/mobile/Library/Caches/Sileo/RepoHashCache.json \
            /var/jb/var/mobile/Library/Caches/sileo-repocache.json \
            /var/jb/var/mobile/Library/Caches/Sileo/sileo-repocache.json \
            /var/mobile/Library/Caches/org.coolstar.SileoStore/Cache.db; do
            [ -e "$f" ] && ls -ld "$f"
          done
          echo

          echo '--- Launch tooling and GUI domains ---'
          for c in uiopen uicache launchctl lsappinfo open sudo; do
            printf '%s=' "$c"; command -v "$c" 2>/dev/null || echo unavailable
          done
          echo '-- launchctl user/gui domain --'
          launchctl print user/501 2>&1 | head -n 35 || true
          launchctl print gui/501 2>&1 | head -n 35 || true
          echo '-- SpringBoard process --'
          ps -axo user,pid,ppid,command 2>/dev/null | grep -E '[S]pringBoard|[f]rontboard|[b]ackboardd' | head -n 30 || true
          echo '-- uiopen help --'
          uiopen --help 2>&1 | head -n 30 || true
          echo

          echo '--- Mobile-user execution context only; no launch yet ---'
          sudo -u mobile env HOME=/var/mobile PATH="$PATH" sh -c 'echo "mobile_id=$(id)"; echo "mobile_home=$HOME"; printf "mobile_uiopen="; command -v uiopen || true; printf "mobile_launchctl="; command -v launchctl || true' 2>&1 || true
          echo
          echo 'READ_ONLY_PROBE_COMPLETE=1'
          EOS
          } | sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-sileo-probe.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-sileo-probe-${{ github.run_id }}
          path: iphone-zebra-sileo-probe.txt
          if-no-files-found: warn
          retention-days: 7
