name: iPhone Zebra Hot Stack

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-hot-stack
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null
      - name: Extract concise Zebra watchdog stack
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          latest="$(ls -1t /var/mobile/Library/Logs/CrashReporter/stacks+Zebra*.ips 2>/dev/null | head -n1)"
          echo '=== ZEBRA HOT STACK ==='
          echo 'READ_ONLY=YES'
          echo "report=$latest"
          [ -n "$latest" ] || { echo 'NO_REPORT=1'; exit 0; }

          echo '--- termination ---'
          grep -E '0x8badf00d|WatchdogEvent|process-launch|termination|exception|elapsed|CPU' "$latest" 2>/dev/null | head -n 35 || true

          echo '--- relevant images/modules ---'
          grep -Eo '"name":"[^"]+"|"path":"[^"]+"' "$latest" 2>/dev/null | \
            grep -Ei 'Zebra|ElleKit|Substrate|libapt|apt|sqlite|\.dylib|/var/jb|/private/preboot' | \
            head -n 100 || true

          echo '--- hot/thread/frame context ---'
          grep -n -E 'userFrames|kernelFrames|threadById|imageIndex|symbol|offsetIntoBinaryTextSegment|Zebra|ElleKit|libapt|sqlite|0x8badf00d' "$latest" 2>/dev/null | head -n 160 || true

          echo '--- Zebra sources.list ---'
          zsrc='/var/mobile/Library/Application Support/xyz.willy.Zebra/sources.list'
          if [ -f "$zsrc" ]; then
            ls -l "$zsrc"
            sed -n '1,80p' "$zsrc"
          else
            echo 'zebra_sources_missing=YES'
          fi

          echo '--- Zebra DB integrity ---'
          zdb='/var/mobile/Library/Application Support/xyz.willy.Zebra/zebra.db'
          ls -l "$zdb" 2>/dev/null || true
          if command -v sqlite3 >/dev/null 2>&1 && [ -f "$zdb" ]; then
            echo -n 'quick_check='
            timeout 8s sqlite3 "$zdb" 'PRAGMA quick_check;' 2>&1 | head -n 10 || true
            echo -n 'tables='
            timeout 8s sqlite3 "$zdb" '.tables' 2>&1 | head -n 8 || true
          else
            echo 'sqlite3_unavailable_or_db_missing=YES'
          fi
          echo 'HOT_STACK_COMPLETE=1'
          EOS
          } | timeout 120s sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-hot-stack.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-hot-stack-${{ github.run_id }}
          path: iphone-zebra-hot-stack.txt
          if-no-files-found: warn
          retention-days: 7
