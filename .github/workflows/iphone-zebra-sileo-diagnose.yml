name: iPhone Zebra Launch Probe

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-launch-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Read-only Zebra launch probe
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          echo '=== ZEBRA READ-ONLY GUI LAUNCH PROBE ==='
          echo 'NO_DATABASE_CHANGES=YES'
          echo 'NO_FILES_DELETED=YES'
          id
          echo '--- executable/registration ---'
          command -v uiopen || true
          ls -l "$(command -v uiopen 2>/dev/null)" 2>/dev/null || true
          uicache -l 2>/dev/null | grep -i -A2 -B2 zebra || true
          ZAPP="$(uicache -l 2>/dev/null | sed -n 's/.*xyz\.willy\.Zebra.*path: \([^}] *\).*/\1/p' | head -n1)"
          [ -n "$ZAPP" ] || ZAPP=/var/jb/Applications/Zebra.app
          echo "zebra_app_guess=$ZAPP"
          if [ -f "$ZAPP/Info.plist" ]; then
            plutil -p "$ZAPP/Info.plist" 2>/dev/null | grep -A8 -B3 -i 'CFBundleURL' || true
          fi
          echo '--- previous uiopen output ---'
          cat /tmp/zebra-uiopen-repair.log 2>/dev/null || true
          echo
          echo '--- launchctl capabilities ---'
          launchctl help asuser 2>&1 | head -n 20 || true
          launchctl print gui/501 2>&1 | head -n 25 || true
          echo '--- method 1: mobile uiopen zbra:// ---'
          pkill -f '/Zebra.app/Zebra' 2>/dev/null || true
          sleep 1
          sudo -u mobile env HOME=/var/mobile PATH="$PATH" uiopen 'zbra://' >/tmp/zebra-probe-m1.log 2>&1
          echo "m1_rc=$?"
          cat /tmp/zebra-probe-m1.log 2>/dev/null || true
          sleep 4
          ps -axo pid,user,command 2>/dev/null | grep -i '[Z]ebra' || true
          if ps -axo command 2>/dev/null | grep -q '[Z]ebra.app/Zebra'; then
            echo 'm1_started=YES'
          else
            echo 'm1_started=NO'
          fi
          echo '--- method 2: launchctl asuser 501 uiopen zbra:// ---'
          if ! ps -axo command 2>/dev/null | grep -q '[Z]ebra.app/Zebra'; then
            launchctl asuser 501 /var/jb/usr/bin/uiopen 'zbra://' >/tmp/zebra-probe-m2.log 2>&1
            echo "m2_rc=$?"
            cat /tmp/zebra-probe-m2.log 2>/dev/null || true
            sleep 4
          fi
          ps -axo pid,user,command 2>/dev/null | grep -i '[Z]ebra' || true
          if ps -axo command 2>/dev/null | grep -q '[Z]ebra.app/Zebra'; then
            echo 'm2_started=YES'
          else
            echo 'm2_started=NO'
          fi
          echo '--- method 3: mobile + launchctl asuser 501 ---'
          if ! ps -axo command 2>/dev/null | grep -q '[Z]ebra.app/Zebra'; then
            sudo -u mobile launchctl asuser 501 /var/jb/usr/bin/uiopen 'zbra://' >/tmp/zebra-probe-m3.log 2>&1
            echo "m3_rc=$?"
            cat /tmp/zebra-probe-m3.log 2>/dev/null || true
            sleep 4
          fi
          ps -axo pid,user,command 2>/dev/null | grep -i '[Z]ebra' || true
          if ps -axo command 2>/dev/null | grep -q '[Z]ebra.app/Zebra'; then
            echo 'm3_started=YES'
          else
            echo 'm3_started=NO'
          fi
          echo 'PROBE_COMPLETE=1'
          EOS
          } | timeout 120s sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-launch-probe.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-launch-probe-${{ github.run_id }}
          path: iphone-zebra-launch-probe.txt
          if-no-files-found: warn
          retention-days: 7
