name: iPhone Zebra Sileo Probe

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-sileo-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Bounded read-only iPhone probe
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          echo '=== BOUNDED READ-ONLY IPHONE PROBE ==='
          echo 'policy=no-device-writes-no-file-moves-no-rm-no-package-actions-no-pref-changes'
          echo "root_id=$(id 2>/dev/null)"

          echo '--- App registration ---'
          uicache -l 2>/dev/null | grep -Ei 'xyz\.willy\.Zebra|org\.coolstar\.Sileo|Zebra\.app|Sileo\.app' || true

          echo '--- App data containers ---'
          for meta in /var/mobile/Containers/Data/Application/*/.com.apple.mobile_container_manager.metadata.plist; do
            [ -f "$meta" ] || continue
            ids="$(strings -a "$meta" 2>/dev/null | grep -E 'xyz\.willy\.Zebra|org\.coolstar\.SileoStore|org\.coolstar\.sileo' | head -n 3)"
            [ -n "$ids" ] || continue
            dir="${meta%/.com.apple.mobile_container_manager.metadata.plist}"
            echo "CONTAINER=$dir"
            printf 'IDENTIFIERS=%s\n' "$ids"
            echo '-- Library top level --'
            ls -la "$dir/Library" 2>/dev/null | head -n 60 || true
            echo '-- exact likely state paths --'
            for f in \
              "$dir/Library/Caches/xyz.willy.Zebra/Zebra.db" \
              "$dir/Library/Caches/Zebra/Zebra.db" \
              "$dir/Library/Zebra/zebra.db" \
              "$dir/Library/Caches/org.coolstar.SileoStore/Cache.db" \
              "$dir/Library/Caches/CydiaClassic/Database/sileo.sqlite3" \
              "$dir/Library/Caches/Sileo/RepoHashCache.json"; do
              [ -e "$f" ] && ls -ld "$f"
            done
            echo '-- matching files, max depth 5 --'
            find "$dir/Library" -maxdepth 5 -type f \
              \( -iname '*zebra*' -o -iname '*sileo*' -o -iname '*.db' -o -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*RepoHashCache*' -o -iname '*repocache*' \) \
              -print 2>/dev/null | head -n 120 || true
          done

          echo '--- Rootless shared Sileo files ---'
          for f in \
            /var/jb/var/mobile/Library/Caches/CydiaClassic/Database/sileo.sqlite3 \
            /var/jb/var/mobile/Library/Caches/Sileo/RepoHashCache.json \
            /var/jb/var/mobile/Library/Caches/sileo-repocache.json \
            /var/jb/var/mobile/Library/Caches/Sileo/sileo-repocache.json \
            /var/mobile/Library/Caches/org.coolstar.SileoStore/Cache.db; do
            [ -e "$f" ] && ls -ld "$f"
          done

          echo '--- Launch context ---'
          for c in uiopen uicache launchctl lsappinfo open sudo; do
            printf '%s=' "$c"; command -v "$c" 2>/dev/null || echo unavailable
          done
          ps -axo user,pid,ppid,command 2>/dev/null | grep -E '[S]pringBoard|[f]rontboard|[b]ackboardd' | head -n 30 || true
          echo '--- mobile context ---'
          sudo -u mobile env HOME=/var/mobile PATH="$PATH" sh -c 'id; printf "HOME=%s\n" "$HOME"; printf "uiopen="; command -v uiopen || true; printf "launchctl="; command -v launchctl || true' 2>&1 || true

          echo 'READ_ONLY_PROBE_COMPLETE=1'
          EOS
          } | timeout 90s sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-sileo-probe.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-sileo-probe-${{ github.run_id }}
          path: iphone-zebra-sileo-probe.txt
          if-no-files-found: warn
          retention-days: 7
