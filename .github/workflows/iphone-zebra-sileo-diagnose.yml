name: iPhone Zebra Patch Dry Run

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-patch-dry-run
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Verify exact patch and signing on a copy only
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set -u
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          ZEBRA='/var/jb/Applications/Zebra.app/Zebra'
          TS="$(date +%Y%m%d-%H%M%S)"
          WORK="/var/mobile/Documents/CodexPackageManagerBackups/$TS/ZebraPatchDryRun"
          CAND="$WORK/Zebra.patched-candidate"
          ENT="$WORK/Zebra.entitlements.plist"

          echo '=== ZEBRA PATCH DRY RUN ==='
          echo 'INSTALLED_BINARY_CHANGED=0'
          echo 'DELETE_COMMANDS_USED=0'
          echo "ldid_path=$(command -v ldid 2>/dev/null || true)"
          echo "jbctl_path=$(command -v jbctl 2>/dev/null || true)"
          command -v ldid >/dev/null 2>&1 || { echo 'ERROR=ldid unavailable'; exit 21; }
          command -v jbctl >/dev/null 2>&1 || { echo 'ERROR=jbctl unavailable'; exit 22; }

          echo '--- ldid help/header ---'
          ldid -h "$ZEBRA" 2>&1 | sed -n '1,80p' || true
          echo '--- jbctl trustcache usage ---'
          jbctl 2>&1 | sed -n '1,40p' || true
          echo '--- original hash ---'
          ORIG_SHA="$(sha256sum "$ZEBRA" | awk '{print $1}')"
          echo "original_sha256=$ORIG_SHA"
          [ "$ORIG_SHA" = '17d470bdfaf19f1b92bdb8fded2aba666060681530f78ac0df6c49e1a6463b04' ] || { echo 'ERROR=installed Zebra hash changed since symbol match'; exit 23; }

          mkdir -p "$WORK"
          chown mobile:mobile "$WORK" 2>/dev/null || true
          chmod 700 "$WORK" 2>/dev/null || true
          cp -p "$ZEBRA" "$CAND"

          echo '--- original entitlements ---'
          ldid -e "$ZEBRA" > "$ENT"
          wc -c "$ENT"
          sed -n '1,100p' "$ENT"

          echo '--- exact instruction check ---'
          python3 - "$CAND" <<'PY'
          import sys, pathlib
          p=pathlib.Path(sys.argv[1])
          b=bytearray(p.read_bytes())
          off=0x180368
          expected=bytes.fromhex('16ea0194')
          replacement=bytes.fromhex('1f2003d5')
          got=bytes(b[off:off+4])
          print('patch_file_offset=0x180368')
          print('patch_original_bytes='+got.hex())
          print('patch_expected_bytes='+expected.hex())
          if got != expected:
              raise SystemExit('ERROR=exact branch bytes do not match expected removeMalware call')
          # Verify surrounding main() bytes too, making accidental-offset patch impossible.
          pre=bytes.fromhex('280e00d0003d44f9')
          post=bytes.fromhex('280e00d0006144f9')
          if bytes(b[off-8:off]) != pre or bytes(b[off+4:off+12]) != post:
              raise SystemExit('ERROR=main surrounding bytes mismatch')
          b[off:off+4]=replacement
          p.write_bytes(b)
          print('patch_new_bytes='+bytes(b[off:off+4]).hex())
          print('PATCH_BYTES_VERIFIED=1')
          PY

          echo '--- candidate pre-sign hash ---'
          sha256sum "$CAND"
          echo '--- sign candidate with original entitlements ---'
          ldid -S"$ENT" "$CAND"
          echo '--- candidate post-sign metadata ---'
          ldid -h "$CAND" 2>&1 | sed -n '1,120p' || true
          echo '--- candidate entitlements after sign ---'
          ldid -e "$CAND" 2>&1 | sed -n '1,120p' || true
          echo '--- exact patch persisted after signing ---'
          python3 - "$CAND" <<'PY'
          import sys,pathlib
          b=pathlib.Path(sys.argv[1]).read_bytes()
          off=0x180368
          print('signed_patch_bytes='+b[off:off+4].hex())
          if b[off:off+4] != bytes.fromhex('1f2003d5'):
              raise SystemExit('ERROR=patch did not persist through ldid')
          print('SIGNED_PATCH_VERIFIED=1')
          PY
          echo "candidate_sha256=$(sha256sum "$CAND" | awk '{print $1}')"
          echo "dry_run_dir=$WORK"
          echo 'PATCH_DRY_RUN_COMPLETE=1'
          echo 'INSTALLED_BINARY_CHANGED=0'
          EOS
          } | timeout 180s sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-patch-dry-run.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-patch-dry-run-${{ github.run_id }}
          path: iphone-zebra-patch-dry-run.txt
          if-no-files-found: warn
          retention-days: 7
