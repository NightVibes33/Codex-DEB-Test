name: iPhone Zebra removeMalware Patch

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-removeMalware-patch
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Patch only Zebra removeMalware call and preserve original
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set -eu
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH

          ZEBRA='/var/jb/Applications/Zebra.app/Zebra'
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="/var/mobile/Documents/CodexPackageManagerBackups/$TS/ZebraRemoveMalwarePatch"
          CAND="$BACKUP/Zebra"
          ENT="$BACKUP/Zebra.entitlements.plist"
          INPLACE_ORIG="$ZEBRA.before-removeMalware-patch-$TS"
          FAILED="$ZEBRA.failed-removeMalware-patch-$TS"
          OFF=$((0x180368))

          echo '=== ZEBRA removeMalware STARTUP PATCH V2 ==='
          echo 'DELETE_COMMANDS_USED=0'
          echo 'PACKAGES_REMOVED=0'
          echo 'TWEAKS_REMOVED=0'
          echo 'PREFERENCES_RESET=0'
          echo 'DATABASE_CHANGED=0'
          echo 'PATCH_SCOPE=one ARM64 instruction in Zebra main()'

          for cmd in ldid jbctl sha256sum dd od cmp cp mv chmod chown; do
            command -v "$cmd" >/dev/null 2>&1 || { echo "ERROR=required tool missing: $cmd"; exit 20; }
          done

          ORIG_SHA="$(sha256sum "$ZEBRA" | awk '{print $1}')"
          echo "installed_original_sha256=$ORIG_SHA"
          if [ "$ORIG_SHA" != '17d470bdfaf19f1b92bdb8fded2aba666060681530f78ac0df6c49e1a6463b04' ]; then
            echo 'ERROR=installed Zebra differs from exact binary that was symbol-matched; refusing patch'
            exit 21
          fi

          readhex() {
            dd if="$1" bs=1 skip="$2" count="$3" 2>/dev/null | od -An -tx1 | tr -d ' \n'
          }

          BEFORE4="$(readhex "$ZEBRA" "$OFF" 4)"
          PRE8="$(readhex "$ZEBRA" $((OFF-8)) 8)"
          POST8="$(readhex "$ZEBRA" $((OFF+4)) 8)"
          echo "installed_patch_bytes_before=$BEFORE4"
          echo "installed_pre8=$PRE8"
          echo "installed_post8=$POST8"
          [ "$BEFORE4" = '16ea0194' ] || { echo 'ERROR=removeMalware call bytes mismatch'; exit 22; }
          [ "$PRE8" = '280e00d0003d44f9' ] || { echo 'ERROR=pre-instruction context mismatch'; exit 23; }
          [ "$POST8" = '280e00d0006144f9' ] || { echo 'ERROR=post-instruction context mismatch'; exit 24; }
          echo 'EXACT_PATCH_SITE_VERIFIED=1'

          mkdir -p "$BACKUP"
          chmod 700 "$BACKUP"
          cp -p "$ZEBRA" "$BACKUP/Zebra.original"
          BACKUP_SHA="$(sha256sum "$BACKUP/Zebra.original" | awk '{print $1}')"
          echo "external_backup_sha256=$BACKUP_SHA"
          [ "$BACKUP_SHA" = "$ORIG_SHA" ] || { echo 'ERROR=external original backup hash mismatch'; exit 25; }

          ldid -e "$ZEBRA" > "$ENT"
          [ -s "$ENT" ] || { echo 'ERROR=failed to preserve Zebra entitlements'; exit 26; }
          echo "entitlements_bytes=$(wc -c < "$ENT" | tr -d ' ')"

          cp -p "$ZEBRA" "$CAND"
          printf '\037\040\003\325' | dd of="$CAND" bs=1 seek="$OFF" conv=notrunc 2>/dev/null
          CAND_PATCH="$(readhex "$CAND" "$OFF" 4)"
          echo "candidate_patch_bytes_pre_sign=$CAND_PATCH"
          [ "$CAND_PATCH" = '1f2003d5' ] || { echo 'ERROR=NOP write verification failed'; exit 27; }

          ldid -S"$ENT" "$CAND"
          CAND_PATCH_SIGNED="$(readhex "$CAND" "$OFF" 4)"
          echo "candidate_patch_bytes_post_sign=$CAND_PATCH_SIGNED"
          [ "$CAND_PATCH_SIGNED" = '1f2003d5' ] || { echo 'ERROR=patch changed during signing'; exit 28; }

          ldid -e "$CAND" > "$BACKUP/Zebra.candidate.entitlements.plist"
          cmp -s "$ENT" "$BACKUP/Zebra.candidate.entitlements.plist" || { echo 'ERROR=candidate entitlements differ from original'; exit 29; }
          echo 'ENTITLEMENTS_PRESERVED=1'

          HDR="$(ldid -h "$CAND" 2>&1)"
          printf '%s\n' "$HDR" | sed -n '1,30p'
          IDENT="$(printf '%s\n' "$HDR" | sed -n 's/^Identifier=//p' | head -n1)"
          CDHASH="$(printf '%s\n' "$HDR" | sed -n 's/^CDHash=//p' | head -n1)"
          echo "candidate_identifier=$IDENT"
          echo "candidate_cdhash=$CDHASH"
          [ "$IDENT" = 'Zebra' ] || { echo 'ERROR=candidate code-sign identifier is not Zebra'; exit 30; }
          [ "${#CDHASH}" -eq 40 ] || { echo "ERROR=CDHash length is ${#CDHASH}, expected 40"; exit 31; }
          case "$CDHASH" in
            *[!0-9a-fA-F]*) echo 'ERROR=CDHash contains non-hex characters'; exit 31 ;;
          esac
          echo 'CDHASH_FORMAT_VERIFIED=1'

          jbctl trustcache add "$CDHASH"
          if ! jbctl trustcache info 2>/dev/null | grep -qi "$CDHASH"; then
            echo 'ERROR=new Zebra CDHash was not found in jailbreak trustcache; installed file remains untouched'
            exit 32
          fi
          echo 'CANDIDATE_TRUSTCACHE_VERIFIED=1'

          killall Zebra 2>/dev/null || true
          mv "$ZEBRA" "$INPLACE_ORIG"
          if ! cp -p "$CAND" "$ZEBRA"; then
            echo 'ERROR=copying patched candidate into canonical path failed; restoring original'
            mv "$INPLACE_ORIG" "$ZEBRA"
            echo 'ROLLBACK_COMPLETED=1'
            exit 33
          fi

          chown root:wheel "$ZEBRA" 2>/dev/null || true
          chmod 755 "$ZEBRA"

          INST_PATCH="$(readhex "$ZEBRA" "$OFF" 4)"
          INST_HDR="$(ldid -h "$ZEBRA" 2>&1)"
          INST_IDENT="$(printf '%s\n' "$INST_HDR" | sed -n 's/^Identifier=//p' | head -n1)"
          INST_CDHASH="$(printf '%s\n' "$INST_HDR" | sed -n 's/^CDHash=//p' | head -n1)"
          echo "installed_patch_bytes_after=$INST_PATCH"
          echo "installed_identifier_after=$INST_IDENT"
          echo "installed_cdhash_after=$INST_CDHASH"

          INSTALL_OK=1
          [ "$INST_PATCH" = '1f2003d5' ] || INSTALL_OK=0
          [ "$INST_IDENT" = 'Zebra' ] || INSTALL_OK=0
          [ "$INST_CDHASH" = "$CDHASH" ] || INSTALL_OK=0
          ldid -e "$ZEBRA" > "$BACKUP/Zebra.installed.entitlements.plist" || INSTALL_OK=0
          cmp -s "$ENT" "$BACKUP/Zebra.installed.entitlements.plist" || INSTALL_OK=0
          if ! jbctl trustcache info 2>/dev/null | grep -qi "$INST_CDHASH"; then INSTALL_OK=0; fi

          if [ "$INSTALL_OK" -ne 1 ]; then
            echo 'ERROR=post-install verification failed; restoring exact original immediately'
            mv "$ZEBRA" "$FAILED"
            mv "$INPLACE_ORIG" "$ZEBRA"
            echo "failed_candidate_preserved=$FAILED"
            echo 'ROLLBACK_COMPLETED=1'
            exit 34
          fi

          echo "original_preserved_in_place=$INPLACE_ORIG"
          echo "external_backup=$BACKUP/Zebra.original"
          echo "signed_candidate_preserved=$CAND"
          echo "backup_dir=$BACKUP"
          echo 'ORIGINAL_BYTES_PRESERVED=1'
          echo 'ZEBRA_REMOVE_MALWARE_CALL_PATCH_INSTALLED=1'
          echo 'RESULT=Patched Zebra is signed, trusted, entitlement-matched, and installed. Manual SpringBoard launch is required for watchdog verification.'
          EOS
          } | timeout 240s sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-removeMalware-patch.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-removeMalware-patch-${{ github.run_id }}
          path: iphone-zebra-removeMalware-patch.txt
          if-no-files-found: warn
          retention-days: 7
