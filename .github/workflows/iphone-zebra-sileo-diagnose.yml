name: iPhone Zebra Symbol Match

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-symbol-match
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Fetch installed Zebra executable and inspect symbols
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          SSH_OPTS=(-o BatchMode=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")

          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          echo '=== ZEBRA EXECUTABLE LOCATE ==='
          dpkg-query -W -f='zebra_version=${Version}\n' xyz.willy.zebra 2>/dev/null || true
          dpkg -L xyz.willy.zebra 2>/dev/null | grep -E '/Zebra\.app/Zebra$' | head -n 5
          EOS
          } | timeout 60s sshpass -e ssh "${SSH_OPTS[@]}" mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee zebra-locate.txt

          ZEBRA_PATH=$(grep -E '^/.*Zebra\.app/Zebra$' zebra-locate.txt | head -n1)
          if [ -z "$ZEBRA_PATH" ]; then
            echo 'ERROR=no Zebra executable path found'
            exit 20
          fi
          echo "zebra_executable=$ZEBRA_PATH"

          {
            printf '%s\n' "$IPHONE_PASSWORD"
            printf 'cat %q\n' "$ZEBRA_PATH"
          } | timeout 90s sshpass -e ssh "${SSH_OPTS[@]}" mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              > Zebra.bin

          chmod +x Zebra.bin
          echo '=== FILE ===' | tee zebra-symbols.txt
          file Zebra.bin | tee -a zebra-symbols.txt
          sha256sum Zebra.bin | tee -a zebra-symbols.txt

          echo '=== MACH-O LOAD COMMANDS / UUID ===' | tee -a zebra-symbols.txt
          llvm-objdump --macho --private-headers Zebra.bin 2>&1 | grep -A4 -B2 -E 'LC_UUID|uuid' | tee -a zebra-symbols.txt || true

          echo '=== HOT FRAME NEAREST SYMBOLS ===' | tee -a zebra-symbols.txt
          python3 - <<'PY' | tee -a zebra-symbols.txt
          import subprocess,re
          targets=[1910732,1573740]
          try:
              out=subprocess.check_output(['llvm-nm','-n','Zebra.bin'],stderr=subprocess.STDOUT,text=True,errors='replace')
          except Exception as e:
              print('llvm_nm_error=',e); raise SystemExit
          syms=[]
          for line in out.splitlines():
              m=re.match(r'^([0-9a-fA-F]+)\s+\S\s+(.*)$',line)
              if m:
                  syms.append((int(m.group(1),16),m.group(2)))
          print('symbol_count=',len(syms))
          for target in targets:
              prior=[s for s in syms if s[0] <= target]
              nxt=[s for s in syms if s[0] > target]
              print('target_offset=',target,hex(target))
              for a,n in prior[-8:]: print('  prior',hex(a),target-a,n[:300])
              for a,n in nxt[:4]: print('  next ',hex(a),a-target,n[:300])
          PY

          echo '=== RELEVANT STRINGS AROUND STARTUP ===' | tee -a zebra-symbols.txt
          strings -a Zebra.bin | grep -Ei 'database|migration|refresh|source|featured|package|tabbar|scene|launch' | head -n 180 | tee -a zebra-symbols.txt || true
          echo 'SYMBOL_MATCH_COMPLETE=1' | tee -a zebra-symbols.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-symbol-match-${{ github.run_id }}
          path: |
            zebra-locate.txt
            zebra-symbols.txt
            Zebra.bin
          if-no-files-found: warn
          retention-days: 7
