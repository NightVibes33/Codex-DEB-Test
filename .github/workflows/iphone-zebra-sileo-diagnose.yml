name: iPhone Package Sources Repair

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-package-sources-repair
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Inspect and safely refresh package source indexes
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set -u
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="/var/mobile/Documents/CodexPackageManagerBackups/$TS/PackageSources"
          ZDIR='/var/mobile/Library/Application Support/xyz.willy.Zebra'
          APTROOT='/var/jb/etc/apt'
          APTLISTS='/var/jb/var/lib/apt/lists'

          echo '=== PACKAGE SOURCE DIAGNOSE + SAFE REFRESH ==='
          echo 'DELETE_COMMANDS_USED=0'
          echo 'PACKAGES_REMOVED=0'
          echo 'TWEAKS_REMOVED=0'
          echo 'PREFERENCES_RESET=0'
          echo "backup_dir=$BACKUP"
          mkdir -p "$BACKUP"
          chmod 700 "$BACKUP" 2>/dev/null || true

          echo '--- versions ---'
          dpkg-query -W -f='sileo=${Version}\n' org.coolstar.sileo 2>/dev/null || true
          dpkg-query -W -f='zebra=${Version}\n' xyz.willy.zebra 2>/dev/null || true
          sw_vers 2>/dev/null || true

          echo '--- canonical apt sources before ---'
          if [ -f "$APTROOT/sources.list" ]; then
            cp -p "$APTROOT/sources.list" "$BACKUP/apt-sources.list"
            ls -l "$APTROOT/sources.list"
            sed -n '1,240p' "$APTROOT/sources.list"
          fi
          if [ -d "$APTROOT/sources.list.d" ]; then
            cp -Rp "$APTROOT/sources.list.d" "$BACKUP/apt-sources.list.d"
            find "$APTROOT/sources.list.d" -maxdepth 1 -type f -print -exec ls -l {} \; -exec sh -c 'echo "--- $1"; sed -n "1,220p" "$1"' sh {} \;
          fi

          echo '--- apt config / architectures ---'
          dpkg --print-architecture 2>/dev/null || true
          dpkg --print-foreign-architectures 2>/dev/null || true
          apt-config dump 2>/dev/null | grep -E '^(Dir|APT::Architecture|APT::Architectures)' | head -n 120 || true

          echo '--- apt list state before ---'
          if [ -d "$APTLISTS" ]; then
            echo "apt_list_files_before=$(find "$APTLISTS" -maxdepth 1 -type f | wc -l | tr -d ' ')"
            echo "apt_packages_files_before=$(find "$APTLISTS" -maxdepth 1 -type f -name '*Packages*' | wc -l | tr -d ' ')"
            for f in "$APTLISTS"/*Packages*; do
              [ -f "$f" ] || continue
              c="$(grep -a '^Package:' "$f" 2>/dev/null | wc -l | tr -d ' ')"
              echo "apt_index=$f packages=$c"
            done
          fi

          echo '--- Zebra state before ---'
          if [ -d "$ZDIR" ]; then
            cp -p "$ZDIR/sources.list" "$BACKUP/Zebra.sources.list" 2>/dev/null || true
            cp -Rp "$ZDIR/lists" "$BACKUP/Zebra.lists" 2>/dev/null || true
            cp -p "$ZDIR/zebra.db" "$BACKUP/zebra.db" 2>/dev/null || true
            ls -la "$ZDIR" || true
            echo '--- Zebra sources.list ---'
            sed -n '1,260p' "$ZDIR/sources.list" 2>/dev/null || true
            echo "zebra_source_lines=$(grep -Ec '^[[:space:]]*deb[[:space:]]+' "$ZDIR/sources.list" 2>/dev/null || true)"
            echo "zebra_list_files=$(find "$ZDIR/lists" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')"
            for f in "$ZDIR/lists"/*; do
              [ -f "$f" ] || continue
              c="$(grep -a '^Package:' "$f" 2>/dev/null | wc -l | tr -d ' ')"
              echo "zebra_index=$(basename "$f") bytes=$(wc -c < "$f" | tr -d ' ') packages=$c"
            done
            [ -f "$ZDIR/zebra.db" ] && ls -l "$ZDIR/zebra.db" || echo 'zebra_db=ABSENT'
          else
            echo 'zebra_support_dir=ABSENT'
          fi

          echo '--- Sileo data/cache discovery ---'
          find /var/mobile/Library -maxdepth 5 \( -iname '*sileo*' -o -iname '*coolstar*' \) -print 2>/dev/null | head -n 160 || true
          find /var/mobile/Library -maxdepth 5 -type f \( -iname '*.db' -o -iname '*.sqlite' -o -iname '*.sqlite3' \) -print 2>/dev/null | grep -Ei 'sileo|coolstar' | head -n 100 || true

          echo '--- executable helpers ---'
          find /var/jb/Applications/Sileo.app /var/jb/Applications/Zebra.app -maxdepth 2 -type f -perm -111 -print 2>/dev/null || true

          echo '--- permissions repair (read/traverse only) ---'
          # Package managers run as mobile. Ensure source/index files are readable and parent dirs traversable.
          [ -d "$APTROOT" ] && chmod a+rx "$APTROOT" 2>/dev/null || true
          [ -d "$APTROOT/sources.list.d" ] && chmod a+rx "$APTROOT/sources.list.d" 2>/dev/null || true
          [ -f "$APTROOT/sources.list" ] && chmod a+r "$APTROOT/sources.list" 2>/dev/null || true
          find "$APTROOT/sources.list.d" -maxdepth 1 -type f -exec chmod a+r {} \; 2>/dev/null || true
          [ -d "$APTLISTS" ] && chmod a+rx "$APTLISTS" 2>/dev/null || true
          find "$APTLISTS" -maxdepth 1 -type f -exec chmod a+r {} \; 2>/dev/null || true
          if [ -d "$ZDIR" ]; then
            chmod a+rx "$ZDIR" 2>/dev/null || true
            [ -f "$ZDIR/sources.list" ] && chmod a+r "$ZDIR/sources.list" 2>/dev/null || true
            [ -d "$ZDIR/lists" ] && chmod a+rx "$ZDIR/lists" 2>/dev/null || true
            find "$ZDIR/lists" -maxdepth 1 -type f -exec chmod a+r {} \; 2>/dev/null || true
          fi

          echo '--- mobile readability checks ---'
          sudo -u mobile sh -c 'test -r /var/jb/etc/apt/sources.list 2>/dev/null && echo mobile_reads_main_sources=1 || true'
          sudo -u mobile sh -c 'for f in /var/jb/etc/apt/sources.list.d/*; do [ -f "$f" ] || continue; [ -r "$f" ] || echo "mobile_unreadable_source=$f"; done' 2>/dev/null || true
          sudo -u mobile sh -c 'for f in /var/jb/var/lib/apt/lists/*Packages*; do [ -f "$f" ] || continue; [ -r "$f" ] || echo "mobile_unreadable_index=$f"; done' 2>/dev/null || true
          sudo -u mobile sh -c 'test -r "/var/mobile/Library/Application Support/xyz.willy.Zebra/sources.list" && echo mobile_reads_zebra_sources=1 || true' 2>/dev/null || true

          echo '--- apt refresh ---'
          APTLOG="$BACKUP/apt-get-update.log"
          set +e
          apt-get update 2>&1 | tee "$APTLOG"
          APT_RC=${PIPESTATUS:-0}
          # dash does not expose PIPESTATUS; capture a second lightweight update return if necessary.
          apt-get update >/dev/null 2>&1
          APT_RC=$?
          set -e
          echo "apt_update_rc=$APT_RC"
          echo '--- apt errors/warnings ---'
          grep -Ei '(^E:|^W:|failed|error|404|403|certificate|signature|NO_PUBKEY|Release file)' "$APTLOG" | tail -n 200 || true

          echo '--- apt list state after ---'
          TOTAL=0
          FILES=0
          for f in "$APTLISTS"/*Packages*; do
            [ -f "$f" ] || continue
            FILES=$((FILES+1))
            c="$(grep -a '^Package:' "$f" 2>/dev/null | wc -l | tr -d ' ')"
            TOTAL=$((TOTAL+c))
            echo "apt_index_after=$f packages=$c bytes=$(wc -c < "$f" | tr -d ' ')"
          done
          echo "apt_packages_files_after=$FILES"
          echo "apt_package_records_after=$TOTAL"
          MOBILE_TOTAL="$(sudo -u mobile sh -c 'grep -ah "^Package:" /var/jb/var/lib/apt/lists/*Packages* 2>/dev/null | wc -l | tr -d " "' 2>/dev/null || echo 0)"
          echo "mobile_visible_apt_package_records=$MOBILE_TOTAL"

          echo '--- Zebra state after apt refresh ---'
          if [ -d "$ZDIR" ]; then
            echo "zebra_sources_bytes=$(wc -c < "$ZDIR/sources.list" 2>/dev/null | tr -d ' ')"
            echo "zebra_source_lines=$(grep -Ec '^[[:space:]]*deb[[:space:]]+' "$ZDIR/sources.list" 2>/dev/null || true)"
            echo "zebra_list_files=$(find "$ZDIR/lists" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')"
            ZTOTAL=0
            for f in "$ZDIR/lists"/*; do
              [ -f "$f" ] || continue
              c="$(grep -a '^Package:' "$f" 2>/dev/null | wc -l | tr -d ' ')"
              ZTOTAL=$((ZTOTAL+c))
            done
            echo "zebra_package_records_in_lists=$ZTOTAL"
            [ -f "$ZDIR/zebra.db" ] && echo "zebra_db_bytes=$(wc -c < "$ZDIR/zebra.db" | tr -d ' ')" || echo 'zebra_db=ABSENT'
          fi

          # Restart only the two package-manager processes so they reopen refreshed files.
          killall Sileo 2>/dev/null || true
          killall Zebra 2>/dev/null || true
          echo 'PACKAGE_MANAGER_PROCESSES_RESTARTED=1'
          echo 'ORIGINAL_SOURCE_AND_INDEX_FILES_BACKED_UP=1'
          echo 'RESULT=APT indexes refreshed and read permissions repaired; diagnostics captured for any remaining Sileo/Zebra-specific cache issue.'
          EOS
          } | timeout 360s sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-package-sources-repair.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-package-sources-repair-${{ github.run_id }}
          path: iphone-package-sources-repair.txt
          if-no-files-found: warn
          retention-days: 7
