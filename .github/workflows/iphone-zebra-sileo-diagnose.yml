name: iPhone Zebra Watchdog Inspect

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-watchdog-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null
      - name: Read-only Zebra watchdog inspection
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          CRASHDIR=/var/mobile/Library/Logs/CrashReporter
          ZDIR='/var/mobile/Library/Application Support/xyz.willy.Zebra'
          latest="$(ls -1t "$CRASHDIR"/stacks+Zebra*.ips 2>/dev/null | head -n1)"
          echo '=== ZEBRA WATCHDOG READ-ONLY INSPECTION ==='
          echo 'NO_DATABASE_CHANGES=YES'
          echo 'NO_FILES_DELETED=YES'
          echo "latest=$latest"
          if [ -n "$latest" ]; then
            echo '--- report metadata / termination ---'
            grep -n -E 'procName|bundleInfo|exception|termination|Watchdog|watchdog|0x8badf00d|process-launch|CPU|elapsed|triggered|faulting' "$latest" 2>/dev/null | head -n 120 || true
            echo '--- Zebra / jailbreak / injected image references ---'
            grep -n -E 'Zebra|MobileSubstrate|DynamicLibraries|ElleKit|ellekit|Substrate|Tweak|\.dylib|procursus|dopamine' "$latest" 2>/dev/null | head -n 260 || true
            echo '--- first 220 lines of report ---'
            sed -n '1,220p' "$latest" 2>/dev/null || true
          fi
          echo '--- Zebra application support files ---'
          find "$ZDIR" -maxdepth 2 -type f -exec ls -l {} \; 2>/dev/null | head -n 160 || true
          echo '--- Zebra package info ---'
          dpkg -s xyz.willy.zebra 2>/dev/null | sed -n '1,100p' || true
          echo '--- Zebra binary deps ---'
          command -v otool >/dev/null 2>&1 && otool -L /var/jb/Applications/Zebra.app/Zebra 2>/dev/null | head -n 120 || true
          echo 'INSPECTION_COMPLETE=1'
          EOS
          } | timeout 120s sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-watchdog-inspect.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-watchdog-inspect-${{ github.run_id }}
          path: iphone-zebra-watchdog-inspect.txt
          if-no-files-found: warn
          retention-days: 7
