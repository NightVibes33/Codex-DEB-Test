name: iPhone Zebra Sileo Repair

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-zebra-sileo-diagnose.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-zebra-sileo-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null

      - name: Targeted non-destructive iPhone repair
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          export HOME=/var/mobile
          TS="$(date +%Y%m%d-%H%M%S)"
          BK="/var/mobile/Documents/CodexPackageManagerBackups/$TS"
          mkdir -p "$BK"
          chmod 700 "$BK" 2>/dev/null || true

          echo '=== TARGETED NON-DESTRUCTIVE IPHONE REPAIR ==='
          echo "backup_dir=$BK"
          echo 'policy=no-rm-no-package-removal-no-tweak-removal-no-pref-reset'

          # If the prior interrupted repair had already renamed one of these exact
          # state files, put the newest preserved original back before proceeding.
          restore_interrupted() {
            orig="$1"
            [ -e "$orig" ] && return 0
            newest="$(ls -1t "$orig".before-fix-* 2>/dev/null | head -n 1)"
            if [ -n "$newest" ] && [ -e "$newest" ]; then
              mv "$newest" "$orig" 2>/dev/null && echo "recovered_interrupted=$orig"
            fi
          }

          preserve_for_rebuild() {
            orig="$1"
            list="$2"
            [ -f "$orig" ] || return 0
            flat="$(printf '%s' "$orig" | sed 's#^/##; s#/#__#g')"
            cp -p "$orig" "$BK/$flat" 2>/dev/null || return 1
            mv "$orig" "$orig.before-fix-$TS" 2>/dev/null || return 1
            printf '%s\n' "$orig" >> "$list"
            echo "preserved=$orig"
          }

          restore_list() {
            list="$1"
            tag="$2"
            [ -f "$list" ] || return 0
            while IFS= read -r orig; do
              [ -n "$orig" ] || continue
              saved="$orig.before-fix-$TS"
              [ -e "$saved" ] || continue
              if [ -e "$orig" ]; then
                mv "$orig" "$orig.failed-rebuild-$TS" 2>/dev/null || true
                echo "preserved_failed_rebuild=$orig.failed-rebuild-$TS"
              fi
              mv "$saved" "$orig" 2>/dev/null || true
              echo "restored_${tag}=$orig"
            done < "$list"
          }

          ZDB=/var/mobile/Library/Caches/xyz.willy.Zebra/Zebra.db
          ZOLD=/var/mobile/Library/Zebra/zebra.db
          SDB=/var/jb/var/mobile/Library/Caches/CydiaClassic/Database/sileo.sqlite3
          RH=/var/jb/var/mobile/Library/Caches/Sileo/RepoHashCache.json

          for f in "$ZDB" "$ZDB-wal" "$ZDB-shm" "$ZOLD" "$ZOLD-wal" "$ZOLD-shm" \
                   "$SDB" "$SDB-wal" "$SDB-shm" "$RH"; do
            restore_interrupted "$f"
          done

          killall Zebra 2>/dev/null || true
          killall Sileo 2>/dev/null || true
          sleep 2

          echo '--- Pre-repair invariants ---'
          dpkg-query -W -f='zebra=${Status} ${Version} ${Architecture}\n' xyz.willy.zebra 2>/dev/null || true
          dpkg-query -W -f='sileo=${Status} ${Version} ${Architecture}\n' org.coolstar.sileo 2>/dev/null || true
          dpkg-query -W -f='ellekit=${Status} ${Version} ${Architecture}\n' ellekit 2>/dev/null || true
          printf 'cypwn_records='; grep -c '^Package:' /var/jb/var/lib/apt/lists/repo.cypwn.xyz_._Packages 2>/dev/null || echo 0
          apt-cache policy xyz.cypwn.python3.12 2>/dev/null | head -n 8 || true

          echo '--- Zebra targeted DB rebuild ---'
          ZLIST="$BK/zebra-moved.txt"
          : > "$ZLIST"
          for f in "$ZDB" "$ZDB-wal" "$ZDB-shm" "$ZOLD" "$ZOLD-wal" "$ZOLD-shm"; do
            preserve_for_rebuild "$f" "$ZLIST" || true
          done
          ZCR_BEFORE="$(ls -1t /var/mobile/Library/Logs/CrashReporter/stacks+Zebra*.ips 2>/dev/null | head -n 1)"
          (uiopen 'zbra://' >/dev/null 2>&1 || uiopen 'zebra://' >/dev/null 2>&1 || uiopen /var/jb/Applications/Zebra.app >/dev/null 2>&1 || true) &
          sleep 8
          ZPID8="$(pgrep -x Zebra 2>/dev/null | tr '\n' ' ')"
          echo "zebra_pid_8s=$ZPID8"
          sleep 17
          ZPID25="$(pgrep -x Zebra 2>/dev/null | tr '\n' ' ')"
          echo "zebra_pid_25s=$ZPID25"
          ZCR_AFTER="$(ls -1t /var/mobile/Library/Logs/CrashReporter/stacks+Zebra*.ips 2>/dev/null | head -n 1)"
          echo "zebra_crash_before=$ZCR_BEFORE"
          echo "zebra_crash_after=$ZCR_AFTER"
          if [ -n "$ZPID25" ] && [ "$ZCR_AFTER" = "$ZCR_BEFORE" ]; then
            echo 'ZEBRA_REPAIR_VERIFIED=1'
          else
            echo 'ZEBRA_REPAIR_VERIFIED=0'
            restore_list "$ZLIST" zebra
          fi

          killall Sileo 2>/dev/null || true
          sleep 2

          echo '--- Sileo targeted cache DB rebuild ---'
          SLIST="$BK/sileo-moved.txt"
          : > "$SLIST"
          for f in "$SDB" "$SDB-wal" "$SDB-shm" "$RH"; do
            preserve_for_rebuild "$f" "$SLIST" || true
          done

          # The APT CyPwn index is already valid and populated; do not alter it.
          printf 'cypwn_records_before_sileo_launch='; grep -c '^Package:' /var/jb/var/lib/apt/lists/repo.cypwn.xyz_._Packages 2>/dev/null || echo 0
          (uiopen 'sileo://' >/dev/null 2>&1 || uiopen /var/jb/Applications/Sileo.app >/dev/null 2>&1 || true) &
          sleep 28

          SDB_OK=0
          RH_OK=0
          [ -f "$SDB" ] && strings -a "$SDB" 2>/dev/null | grep -Fq 'xyz.cypwn.python3.12' && SDB_OK=1
          [ -f "$RH" ] && grep -aq 'repo.cypwn.xyz' "$RH" 2>/dev/null && RH_OK=1
          echo "sileo_db_exists=$([ -f "$SDB" ] && echo 1 || echo 0)"
          echo "sileo_cypwn_db_verified=$SDB_OK"
          echo "sileo_cypwn_hash_verified=$RH_OK"
          printf 'sileo_pid='; pgrep -x Sileo 2>/dev/null | tr '\n' ' '; echo

          if [ "$SDB_OK" -eq 1 ]; then
            echo 'SILEO_CYPWN_REPAIR_VERIFIED=1'
          else
            echo 'SILEO_CYPWN_REPAIR_VERIFIED=0'
            restore_list "$SLIST" sileo
          fi

          echo '--- Final invariants ---'
          dpkg-query -W -f='zebra=${Status} ${Version} ${Architecture}\n' xyz.willy.zebra 2>/dev/null || true
          dpkg-query -W -f='sileo=${Status} ${Version} ${Architecture}\n' org.coolstar.sileo 2>/dev/null || true
          dpkg-query -W -f='ellekit=${Status} ${Version} ${Architecture}\n' ellekit 2>/dev/null || true
          printf 'cypwn_records_final='; grep -c '^Package:' /var/jb/var/lib/apt/lists/repo.cypwn.xyz_._Packages 2>/dev/null || echo 0
          echo 'NO_FILES_DELETED=1'
          echo 'NO_PACKAGES_REMOVED=1'
          echo 'NO_TWEAKS_REMOVED=1'
          echo 'NO_PREFS_RESET=1'
          echo 'IPHONE_REPAIR_COMPLETE=1'
          EOS
          } | sshpass -e ssh \
              -o BatchMode=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee iphone-zebra-sileo-output.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-zebra-sileo-repair-${{ github.run_id }}
          path: iphone-zebra-sileo-output.txt
          if-no-files-found: warn
          retention-days: 7
