name: Temp 3105 iOS15 stability proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-3105-ios15-launch-diagnostic.yml"

permissions:
  contents: read

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.r.outputs.name }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          n="$(python3 - <<'PY'
          import json
          for e in json.load(open('/tmp/e.json')).get('environments',[]):
              if int(e.get('id',-1))==18728387881:
                  print(e['name']); break
          PY
          )"
          test -n "$n"
          echo "name=$n" >> "$GITHUB_OUTPUT"

  prove:
    needs: env
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare Tailscale SSH
        run: |
          set -euo pipefail
          sudo install -d -m0755 /usr/share/keyrings
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tailscale openssh-client sshpass
          sudo systemctl enable --now tailscaled

      - name: Launch as mobile and hold same PID 90 seconds
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          HOST: "100.96.37.124"
          BUNDLE: "com.apple.mobile.MobileHouseArrest"
        run: |
          set -euo pipefail
          sudo tailscale up --auth-key="$TAILSCALE_AUTHKEY" --hostname="gh-3105-stable-${GITHUB_RUN_ID}" --accept-dns=false --accept-routes=false --reset
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ready=0
          for n in $(seq 1 18); do
            rm -f ~/.ssh/known_hosts
            if ssh-keyscan -T8 -H "$HOST" >~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then ready=1; break; fi
            sudo tailscale ping --timeout=5s --c 1 "$HOST" || true
            sleep 8
          done
          test "$ready" = 1
          chmod 600 ~/.ssh/known_hosts
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<EOS
          set -e
          export PATH="/var/jb/usr/bin:/var/jb/bin:/var/jb/usr/sbin:/var/jb/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:\$PATH"
          BUNDLE='$BUNDLE'
          echo '=== 3105 STABILITY PROOF ==='
          uname -a

          APP=''
          for p in /var/containers/Bundle/Application/*/3105.app; do
            [ -d "\$p" ] && APP="\$p" && break
          done
          [ -n "\$APP" ] || { echo APP_NOT_FOUND; exit 71; }
          echo "installed_app=\$APP"
          [ -x "\$APP/3105" ] || { echo EXECUTABLE_NOT_FOUND; exit 72; }
          echo "installed_executable=\$APP/3105"

          if command -v ldid >/dev/null 2>&1; then
            echo '=== INSTALLED ENTITLEMENTS ==='
            ldid -e "\$APP/3105" 2>&1 || true
          fi

          U="\$(command -v uiopen 2>/dev/null || true)"
          [ -n "\$U" ] || { echo UIOPEN_NOT_FOUND; exit 73; }
          S="\$(command -v su 2>/dev/null || true)"
          [ -n "\$S" ] || { echo SU_NOT_FOUND; exit 74; }
          echo "launch_route=root_ssh_to_su_mobile_to_uiopen"
          echo "uiopen=\$U"
          echo "su=\$S"

          find_pid() {
            ps ax 2>/dev/null | while IFS= read -r line; do
              case "\$line" in
                *'/3105.app/3105'*) set -- \$line; echo "\$1"; break ;;
              esac
            done
          }

          killall 3105 2>/dev/null || true
          sleep 2
          if command -v uicache >/dev/null 2>&1; then
            uicache -p "\$APP" 2>&1 || true
          fi

          "\$S" mobile -c "\"\$U\" --bundleid \"\$BUNDLE\"" 2>&1
          launch_rc=\$?
          echo "mobile_uiopen_rc=\$launch_rc"
          [ "\$launch_rc" -eq 0 ] || exit 75

          PID=''
          n=0
          while [ "\$n" -lt 20 ]; do
            PID="\$(find_pid)"
            [ -n "\$PID" ] && break
            n=\$((n+1))
            sleep 1
          done
          [ -n "\$PID" ] || { echo NO_PROCESS_AFTER_LAUNCH; exit 76; }
          echo "launch_pid=\$PID"

          n=0
          while [ "\$n" -lt 18 ]; do
            kill -0 "\$PID" 2>/dev/null || { echo "PROCESS_DIED_AT_CHECK=\$n"; exit 77; }
            CURRENT="\$(find_pid)"
            [ "\$CURRENT" = "\$PID" ] || { echo "PID_CHANGED_AT_CHECK=\$n old=\$PID new=\$CURRENT"; exit 78; }
            n=\$((n+1))
            echo "ALIVE_CHECK_\$n pid=\$PID"
            sleep 5
          done

          FINAL="\$(find_pid)"
          [ "\$FINAL" = "\$PID" ] || { echo "FINAL_PID_CHANGED old=\$PID new=\$FINAL"; exit 79; }
          kill -0 "\$PID" 2>/dev/null || { echo FINAL_PROCESS_DEAD; exit 80; }
          echo "stable_pid=\$PID"
          echo alive_after_90_seconds=1
          echo RUNTIME_PROOF_SUCCESS=1
          EOS
          } | sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh||true)"; [ -n "$S" ] || S=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$S" -s' | tee /tmp/stability-proof.log
          grep -Fq RUNTIME_PROOF_SUCCESS=1 /tmp/stability-proof.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3105-ios15-stability-proof-${{ github.run_id }}
          path: /tmp/stability-proof.log
          if-no-files-found: warn
          retention-days: 7
