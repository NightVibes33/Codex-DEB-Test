# registered launch diagnostic
name: Temp 3105 iOS15 launch diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-3105-ios15-launch-diagnostic.yml"

permissions:
  contents: read

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.r.outputs.name }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          n="$(python3 - <<'PY'
          import json
          for e in json.load(open('/tmp/e.json')).get('environments',[]):
              if int(e.get('id',-1))==18728387881:
                  print(e['name']); break
          PY
          )"
          test -n "$n"
          echo "name=$n" >> "$GITHUB_OUTPUT"

  diagnose:
    needs: env
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare Tailscale SSH
        run: |
          set -euo pipefail
          sudo install -d -m0755 /usr/share/keyrings
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tailscale openssh-client sshpass
          sudo systemctl enable --now tailscaled

      - name: Diagnose and launch installed patched app
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          HOST: "100.96.37.124"
          BUNDLE: "com.apple.mobile.MobileHouseArrest"
        run: |
          set -euo pipefail
          sudo tailscale up --auth-key="$TAILSCALE_AUTHKEY" --hostname="gh-3105-launch-${GITHUB_RUN_ID}" --accept-dns=false --accept-routes=false --reset
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ready=0
          for n in $(seq 1 18); do
            rm -f ~/.ssh/known_hosts
            if ssh-keyscan -T8 -H "$HOST" >~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then ready=1; break; fi
            sudo tailscale ping --timeout=5s --c 1 "$HOST" || true
            sleep 8
          done
          test "$ready" = 1
          chmod 600 ~/.ssh/known_hosts
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<EOS
          set +e
          export PATH="/var/jb/usr/bin:/var/jb/bin:/var/jb/usr/sbin:/var/jb/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:\$PATH"
          BUNDLE='$BUNDLE'
          echo '=== DEVICE ==='
          uname -a
          id
          echo "mobile_id=\$(id mobile 2>&1)"
          for c in uiopen uicache sudo su launchctl pidof pgrep ps log strings otool ldid; do
            p="\$(command -v "\$c" 2>/dev/null || true)"
            echo "cmd_\$c=\${p:-missing}"
          done

          APP=''
          for p in /var/containers/Bundle/Application/*/3105.app; do
            [ -d "\$p" ] && APP="\$p" && break
          done
          if [ -z "\$APP" ]; then echo APP_NOT_FOUND; exit 61; fi
          echo "app=\$APP"
          plutil -p "\$APP/Info.plist" 2>&1 || true
          if command -v ldid >/dev/null 2>&1; then ldid -e "\$APP/3105" 2>&1 || true; fi

          find_pid() {
            if command -v pidof >/dev/null 2>&1; then
              set -- \$(pidof 3105 2>/dev/null)
              [ "\$#" -gt 0 ] && { echo "\$1"; return 0; }
            fi
            if command -v pgrep >/dev/null 2>&1; then
              set -- \$(pgrep -x 3105 2>/dev/null)
              [ "\$#" -gt 0 ] && { echo "\$1"; return 0; }
            fi
            if command -v ps >/dev/null 2>&1; then
              ps ax 2>/dev/null | while IFS= read -r line; do
                case "\$line" in
                  *'/3105.app/3105'*) set -- \$line; echo "\$1"; break ;;
                esac
              done
            fi
          }

          killall 3105 2>/dev/null || true
          sleep 2
          if command -v uicache >/dev/null 2>&1; then
            echo '=== UICACHE REGISTER ==='
            uicache -p "\$APP" 2>&1 || true
            uicache -a 2>&1 || true
          fi

          U="\$(command -v uiopen 2>/dev/null || true)"
          [ -n "\$U" ] || { echo UIOPEN_MISSING; exit 62; }

          try_wait() {
            tag="\$1"
            n=0
            while [ "\$n" -lt 8 ]; do
              PID="\$(find_pid)"
              if [ -n "\$PID" ]; then echo "\${tag}_pid=\$PID"; return 0; fi
              n=\$((n+1)); sleep 1
            done
            echo "\${tag}_no_pid=1"
            return 1
          }

          echo '=== LAUNCH AS MOBILE VIA SUDO ==='
          if command -v sudo >/dev/null 2>&1; then
            sudo -u mobile "\$U" --bundleid "\$BUNDLE" 2>&1
            echo "sudo_mobile_uiopen_rc=\$?"
            try_wait sudo_mobile && exit 0
          fi

          echo '=== LAUNCH AS MOBILE VIA LAUNCHCTL ASUSER ==='
          if command -v launchctl >/dev/null 2>&1; then
            launchctl asuser 501 "\$U" --bundleid "\$BUNDLE" 2>&1
            echo "launchctl_asuser_uiopen_rc=\$?"
            try_wait launchctl_asuser && exit 0
          fi

          echo '=== LAUNCH AS MOBILE VIA SU ==='
          if command -v su >/dev/null 2>&1; then
            su mobile -c "\"\$U\" --bundleid \"\$BUNDLE\"" 2>&1
            echo "su_mobile_uiopen_rc=\$?"
            try_wait su_mobile && exit 0
          fi

          echo '=== ROOT UIOPEN RETEST ==='
          "\$U" --bundleid "\$BUNDLE" 2>&1
          echo "root_uiopen_rc=\$?"
          try_wait root_uiopen && exit 0

          echo '=== DIRECT BINARY DIAGNOSTIC ==='
          LOG=/var/mobile/3105-direct-launch.log
          rm -f "\$LOG"
          if command -v sudo >/dev/null 2>&1; then
            sudo -u mobile env DYLD_PRINT_LIBRARIES=1 DYLD_PRINT_APIS=1 "\$APP/3105" >"\$LOG" 2>&1 &
          else
            "\$APP/3105" >"\$LOG" 2>&1 &
          fi
          DPID=\$!
          echo "direct_wrapper_pid=\$DPID"
          sleep 5
          if kill -0 "\$DPID" 2>/dev/null; then
            echo DIRECT_PROCESS_ALIVE_AFTER_5S=1
            PID="\$(find_pid)"; echo "direct_found_pid=\$PID"
          else
            echo DIRECT_PROCESS_EXITED=1
          fi
          echo '=== DIRECT LOG ==='
          cat "\$LOG" 2>/dev/null || true

          echo '=== RECENT CRASH FILES ==='
          for f in /var/mobile/Library/Logs/CrashReporter/*3105* /var/mobile/Library/Logs/CrashReporter/*MobileHouseArrest*; do
            [ -f "\$f" ] || continue
            echo "crash_file=\$f"
            sed -n '1,360p' "\$f" 2>/dev/null || cat "\$f" 2>/dev/null || true
          done

          echo '=== PROCESS SNAPSHOT ==='
          ps ax 2>&1 | grep -E '3105|SpringBoard|runningboardd' 2>&1 || true
          exit 63
          EOS
          } | sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh||true)"; [ -n "$S" ] || S=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$S" -s' | tee /tmp/launch-diagnostic.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3105-ios15-launch-diagnostic-${{ github.run_id }}
          path: /tmp/launch-diagnostic.log
          if-no-files-found: warn
          retention-days: 7
