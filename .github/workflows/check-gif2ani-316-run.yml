name: Check Gif2Ani 3.1.6 Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/check-gif2ani-316-run.txt

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/install-gif2ani-316-overlay-fix.yml/runs?per_page=10" > runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.load(open('runs.json'))
          out=[]
          for r in data.get('workflow_runs',[]):
              out.append(f"id={r['id']} status={r['status']} conclusion={r.get('conclusion')} event={r['event']} head_sha={r['head_sha']} created={r['created_at']} updated={r['updated_at']}")
          Path('remote/gif2ani-316-run-status.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Publish status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add remote/gif2ani-316-run-status.txt
          if ! git diff --cached --quiet; then git commit -m "Record Gif2Ani 3.1.6 run status [skip ci]"; git push origin HEAD:main; fi
