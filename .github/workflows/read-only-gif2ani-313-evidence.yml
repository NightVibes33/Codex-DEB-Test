name: Read-Only Gif2Ani 3.1.3 Evidence

on:
  push:
    branches: [main]
    paths:
      - triggers/read-only-gif2ani-313-evidence.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1)) == target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  inspect:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Read evidence and crash state
        id: inspect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 45); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then connected=1; break; fi
            sleep 5
          done
          echo "connected=$connected" | tee gif2ani-313-evidence.txt
          test "$connected" -eq 1
          cat > /tmp/read-evidence.sh <<'SH'
          #!/bin/sh
          set -eu
          media='/var/mobile/Library/Application Support/Gif2Ani'
          prefs='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          evidence='/var/mobile/Media/gif2ani-313-racefix-evidence.plist'
          marker='/var/mobile/Media/gif2ani-313-racefix.marker'

          echo '=== PACKAGE ==='
          version=$(dpkg-query -W -f='${Version}' com.nightvibes33.gif2ani)
          echo "version=$version"
          test "$version" = '3.1.3'

          echo '=== SAVED PHYSICAL EVIDENCE ==='
          test -f "$evidence"
          cat "$evidence"
          grep -a -q 'custom-animation-stable' "$evidence"
          grep -A 2 '<key>sourceFrames</key>' "$evidence" | grep -q '<integer>84</integer>'
          grep -A 2 '<key>decodedFrames</key>' "$evidence" | grep -q '<integer>24</integer>'
          grep -A 2 '<key>frameCount</key>' "$evidence" | grep -q '<integer>24</integer>'
          grep -A 2 '<key>animationPending</key>' "$evidence" | grep -q '<false/>'

          echo '=== CRASHES SINCE PHYSICAL TEST ==='
          test -f "$marker"
          crashes=$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \
            \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' \) \
            -newer "$marker" -print 2>/dev/null | tee /tmp/gif2ani-313-crashes.txt | wc -l | tr -d ' ')
          echo "new_crash_reports=$crashes"
          test "$crashes" = 0

          echo '=== FINAL SAFE STATE ==='
          cat "$prefs"
          grep -a -q '<key>isEnabled</key><false/>' "$prefs"
          for f in Pending.gif Active.gif Rejected.gif load-in-progress pending-metadata.plist; do
            if [ -e "$media/$f" ]; then echo "$f=present"; exit 1; else echo "$f=absent"; fi
          done
          bb=$(ps ax | awk '$5=="/usr/libexec/backboardd" {print $1; exit}')
          test -n "$bb"
          bb_env=$(ps eww -p "$bb" 2>/dev/null || true)
          echo "backboardd=$bb"
          printf '%s\n' "$bb_env" | grep -q 'JB_PINFO_FLAGS=0x4c00082'
          echo evidence_result=success
          SH
          chmod +x /tmp/read-evidence.sh
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/read-evidence.sh mobile@"$IPAD_HOST":/var/mobile/Media/read-gif2ani-313-evidence.sh
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=60 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/read-gif2ani-313-evidence.sh' 2>&1 | tee -a gif2ani-313-evidence.txt
      - name: Publish evidence
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('gif2ani-313-evidence.txt').read_text(errors='replace') if Path('gif2ani-313-evidence.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['Gif2Ani 3.1.3 Read-Only Evidence',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"inspect={os.environ.get('INSPECT_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-500:]]
          Path('remote/gif2ani-313-read-only-evidence.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/gif2ani-313-read-only-evidence.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 3.1.3 read-only evidence [skip ci]"
            git push origin HEAD:main
          fi
