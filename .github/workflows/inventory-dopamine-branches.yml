name: Inventory Dopamine Branches

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inventory-dopamine-branches.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p remote
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NightVibes33/Dopamine/branches?per_page=100" \
            > /tmp/branches.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          branches = json.loads(Path('/tmp/branches.json').read_text())
          lines = [
              'NightVibes33/Dopamine branch inventory',
              f'branch_count={len(branches)}',
              '',
          ]
          for branch in branches:
              lines.append(f"{branch['name']}\t{branch['commit']['sha']}")
          Path('remote/dopamine-branches.txt').write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/dopamine-branches.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Dopamine branch inventory [skip ci]"
          git push origin HEAD:main
