name: Reload palera1n Launchd Environment

on:
  push:
    branches: [main]
    paths:
      - triggers/reload-palera1n-launchd-env.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  repair:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Reload launchd jailbreak state and verify injection
        id: repair
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 60); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then connected=1; break; fi
            sleep 5
          done
          test "$connected" -eq 1
          cat > reload-palera1n-env.sh <<'SH'
          #!/bin/sh
          set -eu
          media='/var/mobile/Library/Application Support/Gif2Ani'
          prefs='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          runtime="$media/runtime-status.plist"
          marker='/var/mobile/Media/reload-palera1n-env.marker'
          p1ctl='/var/mobile/Media/p1ctl'

          ln -sf /cores/payload "$p1ctl"
          chmod 0755 "$p1ctl"
          mkdir -p "$media"
          rm -f "$media/Pending.gif" "$media/Active.gif" "$media/Rejected.gif" "$media/load-in-progress" "$media/runtime-status.plist" "$media/pending-metadata.plist"
          cat > "$prefs" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>isEnabled</key><false/>
            <key>pendingReady</key><false/>
            <key>imageTransformation</key><string>resizeAspect</string>
            <key>customLoop</key><real>-1</real>
            <key>customDuration</key><real>-1</real>
            <key>backgroundColor</key><string>#000000</string>
          </dict></plist>
          PLIST
          chown -R mobile:mobile "$media" "$prefs"
          chmod 0755 "$media"
          chmod 0644 "$prefs"
          touch "$marker"

          echo '=== BEFORE ==='
          "$p1ctl" palera1n_flags
          bb_before=$(ps ax | awk '/[b]ackboardd/{print $1; exit}')
          sb_before=$(ps ax | awk '/[S]pringBoard/{print $1; exit}')
          echo "backboardd_before=$bb_before"
          echo "springboard_before=$sb_before"
          ps eww -p "$bb_before" 2>/dev/null || true

          echo '=== RELOAD LAUNCHD JAILBREAK STATE ==='
          "$p1ctl" reload
          echo reload_exit=0
          sleep 2
          /var/jb/usr/bin/launchctl print system/com.apple.backboardd 2>&1 | grep -A 12 -E 'inherited environment =|default environment =|environment =' || true

          echo '=== RESTART UI PROCESSES ==='
          killall -9 backboardd SpringBoard 2>/dev/null || true
          sleep 15

          echo '=== AFTER ==='
          "$p1ctl" palera1n_flags
          bb_after=$(ps ax | awk '/[b]ackboardd/{print $1; exit}')
          sb_after=$(ps ax | awk '/[S]pringBoard/{print $1; exit}')
          echo "backboardd_after=$bb_after"
          echo "springboard_after=$sb_after"
          bb_env=$(ps eww -p "$bb_after" 2>/dev/null || true)
          sb_env=$(ps eww -p "$sb_after" 2>/dev/null || true)
          echo "backboardd_env=$bb_env"
          echo "springboard_env=$sb_env"
          spawned_flags=$(printf '%s\n' "$bb_env" | sed -n 's/.*JB_PINFO_FLAGS=\([^ ]*\).*/\1/p' | tail -n1)
          loader_path=$(printf '%s\n' "$bb_env" | sed -n 's/.*JB_TWEAKLOADER_PATH=\([^ ]*\).*/\1/p' | tail -n1)
          live_flags=$("$p1ctl" palera1n_flags | tail -n1)
          echo "live_flags=$live_flags"
          echo "spawned_flags=$spawned_flags"
          echo "loader_path=$loader_path"

          echo '=== GIF2ANI SAFE STATE ==='
          cat "$prefs"
          ls -la "$media"
          test ! -e "$media/Pending.gif"
          test ! -e "$media/Active.gif"
          test ! -e "$media/Rejected.gif"
          grep -a -q '<false/>' "$prefs"

          echo '=== CONSTRUCTOR STATUS ==='
          if [ -f "$runtime" ]; then cat "$runtime"; else echo runtime_status=missing; fi

          echo '=== RECENT CRASHES ==='
          crashes=$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' \) -newer "$marker" -print 2>/dev/null | wc -l | tr -d ' ')
          echo "new_crash_reports=$crashes"

          test "$live_flags" = '0x4c00082'
          test "$spawned_flags" = "$live_flags"
          test "$loader_path" = '@default'
          test "$crashes" = 0
          test -f "$runtime"
          grep -a -q 'tweak-loaded-no-media-decode' "$runtime"
          echo result=launchd_environment_reloaded_injection_restored
          SH
          chmod +x reload-palera1n-env.sh
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null reload-palera1n-env.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=60 -o ServerAliveInterval=5 -o ServerAliveCountMax=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/reload-palera1n-env.sh' 2>&1 | tee palera1n-launchd-env-reload.txt
      - name: Publish result
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('palera1n-launchd-env-reload.txt').read_text(errors='replace') if Path('palera1n-launchd-env-reload.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['palera1n Launchd Environment Reload',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"repair={os.environ.get('REPAIR_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-500:]]
          Path('remote/palera1n-launchd-env-reload.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/palera1n-launchd-env-reload.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record palera1n launchd environment reload [skip ci]"
            git push origin HEAD:main
          fi
