name: Build DarkSword iOS 16 IPA and DEB

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-darksword-ios16.yml
      - darksword-overlay/**
      - jailbreak-lab/**

permissions:
  contents: write

concurrency:
  group: darksword-ios16-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_HTTP_MULTIPLEXING: "false"
      IOS_RUST_PROFILE: mobile-release
      RUSTC_WRAPPER: ""
      IOS_MIN: "16.1"

    steps:
      - name: Checkout complete imported source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect available Apple toolchain
        id: toolchain
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ios16-artifacts
          {
            set -euo pipefail
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            swift --version
            clang --version
          } 2>&1 | tee ios16-artifacts/toolchain.log

      - name: Install native dependencies
        id: dependencies
        if: steps.toolchain.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            brew install meson ninja xcodegen dpkg zig cmake pkgconf llvm autoconf automake libtool || true
            if ! command -v ldid >/dev/null 2>&1; then
              brew tap ProcursusTeam/Procursus || true
              brew install ldid || true
            fi
            rustup target add aarch64-apple-ios i686-unknown-linux-musl
            command -v xcodegen
            command -v dpkg-deb
            command -v zig
            cargo --version
            rustc --version
          } 2>&1 | tee ios16-artifacts/dependencies.log

      - name: Restore exact Codex and Ghostty revisions
        id: restore
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            LOCK=upstream/litter/SUBMODULES.lock
            test -f "$LOCK"
            CODEX_SHA="$(awk -F= '$1=="codex" {print $2}' "$LOCK")"
            GHOSTTY_SHA="$(awk -F= '$1=="ghostty" {print $2}' "$LOCK")"
            test -n "$CODEX_SHA"
            test -n "$GHOSTTY_SHA"

            restore_repo() {
              local url="$1"
              local path="$2"
              local sha="$3"
              rm -rf "$path"
              mkdir -p "$path"
              git -C "$path" init
              git -C "$path" remote add origin "$url"
              git -C "$path" fetch --depth 1 origin "$sha"
              git -C "$path" checkout --detach FETCH_HEAD
            }

            restore_repo https://github.com/NightVibes33/codex.git \
              upstream/litter/shared/third_party/codex "$CODEX_SHA"
            restore_repo https://github.com/ghostty-org/ghostty.git \
              upstream/litter/shared/third_party/ghostty "$GHOSTTY_SHA"

            test "$(git -C upstream/litter/shared/third_party/codex rev-parse HEAD)" = "$CODEX_SHA"
            test "$(git -C upstream/litter/shared/third_party/ghostty rev-parse HEAD)" = "$GHOSTTY_SHA"
          } 2>&1 | tee ios16-artifacts/restore.log

      - name: Reapply and verify exact DarkSword architecture
        id: overlay
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            chmod +x darksword-overlay/apply.sh
            ./darksword-overlay/apply.sh upstream/litter

            grep -q 'DarkSwordRootView()' upstream/litter/apps/ios/Sources/Litter/LitterApp.swift
            grep -q 'loginLocalChatGPTAccount' upstream/litter/apps/ios/Sources/Litter/DarkSword/DarkSwordRootView.swift
            grep -q 'pub mod darksword_host_runtime' upstream/litter/shared/rust-bridge/codex-mobile-client/src/lib.rs
            grep -q 'darksword_host_runtime::is_available' upstream/litter/shared/rust-bridge/codex-mobile-client/src/ish_runtime.rs
            grep -q -- '- target: LitterLiveActivity' upstream/litter/apps/ios/project.yml
            grep -q -- '- target: LitterWatch' upstream/litter/apps/ios/project.yml
            grep -q -- '- target: LiveProcess' upstream/litter/apps/ios/project.yml
            test -f upstream/litter/apps/ios/Sources/Litter/Resources/JailbreakLab/schema/experiment.schema.json
          } 2>&1 | tee ios16-artifacts/overlay.log

      - name: Verify complete advanced source integrations
        id: source_verify
        if: steps.overlay.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cd upstream/litter
            tools/scripts/verify-nyxian-source-import.sh
            tools/scripts/verify-kittystore-integration.sh
          } 2>&1 | tee ios16-artifacts/source-verify.log

      - name: Build Rust Codex bridge, Ghostty and generated project
        id: rust_build
        if: steps.overlay.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make -C upstream/litter \
            rust-ios-device-fast alpine-fs xcgen \
            IOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            2>&1 | tee ios16-artifacts/rust-and-project.log

      - name: Build complete iOS app and embedded targets
        id: app_build
        if: steps.overlay.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ios16-artifacts/DerivedData
          xcodebuild \
            -project upstream/litter/apps/ios/Litter.xcodeproj \
            -scheme Litter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios16-artifacts/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            LITTER_IOS_BUILD_MODE=full-sideload \
            LITTER_NYXIAN_PRIVATE_BUILD=1 \
            LITTER_PRESERVE_NYXIAN_LIVEPROCESS=1 \
            LITTER_EMBED_UPSTREAM_SOURCE_TREES=1 \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee ios16-artifacts/xcodebuild.log

      - name: Compile rootless host daemon
        id: rootd_build
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min="$IOS_MIN" \
            -O2 -Wall -Wextra \
            darksword-overlay/rootd/main.c \
            -o ios16-artifacts/darksword-rootd \
            2>&1 | tee ios16-artifacts/rootd-build.log
          codesign --force --sign - ios16-artifacts/darksword-rootd

      - name: Package full unsigned IPA and rootless DEB
        id: package
        if: steps.app_build.outcome == 'success' && steps.rootd_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find ios16-artifacts/DerivedData/Build/Products -type d -name 'DarkSwordAI.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            APP="$(find ios16-artifacts/DerivedData/Build/Products -type d -name 'Litter.app' -print -quit)"
          fi
          test -n "$APP"

          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          if command -v ldid >/dev/null 2>&1; then
            while IFS= read -r binary; do
              ldid -S "$binary" || true
            done < <(find "$APP" -type f -perm -111)
            ldid -S"$PWD/darksword-overlay/package/app-entitlements.plist" "$APP/$MAIN_EXECUTABLE"
            ldid -S ios16-artifacts/darksword-rootd
          else
            codesign --force --deep --sign - "$APP"
          fi

          rm -rf ios16-artifacts/Payload
          mkdir -p ios16-artifacts/Payload
          cp -R "$APP" ios16-artifacts/Payload/DarkSwordAI.app
          (cd ios16-artifacts && zip -qry DarkSwordAI-iOS16-full-unsigned.ipa Payload)

          chmod +x darksword-overlay/package/build-deb.sh
          darksword-overlay/package/build-deb.sh \
            "$APP" \
            ios16-artifacts/darksword-rootd \
            ios16-artifacts/com.nightvibes.darkswordai_0.2.0_iphoneos-arm64.deb

          dpkg-deb --contents ios16-artifacts/com.nightvibes.darkswordai_0.2.0_iphoneos-arm64.deb \
            | tee ios16-artifacts/deb-contents.log
          grep -q 'usr/libexec/darksword-rootd' ios16-artifacts/deb-contents.log
          grep -q 'usr/bin/darksword-poc-run' ios16-artifacts/deb-contents.log
          grep -q 'usr/bin/darksword-crash-classify' ios16-artifacts/deb-contents.log

      - name: Write observable iOS 16 build status
        if: always()
        shell: bash
        run: |
          {
            echo '# DarkSword iOS 16 build status'
            echo
            echo "- Toolchain: ${{ steps.toolchain.outcome }}"
            echo "- Dependencies: ${{ steps.dependencies.outcome }}"
            echo "- Codex/Ghostty restore: ${{ steps.restore.outcome }}"
            echo "- DarkSword overlay: ${{ steps.overlay.outcome }}"
            echo "- Full-source verification: ${{ steps.source_verify.outcome }}"
            echo "- Rust/Codex/Ghostty build: ${{ steps.rust_build.outcome }}"
            echo "- iOS app and embedded targets: ${{ steps.app_build.outcome }}"
            echo "- Root daemon: ${{ steps.rootd_build.outcome }}"
            echo "- IPA/DEB package: ${{ steps.package.outcome }}"
            for log in toolchain dependencies restore overlay source-verify rust-and-project xcodebuild rootd-build; do
              echo
              echo "## ${log} log tail"
              echo '```text'
              tail -n 180 "ios16-artifacts/${log}.log" 2>/dev/null || true
              echo '```'
            done
          } > IOS16_BUILD_STATUS.md

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IOS16_BUILD_STATUS.md
          git commit -m 'Record observable DarkSword iOS 16 build diagnostics' || true
          git push origin HEAD:main || true

      - name: Upload packages and every diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkSwordAI-iOS16-build
          path: |
            ios16-artifacts/*.ipa
            ios16-artifacts/*.deb
            ios16-artifacts/*.log
            IOS16_BUILD_STATUS.md
          if-no-files-found: warn
