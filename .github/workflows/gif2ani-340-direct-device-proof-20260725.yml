name: Gif2Ani 3.4 Direct Device Proof 20260725

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/gif2ani-340-direct-device-proof-20260725.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"
  THEME_COMMIT: "b5d5eda04359409865772038895e660d709deb18"

concurrency:
  group: gif2ani-device-change
  cancel-in-progress: false

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          wanted=int(sys.argv[1])
          for item in json.load(open('environments.json')).get('environments',[]):
              if int(item.get('id',-1)) == wanted:
                  print('environment_name='+item['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  proof:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - uses: actions/checkout@v4
        with:
          repository: NightVibes33/Dark-Boot
          ref: main
          path: darkboot

      - name: Install toolchain
        env:
          THEOS: /opt/theos
          CI: "1"
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash curl sudo build-essential fakeroot rsync perl git libxml2 dpkg-dev unzip xz-utils ca-certificates python3 file openssh-client sshpass
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Validate source and downloadable catalog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,urllib.request
          root=Path('darkboot')
          control=root.joinpath('control').read_text()
          assert '\nVersion: 3.4.0\n' in '\n'+control
          part1=root.joinpath('gif2aniprefs/G2ThemeGalleryPart1.inc').read_text()
          offline=part1[part1.index('G2BuiltInPacks'):part1.index('G2LegacyCatalog')]
          legacy=part1[part1.index('G2LegacyCatalog'):part1.index('static UIColor *G2RGB')]
          remote=root.joinpath('gif2aniprefs/G2RemoteThemeCatalog.inc').read_text()
          preview=root.joinpath('gif2aniprefs/G2RemoteThemePreviewOverride.inc').read_text()
          stage=root.joinpath('gif2aniprefs/G2ThemeStageOverride.inc').read_text()
          assert offline.count('@"identifier":') == 12
          assert legacy.count('@"name":') == 54
          assert 'packs.count == 54' in remote
          assert 'b5d5eda04359409865772038895e660d709deb18' in remote
          assert 'G2RemoteThemeURLIsAllowed' in remote
          assert 'Download & Preview' in preview
          assert 'G2RemoteCachedThemeIsValid' in preview
          assert 'NSURLSessionConfiguration.ephemeralSessionConfiguration' in preview
          assert 'G2ValidateGIFData(data, &error)' in preview
          assert 'userSettingsPreserved' in stage
          assert '@{@"pendingReady":@YES}' in stage
          url='https://raw.githubusercontent.com/NightVibes33/Codex-DEB-Test/b5d5eda04359409865772038895e660d709deb18/gif2ani-themes/v1/manifest.json'
          with urllib.request.urlopen(url,timeout=30) as response:
              manifest=json.load(response)
          themes=manifest['themes']
          assert manifest['count']==54 and len(themes)==54
          assert len({x['id'] for x in themes})==54
          assert all(x['license']=='CC0-1.0' for x in themes)
          assert all(x['sourceFrames']==24 for x in themes)
          print('offline_builtins=12')
          print('downloadable_builtins=54')
          print('legacy_source_catalog=54')
          print('catalog_manifest=success')
          PY

      - name: Build rootless package
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          cd darkboot
          make clean package FINALPACKAGE=1 2>&1 | tee ../direct-proof-build.log
          DEB="$(find packages -maxdepth 1 -type f -name 'com.nightvibes33.gif2ani_3.4.0_iphoneos-arm64.deb' | head -n1)"
          test -n "$DEB"
          test "$(dpkg-deb --field "$DEB" Package)" = 'com.nightvibes33.gif2ani'
          test "$(dpkg-deb --field "$DEB" Version)" = '3.4.0'
          cp "$DEB" ../Gif2Ani-3.4.0-direct-proof.deb
          sha256sum "$DEB" | tee ../direct-proof-deb-sha256.txt

      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install and verify on iPad
        id: install
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 45); do
            sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1 && { connected=1; break; }
            sleep 5
          done
          echo "connected=$connected" | tee direct-proof-device.txt
          test "$connected" -eq 1
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null Gif2Ani-3.4.0-direct-proof.deb mobile@"$IPAD_HOST":/var/mobile/Media/Gif2Ani-3.4.0-direct-proof.deb
          cat > /tmp/gif2ani-direct-proof.sh <<'SH'
          #!/bin/sh
          set -eu
          media='/var/mobile/Library/Application Support/Gif2Ani'
          prefs='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          active="$media/Active.gif"
          runtime="$media/runtime-status.plist"
          cache="$media/Catalog"
          deb='/var/mobile/Media/Gif2Ani-3.4.0-direct-proof.deb'
          marker='/var/mobile/Media/gif2ani-340-direct-proof.marker'
          url='https://raw.githubusercontent.com/NightVibes33/Codex-DEB-Test/b5d5eda04359409865772038895e660d709deb18/gif2ani-themes/v1/cyan-pulse-rings.gif'
          expected='1975aa569fb5ee0002856a7cff3b60bbcde04126514386fbd52b89d9f5349a46'
          sha() { /var/jb/usr/bin/sha256sum "$1" 2>/dev/null | awk '{print $1}'; }
          test -f "$active" && test -f "$prefs" && test -f "$runtime"
          active_before=$(sha "$active")
          prefs_before=$(sha "$prefs")
          runtime_before=$(sha "$runtime")
          touch "$marker"
          /var/jb/usr/bin/dpkg -i "$deb"
          version=$(/var/jb/usr/bin/dpkg-query -W -f='${Version}' com.nightvibes33.gif2ani)
          test "$version" = '3.4.0'
          bundle='/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle'
          test -f "$bundle/Gif2AniPrefs" && test -f "$bundle/Root.plist"
          mkdir -p "$cache"
          file="$cache/device-direct-proof.gif"
          rm -f "$file"
          /var/jb/usr/bin/curl --fail --location --proto '=https' --max-time 30 "$url" -o "$file"
          test "$(sha "$file")" = "$expected"
          magic=$(dd if="$file" bs=1 count=6 2>/dev/null)
          case "$magic" in GIF87a|GIF89a) ;; *) exit 1 ;; esac
          rm -f "$file"
          test "$active_before" = "$(sha "$active")"
          test "$prefs_before" = "$(sha "$prefs")"
          test "$runtime_before" = "$(sha "$runtime")"
          crashes=$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' -o -name 'Preferences-*.ips' \) -newer "$marker" -print 2>/dev/null | wc -l | tr -d ' ')
          test "$crashes" = 0
          echo "installed_version=$version"
          echo "device_theme_download=true"
          echo "device_theme_sha256_verified=true"
          echo "active_gif_preserved=true"
          echo "preferences_preserved=true"
          echo "runtime_status_preserved=true"
          echo "new_crash_reports=$crashes"
          echo "direct_device_proof=success"
          /var/jb/usr/bin/killall -9 Preferences 2>/dev/null || true
          SH
          chmod +x /tmp/gif2ani-direct-proof.sh
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/gif2ani-direct-proof.sh mobile@"$IPAD_HOST":/var/mobile/Media/gif2ani-direct-proof.sh
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=60 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/gif2ani-direct-proof.sh' 2>&1 | tee -a direct-proof-device.txt

      - name: Publish proof
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          cd bridge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          def read(path):
              p=Path(path)
              return p.read_text(errors='replace') if p.exists() else ''
          build=read('../direct-proof-build.log')
          device=read('../direct-proof-device.txt')
          digest=read('../direct-proof-deb-sha256.txt')
          password=os.environ.get('IPAD_PASSWORD','')
          if password:
              build=build.replace(password,'***REDACTED***')
              device=device.replace(password,'***REDACTED***')
          lines=['Gif2Ani 3.4.0 Isolated Direct Device Proof','run_id='+os.environ.get('GITHUB_RUN_ID',''),'install='+os.environ.get('INSTALL_OUTCOME',''),'','offline_builtins=12','downloadable_builtins=54','legacy_source_catalog=54','','--- package digest ---',digest.strip(),'','--- device proof ---',*device.splitlines()[-250:],'','--- build tail ---',*build.splitlines()[-180:]]
          Path('remote/gif2ani-340-direct-device-proof.txt').write_text('\n'.join(lines)+'\n')
          PY
          git add remote/gif2ani-340-direct-device-proof.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 3.4 isolated device proof [skip ci]"
            git push origin HEAD:main
          fi
