name: Smoke DarkSword iOS 16 Perception Backport

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/perception-ios16-smoke.yml
      - darksword-overlay/**

permissions:
  contents: write

concurrency:
  group: darksword-perception-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply complete DarkSword overlay
        id: overlay
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p perception-smoke
          {
            set -euo pipefail
            chmod +x darksword-overlay/apply.sh
            ./darksword-overlay/apply.sh upstream/litter
          } 2>&1 | tee perception-smoke/overlay.log

      - name: Validate transformed source invariants
        id: invariants
        if: steps.overlay.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            ROOT=upstream/litter/apps/ios
            grep -q 'revision: de219a1cf34e958134e75a9ebb134cf09bf52fc6' "$ROOT/project.yml"
            grep -q '@Perceptible' "$ROOT/Sources/Litter/Models/AppState.swift"
            grep -q 'WithPerceptionTracking' "$ROOT/Sources/Litter/LitterApp.swift"
            if grep -R --include='*.swift' -nE '@Observable\b|@ObservationIgnored\b|\bwithObservationTracking\b' \
              "$ROOT/Sources/Litter" \
              "$ROOT/Sources/LitterLiveActivity" \
              "$ROOT/Sources/LitterWatch" \
              "$ROOT/Sources/LitterWatchComplications"; then
              echo 'error: native Observation source remained after the iOS 16 transform' >&2
              exit 1
            fi
            echo 'Perception source invariants passed.'
          } 2>&1 | tee perception-smoke/invariants.log

      - name: Parse every transformed Swift file
        id: parse
        if: steps.overlay.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            ROOT=upstream/litter/apps/ios/Sources
            failed=0
            while IFS= read -r -d '' file; do
              if ! xcrun swiftc -frontend -parse "$file" >/tmp/darksword-parse.out 2>&1; then
                echo "===== PARSE FAILURE: $file ====="
                cat /tmp/darksword-parse.out
                failed=1
              fi
            done < <(find \
              "$ROOT/Litter" \
              "$ROOT/LitterLiveActivity" \
              "$ROOT/LitterWatch" \
              "$ROOT/LitterWatchComplications" \
              -type f -name '*.swift' -print0)
            test "$failed" -eq 0
            echo 'All transformed Swift files parsed successfully.'
          } 2>&1 | tee perception-smoke/parse.log

      - name: Record smoke status
        if: always()
        shell: bash
        run: |
          {
            echo '# DarkSword iOS 16 Perception smoke status'
            echo
            echo "- Overlay: ${{ steps.overlay.outcome }}"
            echo "- Invariants: ${{ steps.invariants.outcome }}"
            echo "- Swift parse: ${{ steps.parse.outcome }}"
            echo
            for log in overlay invariants parse; do
              echo "## ${log} log tail"
              echo '```text'
              tail -n 120 "perception-smoke/${log}.log" 2>/dev/null || true
              echo '```'
            done
          } > PERCEPTION_SMOKE_STATUS.md

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main || true
          git add PERCEPTION_SMOKE_STATUS.md
          git commit -m 'Record DarkSword iOS 16 Perception smoke diagnostics' || true
          git push origin HEAD:main || true

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkSwordAI-Perception-smoke
          path: |
            perception-smoke/*.log
            PERCEPTION_SMOKE_STATUS.md
          if-no-files-found: warn
