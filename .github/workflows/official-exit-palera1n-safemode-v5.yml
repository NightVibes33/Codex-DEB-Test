name: Officially Exit palera1n Safe Mode V5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/official-exit-palera1n-safemode-v5.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  run:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Patch local runner for dynamic tool discovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/official-exit-palera1n-v4.sh')
          text=path.read_text()
          old='''CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
LDID="$THEOS/bin/ldid"
'''
          new='''CLANG="$(find "$THEOS/toolchain" -type f -name clang -perm -111 -print -quit)"
LDID="$(find "$THEOS/toolchain" "$THEOS/bin" -type f -name ldid -perm -111 -print -quit)"
echo "clang_path=$CLANG"
echo "ldid_path=$LDID"
'''
          if old not in text:
              raise SystemExit('tool_path_block_not_found')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Join Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Run official Exit Safemode V5
        id: execute
        env:
          IPAD_HOST: ${{ env.IPAD_HOST }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: bash scripts/official-exit-palera1n-v4.sh
      - name: Publish sanitized status
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('official-exit-v4.txt').read_text(errors='replace') if Path('official-exit-v4.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['Official palera1n Exit Safemode V5',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"tailscale={os.environ.get('TAILSCALE_OUTCOME','')}",f"execute={os.environ.get('EXECUTE_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-500:]]
          Path('remote/gif2ani-official-exit-v5-status.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/gif2ani-official-exit-v5-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record official palera1n Exit Safemode V5 [skip ci]"
            git push origin HEAD:main
          fi
