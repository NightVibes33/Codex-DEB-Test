name: Cleanup Old Dark-Boot Data

on:
  push:
    branches: [main]
    paths:
      - triggers/cleanup-old-darkboot.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          target = int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments', []):
              if int(env.get('id', -1)) == target:
                  print('environment_name=' + env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  cleanup:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Join Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ env.IPAD_HOST }}
          version: latest
      - name: Prepare SSH
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 20 -H -p 22 "$IPAD_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Remove old data and verify new runtime
        id: cleanup
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh -c '\''
              set -eu
              rm -rf "/var/mobile/Library/Application Support/DarkBoot"
              rm -f /var/mobile/Library/Preferences/com.nightvibes33.darkboot.plist
              rm -f /var/mobile/Library/Preferences/com.nightvibes33.darkboot.plist.*
              test ! -e "/var/mobile/Library/Application Support/DarkBoot"
              test ! -e /var/mobile/Library/Preferences/com.nightvibes33.darkboot.plist
              version=$(dpkg-query -W com.nightvibes33.gif2ani | cut -f2)
              test "$version" = "3.0.0"
              status_path="/var/mobile/Library/Application Support/Gif2Ani/runtime-status.plist"
              test -f "$status_path"
              echo "old_darkboot_data=removed"
              echo "gif2ani_version=$version"
              echo "runtime_marker_raw_begin"
              cat "$status_path"
              echo "runtime_marker_raw_end"
              echo "cleanup_result=old-package-files-data-removed-new-runtime-preserved"
            '\''' 2>&1 | tee gif2ani-cleanup.txt
      - name: Publish cleanup status
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('gif2ani-cleanup.txt').read_text(errors='replace') if Path('gif2ani-cleanup.txt').exists() else 'No cleanup output.'
          password = os.environ.get('IPAD_PASSWORD', '')
          if password: text = text.replace(password, '***REDACTED***')
          lines = [
              'Gif2Ani Final Cleanup',
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"tailscale={os.environ.get('TAILSCALE_OUTCOME', '')}",
              f"cleanup={os.environ.get('CLEANUP_OUTCOME', '')}",
              '',
              '--- sanitized output ---',
              *text.splitlines()[-180:],
          ]
          Path('remote/gif2ani-cleanup-status.txt').write_text('\n'.join(lines) + '\n')
          PY
          git add remote/gif2ani-cleanup-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani final cleanup [skip ci]"
            git push origin HEAD:main
          fi
