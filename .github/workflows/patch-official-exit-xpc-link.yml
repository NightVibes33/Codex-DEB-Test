name: Patch Official Exit V2 SDK Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/patch-official-exit-xpc-link.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Accept Theos iPhoneOS SDK symlinks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/official-exit-palera1n-safemode-v2.yml')
          text = path.read_text()
          old = '''          SDK="$(find /opt/theos/sdks -maxdepth 1 -type d -name 'iPhoneOS*.sdk' | sort -V | tail -n1)"
'''
          new = '''          SDK="$(ls -d /opt/theos/sdks/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -n1)"
'''
          if new in text:
              print('sdk_symlink_patch=already_present')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print('sdk_symlink_patch=applied')
          else:
              raise SystemExit('expected_sdk_discovery_line_not_found')
          PY
          grep -n 'SDK=' .github/workflows/official-exit-palera1n-safemode-v2.yml | head
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/official-exit-palera1n-safemode-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m "Fix official Exit V2 SDK discovery [skip ci]"
            git push origin HEAD:main
          fi
