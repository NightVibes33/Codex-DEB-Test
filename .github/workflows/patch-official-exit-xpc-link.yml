name: Patch Official Exit V3 Theos Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/patch-official-exit-xpc-link.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export the intended Theos installation path
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/official-exit-palera1n-v3.sh')
          text = path.read_text()
          old = '''sudo chown "$USER:$USER" /opt
bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
'''
          new = '''sudo chown "$USER:$USER" /opt
export THEOS=/opt/theos
bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
'''
          if new in text:
              print('theos_path_patch=already_present')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print('theos_path_patch=applied')
          else:
              raise SystemExit('expected_theos_install_block_not_found')
          PY
          grep -n -A2 -B2 'export THEOS' scripts/official-exit-palera1n-v3.sh
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/official-exit-palera1n-v3.sh
          if ! git diff --cached --quiet; then
            git commit -m "Fix official Exit V3 Theos installation path [skip ci]"
            git push origin HEAD:main
          fi
