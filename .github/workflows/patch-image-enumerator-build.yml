name: iPhone SSH 3105 Visible UI Proof

on:
  push:
    branches: [main]
    paths:
      - "triggers/patch-image-enumerator-build.txt"

permissions:
  actions: read
  contents: read

jobs:
  build-ios15-window:
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      BASE_ARTIFACT_ID: "9707500776"
      BASE_IPA_SHA256: "21dd62c7f11133be0cf12a72d63a1344bf74f94861b9f17972456048d9dac6d9"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/ThreeOneOSFiveJB15.m
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build early-window iOS 15 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base-artifact /tmp/work /tmp/base.zip /tmp/3105-ios15-windowfix.ipa /tmp/3105-ios15-windowfix.sha256
          mkdir -p /tmp/base-artifact /tmp/work

          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" \
            -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base-artifact
          BASE="$(find /tmp/base-artifact -type f -name '*.ipa' | head -n 1)"
          test -n "$BASE"
          GOT="$(shasum -a 256 "$BASE" | awk '{print $1}')"
          echo "base_ipa_sha=$GOT"
          test "$GOT" = "$BASE_IPA_SHA256"
          unzip -q "$BASE" -d /tmp/work
          APP=/tmp/work/Payload/3105.app
          test -d "$APP"

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -Wno-deprecated-declarations \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            remote/ThreeOneOSFiveJB15.m \
            -o "$APP/3105"
          chmod 0755 "$APP/3105"
          file "$APP/3105"

          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]
          info = {
              'CFBundleDevelopmentRegion': 'en',
              'CFBundleDisplayName': '3105',
              'CFBundleExecutable': '3105',
              'CFBundleIdentifier': 'com.nightvibes.app.threeoneosfive1',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': '3105',
              'CFBundlePackageType': 'APPL',
              'CFBundleShortVersionString': '2.0-jb15',
              'CFBundleVersion': '20',
              'LSRequiresIPhoneOS': True,
              'MinimumOSVersion': '15.0',
              'UIDeviceFamily': [1, 2],
              'UILaunchScreen': {},
              'UISupportedInterfaceOrientations': [
                  'UIInterfaceOrientationPortrait',
                  'UIInterfaceOrientationLandscapeLeft',
                  'UIInterfaceOrientationLandscapeRight'
              ],
              'UISupportedInterfaceOrientations~ipad': [
                  'UIInterfaceOrientationPortrait',
                  'UIInterfaceOrientationPortraitUpsideDown',
                  'UIInterfaceOrientationLandscapeLeft',
                  'UIInterfaceOrientationLandscapeRight'
              ],
              'ThreeOneOSFiveJBCompatibility': 'Dopamine iOS 15 early-window runtime'
          }
          with open(p, 'wb') as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_BINARY, sort_keys=False)
          print('EARLY_WINDOW_PLIST=1')
          PY

          cat > /tmp/3105-ios15.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>TROLLTROLL.*</string>
            <key>com.apple.developer.team-identifier</key><string>TROLLTROLL</string>
            <key>get-task-allow</key><true/>
            <key>keychain-access-groups</key><array><string>TROLLTROLL.*</string><string>com.apple.token</string></array>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-sandbox</key><true/>
            <key>com.apple.private.security.container-required</key><string>com.nightvibes.app.threeoneosfive1</string>
            <key>com.apple.private.MobileContainerManager.allowed</key><true/>
            <key>com.apple.private.security.container-manager</key><true/>
            <key>com.apple.private.security.storage.MobileDocuments</key><true/>
            <key>com.apple.security.exception.files.absolute-path.read-write</key><array><string>/</string></array>
          </dict></plist>
          PLIST

          /usr/bin/codesign --force --sign - --timestamp=none \
            --entitlements /tmp/3105-ios15.entitlements \
            --generate-entitlement-der "$APP/3105"
          /usr/bin/codesign -d --entitlements :- "$APP/3105" 2>&1 | tee /tmp/signed-entitlements.txt
          grep -q 'platform-application' /tmp/signed-entitlements.txt
          grep -q 'security.no-sandbox' /tmp/signed-entitlements.txt
          grep -q 'MobileContainerManager.allowed' /tmp/signed-entitlements.txt
          /usr/bin/otool -l "$APP/3105" | grep -A6 LC_BUILD_VERSION | head -n 20

          cd /tmp/work
          zip -qry /tmp/3105-ios15-windowfix.ipa Payload
          cd - >/dev/null
          shasum -a 256 /tmp/3105-ios15-windowfix.ipa | awk '{print $1}' > /tmp/3105-ios15-windowfix.sha256
          echo "ipa_sha=$(cat /tmp/3105-ios15-windowfix.sha256)"
          echo EARLY_WINDOW_IPA_READY=1

      - name: Upload early-window IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ios15-windowfix
          path: |
            /tmp/3105-ios15-windowfix.ipa
            /tmp/3105-ios15-windowfix.sha256
            /tmp/signed-entitlements.txt
          if-no-files-found: error
          retention-days: 7

  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve iPhone environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 15 --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            > /tmp/environments.json
          environment_name="$(python3 - "$TARGET_ENVIRONMENT_ID" <<'PY'
          import json, sys
          target = int(sys.argv[1])
          payload = json.load(open('/tmp/environments.json', encoding='utf-8'))
          for env in payload.get('environments', []):
              if int(env.get('id', -1)) == target:
                  print(env['name']); raise SystemExit(0)
          raise SystemExit('environment not found')
          PY
          )"
          test -n "$environment_name"
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"

  iphone-proof:
    needs: [build-ios15-window, resolve-environment]
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/iphone-command.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Download early-window IPA
        uses: actions/download-artifact@v4
        with:
          name: 3105-ios15-windowfix
          path: /tmp/windowfix

      - name: Verify IPA locally
        run: |
          set -euo pipefail
          test -s /tmp/windowfix/3105-ios15-windowfix.ipa
          test -s /tmp/windowfix/3105-ios15-windowfix.sha256
          EXPECTED="$(tr -d ' \r\n' < /tmp/windowfix/3105-ios15-windowfix.sha256)"
          GOT="$(sha256sum /tmp/windowfix/3105-ios15-windowfix.ipa | awk '{print $1}')"
          echo "expected=$EXPECTED"
          echo "got=$GOT"
          test "$EXPECTED" = "$GOT"

      - name: Install Tailscale and SSH tools
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY"
          sudo install -d -m0755 /usr/share/keyrings
          curl -fL --retry 5 --retry-all-errors --connect-timeout 15 https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg -o /tmp/tailscale.gpg
          sudo install -m0644 /tmp/tailscale.gpg /usr/share/keyrings/tailscale-archive-keyring.gpg
          curl -fL --retry 5 --retry-all-errors --connect-timeout 15 https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list -o /tmp/tailscale.list
          sudo install -m0644 /tmp/tailscale.list /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tailscale openssh-client sshpass netcat-openbsd
          sudo systemctl enable --now tailscaled

      - name: Join tailnet and verify iPhone SSH
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_HOST: "100.96.37.124"
        run: |
          set -euo pipefail
          sudo tailscale up --auth-key="$TAILSCALE_AUTHKEY" --hostname="gh-3105-earlywin-${GITHUB_RUN_ID}" --accept-dns=false --accept-routes=false --reset
          ready=0
          for n in $(seq 1 18); do
            if nc -zvw8 "$IPHONE_HOST" 22; then ready=1; break; fi
            sudo tailscale ping --timeout=5s --c 1 "$IPHONE_HOST" || true
            sleep 8
          done
          test "$ready" = 1

      - name: Install and prove visible runtime
        env:
          IPHONE_HOST: "100.96.37.124"
          IPHONE_PORT: "22"
          IPHONE_USER: "mobile"
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          ssh-keyscan -T10 -H -p "$IPHONE_PORT" "$IPHONE_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          sshpass -e scp -P "$IPHONE_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/windowfix/3105-ios15-windowfix.ipa "$IPHONE_USER@$IPHONE_HOST:/var/mobile/Media/3105-ios15-windowfix.ipa"
          sshpass -e scp -P "$IPHONE_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/windowfix/3105-ios15-windowfix.sha256 "$IPHONE_USER@$IPHONE_HOST:/var/mobile/Media/3105-ios15-windowfix.sha256"
          set +e
          { printf '%s\n' "$IPHONE_PASSWORD"; cat remote/iphone-command.sh; } | \
            sshpass -e ssh -p "$IPHONE_PORT" \
              -o BatchMode=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$IPHONE_USER@$IPHONE_HOST" \
              'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
              2>&1 | tee /tmp/iphone-output.txt
          rc=${PIPESTATUS[1]}
          set -e
          echo "iphone_ssh_exit_code=$rc" | tee -a /tmp/iphone-output.txt
          exit "$rc"

      - name: Upload UI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ios15-early-window-proof-${{ github.run_id }}
          path: /tmp/iphone-output.txt
          if-no-files-found: warn
          retention-days: 7
