name: iPhone SSH 3105 Visible UI Proof

on:
  push:
    branches: [main]
    paths:
      - "triggers/patch-image-enumerator-build.txt"

permissions:
  actions: read
  contents: read

jobs:
  build-ios15-window:
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      BASE_ARTIFACT_ID: "9707500776"
      BASE_IPA_SHA256: "21dd62c7f11133be0cf12a72d63a1344bf74f94861b9f17972456048d9dac6d9"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/ThreeOneOSFiveJB15.m
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build four entitlement variants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base-artifact /tmp/template /tmp/matrix /tmp/base.zip /tmp/3105-compiled
          mkdir -p /tmp/base-artifact /tmp/template /tmp/matrix

          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" \
            -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base-artifact
          BASE="$(find /tmp/base-artifact -type f -name '*.ipa' | head -n 1)"
          test -n "$BASE"
          GOT="$(shasum -a 256 "$BASE" | awk '{print $1}')"
          echo "base_ipa_sha=$GOT"
          test "$GOT" = "$BASE_IPA_SHA256"
          unzip -q "$BASE" -d /tmp/template
          APP=/tmp/template/Payload/3105.app
          test -d "$APP"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iphoneos_sdk=$SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -Wno-deprecated-declarations \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            remote/ThreeOneOSFiveJB15.m \
            -o /tmp/3105-compiled
          chmod 0755 /tmp/3105-compiled
          file /tmp/3105-compiled

          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]
          info = {
              'CFBundleDevelopmentRegion': 'en',
              'CFBundleDisplayName': '3105',
              'CFBundleExecutable': '3105',
              'CFBundleIdentifier': 'com.nightvibes.app.threeoneosfive1',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': '3105',
              'CFBundlePackageType': 'APPL',
              'CFBundleShortVersionString': '2.0-test',
              'CFBundleVersion': '16',
              'LSRequiresIPhoneOS': True,
              'MinimumOSVersion': '15.0',
              'UIDeviceFamily': [1, 2],
              'UILaunchScreen': {},
              'UISupportedInterfaceOrientations': [
                  'UIInterfaceOrientationPortrait',
                  'UIInterfaceOrientationLandscapeLeft',
                  'UIInterfaceOrientationLandscapeRight'
              ],
              'UISupportedInterfaceOrientations~ipad': [
                  'UIInterfaceOrientationPortrait',
                  'UIInterfaceOrientationPortraitUpsideDown',
                  'UIInterfaceOrientationLandscapeLeft',
                  'UIInterfaceOrientationLandscapeRight'
              ],
              'ThreeOneOSFiveJBCompatibility': 'Dopamine iOS 15 entitlement matrix'
          }
          with open(p, 'wb') as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_BINARY, sort_keys=False)
          print('MINIMAL_PLIST_WRITTEN=1')
          print('bundle_id=' + info['CFBundleIdentifier'])
          print('package_type=' + info['CFBundlePackageType'])
          print('scene_manifest_present=' + str('UIApplicationSceneManifest' in info))
          PY

          make_entitlements() {
            variant="$1"
            out="$2"
            python3 - "$variant" "$out" <<'PY'
          import plistlib, sys
          variant, out = sys.argv[1], sys.argv[2]
          ent = {}
          if variant in ('platform', 'platform-nosandbox'):
              ent['platform-application'] = True
          if variant in ('nosandbox', 'platform-nosandbox'):
              ent['com.apple.private.security.no-sandbox'] = True
          with open(out, 'wb') as f:
              plistlib.dump(ent, f, fmt=plistlib.FMT_XML, sort_keys=True)
          print(variant, ent)
          PY
          }

          : > /tmp/matrix/3105-matrix-sha256.txt
          for variant in minimal platform nosandbox platform-nosandbox; do
            WORK="/tmp/work-$variant"
            rm -rf "$WORK"
            cp -a /tmp/template "$WORK"
            VAPP="$WORK/Payload/3105.app"
            cp /tmp/3105-compiled "$VAPP/3105"
            chmod 0755 "$VAPP/3105"
            printf '%s\n' "$variant" > "$VAPP/EntitlementVariant.txt"

            if [ "$variant" = minimal ]; then
              /usr/bin/codesign --force --sign - --timestamp=none "$VAPP/3105"
            else
              make_entitlements "$variant" "/tmp/$variant.entitlements.plist"
              /usr/bin/codesign --force --sign - --timestamp=none \
                --entitlements "/tmp/$variant.entitlements.plist" \
                --generate-entitlement-der \
                "$VAPP/3105"
            fi

            (/usr/bin/codesign -d --entitlements :- "$VAPP/3105" 2>&1 || true) \
              > "/tmp/matrix/entitlements-$variant.txt"
            echo "===== $variant ====="
            cat "/tmp/matrix/entitlements-$variant.txt"

            case "$variant" in
              minimal)
                ! grep -q 'platform-application' "/tmp/matrix/entitlements-$variant.txt"
                ! grep -q 'security.no-sandbox' "/tmp/matrix/entitlements-$variant.txt"
                ;;
              platform)
                grep -q 'platform-application' "/tmp/matrix/entitlements-$variant.txt"
                ! grep -q 'security.no-sandbox' "/tmp/matrix/entitlements-$variant.txt"
                ;;
              nosandbox)
                ! grep -q 'platform-application' "/tmp/matrix/entitlements-$variant.txt"
                grep -q 'security.no-sandbox' "/tmp/matrix/entitlements-$variant.txt"
                ;;
              platform-nosandbox)
                grep -q 'platform-application' "/tmp/matrix/entitlements-$variant.txt"
                grep -q 'security.no-sandbox' "/tmp/matrix/entitlements-$variant.txt"
                ;;
            esac

            (cd "$WORK" && zip -qry "/tmp/matrix/3105-matrix-$variant.ipa" Payload)
            SHA="$(shasum -a 256 "/tmp/matrix/3105-matrix-$variant.ipa" | awk '{print $1}')"
            echo "$SHA  3105-matrix-$variant.ipa" >> /tmp/matrix/3105-matrix-sha256.txt
            echo "variant=$variant sha256=$SHA"
          done

          cat /tmp/matrix/3105-matrix-sha256.txt
          test "$(find /tmp/matrix -maxdepth 1 -name '3105-matrix-*.ipa' | wc -l | tr -d ' ')" = 4
          echo ENTITLEMENT_MATRIX_READY=1

      - name: Upload entitlement matrix
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ios15-entitlement-matrix
          path: /tmp/matrix/
          if-no-files-found: error
          retention-days: 7

  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve iPhone environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 15 --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            > /tmp/environments.json
          environment_name="$(python3 - "$TARGET_ENVIRONMENT_ID" <<'PY'
          import json, sys
          target = int(sys.argv[1])
          payload = json.load(open('/tmp/environments.json', encoding='utf-8'))
          for env in payload.get('environments', []):
              if int(env.get('id', -1)) == target:
                  print(env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment not found')
          PY
          )"
          test -n "$environment_name"
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"

  iphone-proof:
    needs: [build-ios15-window, resolve-environment]
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/iphone-command.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Download entitlement matrix
        uses: actions/download-artifact@v4
        with:
          name: 3105-ios15-entitlement-matrix
          path: /tmp/matrix

      - name: Verify matrix locally
        run: |
          set -euo pipefail
          cd /tmp/matrix
          test -s 3105-matrix-sha256.txt
          sha256sum -c 3105-matrix-sha256.txt
          test "$(find . -maxdepth 1 -name '3105-matrix-*.ipa' | wc -l | tr -d ' ')" = 4

      - name: Install Tailscale and SSH tools with retries
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY"
          sudo install -d -m0755 /usr/share/keyrings
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
            -o /tmp/tailscale.gpg
          sudo install -m0644 /tmp/tailscale.gpg /usr/share/keyrings/tailscale-archive-keyring.gpg
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
            -o /tmp/tailscale.list
          sudo install -m0644 /tmp/tailscale.list /etc/apt/sources.list.d/tailscale.list
          for n in 1 2 3; do sudo apt-get update -qq && break; sleep $((n * 5)); done
          for n in 1 2 3; do sudo apt-get install -y -qq --no-install-recommends tailscale openssh-client sshpass netcat-openbsd && break; sleep $((n * 5)); done
          command -v tailscale
          command -v sshpass
          sudo systemctl enable --now tailscaled

      - name: Join tailnet and verify iPhone SSH
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_HOST: "100.96.37.124"
        run: |
          set -euo pipefail
          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="gh-3105-matrix-${GITHUB_RUN_ID}" \
            --accept-dns=false \
            --accept-routes=false \
            --reset
          ready=0
          for n in $(seq 1 18); do
            if nc -zvw8 "$IPHONE_HOST" 22; then ready=1; break; fi
            sudo tailscale ping --timeout=5s --c 1 "$IPHONE_HOST" || true
            sleep 8
          done
          test "$ready" = 1

      - name: Transfer and run entitlement matrix
        env:
          IPHONE_HOST: "100.96.37.124"
          IPHONE_PORT: "22"
          IPHONE_USER: "mobile"
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$IPHONE_PASSWORD"
          test -s remote/iphone-command.sh
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T10 -H -p "$IPHONE_PORT" "$IPHONE_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          for f in /tmp/matrix/3105-matrix-*.ipa /tmp/matrix/3105-matrix-sha256.txt; do
            sshpass -e scp -P "$IPHONE_PORT" \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$f" "$IPHONE_USER@$IPHONE_HOST:/var/mobile/Media/$(basename "$f")"
          done

          set +e
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat remote/iphone-command.sh
          } | sshpass -e ssh -p "$IPHONE_PORT" \
                -o BatchMode=no \
                -o ConnectTimeout=20 \
                -o ConnectionAttempts=2 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=3 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$IPHONE_USER@$IPHONE_HOST" \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee /tmp/iphone-output.txt
          ssh_status=${PIPESTATUS[1]}
          set -e
          echo "iphone_ssh_exit_code=$ssh_status" | tee -a /tmp/iphone-output.txt
          grep -E 'variant=|_primary=|_direct=|UI_READY|STALLED_BEFORE_DIDFINISH|PRE_MAIN_BLOCK|best_variant|ENTITLEMENT_MATRIX_UI_SUCCESS' /tmp/iphone-output.txt || true
          exit "$ssh_status"

      - name: Upload matrix proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ios15-entitlement-matrix-proof-${{ github.run_id }}
          path: /tmp/iphone-output.txt
          if-no-files-found: warn
          retention-days: 7
