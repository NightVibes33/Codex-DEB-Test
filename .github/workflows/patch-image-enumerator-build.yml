name: iPhone SSH 3105 Runtime Proof

on:
  push:
    branches: [main]
    paths:
      - "triggers/patch-image-enumerator-build.txt"

permissions:
  contents: read

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve iPhone environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            > /tmp/environments.json
          environment_name="$(python3 - "$TARGET_ENVIRONMENT_ID" <<'PY'
          import json, sys
          target = int(sys.argv[1])
          payload = json.load(open('/tmp/environments.json', encoding='utf-8'))
          for env in payload.get('environments', []):
              if int(env.get('id', -1)) == target:
                  print(env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment not found')
          PY
          )"
          test -n "$environment_name"
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"
          echo "Resolved environment: $environment_name"

  iphone-proof:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/iphone-command.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install Tailscale and SSH tools
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY"
          sudo install -d -m0755 /usr/share/keyrings
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
            | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
            | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tailscale openssh-client sshpass netcat-openbsd
          sudo systemctl enable --now tailscaled

      - name: Join tailnet and verify iPhone SSH
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_HOST: "100.96.37.124"
        run: |
          set -euo pipefail
          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="gh-3105-proof-${GITHUB_RUN_ID}" \
            --accept-dns=false \
            --accept-routes=false \
            --reset
          ready=0
          for n in $(seq 1 18); do
            if nc -zvw8 "$IPHONE_HOST" 22; then
              ready=1
              break
            fi
            sudo tailscale ping --timeout=5s --c 1 "$IPHONE_HOST" || true
            sleep 8
          done
          test "$ready" = 1

      - name: Run exact 3105 proof on iPhone
        env:
          IPHONE_HOST: "100.96.37.124"
          IPHONE_PORT: "22"
          IPHONE_USER: "mobile"
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$IPHONE_PASSWORD"
          test -s remote/iphone-command.sh
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T10 -H -p "$IPHONE_PORT" "$IPHONE_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          set +e
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat remote/iphone-command.sh
          } | sshpass -e ssh -p "$IPHONE_PORT" \
                -o BatchMode=no \
                -o ConnectTimeout=20 \
                -o ConnectionAttempts=2 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=3 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$IPHONE_USER@$IPHONE_HOST" \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee /tmp/iphone-output.txt
          ssh_status=${PIPESTATUS[1]}
          set -e
          echo "iphone_ssh_exit_code=$ssh_status" | tee -a /tmp/iphone-output.txt
          grep -E 'RUNTIME_PROOF_SUCCESS|alive_after_90_seconds|MOBILE_SESSION_PROOF_FAILED|NO_PROCESS|DIRECT_ALIVE|launch_pid|stable_pid' /tmp/iphone-output.txt || true
          exit "$ssh_status"

      - name: Upload proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-3105-runtime-proof-${{ github.run_id }}
          path: /tmp/iphone-output.txt
          if-no-files-found: warn
          retention-days: 7
