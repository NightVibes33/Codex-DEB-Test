name: iPhone SSH 3105 Visible UI Proof

on:
  push:
    branches: [main]
    paths:
      - "triggers/patch-image-enumerator-build.txt"

permissions:
  actions: read
  contents: read

jobs:
  build-ios15-window:
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      BASE_ARTIFACT_ID: "9707500776"
      BASE_IPA_SHA256: "21dd62c7f11133be0cf12a72d63a1344bf74f94861b9f17972456048d9dac6d9"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/ThreeOneOSFiveJB15.m
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build retained UIKit iOS 15 executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/base-artifact /tmp/work /tmp/base.zip /tmp/3105-ios15-windowfix.ipa /tmp/3105-ios15-windowfix.sha256
          mkdir -p /tmp/base-artifact /tmp/work

          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" \
            -o /tmp/base.zip
          unzip -q /tmp/base.zip -d /tmp/base-artifact
          BASE="$(find /tmp/base-artifact -type f -name '*.ipa' | head -n 1)"
          test -n "$BASE"
          GOT="$(shasum -a 256 "$BASE" | awk '{print $1}')"
          echo "base_ipa_sha=$GOT"
          test "$GOT" = "$BASE_IPA_SHA256"
          unzip -q "$BASE" -d /tmp/work
          APP=/tmp/work/Payload/3105.app
          test -d "$APP"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iphoneos_sdk=$SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -Wno-deprecated-declarations \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            remote/ThreeOneOSFiveJB15.m \
            -o "$APP/3105"
          chmod 0755 "$APP/3105"
          file "$APP/3105"

          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]
          info = {
              'CFBundleDevelopmentRegion': 'en',
              'CFBundleDisplayName': '3105',
              'CFBundleExecutable': '3105',
              'CFBundleIdentifier': 'com.nightvibes.app.threeoneosfive1',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': '3105',
              'CFBundlePackageType': 'APPL',
              'CFBundleShortVersionString': '2.0-test',
              'CFBundleVersion': '15',
              'LSRequiresIPhoneOS': True,
              'MinimumOSVersion': '15.0',
              'UIDeviceFamily': [1, 2],
              'UILaunchScreen': {},
              'UISupportedInterfaceOrientations': [
                  'UIInterfaceOrientationPortrait',
                  'UIInterfaceOrientationLandscapeLeft',
                  'UIInterfaceOrientationLandscapeRight'
              ],
              'UISupportedInterfaceOrientations~ipad': [
                  'UIInterfaceOrientationPortrait',
                  'UIInterfaceOrientationPortraitUpsideDown',
                  'UIInterfaceOrientationLandscapeLeft',
                  'UIInterfaceOrientationLandscapeRight'
              ],
              'ThreeOneOSFiveJBCompatibility': 'Dopamine iOS 15 minimal foreground app identity'
          }
          with open(p, 'wb') as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_BINARY, sort_keys=False)
          print('MINIMAL_PLIST_WRITTEN=1')
          print('bundle_id=' + info['CFBundleIdentifier'])
          print('package_type=' + info['CFBundlePackageType'])
          print('minimum_os=' + info['MinimumOSVersion'])
          print('scene_manifest_present=' + str('UIApplicationSceneManifest' in info))
          PY

          # Keep the compatibility binary a normal app. TrollStore performs the
          # CoreTrust/application-identifier signing during device installation.
          /usr/bin/codesign --force --sign - --timestamp=none "$APP/3105"
          (/usr/bin/codesign -d --entitlements :- "$APP/3105" 2>&1 || true) | tee /tmp/signed-entitlements.txt
          if grep -Eq 'platform-application|MobileContainerManager|security.no-sandbox|container-manager|absolute-path.read-write' /tmp/signed-entitlements.txt; then
            echo PRIVATE_ENTITLEMENTS_STILL_PRESENT=1
            cat /tmp/signed-entitlements.txt
            exit 32
          fi
          echo MINIMAL_APP_ENTITLEMENTS=1

          /usr/bin/otool -l "$APP/3105" | grep -A6 LC_BUILD_VERSION | head -n 20 || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          if /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' "$APP/Info.plist" >/dev/null 2>&1; then
            echo SCENE_MANIFEST_STILL_PRESENT=1
            exit 31
          fi
          echo CLASSIC_APP_LIFECYCLE=1

          cd /tmp/work
          zip -qry /tmp/3105-ios15-windowfix.ipa Payload
          cd - >/dev/null
          shasum -a 256 /tmp/3105-ios15-windowfix.ipa | awk '{print $1}' > /tmp/3105-ios15-windowfix.sha256
          echo "windowfix_ipa_sha=$(cat /tmp/3105-ios15-windowfix.sha256)"
          test -s /tmp/3105-ios15-windowfix.ipa
          test -s /tmp/3105-ios15-windowfix.sha256
          echo IOS15_WINDOWFIX_IPA_READY=1

      - name: Upload retained UIKit IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ios15-windowfix
          path: |
            /tmp/3105-ios15-windowfix.ipa
            /tmp/3105-ios15-windowfix.sha256
            /tmp/signed-entitlements.txt
          if-no-files-found: error
          retention-days: 7

  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve iPhone environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 15 --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            > /tmp/environments.json
          environment_name="$(python3 - "$TARGET_ENVIRONMENT_ID" <<'PY'
          import json, sys
          target = int(sys.argv[1])
          payload = json.load(open('/tmp/environments.json', encoding='utf-8'))
          for env in payload.get('environments', []):
              if int(env.get('id', -1)) == target:
                  print(env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment not found')
          PY
          )"
          test -n "$environment_name"
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"

  iphone-proof:
    needs: [build-ios15-window, resolve-environment]
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/iphone-command.sh
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Download retained UIKit IPA
        uses: actions/download-artifact@v4
        with:
          name: 3105-ios15-windowfix
          path: /tmp/windowfix

      - name: Verify local test payload
        run: |
          set -euo pipefail
          test -s /tmp/windowfix/3105-ios15-windowfix.ipa
          test -s /tmp/windowfix/3105-ios15-windowfix.sha256
          EXPECTED="$(tr -d ' \r\n' < /tmp/windowfix/3105-ios15-windowfix.sha256)"
          GOT="$(sha256sum /tmp/windowfix/3105-ios15-windowfix.ipa | awk '{print $1}')"
          echo "expected=$EXPECTED"
          echo "got=$GOT"
          test "$EXPECTED" = "$GOT"

      - name: Install Tailscale and SSH tools with retries
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY"
          sudo install -d -m0755 /usr/share/keyrings
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
            -o /tmp/tailscale.gpg
          sudo install -m0644 /tmp/tailscale.gpg /usr/share/keyrings/tailscale-archive-keyring.gpg
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
            -o /tmp/tailscale.list
          sudo install -m0644 /tmp/tailscale.list /etc/apt/sources.list.d/tailscale.list
          for n in 1 2 3; do sudo apt-get update -qq && break; sleep $((n * 5)); done
          for n in 1 2 3; do sudo apt-get install -y -qq --no-install-recommends tailscale openssh-client sshpass netcat-openbsd && break; sleep $((n * 5)); done
          command -v tailscale
          command -v sshpass
          sudo systemctl enable --now tailscaled

      - name: Join tailnet and verify iPhone SSH
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_HOST: "100.96.37.124"
        run: |
          set -euo pipefail
          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="gh-3105-ui-${GITHUB_RUN_ID}" \
            --accept-dns=false \
            --accept-routes=false \
            --reset
          ready=0
          for n in $(seq 1 18); do
            if nc -zvw8 "$IPHONE_HOST" 22; then ready=1; break; fi
            sudo tailscale ping --timeout=5s --c 1 "$IPHONE_HOST" || true
            sleep 8
          done
          test "$ready" = 1

      - name: Transfer IPA and prove active visible window
        env:
          IPHONE_HOST: "100.96.37.124"
          IPHONE_PORT: "22"
          IPHONE_USER: "mobile"
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$IPHONE_PASSWORD"
          test -s remote/iphone-command.sh
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T10 -H -p "$IPHONE_PORT" "$IPHONE_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          sshpass -e scp -P "$IPHONE_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/windowfix/3105-ios15-windowfix.ipa \
            "$IPHONE_USER@$IPHONE_HOST:/var/mobile/Media/3105-ios15-windowfix.ipa"
          sshpass -e scp -P "$IPHONE_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/windowfix/3105-ios15-windowfix.sha256 \
            "$IPHONE_USER@$IPHONE_HOST:/var/mobile/Media/3105-ios15-windowfix.sha256"

          set +e
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat remote/iphone-command.sh
          } | sshpass -e ssh -p "$IPHONE_PORT" \
                -o BatchMode=no \
                -o ConnectTimeout=20 \
                -o ConnectionAttempts=2 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=3 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$IPHONE_USER@$IPHONE_HOST" \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee /tmp/iphone-output.txt
          ssh_status=${PIPESTATUS[1]}
          set -e
          echo "iphone_ssh_exit_code=$ssh_status" | tee -a /tmp/iphone-output.txt
          grep -E 'UI_READY|phase=|key=|hidden=|root_view_loaded=|CORRECT_UIOPEN_UI_SUCCESS|RUNTIME_PROOF_SUCCESS|stable_pid|alive_after_60_seconds' /tmp/iphone-output.txt || true
          exit "$ssh_status"

      - name: Upload visible UI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ios15-visible-ui-proof-${{ github.run_id }}
          path: /tmp/iphone-output.txt
          if-no-files-found: warn
          retention-days: 7
