name: Check Dark-Boot 3.2 Finalizer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/check-darkboot-320-finalizer.txt

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Dark-Boot finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NightVibes33/Dark-Boot/actions/workflows/finalize-gif2ani-320-settings.yml/runs?per_page=10" > runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for r in json.load(open('runs.json')).get('workflow_runs',[]):
              rows.append(f"id={r['id']} status={r['status']} conclusion={r.get('conclusion')} head_sha={r['head_sha']} created={r['created_at']} updated={r['updated_at']}")
          Path('remote/darkboot-320-finalizer-status.txt').write_text('\n'.join(rows)+'\n')
          PY
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add remote/darkboot-320-finalizer-status.txt
          if ! git diff --cached --quiet; then git commit -m "Record Dark-Boot 3.2 finalizer status [skip ci]"; git push origin HEAD:main; fi
