name: iPad + iPhone Tailscale SSH Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "remote/ipad-command.sh"
      - "remote/iphone-command.sh"
      - ".github/workflows/ipad-tailscale-ssh.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: ipad-tailscale-ssh
  cancel-in-progress: true

jobs:
  resolve-environment:
    name: Resolve secret environment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}

    steps:
      - name: Resolve environment ID
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            > environments.json

          environment_name="$({
            python3 - "$TARGET_ENVIRONMENT_ID" <<'PY'
          import json
          import sys

          target_id = int(sys.argv[1])
          with open("environments.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          for environment in payload.get("environments", []):
              if int(environment.get("id", -1)) == target_id:
                  print(environment["name"])
                  raise SystemExit(0)

          raise SystemExit(1)
          PY
          } || true)"

          if [ -z "$environment_name" ]; then
            echo "Could not resolve GitHub environment ID $TARGET_ENVIRONMENT_ID" >&2
            cat environments.json >&2
            exit 1
          fi

          echo "Resolved environment ID $TARGET_ENVIRONMENT_ID to: $environment_name"
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"

  run-command:
    name: Run command on iPad
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        id: validate
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          : > validation-error.txt
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "Missing environment secret: TAILSCALE_AUTHKEY" | tee -a validation-error.txt >&2
          fi
          if [ -z "$IPAD_PASSWORD" ]; then
            echo "Missing environment secret: IPAD_PASSWORD" | tee -a validation-error.txt >&2
          fi
          if [ -s validation-error.txt ]; then
            exit 1
          fi

      - name: Install Tailscale and SSH clients
        id: install_ssh
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl --fail --silent --show-error --retry 3 --connect-timeout 20 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
            | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl --fail --silent --show-error --retry 3 --connect-timeout 20 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
            | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tailscale openssh-client sshpass
          sudo systemctl enable --now tailscaled
          tailscale version

      - name: Join the Tailscale network with retries
        id: tailscale
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPAD_HOST: 100.116.117.65
        run: |
          set -euo pipefail
          : > ipad-output.txt
          connected=0
          for attempt in 1 2 3; do
            echo "Tailscale connection attempt $attempt/3" | tee -a ipad-output.txt
            sudo tailscale logout >/dev/null 2>&1 || true
            sudo systemctl restart tailscaled
            sleep 3
            if sudo tailscale up \
              --auth-key="$TAILSCALE_AUTHKEY" \
              --hostname="github-ipad-${GITHUB_RUN_ID}-${attempt}" \
              --accept-dns=false \
              --accept-routes=false \
              --reset 2>&1 | tee -a ipad-output.txt; then
              sudo tailscale status 2>&1 | tee -a ipad-output.txt
              if sudo tailscale status | grep -Fq "$IPAD_HOST"; then
                connected=1
                sudo tailscale ping --timeout=8s --c 1 "$IPAD_HOST" 2>&1 | tee -a ipad-output.txt || \
                  echo 'tailscale_ping=advisory-timeout-continuing-to-ssh-port-check' | tee -a ipad-output.txt
                break
              fi
            fi
            sleep $((attempt * 8))
          done
          if [ "$connected" != 1 ]; then
            echo "Tailscale login succeeded inconsistently or the iPad node was not visible." | tee -a ipad-output.txt >&2
            sudo tailscale status 2>&1 | tee -a ipad-output.txt || true
            exit 1
          fi
          echo 'tailscale_ipad_node_visible=success' | tee -a ipad-output.txt

      - name: Run command file on iPad as root
        id: ssh
        shell: bash
        env:
          IPAD_HOST: 100.116.117.65
          IPAD_PORT: "22"
          IPAD_USER: mobile
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          : > ipad-output.txt

          if [ ! -s remote/ipad-command.sh ]; then
            echo "remote/ipad-command.sh is missing or empty" | tee -a ipad-output.txt
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          echo "Waking and checking iPad SSH port over Tailscale..." | tee -a ipad-output.txt
          key_ready=0
          for attempt in $(seq 1 18); do
            echo "SSH port attempt $attempt/18" | tee -a ipad-output.txt
            rm -f "$HOME/.ssh/known_hosts"
            if ssh-keyscan -T 10 -H -p "$IPAD_PORT" "$IPAD_HOST" > "$HOME/.ssh/known_hosts" 2>>ipad-output.txt; then
              if [ -s "$HOME/.ssh/known_hosts" ]; then
                key_ready=1
                break
              fi
            fi
            sudo tailscale ping --timeout=5s --c 1 "$IPAD_HOST" >>ipad-output.txt 2>&1 || true
            sleep 8
          done
          if [ "$key_ready" != 1 ]; then
            echo "Could not reach iPad TCP port 22 after wake and retry attempts." | tee -a ipad-output.txt
            sudo tailscale status 2>&1 | tee -a ipad-output.txt || true
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          echo 'ipad_ssh_port_ready=success' | tee -a ipad-output.txt

          echo "Running remote/ipad-command.sh on $IPAD_USER@$IPAD_HOST:$IPAD_PORT as root..." | tee -a ipad-output.txt
          set +e
          {
            printf '%s\n' "$IPAD_PASSWORD"
            cat remote/ipad-command.sh
          } | sshpass -e ssh \
                -p "$IPAD_PORT" \
                -o BatchMode=no \
                -o ConnectTimeout=20 \
                -o ConnectionAttempts=2 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=2 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$IPAD_USER@$IPAD_HOST" \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee -a ipad-output.txt
          ssh_status=${PIPESTATUS[1]}
          set -e

          echo "ssh_exit_code=$ssh_status" | tee -a ipad-output.txt
          exit "$ssh_status"

      - name: Upload command output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-ssh-output-${{ github.run_id }}
          path: ipad-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish bridge status
        if: always()
        env:
          ENVIRONMENT_NAME: ${{ needs.resolve-environment.outputs.environment_name }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
          INSTALL_SSH_OUTCOME: ${{ steps.install_ssh.outcome }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = [
              "iPad Tailscale SSH Bridge",
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"run_url=https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              f"commit={os.environ.get('GITHUB_SHA', '')}",
              f"environment={os.environ.get('ENVIRONMENT_NAME', '')}",
              f"validate={os.environ.get('VALIDATE_OUTCOME', '')}",
              f"tailscale={os.environ.get('TAILSCALE_OUTCOME', '')}",
              f"install_ssh={os.environ.get('INSTALL_SSH_OUTCOME', '')}",
              f"ssh={os.environ.get('SSH_OUTCOME', '')}",
          ]

          validation = Path("validation-error.txt")
          if validation.exists() and validation.stat().st_size:
              lines.extend(["", "--- validation error ---"])
              lines.extend(validation.read_text(errors="replace").splitlines())

          lines.extend(["", "--- sanitized SSH output ---"])
          output = Path("ipad-output.txt")
          if output.exists():
              text = output.read_text(errors="replace")
              password = os.environ.get("IPAD_PASSWORD", "")
              if password:
                  text = text.replace(password, "***REDACTED***")
              lines.extend(text.splitlines()[-180:])
          else:
              lines.append("No SSH output file was created; failure occurred before the SSH step.")

          Path("remote/ipad-bridge-status.txt").write_text("\n".join(lines) + "\n")
          PY

          git add remote/ipad-bridge-status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record iPad SSH bridge status [skip ci]"
          git push origin HEAD:main

  run-command-iphone:
    name: Run diagnostic on iPhone 100.96.37.124
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY" || { echo 'Missing TAILSCALE_AUTHKEY'; exit 1; }
          test -n "$IPHONE_PASSWORD" || { echo 'Missing IPAD_PASSWORD used for iPhone SSH'; exit 1; }

      - name: Install Tailscale and SSH clients
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl --fail --silent --show-error --retry 3 --connect-timeout 20 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
            | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl --fail --silent --show-error --retry 3 --connect-timeout 20 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
            | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tailscale openssh-client sshpass netcat-openbsd
          sudo systemctl enable --now tailscaled

      - name: Join Tailscale and verify iPhone
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_HOST: 100.96.37.124
        run: |
          set -euo pipefail
          : > iphone-output.txt
          sudo tailscale logout >/dev/null 2>&1 || true
          sudo systemctl restart tailscaled
          sleep 3
          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="github-iphone-${GITHUB_RUN_ID}" \
            --accept-dns=false \
            --accept-routes=false \
            --reset 2>&1 | tee -a iphone-output.txt
          sudo tailscale status 2>&1 | tee -a iphone-output.txt
          if ! sudo tailscale status | grep -Fq "$IPHONE_HOST"; then
            echo "iphone_node_visible=no target=$IPHONE_HOST" | tee -a iphone-output.txt
            exit 1
          fi
          echo "iphone_node_visible=yes target=$IPHONE_HOST" | tee -a iphone-output.txt
          sudo tailscale ping --timeout=8s --c 2 "$IPHONE_HOST" 2>&1 | tee -a iphone-output.txt || true
          if nc -zvw8 "$IPHONE_HOST" 22 2>&1 | tee -a iphone-output.txt; then
            echo 'iphone_tcp_22=open' | tee -a iphone-output.txt
          else
            echo 'iphone_tcp_22=closed_or_unreachable' | tee -a iphone-output.txt
            exit 1
          fi

      - name: SSH and run iPhone battery diagnostic
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PORT: "22"
          IPHONE_USER: mobile
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          rm -f "$HOME/.ssh/known_hosts"
          ssh-keyscan -T 10 -H -p "$IPHONE_PORT" "$IPHONE_HOST" > "$HOME/.ssh/known_hosts" 2>>iphone-output.txt
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo 'iphone_host_key_scan=failed' | tee -a iphone-output.txt
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          set +e
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat remote/iphone-command.sh
          } | sshpass -e ssh \
                -p "$IPHONE_PORT" \
                -o BatchMode=no \
                -o ConnectTimeout=20 \
                -o ConnectionAttempts=2 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=2 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$IPHONE_USER@$IPHONE_HOST" \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee -a iphone-output.txt
          ssh_status=${PIPESTATUS[1]}
          set -e
          echo "iphone_ssh_exit_code=$ssh_status" | tee -a iphone-output.txt
          exit "$ssh_status"

      - name: Upload iPhone diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-ssh-output-${{ github.run_id }}
          path: iphone-output.txt
          if-no-files-found: warn
          retention-days: 7
