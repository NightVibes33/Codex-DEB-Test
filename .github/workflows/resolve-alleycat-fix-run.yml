name: Resolve AlleyCat Fix Run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resolve-alleycat-fix-run.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      OBSOLETE_SHA: cf03df447927f546f942c67897fd8b6c9713d1c1
      FINAL_SHA: 018d71c78659909db67bf5daf1b2e5f59b364dd2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/runs.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ios-unsigned-ipa.yml/runs?per_page=30" > "$runs"
          obsolete_id="$(jq -r --arg sha "$OBSOLETE_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' "$runs" | head -1)"
          obsolete_status="$(jq -r --arg sha "$OBSOLETE_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .status' "$runs" | head -1)"
          final_id="$(jq -r --arg sha "$FINAL_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' "$runs" | head -1)"
          final_status="$(jq -r --arg sha "$FINAL_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .status' "$runs" | head -1)"
          final_conclusion="$(jq -r --arg sha "$FINAL_SHA" '.workflow_runs[] | select(.head_sha==$sha) | (.conclusion // "")' "$runs" | head -1)"

          if [[ -n "$final_id" && -n "$obsolete_id" && "$obsolete_id" != "$final_id" && ( "$obsolete_status" == "queued" || "$obsolete_status" == "in_progress" ) ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${obsolete_id}/cancel" || true
            obsolete_status="cancel-requested"
          fi

          mkdir -p build-diagnostics
          {
            echo '# AlleyCat final fix run'
            echo
            echo "- Final commit: $FINAL_SHA"
            echo "- Final run: ${final_id:-not-found}"
            echo "- Final status: ${final_status:-not-found}"
            echo "- Final conclusion: ${final_conclusion:-}"
            echo "- Obsolete commit: $OBSOLETE_SHA"
            echo "- Obsolete run: ${obsolete_id:-not-found}"
            echo "- Obsolete status: ${obsolete_status:-not-found}"
          } > build-diagnostics/alleycat-final-fix-run.md
      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-diagnostics/alleycat-final-fix-run.md
          git commit -m 'Record AlleyCat final fix run [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
