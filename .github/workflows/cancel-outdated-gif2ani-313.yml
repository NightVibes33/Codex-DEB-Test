name: Cancel Outdated Gif2Ani 3.1.3 Tests

on:
  push:
    branches: [main]
    paths:
      - triggers/cancel-outdated-gif2ani-313.txt
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cancel queued and running physical tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > cancelled.txt
          for status in queued in_progress; do
            curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test-gif2ani-3.1.3-physical.yml/runs?status=${status}&per_page=100" > "runs-${status}.json"
            python3 - "$status" <<'PY' >> cancelled.txt
          import json,sys
          status=sys.argv[1]
          for run in json.load(open(f'runs-{status}.json')).get('workflow_runs',[]):
              print(f"{run['id']} {status} {run['head_sha']}")
          PY
          done
          while read -r run_id status head_sha; do
            [ -n "$run_id" ] || continue
            code=$(curl -sS -o /tmp/cancel-response -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")
            echo "cancel_run=$run_id prior_status=$status head_sha=$head_sha http=$code" >> cancel-report.txt
            test "$code" = 202 || test "$code" = 409
          done < cancelled.txt
          if [ ! -s cancel-report.txt ]; then echo no_outdated_runs_found=yes > cancel-report.txt; fi
      - name: Publish cancellation report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          {
            echo 'Outdated Gif2Ani 3.1.3 Test Cancellation'
            echo "run_id=${GITHUB_RUN_ID}"
            cat cancel-report.txt
          } > remote/gif2ani-313-cancellation.txt
          git add remote/gif2ani-313-cancellation.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record outdated Gif2Ani test cancellation [skip ci]"
            git push origin HEAD:main
          fi
