name: Quick Gif2Ani Post-Exit Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/diagnose-ellekit-loader-ipad.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name']); raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  check:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Read current device state
        id: collect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          timeout 45 sshpass -e ssh -p 22 \
            -o ConnectTimeout=12 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            mobile@"$IPAD_HOST" 'sh -c '\''
              echo "=== PACKAGES ==="
              dpkg-query -W -f="${Package} ${Version} ${Status}\n" ellekit com.nightvibes33.gif2ani 2>&1 || true
              echo "=== PROCESSES ==="
              ps ax | grep -E "[b]ackboardd|[S]pringBoard" || true
              echo "=== GIF SLOTS ==="
              media="/var/mobile/Library/Application Support/Gif2Ani"
              for f in Pending.gif Active.gif Rejected.gif load-in-progress runtime-status.plist; do
                if [ -e "$media/$f" ]; then echo "$f=present"; else echo "$f=absent"; fi
              done
              echo "=== RUNTIME STATUS ==="
              cat "$media/runtime-status.plist" 2>/dev/null || echo runtime_status=missing
              echo "=== SAFE MODE GATES ==="
              echo "_MSSafeMode=$(/var/jb/usr/bin/launchctl getenv _MSSafeMode 2>/dev/null || true)"
              echo "_SafeMode=$(/var/jb/usr/bin/launchctl getenv _SafeMode 2>/dev/null || true)"
              if [ -e /var/mobile/.eksafemode ]; then echo eksafemode_file=present; else echo eksafemode_file=absent; fi
              echo "=== RECENT CRASHES ==="
              find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name "backboardd-*.ips" -o -name "SpringBoard-*.ips" \) -mmin -20 -print 2>/dev/null | wc -l | tr -d " "
            '\''' 2>&1 | tee quick-post-exit-check.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "ssh_exit=$code" | tee -a quick-post-exit-check.txt
          exit "$code"
      - name: Publish status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          {
            echo "Quick Gif2Ani Post-Exit Check"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "collect=${{ steps.collect.outcome }}"
            echo
            cat quick-post-exit-check.txt 2>/dev/null || echo "No output."
          } > remote/quick-gif2ani-post-exit-check.txt
          git add remote/quick-gif2ani-post-exit-check.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record quick Gif2Ani post-exit check [skip ci]"
            git push origin HEAD:main
          fi
