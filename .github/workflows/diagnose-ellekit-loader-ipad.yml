name: Trace Choicy and backboardd Injection V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/diagnose-ellekit-loader-ipad.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name']); raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  check:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Inspect Choicy and backboardd rules
        id: collect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          timeout 55 sshpass -e ssh -p 22 \
            -o ConnectTimeout=12 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            mobile@"$IPAD_HOST" 'sh -c '\''
              dump_plist() {
                p="$1"
                echo "--- $p"
                if command -v plutil >/dev/null 2>&1; then
                  plutil -p "$p" 2>&1 || file "$p" 2>&1 || true
                else
                  file "$p" 2>&1 || true
                fi
              }

              echo "=== PACKAGES / PROCESSES ==="
              dpkg-query -W ellekit com.nightvibes33.gif2ani 2>&1 || true
              ps ax | grep -E "[b]ackboardd|[S]pringBoard" || true

              echo "=== SAFE MODE GATES ==="
              echo "_MSSafeMode=$(/var/jb/usr/bin/launchctl getenv _MSSafeMode 2>/dev/null || true)"
              echo "_SafeMode=$(/var/jb/usr/bin/launchctl getenv _SafeMode 2>/dev/null || true)"
              if [ -e /var/mobile/.eksafemode ]; then echo eksafemode_file=present; else echo eksafemode_file=absent; fi

              echo "=== CHOICY PACKAGE FILES ==="
              dpkg-query -W 2>/dev/null | grep -i choicy || true
              dpkg-query -L com.opa334.choicy 2>&1 || true
              ls -la /var/jb/usr/lib/TweakInject/Choicy* 2>&1 || true
              for f in /var/jb/usr/lib/TweakInject/Choicy*.plist; do
                [ -e "$f" ] || continue
                dump_plist "$f"
              done

              echo "=== CHOICY PREFERENCES ==="
              find /var/mobile/Library/Preferences -maxdepth 1 -iname "*choicy*" -print 2>/dev/null || true
              for f in /var/mobile/Library/Preferences/*choicy* /var/mobile/Library/Preferences/*Choicy*; do
                [ -e "$f" ] || continue
                dump_plist "$f"
              done

              echo "=== BACKBOARDD TARGETING TWEAKS ==="
              for f in /var/jb/usr/lib/TweakInject/*.plist; do
                [ -f "$f" ] || continue
                if grep -a -q "backboardd" "$f" 2>/dev/null; then
                  dump_plist "$f"
                fi
              done

              echo "=== BACKBOARDD LAUNCH STATE ==="
              pid=$(ps ax | awk "/[b]ackboardd/{print \$1; exit}")
              echo "backboardd_pid=$pid"
              /var/jb/usr/bin/launchctl print system/com.apple.backboardd 2>&1 | grep -E "state =|path =|program =|environment|DYLD|SafeMode|inject|pid =" | head -100 || true

              echo "=== GIF2ANI RUNTIME DIRECTORY ==="
              media="/var/mobile/Library/Application Support/Gif2Ani"
              ls -ld "$media" 2>&1 || true
              ls -la "$media" 2>&1 || true
              if [ -e "$media/runtime-status.plist" ]; then dump_plist "$media/runtime-status.plist"; else echo runtime_status=missing; fi

              echo "=== RECENT CRASHES ==="
              find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name "backboardd-*.ips" -o -name "SpringBoard-*.ips" \) -mmin -30 -print 2>/dev/null || true
            '\''' 2>&1 | tee choicy-backboardd-trace-v2.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "ssh_exit=$code" | tee -a choicy-backboardd-trace-v2.txt
          exit "$code"
      - name: Publish status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          {
            echo "Choicy and backboardd Injection Trace V2"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "collect=${{ steps.collect.outcome }}"
            echo
            cat choicy-backboardd-trace-v2.txt 2>/dev/null || echo "No output."
          } > remote/choicy-backboardd-injection-trace-v2.txt
          git add remote/choicy-backboardd-injection-trace-v2.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Choicy and backboardd injection trace V2 [skip ci]"
            git push origin HEAD:main
          fi
