name: Trace ElleKit Launch Injection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/diagnose-ellekit-loader-ipad.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name']); raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  check:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Inspect launch injection state
        id: collect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          timeout 55 sshpass -e ssh -p 22 \
            -o ConnectTimeout=12 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            mobile@"$IPAD_HOST" 'sh -c '\''
              echo "=== CURRENT STATE ==="
              dpkg-query -W ellekit com.nightvibes33.gif2ani 2>&1 || true
              ps ax | grep -E "[l]aunchd|[b]ackboardd|[S]pringBoard" || true
              echo "_MSSafeMode=$(/var/jb/usr/bin/launchctl getenv _MSSafeMode 2>/dev/null || true)"
              echo "_SafeMode=$(/var/jb/usr/bin/launchctl getenv _SafeMode 2>/dev/null || true)"

              echo "=== GLOBAL LAUNCHD ENV ==="
              for key in DYLD_INSERT_LIBRARIES SANDBOX_EXTENSION _MSSafeMode _SafeMode; do
                printf "%s=" "$key"
                /var/jb/usr/bin/launchctl getenv "$key" 2>/dev/null || true
              done

              echo "=== BACKBOARDD SERVICE ENVIRONMENT ==="
              /var/jb/usr/bin/launchctl print system/com.apple.backboardd 2>&1 | awk '\''
                /default environment = \{/ {show=1; count=0}
                /environment = \{/ {show=1; count=0}
                show {print; count++}
                show && count>35 {show=0}
              '\'' || true

              echo "=== BACKBOARDD PROCESS ENVIRONMENT ==="
              pid=$(ps ax | awk "/[b]ackboardd/{print \$1; exit}")
              echo "backboardd_pid=$pid"
              ps eww -p "$pid" 2>&1 || true

              echo "=== LAUNCHD PROCESS ENVIRONMENT ==="
              ps eww -p 1 2>&1 || true

              echo "=== ELLEKIT PATHS ==="
              ls -la /var/jb/usr/lib/ellekit/pspawn.dylib /var/jb/usr/lib/ellekit/libinjector.dylib /var/jb/usr/libexec/ellekit/loader /var/jb/etc/rc.d/ellekit-loader 2>&1 || true
              file /var/jb/usr/lib/ellekit/pspawn.dylib /var/jb/usr/lib/ellekit/libinjector.dylib /var/jb/usr/libexec/ellekit/loader 2>&1 || true

              echo "=== SYSTEM JOB MATCHES ==="
              /var/jb/usr/bin/launchctl print system 2>&1 | grep -i -E "ellekit|pspawn|libinjector|DYLD_INSERT_LIBRARIES|SANDBOX_EXTENSION" | head -120 || true

              echo "=== GIF2ANI RUNTIME ==="
              media="/var/mobile/Library/Application Support/Gif2Ani"
              ls -la "$media" 2>&1 || true
              if [ -e "$media/runtime-status.plist" ]; then /var/jb/usr/libexec/PlistBuddy -c Print "$media/runtime-status.plist" 2>&1 || true; else echo runtime_status=missing; fi

              echo "=== RECENT CRASHES ==="
              find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name "backboardd-*.ips" -o -name "SpringBoard-*.ips" \) -mmin -30 -print 2>/dev/null || true
            '\''' 2>&1 | tee ellekit-launch-injection.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "ssh_exit=$code" | tee -a ellekit-launch-injection.txt
          exit "$code"
      - name: Publish status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          {
            echo "ElleKit Launch Injection Trace"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "collect=${{ steps.collect.outcome }}"
            echo
            cat ellekit-launch-injection.txt 2>/dev/null || echo "No output."
          } > remote/ellekit-launch-injection-trace.txt
          git add remote/ellekit-launch-injection-trace.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record ElleKit launch injection trace [skip ci]"
            git push origin HEAD:main
          fi
