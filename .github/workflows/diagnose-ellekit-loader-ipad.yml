name: Verify Current ElleKit Loader Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/diagnose-ellekit-loader-ipad.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  check:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Create read-only device script
        run: |
          cat > verify-current-loader-path.sh <<'SH'
          #!/bin/sh
          set +e
          media="/var/mobile/Library/Application Support/Gif2Ani"
          bb=$(ps ax | awk '/[b]ackboardd/{print $1; exit}')
          sb=$(ps ax | awk '/[S]pringBoard/{print $1; exit}')
          echo '=== PACKAGES ==='
          dpkg-query -W -f='${Package}\t${Version}\t${Status}\n' ellekit com.nightvibes33.gif2ani 2>&1
          echo '=== GLOBAL LOADER PATH ==='
          echo "JB_TWEAKLOADER_PATH=$(/var/jb/usr/bin/launchctl getenv JB_TWEAKLOADER_PATH 2>/dev/null || true)"
          echo '=== PROCESSES ==='
          echo "backboardd_pid=$bb"
          echo "springboard_pid=$sb"
          ps eww -p "$bb" 2>&1 || true
          ps eww -p "$sb" 2>&1 || true
          echo '=== RUNTIME DIRECTORY ==='
          ls -la "$media" 2>&1 || true
          echo '=== RUNTIME STATUS ==='
          cat "$media/runtime-status.plist" 2>/dev/null || echo runtime_status=missing
          echo '=== SAFE MODE GATES ==='
          echo "_MSSafeMode=$(/var/jb/usr/bin/launchctl getenv _MSSafeMode 2>/dev/null || true)"
          echo "_SafeMode=$(/var/jb/usr/bin/launchctl getenv _SafeMode 2>/dev/null || true)"
          if [ -e /var/mobile/.eksafemode ]; then echo eksafemode_file=present; else echo eksafemode_file=absent; fi
          echo '=== RECENT CRASHES ==='
          find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' \) -mmin -30 -print 2>/dev/null || true
          SH
          chmod +x verify-current-loader-path.sh
      - name: Run read-only verification
        id: collect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          timeout 60 sshpass -e scp -P 22 -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null verify-current-loader-path.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          copy_code=$?
          if [ "$copy_code" -eq 0 ]; then
            timeout 60 sshpass -e ssh -p 22 -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sh /var/mobile/Media/verify-current-loader-path.sh' 2>&1 | tee current-loader-path.txt
            code=${PIPESTATUS[0]}
          else
            code=$copy_code
            echo "scp_exit=$copy_code" | tee current-loader-path.txt
          fi
          set -e
          echo "probe_exit=$code" | tee -a current-loader-path.txt
          exit "$code"
      - name: Publish status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          {
            echo 'Current ElleKit Loader Path Verification'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "collect=${{ steps.collect.outcome }}"
            echo
            cat current-loader-path.txt 2>/dev/null || echo 'No output.'
          } > remote/current-ellekit-loader-path.txt
          git add remote/current-ellekit-loader-path.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record current ElleKit loader path [skip ci]'
            git push origin HEAD:main
          fi
