name: Read Choicy Injection Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/diagnose-ellekit-loader-ipad.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name']); raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  check:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Read Choicy rules
        id: collect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          timeout 55 sshpass -e ssh -p 22 \
            -o ConnectTimeout=12 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            mobile@"$IPAD_HOST" 'sh -c '\''
              buddy="/var/jb/usr/libexec/PlistBuddy"
              dump() {
                f="$1"
                echo "--- $f"
                if [ -x "$buddy" ]; then "$buddy" -c Print "$f" 2>&1 || true; else file "$f" 2>&1 || true; fi
              }

              echo "=== CURRENT STATE ==="
              dpkg-query -W ellekit com.nightvibes33.gif2ani com.opa334.choicy 2>&1 || true
              ps ax | grep -E "[b]ackboardd|[S]pringBoard" || true
              echo "_MSSafeMode=$(/var/jb/usr/bin/launchctl getenv _MSSafeMode 2>/dev/null || true)"
              echo "_SafeMode=$(/var/jb/usr/bin/launchctl getenv _SafeMode 2>/dev/null || true)"

              echo "=== CHOICY DEFAULTS ==="
              defaults read com.opa334.choicy 2>&1 || true

              echo "=== CHOICY PREFERENCE FILE ==="
              pref="/var/mobile/Library/Preferences/com.opa334.choicy.plist"
              ls -la "$pref" 2>&1 || true
              [ -e "$pref" ] && dump "$pref"

              echo "=== CHOICY INJECTION FILTERS ==="
              find /var/jb/usr/lib/TweakInject -maxdepth 1 -iname "*choicy*.plist" -print 2>/dev/null | while IFS= read -r f; do dump "$f"; done

              echo "=== CHOICY SETTINGS SCHEMAS ==="
              for f in \
                "/var/jb/Library/PreferenceBundles/ChoicyPrefs.bundle/ApplicationDaemon.plist" \
                "/var/jb/Library/PreferenceBundles/ChoicyPrefs.bundle/GlobalTweakConfiguration.plist" \
                "/var/jb/Library/PreferenceBundles/ChoicyPrefs.bundle/Root.plist"; do
                [ -e "$f" ] && dump "$f"
              done

              echo "=== GIF2ANI FILTER ==="
              dump /var/jb/usr/lib/TweakInject/Gif2Ani.plist

              echo "=== BACKBOARDD FILTER MATCHES ==="
              for f in /var/jb/usr/lib/TweakInject/*.plist; do
                [ -f "$f" ] || continue
                if grep -a -q "backboardd" "$f" 2>/dev/null; then
                  echo "$f"
                fi
              done

              echo "=== RUNTIME STATUS ==="
              media="/var/mobile/Library/Application Support/Gif2Ani"
              if [ -e "$media/runtime-status.plist" ]; then dump "$media/runtime-status.plist"; else echo runtime_status=missing; fi
              echo "=== RECENT CRASHES ==="
              find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name "backboardd-*.ips" -o -name "SpringBoard-*.ips" \) -mmin -30 -print 2>/dev/null || true
            '\''' 2>&1 | tee choicy-rules.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "ssh_exit=$code" | tee -a choicy-rules.txt
          exit "$code"
      - name: Publish status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          {
            echo "Choicy Injection Rules"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "collect=${{ steps.collect.outcome }}"
            echo
            cat choicy-rules.txt 2>/dev/null || echo "No output."
          } > remote/choicy-injection-rules.txt
          git add remote/choicy-injection-rules.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Choicy injection rules [skip ci]"
            git push origin HEAD:main
          fi
