name: Patch Official Exit Remove libxpc Flag

on:
  push:
    branches: [main]
    paths:
      - triggers/patch-official-exit-remove-lxpc.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove standalone libxpc linker flag
        run: |
          set -euo pipefail
          target=.github/workflows/official-exit-palera1n-safemode.yml
          grep -q 'exitpale_LIBRARIES = xpc' "$target"
          sed -i '/exitpale_LIBRARIES = xpc/d' "$target"
          ! grep -q 'exitpale_LIBRARIES = xpc' "$target"
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/official-exit-palera1n-safemode.yml
          git commit -m "Link official safe-mode helper through system libraries"
          git push origin HEAD:main
