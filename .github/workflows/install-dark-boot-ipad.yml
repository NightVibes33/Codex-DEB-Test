name: Install Dark-Boot 2.0.1 on iPad

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: install-dark-boot-ipad
  cancel-in-progress: true

env:
  DARK_BOOT_VERSION: "2.0.1"
  DARK_BOOT_SOURCE_COMMIT: "6800cd10809ae3b442b218784a3180722f8a9560"
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'NightVibes33' && github.event.issue.title == '[Install Dark-Boot 2.0.1]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve bridge environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          target = int(sys.argv[1])
          data = json.load(open('environments.json', encoding='utf-8'))
          for env in data.get('environments', []):
              if int(env.get('id', -1)) == target:
                  print('environment_name=' + env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  install:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'NightVibes33' && github.event.issue.title == '[Install Dark-Boot 2.0.1]')
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout transport repository
        uses: actions/checkout@v4

      - name: Validate bridge secrets
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          test -n "$TAILSCALE_AUTHKEY"
          test -n "$IPAD_PASSWORD"

      - name: Build exact Dark-Boot source and validate Settings pane
        env:
          THEOS: /opt/theos
          CI: "1"
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl zip git libxml2 \
            dpkg-dev unzip xz-utils ca-certificates python3 openssh-client sshpass
          sudo rm -rf /opt/theos dark-boot-src package-root
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

          git init dark-boot-src
          git -C dark-boot-src remote add origin https://github.com/NightVibes33/Dark-Boot.git
          git -C dark-boot-src fetch --depth 1 origin "$DARK_BOOT_SOURCE_COMMIT"
          git -C dark-boot-src checkout --detach FETCH_HEAD
          test "$(git -C dark-boot-src rev-parse HEAD)" = "$DARK_BOOT_SOURCE_COMMIT"

          make -C dark-boot-src clean package FINALPACKAGE=1
          DEB="$(find dark-boot-src/packages -maxdepth 1 -type f -name 'com.nightvibes33.darkboot_2.0.1_iphoneos-arm64.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb --field "$DEB" Version)" = "$DARK_BOOT_VERSION"
          test "$(dpkg-deb --field "$DEB" Architecture)" = "iphoneos-arm64"
          dpkg-deb -x "$DEB" package-root
          python3 - <<'PY'
          import plistlib
          path = 'package-root/var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle/Root.plist'
          with open(path, 'rb') as f:
              root = plistlib.load(f)
          assert isinstance(root, dict)
          items = root.get('items')
          assert isinstance(items, list) and len(items) >= 35
          print(f'packaged_settings_specifiers={len(items)}')
          PY
          cp "$DEB" Dark-Boot-2.0.1-rootless.deb
          sha256sum Dark-Boot-2.0.1-rootless.deb | tee package-sha256.txt

      - name: Join Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ env.IPAD_HOST }}
          version: latest

      - name: Prepare trusted SSH connection
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 20 -H -p 22 "$IPAD_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh -p 22 -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" mobile@"$IPAD_HOST" 'echo bridge-ready'

      - name: Copy and install fixed package
        id: install
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          : > install-status.txt
          sshpass -e scp -P 22 -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" Dark-Boot-2.0.1-rootless.deb \
            mobile@"$IPAD_HOST":/var/mobile/Documents/Dark-Boot-2.0.1-rootless.deb

          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=20 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh -c '\''dpkg -i /var/mobile/Documents/Dark-Boot-2.0.1-rootless.deb; sync'\''' \
            2>&1 | tee install-status.txt
          code=${PIPESTATUS[1]}
          echo "install_ssh_exit=$code" | tee -a install-status.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 255 ]; then exit "$code"; fi
          sleep 22

      - name: Reconnect and verify real installed Settings controls
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in 1 2 3 4 5 6; do
            if sshpass -e ssh -p 22 -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" mobile@"$IPAD_HOST" 'true'; then
              connected=1
              break
            fi
            sleep 8
          done
          test "$connected" -eq 1

          cat > verify-dark-boot.sh <<'SH'
          #!/bin/sh
          set -eu
          ROOT=/var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle/Root.plist
          version="$(dpkg-query -W -f='${Version}' com.nightvibes33.darkboot)"
          echo "installed_version=$version"
          test "$version" = "2.0.1"
          test -x /var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle/DarkBootPrefs
          test -f /var/jb/Library/PreferenceLoader/Preferences/DarkBoot.plist
          test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/DarkBoot.dylib
          test -f "$ROOT"
          grep -q '<key>items</key>' "$ROOT"
          count="$(grep -c '<key>cell</key>' "$ROOT")"
          echo "installed_settings_specifiers=$count"
          test "$count" -ge 35
          grep -q 'Enable Dark Boot' "$ROOT"
          grep -q 'Import Image, GIF, or Video' "$ROOT"
          grep -q 'Preview Full Experience' "$ROOT"
          echo 'settings_bundle=real-controls-present'
          rm -f /var/mobile/Documents/Dark-Boot-2.0.1-rootless.deb
          killall -9 Preferences 2>/dev/null || true
          SH
          chmod 0755 verify-dark-boot.sh
          sshpass -e scp -P 22 -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" verify-dark-boot.sh \
            mobile@"$IPAD_HOST":/var/mobile/Documents/verify-dark-boot.sh
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Documents/verify-dark-boot.sh' \
            2>&1 | tee -a install-status.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-boot-2.0.1-ipad-install-${{ github.run_id }}
          path: |
            install-status.txt
            package-sha256.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish sanitized status
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('install-status.txt').read_text(errors='replace') if Path('install-status.txt').exists() else 'No install output.'
          secret = os.environ.get('IPAD_PASSWORD', '')
          if secret:
              text = text.replace(secret, '***REDACTED***')
          lines = [
              'Dark-Boot 2.0.1 iPad Repair',
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"source_commit={os.environ.get('DARK_BOOT_SOURCE_COMMIT', '')}",
              f"tailscale={os.environ.get('TAILSCALE_OUTCOME', '')}",
              f"install_step={os.environ.get('INSTALL_OUTCOME', '')}",
              '',
              *text.splitlines()[-120:],
          ]
          Path('remote/dark-boot-install-status.txt').write_text('\n'.join(lines) + '\n')
          PY
          git add remote/dark-boot-install-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Dark-Boot 2.0.1 iPad repair [skip ci]"
            git push origin HEAD:main
          fi
