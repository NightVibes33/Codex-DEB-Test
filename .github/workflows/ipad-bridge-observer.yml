name: iPad Bridge Observer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ipad-bridge-observer.yml"

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query latest iPad bridge run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "observer_refresh=4"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ipad-tailscale-ssh.yml/runs?branch=main&per_page=5" \
            > runs.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('runs.json').read_text())
          lines = ['iPad Bridge Observer']
          for run in data.get('workflow_runs', []):
              lines.extend([
                  f"run_id={run.get('id')}",
                  f"head_sha={run.get('head_sha')}",
                  f"status={run.get('status')}",
                  f"conclusion={run.get('conclusion')}",
                  f"created_at={run.get('created_at')}",
                  f"updated_at={run.get('updated_at')}",
                  f"url={run.get('html_url')}",
                  '---',
              ])
          Path('remote/ipad-bridge-observer.txt').write_text('\n'.join(lines) + '\n')
          PY

      - name: Publish observer status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add remote/ipad-bridge-observer.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record iPad bridge observer status [skip ci]"
          git push origin HEAD:main
