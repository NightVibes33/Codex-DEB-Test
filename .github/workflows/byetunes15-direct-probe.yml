name: ByeTunes15 Direct iPhone Probe

on:
  workflow_dispatch:
  push:
    branches:
      - temp/byetunes-ios16-rootless
    paths:
      - 'triggers/byetunes15-direct-probe.txt'

permissions:
  contents: read

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.e.outputs.name }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json
          for e in json.load(open('/tmp/e.json')).get('environments', []):
              if int(e.get('id', -1)) == 18728387881:
                  print('name=' + e['name']); break
          else: raise SystemExit('environment not found')
          PY

  probe:
    needs: env
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSHPASS: ${{ secrets.IPAD_PASSWORD }}
      PASS: ${{ secrets.IPAD_PASSWORD }}
      HOST: '100.96.37.124'
    steps:
      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Direct probe known iPhone
        run: |
          set -euo pipefail
          tailscale status --json > tailscale.json
          tailscale ping --timeout=5s --c 1 "$HOST" | tee direct-ping.txt || true
          timeout 8s ssh-keyscan -T 5 -H "$HOST" > known_hosts 2>keyscan.txt
          test -s known_hosts
          cat >/tmp/probe.sh <<'SH'
          set -eu
          P=/System/Library/CoreServices/SystemVersion.plist
          V="$(sed -n '/<key>ProductVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P" | head -n1)"
          B="$(sed -n '/<key>ProductBuildVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P" | head -n1)"
          M="$(sysctl -n hw.machine 2>/dev/null || /usr/sbin/sysctl -n hw.machine 2>/dev/null || uname -m)"
          echo "machine=$M version=$V build=$B"
          [ "$M" = iPhone8,1 ]
          [ "$V" = 15.8.8 ]
          [ -d /var/jb ]
          Q=/var/jb/usr/bin/dpkg-query; [ -x "$Q" ] || Q="$(command -v dpkg-query)"
          E="$($Q -W -f='${Status}' ellekit 2>/dev/null || true)"; echo "ellekit=$E"; echo "$E" | grep -q 'install ok installed'
          DB=/var/mobile/Media/iTunes_Control/iTunes/MediaLibrary.sqlitedb; test -f "$DB"; echo "db_size=$(stat -f %z "$DB" 2>/dev/null || stat -c %s "$DB" 2>/dev/null || echo unknown)"
          S=/var/jb/usr/bin/sqlite3; [ -x "$S" ] || S="$(command -v sqlite3)"
          echo 'quick_check_start'
          "$S" -readonly "$DB" 'PRAGMA quick_check;' 2>/dev/null || "$S" "$DB" 'PRAGMA quick_check;'
          echo 'quick_check_end'
          echo DIRECT_IPHONE_PROBE_PASS
          SH
          set +e
          { printf '%s\n' "$PASS"; cat /tmp/probe.sh; } | timeout 35s sshpass -e ssh -p 22 -o BatchMode=no -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' | tee direct-probe.txt
          rc=${PIPESTATUS[1]}
          set -e
          echo "ssh_rc=$rc" | tee -a direct-probe.txt
          test "$rc" -eq 0
          grep -q DIRECT_IPHONE_PROBE_PASS direct-probe.txt

      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ByeTunes15-direct-probe-${{ github.run_id }}
          path: |
            tailscale.json
            direct-ping.txt
            keyscan.txt
            direct-probe.txt
          if-no-files-found: ignore
          retention-days: 7
