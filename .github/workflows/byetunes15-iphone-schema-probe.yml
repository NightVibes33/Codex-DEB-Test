name: ByeTunes15 iPhone Schema Probe

on:
  workflow_dispatch:
  push:
    branches: [temp/byetunes-ios16-rootless]
    paths:
      - '.github/workflows/byetunes15-iphone-schema-probe.yml'
      - 'triggers/byetunes15-iphone-schema-probe.txt'

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/byetunes-ios16-rootless

      - name: Select Xcode 15
        run: |
          set -euo pipefail
          candidate=''
          for path in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app /Applications/Xcode_15.2.app /Applications/Xcode_15.1.app /Applications/Xcode.app; do
            if [ -d "$path" ]; then candidate="$path"; break; fi
          done
          test -n "$candidate"
          sudo xcode-select --switch "$candidate"
          xcodebuild -version

      - name: Install packaging tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid dpkg findutils sed coreutils
          cache: true
          cache-path: ~/__cache

      - name: Install Theos and SDK
        run: |
          set -euo pipefail
          rm -rf "$THEOS" /tmp/theos-sdks
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -a /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"

      - name: Apply iOS 15 compatibility patch
        id: patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('byetunes16')
          p=root/'Makefile'; s=p.read_text(); old='TARGET = iphone:clang:16.5:16.0'; assert old in s; p.write_text(s.replace(old,'TARGET = iphone:clang:16.5:15.0',1))
          p=root/'control'; s=p.read_text(); old='Depends: firmware (>= 16.0), firmware (<< 17.0), ellekit'; assert old in s
          s=s.replace(old,'Depends: firmware (>= 15.0), firmware (<< 16.0), ellekit',1).replace('Version: 0.2.0','Version: 0.2.0-ios15.1',1).replace('Name: ByeTunes 16 Injection','Name: ByeTunes 15 Injection',1); p.write_text(s)
          p=root/'daemon'/'BTImporter.m'; s=p.read_text()
          pairs=[
            ('INSERT OR REPLACE INTO artwork(artwork_token,artwork_source_type,relative_path,artwork_type,artwork_variant_type) VALUES(?,1,?,1,0)','INSERT OR REPLACE INTO artwork(artwork_token,artwork_source_type,relative_path,artwork_type) VALUES(?,1,?,1)'),
            ('INSERT OR REPLACE INTO artwork_token(artwork_token,artwork_source_type,artwork_type,entity_pid,entity_type,artwork_variant_type) VALUES(?,1,1,?,?,0)','INSERT OR REPLACE INTO artwork_token(artwork_token,artwork_source_type,artwork_type,entity_pid,entity_type) VALUES(?,1,1,?,?)'),
            ("INSERT OR REPLACE INTO best_artwork_token(entity_pid,entity_type,artwork_type,available_artwork_token,fetchable_artwork_token,fetchable_artwork_source_type,artwork_variant_type) VALUES(?,?,1,?,'',0,0)","INSERT OR REPLACE INTO best_artwork_token(entity_pid,entity_type,artwork_type,available_artwork_token,fetchable_artwork_token,fetchable_artwork_source_type) VALUES(?,?,1,?,'',0)"),
            ('INSERT INTO container_item(container_item_pid,container_pid,item_pid,position,uuid) VALUES(?,?,?,?,?)','INSERT INTO container_item(container_item_pid,container_pid,item_pid,position) VALUES(?,?,?,?)'),
            ('NSString*u=NSUUID.UUID.UUIDString;',''),
            ('sqlite3_bind_text(s,5,u.UTF8String,-1,SQLITE_TRANSIENT);','')]
          for old,new in pairs: assert old in s, old; s=s.replace(old,new)
          p.write_text(s)
          p=root/'daemon'/'BTImporter+Full.m'; s=p.read_text(); old='INSERT INTO container_item(container_item_pid,container_pid,item_pid,position,uuid) VALUES(?,?,?,?,?)'; assert old in s
          s=s.replace(old,'INSERT INTO container_item(container_item_pid,container_pid,item_pid,position) VALUES(?,?,?,?)').replace('NSString *uuid = NSUUID.UUID.UUIDString;','').replace('sqlite3_bind_text(stmt, 5, uuid.UTF8String, -1, SQLITE_TRANSIENT);',''); p.write_text(s)
          PY

      - name: Build rootless iOS 15 DEB
        id: compile
        run: |
          set -o pipefail
          : > byetunes15-build.log
          make -C byetunes16 clean package FINALPACKAGE=1 2>&1 | tee byetunes15-build.log

      - name: Validate iOS 15 package
        id: validate
        run: |
          set -euo pipefail
          DEB="$(find byetunes16/packages -maxdepth 1 -type f -name '*.deb' -print | head -n1)"
          test -n "$DEB"
          dpkg-deb --info "$DEB" | tee byetunes15-package-info.txt
          dpkg-deb --contents "$DEB" | tee byetunes15-package-contents.txt
          test "$(dpkg-deb --field "$DEB" Package)" = 'com.nightvibes.byetunes16'
          test "$(dpkg-deb --field "$DEB" Architecture)" = 'iphoneos-arm64'
          DEPENDS="$(dpkg-deb --field "$DEB" Depends)"
          echo "$DEPENDS" | grep -F 'firmware (>= 15.0)'
          echo "$DEPENDS" | grep -F 'firmware (<< 16.0)'
          rm -rf byetunes15-package-root
          dpkg-deb -x "$DEB" byetunes15-package-root
          DYLIB=byetunes15-package-root/var/jb/Library/MobileSubstrate/DynamicLibraries/ByeTunes16.dylib
          DAEMON=byetunes15-package-root/var/jb/usr/libexec/byetunes16d
          test -f "$DYLIB" && test -x "$DAEMON"
          file "$DYLIB" | tee byetunes15-binary-info.txt | grep -q arm64
          file "$DAEMON" | tee -a byetunes15-binary-info.txt | grep -q arm64
          otool -l "$DYLIB" | tee byetunes15-otool.txt
          otool -l "$DAEMON" | tee -a byetunes15-otool.txt
          grep -Eq 'minos 15\.|version 15\.' byetunes15-otool.txt
          shasum -a 256 "$DEB" | tee byetunes15-sha256.txt
          cp "$DEB" ByeTunes15-iOS15-Dopamine-rootless.deb
          { echo validation=success; echo "version=$(dpkg-deb --field "$DEB" Version)"; echo "depends=$DEPENDS"; } | tee byetunes15-validation.txt

      - name: Upload iOS 15 DEB
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ByeTunes15-iOS15-Dopamine-rootless
          path: ByeTunes15-iOS15-Dopamine-rootless.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ByeTunes15-build-diagnostics-${{ github.run_id }}
          path: |
            byetunes15-build.log
            byetunes15-package-info.txt
            byetunes15-package-contents.txt
            byetunes15-binary-info.txt
            byetunes15-otool.txt
            byetunes15-sha256.txt
            byetunes15-validation.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish build result
        if: always()
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin temp/byetunes-ios16-rootless
          mkdir -p remote
          {
            echo 'ByeTunes iOS15 iPhone Build'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "patch=${PATCH_OUTCOME}"
            echo "compile=${COMPILE_OUTCOME}"
            echo "validate=${VALIDATE_OUTCOME}"
            [ ! -f byetunes15-validation.txt ] || cat byetunes15-validation.txt
            echo '--- build tail ---'
            [ ! -f byetunes15-build.log ] || tail -n 220 byetunes15-build.log
          } > remote/byetunes15-build-status.txt
          git add remote/byetunes15-build-status.txt
          git commit -m 'Record ByeTunes iOS15 build status [skip ci]' || exit 0
          git push origin HEAD:temp/byetunes-ios16-rootless
