name: Cancel Stuck p1ctl Probe

on:
  push:
    branches: [main]
    paths:
      - triggers/cancel-stuck-p1ctl-run.txt

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cancel run 30170707166
        id: cancel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          http_code=$(curl --silent --show-error -o cancel-response.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/30170707166/cancel")
          code=$?
          set -e
          echo "curl_exit=$code" | tee cancel-status.txt
          echo "http_code=$http_code" | tee -a cancel-status.txt
          if [ -s cancel-response.txt ]; then cat cancel-response.txt | tee -a cancel-status.txt; fi
          test "$code" -eq 0
          test "$http_code" = "202"
      - name: Publish cancellation status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          {
            echo "Stuck p1ctl Probe Cancellation"
            echo "target_run_id=30170707166"
            echo "outcome=${{ steps.cancel.outcome }}"
            echo
            cat cancel-status.txt 2>/dev/null || true
          } > remote/stuck-p1ctl-cancellation.txt
          git add remote/stuck-p1ctl-cancellation.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record stuck p1ctl probe cancellation [skip ci]"
            git push origin HEAD:main
          fi
