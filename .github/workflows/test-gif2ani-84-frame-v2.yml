name: Test Gif2Ani 84-Frame Animation V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/test-gif2ani-84-frame-v2.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  stress-test:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate 84-frame 33.6-second GIF
        id: generate
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil openssh-client sshpass
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          frames=[]
          width,height=320,240
          for i in range(84):
              im=Image.new('RGB',(width,height),(0,0,0))
              d=ImageDraw.Draw(im)
              x=(i*7)%(width-48)
              y=72+((i*5)%96)
              d.rectangle((x,y,x+48,y+48),fill=(245,245,255))
              d.rectangle((0,0,width-1,height-1),outline=((i*3)%256,80,255),width=3)
              d.line((0,height//2,width-1,height//2),fill=(30,70,180),width=2)
              d.point((i%width,(i*11)%height),fill=(255,0,80))
              frames.append(im)
          frames[0].save('Gif2Ani-84-frame-test.gif',save_all=True,append_images=frames[1:],duration=400,loop=0,optimize=False,disposal=2)
          check=Image.open('Gif2Ani-84-frame-test.gif')
          assert check.n_frames==84, check.n_frames
          assert check.size==(320,240), check.size
          print('source_frames=84')
          print('duration_seconds=33.6')
          print('dimensions=320x240')
          PY
          bytes=$(stat -c %s Gif2Ani-84-frame-test.gif)
          echo "input_bytes=$bytes"
          test "$bytes" -gt 0
          test "$bytes" -lt 26214400
          sha256sum Gif2Ani-84-frame-test.gif

      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Run bounded 84-frame physical test
        id: test
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 48); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then connected=1; break; fi
            sleep 5
          done
          echo "connected=$connected" | tee gif2ani-84-v2.txt
          test "$connected" -eq 1
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            Gif2Ani-84-frame-test.gif mobile@"$IPAD_HOST":/var/mobile/Media/

          cat > run-gif2ani-84-v2.sh <<'SH'
          #!/bin/sh
          set -eu
          media='/var/mobile/Library/Application Support/Gif2Ani'
          prefs='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          marker='/var/mobile/Media/gif2ani-84-v2.marker'

          backboard_pid() {
            ps ax | awk '$5=="/usr/libexec/backboardd" {print $1; exit}'
          }
          wait_new_backboard() {
            old="$1"
            for n in $(seq 1 45); do
              now=$(backboard_pid)
              if [ -n "$now" ] && [ "$now" != "$old" ]; then echo "$now"; return 0; fi
              sleep 1
            done
            return 1
          }
          write_disabled() {
            cat > "$prefs" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>isEnabled</key><false/>
            <key>pendingReady</key><false/>
            <key>imageTransformation</key><string>resizeAspect</string>
            <key>customLoop</key><real>-1</real>
            <key>customDuration</key><real>-1</real>
            <key>backgroundColor</key><string>#000000</string>
          </dict></plist>
          PLIST
            chown mobile:mobile "$prefs" 2>/dev/null || true
            chmod 0644 "$prefs" 2>/dev/null || true
          }
          cleanup() {
            set +e
            write_disabled
            rm -f "$media/Pending.gif" "$media/Active.gif" "$media/Rejected.gif" "$media/load-in-progress" "$media/pending-metadata.plist"
            old=$(backboard_pid)
            /var/jb/usr/bin/killall -9 backboardd 2>/dev/null || true
            wait_new_backboard "$old" >/dev/null 2>&1 || true
            sleep 5
            rm -f /var/mobile/Media/Gif2Ani-84-frame-test.gif
          }
          trap cleanup EXIT

          echo '=== PRECHECK ==='
          dpkg-query -W -f='${Package}\t${Version}\t${Status}\n' com.nightvibes33.gif2ani ellekit 2>&1
          test "$(dpkg-query -W -f='${Version}' com.nightvibes33.gif2ani)" = '3.1.1'
          current=$(backboard_pid)
          test -n "$current"
          current_env=$(ps eww -p "$current" 2>/dev/null || true)
          echo "current_backboardd=$current"
          echo "current_env=$current_env"
          printf '%s\n' "$current_env" | grep -q 'JB_PINFO_FLAGS=0x4c00082'

          mkdir -p "$media"
          chown mobile:mobile "$media"
          chmod 0755 "$media"
          rm -f "$media/Pending.gif" "$media/Active.gif" "$media/Rejected.gif" "$media/load-in-progress" "$media/runtime-status.plist" "$media/pending-metadata.plist"
          cp /var/mobile/Media/Gif2Ani-84-frame-test.gif "$media/Active.gif"
          chown mobile:mobile "$media/Active.gif"
          chmod 0644 "$media/Active.gif"
          cat > "$prefs" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>isEnabled</key><true/>
            <key>pendingReady</key><false/>
            <key>imageTransformation</key><string>resizeAspect</string>
            <key>customLoop</key><real>-1</real>
            <key>customDuration</key><real>-1</real>
            <key>backgroundColor</key><string>#000000</string>
          </dict></plist>
          PLIST
          chown mobile:mobile "$prefs"
          chmod 0644 "$prefs"

          echo '=== RESTART BACKBOARDD WITH ENABLED PREFS ==='
          old=$(backboard_pid)
          /var/jb/usr/bin/killall -9 backboardd
          new=$(wait_new_backboard "$old")
          echo "old_backboardd=$old"
          echo "new_backboardd=$new"
          sleep 6
          new_env=$(ps eww -p "$new" 2>/dev/null || true)
          echo "new_env=$new_env"
          printf '%s\n' "$new_env" | grep -q 'JB_PINFO_FLAGS=0x4c00082'
          test -f "$media/runtime-status.plist"
          grep -a -q 'tweak-loaded-no-media-decode' "$media/runtime-status.plist"

          echo '=== TRIGGER RESPRING ANIMATION ==='
          touch "$marker"
          if [ -x /var/jb/usr/bin/sbreload ]; then /var/jb/usr/bin/sbreload
          elif [ -x /usr/bin/sbreload ]; then /usr/bin/sbreload
          else /var/jb/usr/bin/killall -9 SpringBoard
          fi
          sleep 20

          echo '=== RUNTIME RESULT ==='
          cat "$media/runtime-status.plist" 2>/dev/null || echo runtime_status=missing
          test -f "$media/runtime-status.plist"
          grep -a -q 'custom-animation-stable' "$media/runtime-status.plist"
          grep -A 2 '<key>sourceFrames</key>' "$media/runtime-status.plist" | grep -q '<integer>84</integer>'
          grep -A 2 '<key>decodedFrames</key>' "$media/runtime-status.plist" | grep -q '<integer>21</integer>'
          grep -A 2 '<key>frameCount</key>' "$media/runtime-status.plist" | grep -q '<integer>21</integer>'
          test -f "$media/Active.gif"
          test ! -e "$media/Rejected.gif"
          test ! -e "$media/load-in-progress"
          crashes=$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' \) -newer "$marker" -print 2>/dev/null | wc -l | tr -d ' ')
          echo "new_crash_reports=$crashes"
          test "$crashes" = 0
          echo gif2ani_84_frame_test=success
          SH
          chmod +x run-gif2ani-84-v2.sh
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null run-gif2ani-84-v2.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=60 -o ServerAliveInterval=8 -o ServerAliveCountMax=8 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/run-gif2ani-84-v2.sh' \
            2>&1 | tee -a gif2ani-84-v2.txt
          code=${PIPESTATUS[1]}
          set -e
          echo "remote_exit=$code" | tee -a gif2ani-84-v2.txt
          exit "$code"

      - name: Verify final disabled state
        if: always()
        id: final_verify
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then break; fi
            sleep 5
          done
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=25 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh -c '\''
            media="/var/mobile/Library/Application Support/Gif2Ani"
            prefs="/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist"
            grep -a -q "<key>isEnabled</key><false/>" "$prefs"
            test ! -e "$media/Pending.gif"
            test ! -e "$media/Active.gif"
            test ! -e "$media/Rejected.gif"
            test ! -e "$media/load-in-progress"
            echo final_state=installed_disabled_no_test_media
          '\''' 2>&1 | tee -a gif2ani-84-v2.txt

      - name: Publish result
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          FINAL_OUTCOME: ${{ steps.final_verify.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('gif2ani-84-v2.txt').read_text(errors='replace') if Path('gif2ani-84-v2.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=[
              'Gif2Ani 84-Frame Physical Test V2',
              f"run_id={os.environ.get('GITHUB_RUN_ID','')}",
              f"generate={os.environ.get('GENERATE_OUTCOME','')}",
              f"test={os.environ.get('TEST_OUTCOME','')}",
              f"final_verify={os.environ.get('FINAL_OUTCOME','')}",
              '', '--- sanitized output ---', *text.splitlines()[-700:]
          ]
          Path('remote/gif2ani-84-frame-v2-status.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/gif2ani-84-frame-v2-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 84-frame physical test V2 [skip ci]"
            git push origin HEAD:main
          fi
