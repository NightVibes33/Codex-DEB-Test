name: Diagnose iPad Tweak Injection Policy

on:
  push:
    branches: [main]
    paths:
      - triggers/diagnose-tweak-injection-policy.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  diagnose:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Collect injection policy and loader state
        id: collect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 36); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then connected=1; break; fi
            sleep 5
          done
          test "$connected" -eq 1
          cat > inspect-injection-policy.sh <<'SH'
          #!/bin/sh
          set +e
          echo '=== DEVICE / BOOT ==='
          sw_vers 2>/dev/null || true
          uname -a
          uptime
          echo '=== PROCESS OWNERS / ENV ==='
          ps -axo user,pid,ppid,command 2>/dev/null | grep -E '[l]aunchd|[b]ackboardd|[S]pringBoard' || ps ax | grep -E '[l]aunchd|[b]ackboardd|[S]pringBoard'
          ps eww -p 1 2>/dev/null || true
          bb=$(ps ax | awk '/[b]ackboardd/{print $1; exit}')
          sb=$(ps ax | awk '/[S]pringBoard/{print $1; exit}')
          [ -n "$bb" ] && ps eww -p "$bb" 2>/dev/null || true
          [ -n "$sb" ] && ps eww -p "$sb" 2>/dev/null || true

          echo '=== LAUNCHD ENV GATES ==='
          for key in _MSSafeMode _SafeMode LIBHOOKER_SAFE_MODE DISABLE_TWEAKS DYLD_INSERT_LIBRARIES PALERA1N_SAFE_MODE; do
            value=$(/var/jb/usr/bin/launchctl getenv "$key" 2>/dev/null)
            echo "$key=$value"
          done
          for f in /var/mobile/.eksafemode /var/mobile/.safemode /var/jb/.safemode /var/jb/var/mobile/.eksafemode; do [ -e "$f" ] && echo "$f=present" || echo "$f=absent"; done

          echo '=== CHOICY PACKAGE / FILTERS ==='
          dpkg-query -W 2>/dev/null | grep -Ei 'choicy|ellekit|substrate|libhooker|substitute|palera1n' || true
          for f in /var/jb/usr/lib/TweakInject/*Choicy*.plist /var/jb/Library/MobileSubstrate/DynamicLibraries/*Choicy*.plist; do
            [ -f "$f" ] || continue
            echo "--- $f"
            cat "$f"
          done

          echo '=== CHOICY / INJECTION PREFERENCES ==='
          find /var/mobile/Library/Preferences /var/jb/var/mobile/Library/Preferences -maxdepth 1 -type f \
            \( -iname '*choicy*' -o -iname '*ellekit*' -o -iname '*substrate*' -o -iname '*libhooker*' -o -iname '*palera1n*' -o -iname '*safemode*' \) -print 2>/dev/null | sort | while read f; do
              echo "--- $f"
              if command -v plutil >/dev/null 2>&1; then plutil -p "$f" 2>/dev/null || cat "$f"; else cat "$f"; fi
            done

          echo '=== GLOBAL PREFERENCE KEY SEARCH ==='
          grep -aR -Ei 'DisableTweak|disable.*inject|tweak.*disable|safe.?mode|backboardd|SpringBoard' \
            /var/mobile/Library/Preferences/com.opa334.choicyprefs.plist \
            /var/mobile/Library/Preferences 2>/dev/null | head -n 300 || true

          echo '=== ELLEKIT FILES / SIGNATURES ==='
          ls -l /var/jb/etc/rc.d/ellekit-loader /var/jb/usr/libexec/ellekit/loader /var/jb/usr/lib/ellekit/pspawn.dylib /var/jb/usr/lib/ellekit/libinjector.dylib
          file /var/jb/usr/libexec/ellekit/loader /var/jb/usr/lib/ellekit/pspawn.dylib /var/jb/usr/lib/ellekit/libinjector.dylib 2>&1 || true
          if [ -x /var/jb/usr/bin/ldid ]; then
            echo '--- pspawn entitlements'; /var/jb/usr/bin/ldid -e /var/jb/usr/lib/ellekit/pspawn.dylib 2>&1 || true
            echo '--- loader entitlements'; /var/jb/usr/bin/ldid -e /var/jb/usr/libexec/ellekit/loader 2>&1 || true
          fi

          echo '=== LIVE ELLEKIT LOADER OUTPUT ==='
          timeout 20 /var/jb/usr/libexec/ellekit/loader 2>&1
          loader_code=$?
          echo "loader_exit=$loader_code"

          echo '=== POST-LOADER STATE ==='
          sleep 5
          ps -axo user,pid,ppid,command 2>/dev/null | grep -E '[l]aunchd|[b]ackboardd|[S]pringBoard' || true
          echo '=== RECENT CRASHES ==='
          find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' -o -name 'launchd-*.ips' \) -mmin -30 -print 2>/dev/null
          SH
          chmod +x inspect-injection-policy.sh
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null inspect-injection-policy.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/inspect-injection-policy.sh' 2>&1 | tee injection-policy-diagnostic.txt
      - name: Publish sanitized diagnostic
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('injection-policy-diagnostic.txt').read_text(errors='replace') if Path('injection-policy-diagnostic.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['iPad Tweak Injection Policy Diagnostic',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"collect={os.environ.get('COLLECT_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-1200:]]
          Path('remote/ipad-tweak-injection-policy.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/ipad-tweak-injection-policy.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record iPad tweak injection policy diagnostic [skip ci]"
            git push origin HEAD:main
          fi
