name: Diagnose iPad Tweak Injection Policy

on:
  push:
    branches: [main]
    paths:
      - triggers/diagnose-tweak-injection-policy.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  diagnose:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Verify explicit TweakLoader path safely
        id: collect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 48); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then connected=1; break; fi
            sleep 5
          done
          test "$connected" -eq 1
          cat > verify-loader.sh <<'SH'
          #!/bin/sh
          set -eu
          media='/var/mobile/Library/Application Support/Gif2Ani'
          prefs='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          runtime="$media/runtime-status.plist"
          marker='/var/mobile/Media/explicit-loader-test-start.marker'

          mkdir -p "$media"
          rm -f "$media/Pending.gif" "$media/Active.gif" "$media/Rejected.gif" "$media/load-in-progress" "$media/pending-metadata.plist"
          cat > "$prefs" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>isEnabled</key><false/>
          <key>pendingReady</key><false/>
          <key>imageTransformation</key><string>resizeAspect</string>
          <key>customLoop</key><real>-1</real>
          <key>customDuration</key><real>-1</real>
          <key>backgroundColor</key><string>#000000</string>
          </dict></plist>
          PLIST
          chown -R mobile:mobile "$media" "$prefs"
          chmod 0755 "$media"
          chmod 0644 "$prefs"

          echo '=== PRECHECK ==='
          echo "launchctl_path=$(/var/jb/usr/bin/launchctl getenv JB_TWEAKLOADER_PATH 2>/dev/null || true)"
          echo "backboardd_before=$(ps ax | awk '/[b]ackboardd/{print $1; exit}')"
          echo "springboard_before=$(ps ax | awk '/[S]pringBoard/{print $1; exit}')"
          if [ -f "$runtime" ]; then cat "$runtime"; else echo runtime_before=missing; fi

          touch "$marker"
          /var/jb/usr/bin/launchctl setenv JB_TWEAKLOADER_PATH /var/jb/usr/lib/TweakLoader.dylib
          rm -f "$runtime"
          echo "explicit_path=$(/var/jb/usr/bin/launchctl getenv JB_TWEAKLOADER_PATH 2>/dev/null || true)"
          killall -9 backboardd SpringBoard 2>/dev/null || true
          sleep 15

          echo '=== POSTCHECK ==='
          echo "backboardd_after=$(ps ax | awk '/[b]ackboardd/{print $1; exit}')"
          echo "springboard_after=$(ps ax | awk '/[S]pringBoard/{print $1; exit}')"
          bb=$(ps ax | awk '/[b]ackboardd/{print $1; exit}')
          [ -n "$bb" ] && ps eww -p "$bb" 2>/dev/null || true
          if [ -f "$runtime" ]; then cat "$runtime"; else echo runtime_after=missing; fi
          test ! -e "$media/Pending.gif"
          test ! -e "$media/Active.gif"
          test ! -e "$media/Rejected.gif"
          crashes=$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' \) -newer "$marker" -print 2>/dev/null | wc -l | tr -d ' ')
          echo "new_crash_reports=$crashes"
          if [ -f "$runtime" ] && grep -a -q 'tweak-loaded-no-media-decode' "$runtime"; then
            echo result=explicit_path_injection_success
            test "$crashes" = 0
          else
            echo result=explicit_path_injection_failed
            exit 1
          fi
          SH
          chmod +x verify-loader.sh
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null verify-loader.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=60 -o ServerAliveInterval=5 -o ServerAliveCountMax=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/verify-loader.sh' 2>&1 | tee explicit-loader-registered-test.txt
          code=${PIPESTATUS[1]}
          set -e
          echo "remote_exit=$code" | tee -a explicit-loader-registered-test.txt
          exit "$code"
      - name: Publish diagnostic
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('explicit-loader-registered-test.txt').read_text(errors='replace') if Path('explicit-loader-registered-test.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['Registered Explicit TweakLoader Test',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"collect={os.environ.get('COLLECT_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-400:]]
          Path('remote/registered-explicit-tweakloader-test.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/registered-explicit-tweakloader-test.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record registered explicit TweakLoader test [skip ci]"
            git push origin HEAD:main
          fi
