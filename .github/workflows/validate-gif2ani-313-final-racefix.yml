name: Validate Gif2Ani 3.1.3 Final Race Fix

on:
  push:
    branches: [main]
    paths:
      - triggers/validate-gif2ani-313-final-racefix.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"
  ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-75c0-81fd-b287-8e90a2e8288f/raw?se=2026-07-25T19:55:16Z&sp=r&sv=2026-02-06&sr=b&scid=43911bfe-9e25-51f6-9e3c-278ab0afa28e&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-25T09:53:32Z&ske=2026-07-27T09:53:32Z&sks=b&skv=2026-02-06&sig=ncN%2BgeJphOI1yU6TgMPWhopl7w4dLg1U0HqkDgzRDLQ%3D"
  DEB_SHA256: "56be3e0656ab6770dd3f352ddcd6fb308a887bded980ee818e8e6fe46b6e5281"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1)) == target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  validate:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate final DEB
        id: package
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$ARTIFACT_URL" -o final-artifact.zip
          unzip -q final-artifact.zip -d final-artifact
          DEB="$(find final-artifact -maxdepth 1 -type f -name '*.deb' | head -n1)"
          test -n "$DEB"
          echo "$DEB_SHA256  $DEB" | sha256sum -c -
          test "$(dpkg-deb --field "$DEB" Package)" = "com.nightvibes33.gif2ani"
          test "$(dpkg-deb --field "$DEB" Version)" = "3.1.3"
          cp "$DEB" Gif2Ani-3.1.3-racefix.deb
          sha256sum Gif2Ani-3.1.3-racefix.deb | tee final-deb-sha.txt

      - name: Generate 84-frame bounded test GIF
        id: generate
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil openssh-client sshpass
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          width,height=320,240
          frames=[]
          for i in range(84):
              image=Image.new('RGB',(width,height),(3,4,10))
              draw=ImageDraw.Draw(image)
              x=20+int((width-40)*(i/83))
              radius=18+(i%12)
              draw.ellipse((x-radius,height//2-radius,x+radius,height//2+radius),
                           fill=(35+(i*3)%180,80+(i*5)%160,220),
                           outline=(190,220,255),width=3)
              draw.rectangle((0,height-16,int(width*(i+1)/84),height),fill=(90,120,255))
              frames.append(image.convert('P',palette=Image.ADAPTIVE,colors=128))
          frames[0].save('Gif2Ani-84-frame-racefix.gif',save_all=True,
                         append_images=frames[1:],duration=55,loop=0,
                         optimize=True,disposal=2)
          PY
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('Gif2Ani-84-frame-racefix.gif')
          count=0
          try:
              while True:
                  count += 1
                  im.seek(im.tell()+1)
          except EOFError:
              pass
          print(f'frames={count} size={im.size[0]}x{im.size[1]}')
          assert count == 84
          assert im.size == (320,240)
          PY
          test "$(stat -c %s Gif2Ani-84-frame-racefix.gif)" -lt 1048576
          sha256sum Gif2Ani-84-frame-racefix.gif | tee test-gif-sha.txt

      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install and physically validate final race fix
        id: physical
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 60); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              mobile@"$IPAD_HOST" true >/dev/null 2>&1; then
              connected=1
              break
            fi
            sleep 5
          done
          echo "connected=$connected" | tee final-racefix-validation.txt
          test "$connected" -eq 1

          sshpass -e scp -P 22 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            Gif2Ani-3.1.3-racefix.deb Gif2Ani-84-frame-racefix.gif \
            scripts/validate-gif2ani-313-racefix.sh \
            mobile@"$IPAD_HOST":/var/mobile/Media/

          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=90 -o ServerAliveInterval=8 -o ServerAliveCountMax=8 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh /var/mobile/Media/validate-gif2ani-313-racefix.sh' \
            2>&1 | tee -a final-racefix-validation.txt
          code=${PIPESTATUS[1]}
          set -e
          echo "physical_exit=$code" | tee -a final-racefix-validation.txt
          exit "$code"

      - name: Verify final cleanup state
        id: final
        if: always()
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 48); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              mobile@"$IPAD_HOST" true >/dev/null 2>&1; then
              connected=1
              break
            fi
            sleep 5
          done
          echo "final_connected=$connected" | tee -a final-racefix-validation.txt
          test "$connected" -eq 1
          cat > final-state-check.sh <<'SH'
          #!/bin/sh
          set -eu
          media='/var/mobile/Library/Application Support/Gif2Ani'
          prefs='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          version=$(dpkg-query -W -f='${Version}' com.nightvibes33.gif2ani)
          echo "final_version=$version"
          test "$version" = '3.1.3'
          cat "$prefs"
          grep -a -q '<key>isEnabled</key><false/>' "$prefs"
          for f in Pending.gif Active.gif Rejected.gif load-in-progress pending-metadata.plist; do
            if [ -e "$media/$f" ]; then echo "$f=present"; exit 1; else echo "$f=absent"; fi
          done
          bb=$(ps ax | awk '$5=="/usr/libexec/backboardd" {print $1; exit}')
          echo "final_backboardd=$bb"
          test -n "$bb"
          ps eww -p "$bb" | grep -q 'JB_PINFO_FLAGS=0x4c00082'
          cat "$media/runtime-status.plist" 2>/dev/null || true
          echo final_state=gif2ani_3.1.3_cached_layer_installed_disabled_no_media
          SH
          chmod +x final-state-check.sh
          sshpass -e scp -P 22 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            final-state-check.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=60 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/final-state-check.sh' \
            2>&1 | tee -a final-racefix-validation.txt

      - name: Publish final validation report
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          PHYSICAL_OUTCOME: ${{ steps.physical.outcome }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('final-racefix-validation.txt').read_text(errors='replace') if Path('final-racefix-validation.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=[
              'Gif2Ani 3.1.3 Final Cached-Layer Physical Validation',
              f"run_id={os.environ.get('GITHUB_RUN_ID','')}",
              f"package={os.environ.get('PACKAGE_OUTCOME','')}",
              f"generate={os.environ.get('GENERATE_OUTCOME','')}",
              f"physical={os.environ.get('PHYSICAL_OUTCOME','')}",
              f"final={os.environ.get('FINAL_OUTCOME','')}",
              '', '--- sanitized output ---', *text.splitlines()[-1200:]
          ]
          Path('/tmp/gif2ani-313-final-racefix-validation.txt').write_text('\n'.join(out)+'\n')
          PY
          for attempt in 1 2 3 4 5; do
            git reset --hard HEAD
            git pull --rebase origin main
            mkdir -p remote
            cp /tmp/gif2ani-313-final-racefix-validation.txt remote/gif2ani-313-final-racefix-validation.txt
            git add remote/gif2ani-313-final-racefix-validation.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Gif2Ani 3.1.3 final race-fix validation [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
