name: Build Install Hidden

on:
  workflow_dispatch:
  push:
    branches: [hidden-system-v1]
    paths:
      - 'Hidden/**'
      - '.github/workflows/hidden-build-install.yml'

permissions:
  contents: write

env:
  IPAD_HOST: '100.116.117.65'

concurrency:
  group: hidden-system-v1-device
  cancel-in-progress: true

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: '18728387881'
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          target = int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments', []):
              if int(env.get('id', -1)) == target:
                  print('environment_name=' + env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  build-install:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hidden-system-v1

      - name: Tune scanner for older devices
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Hidden/Sources/main.m')
          s = p.read_text()
          replacements = {
              'const NSUInteger slice = 8U * 1024U * 1024U;': 'const NSUInteger slice = 1U * 1024U * 1024U;',
              'if (size == 0 || size > (160ULL * 1024ULL * 1024ULL)) return;': 'if (size == 0 || size > (96ULL * 1024ULL * 1024ULL)) return;',
              'if (resourceCount >= 32) break;': 'if (resourceCount >= 16) break;',
              'if (++appCount >= 28) break;': 'if (++appCount >= 20) break;',
              'if (++fwCount >= 90) break;': 'if (++fwCount >= 48) break;',
              'if (++prefCount >= 180) break;': 'if (++prefCount >= 100) break;',
              'dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0)': 'dispatch_get_global_queue(QOS_CLASS_UTILITY, 0)',
              '*emitted < 100': '*emitted < 60',
              'emitted < 100': 'emitted < 60',
          }
          changed = []
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed.append(old)
          p.write_text(s)
          print('scanner_tuning_replacements=' + str(len(changed)))
          required = [
              'const NSUInteger slice = 1U * 1024U * 1024U;',
              'if (++fwCount >= 48) break;',
              'QOS_CLASS_UTILITY',
              'latest-scan.json',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('scanner tuning verification failed: ' + repr(missing))
          PY

      - name: Install Theos
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash curl sudo build-essential fakeroot rsync perl git libxml2 dpkg-dev unzip xz-utils ca-certificates python3 file openssh-client sshpass
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Build rootless package
        id: build
        env:
          THEOS: /opt/theos
        run: |
          set -uo pipefail
          : > hidden-validation.log
          cd Hidden
          set +e
          make clean package FINALPACKAGE=1 2>&1 | tee ../hidden-build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          echo "build_rc=$BUILD_RC" | tee -a ../hidden-validation.log
          [ "$BUILD_RC" -eq 0 ] || exit "$BUILD_RC"
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n1)"
          [ -n "$DEB" ] || { echo 'validation_fail=no_deb_found' | tee -a ../hidden-validation.log; exit 1; }
          cp "$DEB" ../Hidden-0.1.0-rootless.deb
          cd ..
          PKG_NAME="$(dpkg-deb --field Hidden-0.1.0-rootless.deb Package || true)"
          PKG_VERSION="$(dpkg-deb --field Hidden-0.1.0-rootless.deb Version || true)"
          PKG_ARCH="$(dpkg-deb --field Hidden-0.1.0-rootless.deb Architecture || true)"
          echo "package_name=$PKG_NAME" | tee -a hidden-validation.log
          echo "package_version=$PKG_VERSION" | tee -a hidden-validation.log
          echo "package_arch=$PKG_ARCH" | tee -a hidden-validation.log
          [ "$PKG_NAME" = 'com.nightvibes.hidden' ] || exit 1
          case "$PKG_VERSION" in 0.1.0|0.1.0-*) ;; *) exit 1 ;; esac
          rm -rf hidden-deb-root
          dpkg-deb -x Hidden-0.1.0-rootless.deb hidden-deb-root
          APP_BIN="$(find hidden-deb-root -type f -path '*/Applications/Hidden.app/Hidden' | head -n1)"
          [ -n "$APP_BIN" ] && [ -x "$APP_BIN" ] || exit 1
          file "$APP_BIN" | tee -a hidden-validation.log
          grep -F -q '/System/Library/PrivateFrameworks' Hidden/Sources/main.m
          grep -F -q 'PreferenceManifestsInternal' Hidden/Sources/main.m
          grep -F -q 'latest-scan.json' Hidden/Sources/main.m
          grep -F -q 'QOS_CLASS_UTILITY' Hidden/Sources/main.m
          sha256sum Hidden-0.1.0-rootless.deb | tee hidden-deb-sha256.txt | tee -a hidden-validation.log
          echo 'package_validation=success' | tee -a hidden-validation.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hidden-0.1.0-rootless
          path: |
            Hidden-0.1.0-rootless.deb
            hidden-build.log
            hidden-validation.log
            hidden-deb-sha256.txt
          if-no-files-found: error

      - uses: tailscale/github-action@v4
        if: success()
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Recover, install, scan, and prove on iPad
        id: device
        if: success()
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_OPTS='-p 22 -o ConnectTimeout=8 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          REPORT='/var/mobile/Library/Hidden/latest-scan.json'
          : > hidden-device-proof.txt

          echo 'checkpoint=wait_for_device_recovery' | tee -a hidden-device-proof.txt
          connected=0
          for attempt in $(seq 1 180); do
            if sshpass -e ssh $SSH_OPTS mobile@"$IPAD_HOST" true >/dev/null 2>&1; then
              connected=1
              echo "recovery_connect_attempt=$attempt" | tee -a hidden-device-proof.txt
              break
            fi
            if [ $((attempt % 12)) -eq 0 ]; then echo "recovery_wait_attempt=$attempt" | tee -a hidden-device-proof.txt; fi
            sleep 5
          done
          [ "$connected" -eq 1 ] || { echo 'HIDDEN_DEVICE_FAIL=device_never_recovered' | tee -a hidden-device-proof.txt; exit 1; }

          echo 'checkpoint=kill_old_scan' | tee -a hidden-device-proof.txt
          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh $SSH_OPTS mobile@"$IPAD_HOST" 'sudo -S -p "" killall -9 Hidden 2>/dev/null || true' >/dev/null 2>&1
          set -e
          sleep 3

          sshpass -e scp -P 22 -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null Hidden-0.1.0-rootless.deb mobile@"$IPAD_HOST":/var/mobile/Media/Hidden-0.1.0-rootless.deb
          cat > /tmp/install-hidden.sh <<'SH'
          #!/bin/sh
          set -u
          export PATH="/var/jb/usr/bin:/var/jb/usr/sbin:/usr/bin:/usr/sbin:/bin:/sbin:$PATH"
          REPORT='/var/mobile/Library/Hidden/latest-scan.json'
          fail() { echo "HIDDEN_DEVICE_FAIL=$1"; exit 1; }
          dpkg -i /var/mobile/Media/Hidden-0.1.0-rootless.deb || fail dpkg_install
          VERSION="$(dpkg-query -W -f='${Version}' com.nightvibes.hidden 2>/dev/null)"
          echo "installed_version=$VERSION"
          test -x /var/jb/Applications/Hidden.app/Hidden || fail binary_missing
          /var/jb/usr/bin/uicache -p /var/jb/Applications/Hidden.app >/dev/null 2>&1 || /var/jb/usr/bin/uicache -a >/dev/null 2>&1 || fail uicache
          killall -9 Hidden 2>/dev/null || true
          rm -f "$REPORT"
          mkdir -p /var/mobile/Library/Hidden || fail report_directory
          chown mobile:mobile /var/mobile/Library/Hidden 2>/dev/null || true
          sudo -u mobile uiopen 'hidden://' >/dev/null 2>&1 || fail uiopen
          i=0
          while [ "$i" -lt 20 ]; do
            PID="$(ps ax 2>/dev/null | awk '/[H]idden.app\/Hidden/{print $1; exit}')"
            if [ -n "$PID" ]; then
              echo "hidden_pid=$PID"
              echo 'package_payload=pass'
              echo 'homescreen_launch=pass'
              exit 0
            fi
            i=$((i + 1)); sleep 1
          done
          fail launch
          SH
          chmod +x /tmp/install-hidden.sh
          sshpass -e scp -P 22 -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/install-hidden.sh mobile@"$IPAD_HOST":/var/mobile/Media/install-hidden.sh
          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh $SSH_OPTS mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/install-hidden.sh' 2>&1 | tee -a hidden-device-proof.txt
          LAUNCH_RC=${PIPESTATUS[1]}
          set -e
          [ "$LAUNCH_RC" -eq 0 ] || exit "$LAUNCH_RC"

          echo 'checkpoint=scan_poll' | tee -a hidden-device-proof.txt
          scan_ready=0
          for attempt in $(seq 1 120); do
            set +e
            STATE="$(sshpass -e ssh $SSH_OPTS mobile@"$IPAD_HOST" "if [ -s '$REPORT' ] && grep -q '\"totalFindings\"' '$REPORT' 2>/dev/null; then echo READY; elif ps ax 2>/dev/null | grep '[H]idden.app/Hidden' >/dev/null; then echo RUNNING; else echo EXITED; fi" 2>/dev/null)"
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              STATE='SSH_BUSY'
            fi
            if [ $((attempt % 6)) -eq 0 ] || [ "$STATE" != 'RUNNING' ]; then echo "scan_poll_${attempt}=$STATE" | tee -a hidden-device-proof.txt; fi
            case "$STATE" in
              READY) scan_ready=1; break ;;
              EXITED) echo 'HIDDEN_DEVICE_FAIL=scan_process_exited' | tee -a hidden-device-proof.txt; exit 1 ;;
            esac
            sleep 5
          done
          [ "$scan_ready" -eq 1 ] || { echo 'HIDDEN_DEVICE_FAIL=scan_report_timeout' | tee -a hidden-device-proof.txt; exit 1; }

          copied=0
          for attempt in $(seq 1 10); do
            if sshpass -e scp -P 22 -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST":"$REPORT" hidden-device-scan.json 2>/dev/null; then copied=1; break; fi
            sleep 3
          done
          [ "$copied" -eq 1 ] || { echo 'HIDDEN_DEVICE_FAIL=report_copy' | tee -a hidden-device-proof.txt; exit 1; }

          python3 - <<'PY' | tee -a hidden-device-proof.txt
          import json
          report = json.load(open('hidden-device-scan.json', encoding='utf-8'))
          total = int(report.get('totalFindings', 0) or 0)
          reported = int(report.get('reportedFindings', 0) or 0)
          schema = int(report.get('schema', 0) or 0)
          if schema < 3 or total <= 0 or reported <= 0:
              raise SystemExit('HIDDEN_DEVICE_FAIL=invalid_or_empty_report')
          print('scan_schema=' + str(schema))
          print('scan_total_findings=' + str(total))
          print('scan_reported_findings=' + str(reported))
          print('scan_elapsed_seconds=' + str(report.get('elapsedSeconds', 'unknown')))
          print('scan_os=' + str(report.get('os', 'unknown')).replace('\n', ' '))
          cats = report.get('categoryCounts', {})
          print('scan_category_counts=' + json.dumps(cats, sort_keys=True, separators=(',', ':')))
          print('scan_top_targets=' + ', '.join(report.get('topTargets', [])[:15]))
          for idx, item in enumerate(report.get('findings', [])[:20], 1):
              def clean(v): return str(v).replace('\n',' ').replace('\r',' ').replace('|','/').strip()[:240]
              print('finding_%02d=score:%s | %s | %s | %s | %s' % (idx, clean(item.get('score','')), clean(item.get('target','')), clean(item.get('category','')), clean(item.get('evidence','')), clean(item.get('path',''))))
          print('system_scan_report=pass')
          print('device_proof=success')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hidden-device-proof
          path: |
            Hidden-0.1.0-rootless.deb
            hidden-device-proof.txt
            hidden-device-scan.json
            hidden-build.log
            hidden-validation.log
          if-no-files-found: ignore

      - name: Publish branch status and tuned scanner
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
        run: |
          set -euo pipefail
          {
            echo '# Hidden Build / Device Status'
            echo
            echo "- Run: ${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Build step: ${BUILD_OUTCOME}"
            echo "- Device step: ${DEVICE_OUTCOME}"
            echo
            echo '## Device proof and scan summary'
            echo '```text'
            cat hidden-device-proof.txt 2>/dev/null || echo 'No device proof produced.'
            echo '```'
            echo
            echo '## Validation log'
            echo '```text'
            tail -n 180 hidden-validation.log 2>/dev/null || echo 'No validation log produced.'
            echo '```'
            echo
            echo '## Build log tail'
            echo '```text'
            tail -n 180 hidden-build.log 2>/dev/null || echo 'No build log produced.'
            echo '```'
          } > Hidden/DEVICE_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Hidden/DEVICE_STATUS.md Hidden/Sources/main.m
          if ! git diff --cached --quiet; then
            git commit -m 'Record Hidden tuned build and iPad proof [skip ci]'
            git push origin HEAD:hidden-system-v1
          fi
