name: Build Install Hidden

on:
  workflow_dispatch:
  push:
    branches: [hidden-system-v1]
    paths:
      - 'Hidden/**'
      - '.github/workflows/hidden-build-install.yml'

permissions:
  contents: write

env:
  IPAD_HOST: '100.116.117.65'

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: '18728387881'
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          target = int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments', []):
              if int(env.get('id', -1)) == target:
                  print('environment_name=' + env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  build-install:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hidden-system-v1

      - name: Install Theos
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash curl sudo build-essential fakeroot rsync perl git libxml2 dpkg-dev unzip xz-utils ca-certificates python3 file openssh-client sshpass
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Build rootless package
        id: build
        env:
          THEOS: /opt/theos
        run: |
          set -uo pipefail
          : > hidden-validation.log
          cd Hidden
          set +e
          make clean package FINALPACKAGE=1 2>&1 | tee ../hidden-build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          echo "build_rc=$BUILD_RC" | tee -a ../hidden-validation.log
          [ "$BUILD_RC" -eq 0 ] || exit "$BUILD_RC"

          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n1)"
          if [ -z "$DEB" ]; then
            echo 'validation_fail=no_deb_found' | tee -a ../hidden-validation.log
            exit 1
          fi
          echo "built_deb=$DEB" | tee -a ../hidden-validation.log
          cp "$DEB" ../Hidden-0.1.0-rootless.deb
          cd ..

          PKG_NAME="$(dpkg-deb --field Hidden-0.1.0-rootless.deb Package || true)"
          PKG_VERSION="$(dpkg-deb --field Hidden-0.1.0-rootless.deb Version || true)"
          PKG_ARCH="$(dpkg-deb --field Hidden-0.1.0-rootless.deb Architecture || true)"
          {
            echo "package_name=$PKG_NAME"
            echo "package_version=$PKG_VERSION"
            echo "package_arch=$PKG_ARCH"
            echo 'package_contents_begin'
            dpkg-deb -c Hidden-0.1.0-rootless.deb
            echo 'package_contents_end'
          } | tee -a hidden-validation.log

          if [ "$PKG_NAME" != 'com.nightvibes.hidden' ]; then
            echo "validation_fail=package_name:$PKG_NAME" | tee -a hidden-validation.log
            exit 1
          fi
          case "$PKG_VERSION" in
            0.1.0|0.1.0-*) ;;
            *) echo "validation_fail=package_version:$PKG_VERSION" | tee -a hidden-validation.log; exit 1 ;;
          esac

          rm -rf hidden-deb-root
          dpkg-deb -x Hidden-0.1.0-rootless.deb hidden-deb-root
          echo 'extracted_files_begin' | tee -a hidden-validation.log
          find hidden-deb-root -maxdepth 7 -type f -print | sort | tee -a hidden-validation.log
          echo 'extracted_files_end' | tee -a hidden-validation.log

          APP_BIN="$(find hidden-deb-root -type f -path '*/Applications/Hidden.app/Hidden' | head -n1)"
          if [ -z "$APP_BIN" ]; then
            echo 'validation_fail=app_binary_missing' | tee -a hidden-validation.log
            exit 1
          fi
          APP_DIR="$(dirname "$APP_BIN")"
          echo "validated_app_binary=$APP_BIN" | tee -a hidden-validation.log
          file "$APP_BIN" | tee -a hidden-validation.log
          if [ ! -x "$APP_BIN" ]; then
            echo 'validation_fail=app_binary_not_executable' | tee -a hidden-validation.log
            exit 1
          fi
          if [ ! -f "$APP_DIR/Info.plist" ]; then
            echo "validation_fail=info_plist_missing:$APP_DIR/Info.plist" | tee -a hidden-validation.log
            exit 1
          fi

          if grep -a -F -q '/System/Library/PrivateFrameworks' "$APP_BIN"; then
            echo 'signature_ok=/System/Library/PrivateFrameworks' | tee -a hidden-validation.log
          else
            echo 'validation_fail=core_scanner_signature_missing' | tee -a hidden-validation.log
            exit 1
          fi

          for SIG in 'PreferenceManifestsInternal' 'Scanning PrivateFrameworks'; do
            if grep -a -F -q "$SIG" "$APP_BIN"; then
              echo "signature_ok=$SIG" | tee -a hidden-validation.log
            else
              echo "signature_note=not_present_in_final_binary:$SIG" | tee -a hidden-validation.log
            fi
          done

          grep -F -q '/System/Library/PrivateFrameworks' Hidden/Sources/main.m || { echo 'validation_fail=source_privateframeworks_missing' | tee -a hidden-validation.log; exit 1; }
          grep -F -q 'PreferenceManifestsInternal' Hidden/Sources/main.m || { echo 'validation_fail=source_preference_manifest_missing' | tee -a hidden-validation.log; exit 1; }
          grep -F -q 'latest-scan.json' Hidden/Sources/main.m || { echo 'validation_fail=source_report_missing' | tee -a hidden-validation.log; exit 1; }
          echo 'source_scanner_targets=pass' | tee -a hidden-validation.log

          sha256sum Hidden-0.1.0-rootless.deb | tee hidden-deb-sha256.txt | tee -a hidden-validation.log
          echo 'package_validation=success' | tee -a hidden-validation.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hidden-0.1.0-rootless
          path: |
            Hidden-0.1.0-rootless.deb
            hidden-build.log
            hidden-validation.log
            hidden-deb-sha256.txt
          if-no-files-found: error

      - uses: tailscale/github-action@v4
        if: success()
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install, scan, and prove on iPad
        id: device
        if: success()
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 30); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then connected=1; break; fi
            sleep 3
          done
          test "$connected" -eq 1
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null Hidden-0.1.0-rootless.deb mobile@"$IPAD_HOST":/var/mobile/Media/Hidden-0.1.0-rootless.deb
          cat > /tmp/install-hidden.sh <<'SH'
          #!/bin/sh
          set -u
          export PATH="/var/jb/usr/bin:/var/jb/usr/sbin:/usr/bin:/usr/sbin:/bin:/sbin:$PATH"
          REPORT='/var/mobile/Library/Hidden/latest-scan.json'
          fail() { echo "HIDDEN_DEVICE_FAIL=$1"; exit 1; }
          echo 'checkpoint=dpkg_install'
          dpkg -i /var/mobile/Media/Hidden-0.1.0-rootless.deb || fail dpkg_install
          VERSION="$(dpkg-query -W -f='${Version}' com.nightvibes.hidden 2>/dev/null)"
          echo "installed_version=$VERSION"
          case "$VERSION" in
            0.1.0|0.1.0-*) ;;
            *) fail version ;;
          esac
          test -x /var/jb/Applications/Hidden.app/Hidden || fail binary_missing
          test -f /var/jb/Applications/Hidden.app/Info.plist || fail plist_missing
          grep -a -F -q '/System/Library/PrivateFrameworks' /var/jb/Applications/Hidden.app/Hidden || fail scanner_signature
          /var/jb/usr/bin/uicache -p /var/jb/Applications/Hidden.app >/dev/null 2>&1 || /var/jb/usr/bin/uicache -a >/dev/null 2>&1 || fail uicache

          killall -9 Hidden 2>/dev/null || true
          rm -f "$REPORT"
          mkdir -p /var/mobile/Library/Hidden || fail report_directory
          chown mobile:mobile /var/mobile/Library/Hidden 2>/dev/null || true
          sudo -u mobile uiopen 'hidden://' >/dev/null 2>&1 || true

          app_ready=0
          i=0
          while [ "$i" -lt 20 ]; do
            if ps ax 2>/dev/null | grep '[H]idden.app/Hidden' >/dev/null; then app_ready=1; break; fi
            i=$((i + 1)); sleep 1
          done
          [ "$app_ready" -eq 1 ] || fail launch
          PID="$(ps ax 2>/dev/null | awk '/[H]idden.app\/Hidden/{print $1; exit}')"
          echo "hidden_pid=$PID"

          scan_ready=0
          i=0
          while [ "$i" -lt 240 ]; do
            if [ -s "$REPORT" ] && grep -q '"totalFindings"' "$REPORT" 2>/dev/null; then scan_ready=1; break; fi
            if ! ps ax 2>/dev/null | grep '[H]idden.app/Hidden' >/dev/null; then fail scan_process_exited; fi
            i=$((i + 1)); sleep 1
          done
          [ "$scan_ready" -eq 1 ] || fail scan_report_timeout
          REPORT_BYTES="$(wc -c < "$REPORT" | tr -d ' ')"
          echo "scan_report_bytes=$REPORT_BYTES"
          echo 'package_payload=pass'
          echo 'uicache=pass'
          echo 'homescreen_launch=pass'
          echo 'system_scan_report=pass'
          echo 'device_proof=success'
          SH
          chmod +x /tmp/install-hidden.sh
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/install-hidden.sh mobile@"$IPAD_HOST":/var/mobile/Media/install-hidden.sh
          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=300 -o ServerAliveInterval=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/install-hidden.sh' 2>&1 | tee hidden-device-proof.txt
          DEVICE_RC=${PIPESTATUS[1]}
          set -e

          if [ "$DEVICE_RC" -eq 0 ]; then
            sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST":/var/mobile/Library/Hidden/latest-scan.json hidden-device-scan.json
            python3 - <<'PY' | tee -a hidden-device-proof.txt
          import json
          with open('hidden-device-scan.json', 'r', encoding='utf-8') as f:
              report = json.load(f)
          print('scan_total_findings=' + str(report.get('totalFindings', 0)))
          print('scan_reported_findings=' + str(report.get('reportedFindings', 0)))
          print('scan_os=' + str(report.get('os', 'unknown')).replace('\n', ' '))
          cats = report.get('categoryCounts', {})
          print('scan_category_counts=' + json.dumps(cats, sort_keys=True, separators=(',', ':')))
          print('scan_top_targets=' + ', '.join(report.get('topTargets', [])[:15]))
          for idx, item in enumerate(report.get('findings', [])[:20], 1):
              def clean(v):
                  return str(v).replace('\n', ' ').replace('\r', ' ').replace('|', '/').strip()[:240]
              print('finding_%02d=score:%s | %s | %s | %s | %s' % (
                  idx, clean(item.get('score', '')), clean(item.get('target', '')),
                  clean(item.get('category', '')), clean(item.get('evidence', '')), clean(item.get('path', ''))))
          PY
          fi
          exit "$DEVICE_RC"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hidden-device-proof
          path: |
            hidden-device-proof.txt
            hidden-device-scan.json
            hidden-build.log
            hidden-validation.log
          if-no-files-found: ignore

      - name: Publish branch status
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
        run: |
          set -euo pipefail
          {
            echo '# Hidden Build / Device Status'
            echo
            echo "- Run: ${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Build step: ${BUILD_OUTCOME}"
            echo "- Device step: ${DEVICE_OUTCOME}"
            echo
            echo '## Device proof and scan summary'
            echo '```text'
            cat hidden-device-proof.txt 2>/dev/null || echo 'No device proof produced.'
            echo '```'
            echo
            echo '## Validation log'
            echo '```text'
            tail -n 260 hidden-validation.log 2>/dev/null || echo 'No validation log produced.'
            echo '```'
            echo
            echo '## Build log tail'
            echo '```text'
            tail -n 220 hidden-build.log 2>/dev/null || echo 'No build log produced.'
            echo '```'
          } > Hidden/DEVICE_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Hidden/DEVICE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record Hidden build and iPad proof [skip ci]'
            git push origin HEAD:hidden-system-v1
          fi
