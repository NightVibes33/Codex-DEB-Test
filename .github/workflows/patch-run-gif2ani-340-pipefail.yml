name: Patch and Run Gif2Ani 3.4 Functional Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/patch-run-gif2ani-340-pipefail.txt

permissions:
  contents: write

concurrency:
  group: gif2ani-340-functional-proof-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove redundant stripped-binary text assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-install-gif2ani-340-downloadable.yml')
          text = path.read_text()
          lines = text.splitlines()
          kept = []
          removed = []
          for line in lines:
              stripped = line.strip()
              is_bundle_text_check = (
                  ('Gif2AniPrefs' in stripped) and
                  ('grep -a' in stripped or 'strings ' in stripped) and
                  any(token in stripped for token in [
                      'Download & Preview',
                      'Cyan Pulse Rings',
                      'Legacy Source Catalog',
                      'userSettingsPreserved',
                      'method_exchangeImplementations'
                  ])
              )
              if is_bundle_text_check:
                  removed.append(stripped)
              else:
                  kept.append(line)
          if not removed:
              raise SystemExit('no redundant bundle string assertions were found')
          text = '\n'.join(kept) + '\n'
          required = [
              "assert 'Download & Preview' in preview",
              "assert 'userSettingsPreserved' in stage",
              "assert 'Cyan Pulse Rings' in remote",
              "assert '12 Offline + 54 Downloadable' in polish",
              "manifest['count'] == 54",
              "download_sha256",
              "active_gif_preserved=true",
              "preferences_preserved=true",
              "runtime_status_preserved=true",
              "new_crash_reports=$crashes"
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'functional proof requirement missing: {missing}')
          path.write_text(text)
          print(f'removed_redundant_binary_assertions={len(removed)}')
          for item in removed:
              print('removed=' + item)
          PY
          ! grep -E "Gif2AniPrefs.*(Download & Preview|Cyan Pulse Rings|Legacy Source Catalog|userSettingsPreserved|method_exchangeImplementations)" .github/workflows/build-install-gif2ani-340-downloadable.yml
          grep -q "assert 'Download & Preview' in preview" .github/workflows/build-install-gif2ani-340-downloadable.yml
          grep -q "manifest\['count'\] == 54" .github/workflows/build-install-gif2ani-340-downloadable.yml
          grep -q 'active_gif_preserved=true' .github/workflows/build-install-gif2ani-340-downloadable.yml
          printf 'build=%s\nversion=3.4.0\ndownloadable_builtins=54\nfix=functional-proof-no-stripped-string-assertions\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > triggers/build-install-gif2ani-340-downloadable.txt

      - name: Commit patch and trigger proof
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-install-gif2ani-340-downloadable.yml triggers/build-install-gif2ani-340-downloadable.txt
          if ! git diff --cached --quiet; then
            git commit -m "Use functional checks for Gif2Ani 3.4 final proof"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
