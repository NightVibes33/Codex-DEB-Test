name: Build AlleyCat iOS 16 IPA and DEB

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-alleycat-ios16.yml
      - darksword-overlay/**
      - jailbreak-lab/**

permissions:
  contents: read

concurrency:
  group: alleycat-ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_HTTP_MULTIPLEXING: "false"
      IOS_RUST_PROFILE: mobile-release
      RUSTC_WRAPPER: ""
      IOS_MIN: "16.1"
      SOURCE_ROOT: source/AlleyCat
      ARTIFACT_ROOT: artifacts

    steps:
      - name: Checkout patch and package files
        uses: actions/checkout@v4

      - name: Clone the real advanced AlleyCat source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source "$ARTIFACT_ROOT"
          git clone --depth 1 https://github.com/NightVibes33/litter.git "$SOURCE_ROOT"
          git -C "$SOURCE_ROOT" submodule sync --recursive
          git -C "$SOURCE_ROOT" submodule set-url \
            shared/third_party/codex https://github.com/NightVibes33/codex.git
          git -C "$SOURCE_ROOT" submodule update --init --recursive --depth 1 || \
            git -C "$SOURCE_ROOT" submodule update --init --recursive
          git -C "$SOURCE_ROOT" rev-parse HEAD | tee "$ARTIFACT_ROOT/alleycat-source-sha.txt"
          git -C "$SOURCE_ROOT/shared/third_party/codex" rev-parse HEAD \
            | tee "$ARTIFACT_ROOT/codex-source-sha.txt"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$ARTIFACT_ROOT/toolchain.log"
          xcrun --sdk iphoneos --show-sdk-version | tee -a "$ARTIFACT_ROOT/toolchain.log"
          brew install meson ninja xcodegen dpkg cmake pkgconf llvm autoconf automake libtool || true
          if ! command -v ldid >/dev/null 2>&1; then
            brew tap ProcursusTeam/Procursus || true
            brew install ldid || true
          fi
          rustup target add aarch64-apple-ios i686-unknown-linux-musl aarch64-unknown-linux-musl
          command -v xcodegen
          command -v dpkg-deb

      - name: Apply the small iOS 16 and rootless patch set
        shell: bash
        run: |
          set -euo pipefail
          chmod +x darksword-overlay/apply.sh
          ./darksword-overlay/apply.sh "$SOURCE_ROOT" 2>&1 | tee "$ARTIFACT_ROOT/patch.log"
          grep -q 'ContentView()' "$SOURCE_ROOT/apps/ios/Sources/Litter/LitterApp.swift"
          ! grep -q 'DarkSwordRootView()' "$SOURCE_ROOT/apps/ios/Sources/Litter/LitterApp.swift"
          grep -q 'AlleyCat Labs' "$SOURCE_ROOT/apps/ios/Sources/Litter/Views/SettingsView.swift"
          grep -q '<string>Alley Cãt</string>' "$SOURCE_ROOT/apps/ios/Sources/Litter/Info.plist"
          grep -q 'enum ChatWorkMode' "$SOURCE_ROOT/apps/ios/Sources/Litter/Models/AppState.swift"
          grep -q 'chatWorkSelector' "$SOURCE_ROOT/apps/ios/Sources/Litter/Views/HeaderView.swift"
          grep -q 'ChatWorkMode.work.rawValue' "$SOURCE_ROOT/apps/ios/Sources/Litter/Models/AppState.swift"
          grep -q 'darksword_host_runtime::is_available' \
            "$SOURCE_ROOT/shared/rust-bridge/codex-mobile-client/src/ish_runtime.rs"

      - name: Build AlleyCat runtime and Xcode project
        shell: bash
        run: |
          set -o pipefail
          make -C "$SOURCE_ROOT" \
            rust-ios-device-fast alpine-fs xcgen \
            IOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            2>&1 | tee "$ARTIFACT_ROOT/rust-and-project.log"

      - name: Build the full AlleyCat app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$ARTIFACT_ROOT/DerivedData"
          xcodebuild \
            -project "$SOURCE_ROOT/apps/ios/Litter.xcodeproj" \
            -scheme Litter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/$ARTIFACT_ROOT/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            LITTER_IOS_BUILD_MODE=full-sideload \
            LITTER_NYXIAN_PRIVATE_BUILD=1 \
            LITTER_PRESERVE_NYXIAN_LIVEPROCESS=1 \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$ARTIFACT_ROOT/xcodebuild.log"

      - name: Build rootless host daemon
        shell: bash
        run: |
          set -o pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min="$IOS_MIN" \
            -O2 -Wall -Wextra \
            darksword-overlay/rootd/main.c \
            -o "$ARTIFACT_ROOT/darksword-rootd" \
            2>&1 | tee "$ARTIFACT_ROOT/rootd-build.log"
          codesign --force --sign - "$ARTIFACT_ROOT/darksword-rootd"

      - name: Package AlleyCat IPA and rootless DEB
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$ARTIFACT_ROOT/DerivedData/Build/Products" -type d \
            \( -name 'AlleyCat.app' -o -name 'Litter.app' \) -print -quit)"
          test -n "$APP"

          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          if command -v ldid >/dev/null 2>&1; then
            while IFS= read -r binary; do ldid -S "$binary" || true; done < <(find "$APP" -type f -perm -111)
            ldid -S"$PWD/darksword-overlay/package/app-entitlements.plist" "$APP/$MAIN_EXECUTABLE"
            ldid -S "$ARTIFACT_ROOT/darksword-rootd"
          else
            codesign --force --deep --sign - "$APP"
          fi

          rm -rf "$ARTIFACT_ROOT/Payload"
          mkdir -p "$ARTIFACT_ROOT/Payload"
          cp -R "$APP" "$ARTIFACT_ROOT/Payload/AlleyCat.app"
          (cd "$ARTIFACT_ROOT" && zip -qry AlleyCat-iOS16-full-unsigned.ipa Payload)

          chmod +x darksword-overlay/package/build-deb.sh
          darksword-overlay/package/build-deb.sh \
            "$APP" \
            "$ARTIFACT_ROOT/darksword-rootd" \
            "$ARTIFACT_ROOT/com.nightvibes.alleycat_0.2.0_iphoneos-arm64.deb"

          dpkg-deb --contents "$ARTIFACT_ROOT/com.nightvibes.alleycat_0.2.0_iphoneos-arm64.deb" \
            | tee "$ARTIFACT_ROOT/deb-contents.log"
          grep -q 'var/jb/Applications/AlleyCat.app' "$ARTIFACT_ROOT/deb-contents.log"
          test -s "$ARTIFACT_ROOT/AlleyCat-iOS16-full-unsigned.ipa"

      - name: Upload IPA DEB and full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlleyCat-iOS16-full-build
          path: |
            artifacts/*.ipa
            artifacts/*.deb
            artifacts/*.log
            artifacts/*.txt
          if-no-files-found: warn
