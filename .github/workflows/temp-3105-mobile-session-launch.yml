name: Temp 3105 iOS15 mobile-session launch proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-3105-mobile-session-launch.yml"

permissions:
  contents: read

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.r.outputs.name }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          n="$(python3 - <<'PY'
          import json
          for e in json.load(open('/tmp/e.json')).get('environments',[]):
              if int(e.get('id',-1))==18728387881:
                  print(e['name'])
                  break
          PY
          )"
          test -n "$n"
          echo "name=$n" >> "$GITHUB_OUTPUT"

  prove:
    needs: env
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Prepare bridge
        run: |
          set -euo pipefail
          sudo install -d -m0755 /usr/share/keyrings
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tailscale openssh-client sshpass
          sudo systemctl enable --now tailscaled

      - name: Launch as mobile user and require stable PID
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          HOST: "100.96.37.124"
          BUNDLE: "com.nightvibes.app.threeoneosfive1"
        run: |
          set -euo pipefail
          sudo tailscale up --auth-key="$TAILSCALE_AUTHKEY" --hostname="gh-3105-mobile-${GITHUB_RUN_ID}" --accept-dns=false --accept-routes=false --reset
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ready=0
          for n in $(seq 1 18); do
            rm -f ~/.ssh/known_hosts
            if ssh-keyscan -T8 -H "$HOST" >~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              ready=1
              break
            fi
            sudo tailscale ping --timeout=5s --c 1 "$HOST" || true
            sleep 8
          done
          test "$ready" = 1
          chmod 600 ~/.ssh/known_hosts

          # Root-only prep: terminate stale copies, then leave SpringBoard launch to uid 501.
          printf '%s\nset +e\nexport PATH="/var/jb/usr/bin:/var/jb/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"\nkillall 3105 2>/dev/null || true\nexit 0\n' "$IPHONE_PASSWORD" \
            | sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" \
              'S="$(command -v sh||true)"; [ -n "$S" ] || S=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$S" -s'
          sleep 2

          # This shell intentionally stays mobile (uid 501), matching the SpringBoard user session.
          cat <<EOS | sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'sh -s' | tee /tmp/mobile-launch.log
          set +e
          export PATH="/var/jb/usr/bin:/var/jb/bin:/var/jb/usr/sbin:/var/jb/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:\$PATH"
          BUNDLE='$BUNDLE'
          echo "uid=\$(id -u 2>/dev/null)"
          echo "user=\$(id -un 2>/dev/null)"
          echo "device_time=\$(date 2>/dev/null)"
          echo '=== UICACHE INFO ==='
          /var/jb/usr/bin/uicache -i "\$BUNDLE" 2>&1 || true
          echo '=== UICACHE LIST ==='
          LINE="\$(/var/jb/usr/bin/uicache -l 2>&1 | grep -F "\$BUNDLE" | head -n 1)"
          echo "registration=\$LINE"
          APP="\${LINE#* : }"
          echo "registered_path=\$APP"
          [ -d "\$APP" ] && echo REGISTERED_PATH_EXISTS=1 || echo REGISTERED_PATH_EXISTS=0

          find_pid() {
            P="\$(pidof 3105 2>/dev/null || true)"
            set -- \$P
            [ -n "\${1:-}" ] && { echo "\$1"; return; }
            ps ax 2>/dev/null | while read pid rest; do
              case "\$rest" in *'/3105.app/3105'*) echo "\$pid"; break;; esac
            done
          }

          wait_pid() {
            n=0
            while [ "\$n" -lt 20 ]; do
              P="\$(find_pid)"
              [ -n "\$P" ] && { echo "\$P"; return 0; }
              n=\$((n+1))
              sleep 1
            done
            return 1
          }

          echo '=== MOBILE BUNDLE-ID LAUNCH ==='
          /var/jb/usr/bin/uiopen --bundleid "\$BUNDLE" 2>&1
          echo "uiopen_bundle_rc=\$?"
          PID="\$(wait_pid)"
          if [ -z "\$PID" ]; then
            echo BUNDLE_LAUNCH_NO_PID=1
            if [ -n "\$APP" ]; then
              echo '=== MOBILE PRIVATE-VAR PATH LAUNCH ==='
              /var/jb/usr/bin/uiopen --path "\$APP" 2>&1
              echo "uiopen_path_rc=\$?"
              PID="\$(wait_pid)"
            fi
          fi

          if [ -z "\$PID" ]; then
            echo NO_PROCESS_AFTER_MOBILE_SESSION_LAUNCH=1
            echo '=== LAUNCHCTL GUI 501 MATCHES ==='
            launchctl print gui/501 2>&1 | grep -Ei '3105|threeoneosfive|nightvibes' || true
            echo '=== PROCESS MATCHES ==='
            ps ax 2>/dev/null | while read pid rest; do case "\$pid \$rest" in *3105*|*threeoneosfive*|*nightvibes*) echo "PS_MATCH \$pid \$rest";; esac; done
            exit 54
          fi

          echo "launch_pid=\$PID"
          n=0
          while [ "\$n" -lt 18 ]; do
            kill -0 "\$PID" 2>/dev/null || { echo "PROCESS_DIED_CHECK=\$n"; exit 55; }
            n=\$((n+1))
            echo "ALIVE_\$n pid=\$PID"
            sleep 5
          done
          PID2="\$(find_pid)"
          echo "final_pid=\$PID2"
          [ "\$PID2" = "\$PID" ] || { echo "PID_CHANGED old=\$PID new=\$PID2"; exit 56; }
          echo alive_after_90_seconds=1
          echo "stable_pid=\$PID"
          echo RUNTIME_PROOF_SUCCESS=1
          EOS

          if grep -Fq RUNTIME_PROOF_SUCCESS=1 /tmp/mobile-launch.log; then
            exit 0
          fi

          # Failure-only privileged diagnostic pass.
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH="/var/jb/usr/bin:/var/jb/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          echo '=== ROOT FAILURE DIAGNOSTICS ==='
          echo 'uicache info:'
          /var/jb/usr/bin/uicache -i com.nightvibes.app.threeoneosfive1 2>&1 || true
          echo 'recent 3105 crash reports:'
          ls -lT /var/mobile/Library/Logs/CrashReporter/3105-*.ips 2>/dev/null || true
          echo 'launchservices registration:'
          /var/jb/usr/bin/uicache -l 2>&1 | grep -E '3105|threeoneosfive|nightvibes' || true
          if [ -x /usr/bin/log ]; then
            echo 'system logs:'
            /usr/bin/log show --last 4m --style compact --predicate 'process == "SpringBoard" OR process == "runningboardd" OR process == "lsd" OR process == "amfid"' 2>&1 \
              | grep -Ei '3105|threeoneosfive|nightvibes|launch|denied|invalid|entitlement|signature|F6556AA2' \
              | tail -n 400 || true
          fi
          EOS
          } | sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" \
            'S="$(command -v sh||true)"; [ -n "$S" ] || S=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$S" -s' | tee /tmp/root-diag.log
          exit 54

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3105-mobile-session-${{ github.run_id }}
          path: |
            /tmp/mobile-launch.log
            /tmp/root-diag.log
          if-no-files-found: warn
          retention-days: 3
