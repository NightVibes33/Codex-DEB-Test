name: iPhone Tailscale SSH Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "remote/iphone-command.sh"
      - "remote/rfmonctl.c"
      - ".github/workflows/iphone-tailscale-ssh.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: iphone-tailscale-ssh-circleapps-re
  cancel-in-progress: true

jobs:
  resolve-environment:
    name: Resolve secret environment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve environment ID
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            > environments.json
          environment_name="$({
            python3 - "$TARGET_ENVIRONMENT_ID" <<'PY'
          import json, sys
          target_id = int(sys.argv[1])
          with open("environments.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          for environment in payload.get("environments", []):
              if int(environment.get("id", -1)) == target_id:
                  print(environment["name"])
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          } || true)"
          if [ -z "$environment_name" ]; then
            echo "Could not resolve GitHub environment ID $TARGET_ENVIRONMENT_ID" >&2
            exit 1
          fi
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"

  build-rfmonctl:
    name: Build arm64 iOS rfmonctl
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/rfmonctl.c
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Cross-compile for iOS 15 arm64
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDKROOT=$SDKROOT"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -isysroot "$SDKROOT" \
            -O2 -Wall -Wextra \
            remote/rfmonctl.c \
            -o rfmonctl
          codesign --force --sign - rfmonctl
          file rfmonctl
          codesign -dv --verbose=2 rfmonctl 2>&1 | head -n 40 || true
          shasum -a 256 rfmonctl
      - name: Upload rfmonctl
        uses: actions/upload-artifact@v4
        with:
          name: rfmonctl-${{ github.run_id }}
          path: rfmonctl
          if-no-files-found: error
          retention-days: 7

      - name: Reverse-engineer official CircleApps15 crash sites
        shell: bash
        run: |
          set -euo pipefail
          URL='https://havoc.app/api/download/package/65b74908e8c64098dc0e2820/com.sugiuta.circleapps15_1.0.2_iphoneos-arm64.deb'
          EXPECTED='32a511faf26ee60e4d0b184d1428a72610519d79d5cc37a14bc9cd8475d66285'
          curl -fL --retry 3 "$URL" -o /tmp/circleapps.deb
          ACTUAL="$(shasum -a 256 /tmp/circleapps.deb | awk '{print $1}')"
          echo "official_deb_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p /tmp/circleapps
          cd /tmp/circleapps
          ar -x /tmp/circleapps.deb
          DATA="$(ls data.tar.* | head -n1)"
          tar -xf "$DATA"
          DY="$(find . -type f -name 'CircleAppsiPhone.dylib' | head -n1)"
          echo "circleapps_dylib=$DY"
          file "$DY"
          shasum -a 256 "$DY"
          echo '=== OTOOL_L ==='
          otool -L "$DY"
          echo '=== OBJC_METADATA_MATCHES ==='
          otool -ov "$DY" 2>/dev/null | grep -E -B3 -A12 'Circle|App|Launcher|Recent|Favorite|ViewController|insertObject|array' | head -n 800 || true
          echo '=== STRINGS_MATCHES ==='
          strings -a "$DY" | grep -Ei 'circle|favorite|recent|bundle|identifier|icon|launcher|array|index|insert|preference|gesture|viewDidLoad' | head -n 500 || true
          echo '=== CRASH_SITE_DISASSEMBLY ==='
          xcrun llvm-objdump --macho --disassemble --no-show-raw-insn "$DY" > /tmp/circleapps.disasm
          python3 - <<'PY'
          import re
          targets=[0x4db4,0x8e44,0x8ff0,0x9e70]
          lines=open('/tmp/circleapps.disasm',errors='replace').read().splitlines()
          addrs=[]
          for i,line in enumerate(lines):
              m=re.match(r'^([0-9a-fA-F]+):',line.strip())
              if m:
                  addrs.append((int(m.group(1),16),i))
          for t in targets:
              best=min(addrs,key=lambda x:abs(x[0]-t)) if addrs else None
              print(f'--- target=0x{t:x} nearest={best[0]:#x} line={best[1] if best else -1} ---')
              if best:
                  lo=max(0,best[1]-35); hi=min(len(lines),best[1]+50)
                  print('\n'.join(lines[lo:hi]))
          PY
          echo '=== SYMBOLS_NEAR_CRASH_SITES ==='
          nm -nm "$DY" 2>/dev/null | head -n 1200 || true

  run-command:
    name: Run command on iPhone
    needs: [resolve-environment, build-rfmonctl]
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/iphone-command.sh
            remote/iphone-bridge-status.txt
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Download rfmonctl
        uses: actions/download-artifact@v4
        with:
          name: rfmonctl-${{ github.run_id }}
          path: /tmp/rfmon-stage

      - name: Validate staged binary and secrets
        id: validate
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          : > validation-error.txt
          test -s /tmp/rfmon-stage/rfmonctl || echo "rfmonctl artifact missing" >> validation-error.txt
          [ -n "$TAILSCALE_AUTHKEY" ] || echo "Missing environment secret: TAILSCALE_AUTHKEY" >> validation-error.txt
          [ -n "$IPHONE_PASSWORD" ] || echo "Missing environment secret used for iPhone login: IPAD_PASSWORD" >> validation-error.txt
          if [ -s validation-error.txt ]; then
            cat validation-error.txt >&2
            exit 1
          fi
          chmod 755 /tmp/rfmon-stage/rfmonctl
          file /tmp/rfmon-stage/rfmonctl
          sha256sum /tmp/rfmon-stage/rfmonctl

      - name: Install Tailscale and SSH clients
        id: install_ssh
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl --fail --silent --show-error --retry 3 --connect-timeout 20 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
            | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl --fail --silent --show-error --retry 3 --connect-timeout 20 \
            https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
            | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tailscale openssh-client sshpass
          sudo systemctl enable --now tailscaled
          tailscale version

      - name: Join the Tailscale network with retries
        id: tailscale
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_HOST: 100.96.37.124
        run: |
          set -euo pipefail
          : > iphone-output.txt
          connected=0
          for attempt in 1 2 3; do
            echo "Tailscale connection attempt $attempt/3" | tee -a iphone-output.txt
            sudo tailscale logout >/dev/null 2>&1 || true
            sudo systemctl restart tailscaled
            sleep 3
            if sudo tailscale up \
              --auth-key="$TAILSCALE_AUTHKEY" \
              --hostname="github-iphone-${GITHUB_RUN_ID}-${attempt}" \
              --accept-dns=false \
              --accept-routes=false \
              --reset 2>&1 | tee -a iphone-output.txt; then
              sudo tailscale status 2>&1 | tee -a iphone-output.txt
              if sudo tailscale status | grep -Fq "$IPHONE_HOST"; then
                connected=1
                sudo tailscale ping --timeout=8s --c 1 "$IPHONE_HOST" 2>&1 | tee -a iphone-output.txt || \
                  echo 'tailscale_ping=advisory-timeout-continuing-to-ssh-port-check' | tee -a iphone-output.txt
                break
              fi
            fi
            sleep $((attempt * 8))
          done
          if [ "$connected" != 1 ]; then
            echo "iPhone node not visible over Tailscale" | tee -a iphone-output.txt >&2
            exit 1
          fi
          echo 'tailscale_iphone_node_visible=success' | tee -a iphone-output.txt

      - name: Stage rfmonctl and run iPhone command as root
        id: ssh
        shell: bash
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PORT: "22"
          IPHONE_USER: mobile
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          : > iphone-output.txt
          if [ ! -s remote/iphone-command.sh ]; then
            echo "remote/iphone-command.sh is missing or empty" | tee -a iphone-output.txt
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "Waking and checking iPhone SSH port over Tailscale..." | tee -a iphone-output.txt
          key_ready=0
          for attempt in $(seq 1 18); do
            echo "SSH port attempt $attempt/18" | tee -a iphone-output.txt
            rm -f "$HOME/.ssh/known_hosts"
            if ssh-keyscan -T 10 -H -p "$IPHONE_PORT" "$IPHONE_HOST" > "$HOME/.ssh/known_hosts" 2>>iphone-output.txt; then
              if [ -s "$HOME/.ssh/known_hosts" ]; then
                key_ready=1
                break
              fi
            fi
            sudo tailscale ping --timeout=5s --c 1 "$IPHONE_HOST" >>iphone-output.txt 2>&1 || true
            sleep 8
          done
          if [ "$key_ready" != 1 ]; then
            echo "Could not reach iPhone TCP port 22" | tee -a iphone-output.txt
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          echo 'iphone_ssh_port_ready=success' | tee -a iphone-output.txt

          RFMON_B64="$(base64 -w 0 /tmp/rfmon-stage/rfmonctl)"
          echo "Staging native rfmonctl and running probe as root..." | tee -a iphone-output.txt
          set +e
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            printf '%s\n' 'mkdir -p /var/jb/usr/local/bin'
            printf "printf '%%s' '%s' | base64 -d > /var/jb/usr/local/bin/rfmonctl\n" "$RFMON_B64"
            printf '%s\n' 'chmod 755 /var/jb/usr/local/bin/rfmonctl'
            cat remote/iphone-command.sh
          } | sshpass -e ssh \
                -p "$IPHONE_PORT" \
                -o BatchMode=no \
                -o ConnectTimeout=20 \
                -o ConnectionAttempts=2 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=2 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$IPHONE_USER@$IPHONE_HOST" \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee -a iphone-output.txt
          ssh_status=${PIPESTATUS[1]}
          set -e
          echo "ssh_exit_code=$ssh_status" | tee -a iphone-output.txt
          exit "$ssh_status"

      - name: Upload command output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-ssh-output-${{ github.run_id }}
          path: iphone-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish bridge status
        if: always()
        env:
          ENVIRONMENT_NAME: ${{ needs.resolve-environment.outputs.environment_name }}
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
          INSTALL_SSH_OUTCOME: ${{ steps.install_ssh.outcome }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          lines = [
              "iPhone Tailscale SSH Bridge",
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"run_url=https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              f"commit={os.environ.get('GITHUB_SHA', '')}",
              f"environment={os.environ.get('ENVIRONMENT_NAME', '')}",
              "target=100.96.37.124:22",
              f"validate={os.environ.get('VALIDATE_OUTCOME', '')}",
              f"tailscale={os.environ.get('TAILSCALE_OUTCOME', '')}",
              f"install_ssh={os.environ.get('INSTALL_SSH_OUTCOME', '')}",
              f"ssh={os.environ.get('SSH_OUTCOME', '')}",
              "",
              "--- sanitized SSH output ---",
          ]
          output = Path("iphone-output.txt")
          if output.exists():
              text = output.read_text(errors="replace")
              password = os.environ.get("IPHONE_PASSWORD", "")
              if password:
                  text = text.replace(password, "***REDACTED***")
              lines.extend(text.splitlines()[-260:])
          else:
              lines.append("No SSH output file was created.")
          Path("remote/iphone-bridge-status.txt").write_text("\n".join(lines) + "\n")
          PY
          git add remote/iphone-bridge-status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record iPhone SSH bridge status [skip ci]"
          git push origin HEAD:main
