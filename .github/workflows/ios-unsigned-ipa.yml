name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: full-sideload
        type: choice
        options:
          - full-sideload
          - fast-device
          - release-device
          - nyxian-private
  push:
    branches:
      - main
      - temp/darwin-vm-windows11
    paths:
      - upstream/litter/**
      - .github/workflows/ios-unsigned-ipa.yml

permissions:
  contents: write

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-ipa:
    name: Build unsigned sideload IPA
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_HTTP_MULTIPLEXING: "false"
      IOS_RUST_PROFILE: mobile-release
      IOS_MIN: "16.1"
      RUSTC_WRAPPER: ""
      SCCACHE_DISABLE: "1"
      SOURCE_ROOT: upstream/litter
      DERIVED_DATA_PATH: ${{ github.workspace }}/build/DerivedData
      RUSTY_V8_VERSION: "149.2.0"
      RUSTY_V8_ARCHIVE_NAME: librusty_v8_release_x86_64-apple-darwin.a.gz
      LITTER_IOS_BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'full-sideload' }}
      LITTER_NYXIAN_PRIVATE_BUILD: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'full-sideload' || inputs.build_mode == 'nyxian-private') && '1' || '0' }}
      LITTER_EMBED_PRIVATE_BUILDKIT_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'nyxian-private' && '1' || '0' }}
      LITTER_PRESERVE_NYXIAN_LIVEPROCESS: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'full-sideload' || inputs.build_mode == 'nyxian-private') && '1' || '0' }}
      LITTER_SKIP_ALLEYCAT_UPDATE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install Metal toolchain when absent
        run: |
          set -euo pipefail
          if ! xcrun --sdk iphoneos --find metal >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo xcodebuild -downloadComponent MetalToolchain; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                exit 1
              fi
              sleep $((attempt * 20))
            done
          fi
          xcrun --sdk iphoneos --find metal

      - name: Verify Alley Cat source
        working-directory: upstream/litter
        run: |
          set -euo pipefail
          tools/scripts/verify-nyxian-source-import.sh
          tools/scripts/verify-kittystore-integration.sh

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-ios-${{ runner.os }}-xcodegen-native-tools-v5

      - name: Install native build dependencies
        run: brew install meson ninja xcodegen

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,i686-unknown-linux-musl

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-cargo-registry-${{ runner.os }}-${{ hashFiles('upstream/litter/shared/rust-bridge/Cargo.lock', 'upstream/litter/ThirdParty/SideStore/minimuxer/Cargo.lock') }}
          restore-keys: |
            ios-cargo-registry-${{ runner.os }}-

      - name: Cache Zig package downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/darksword-zig-global
          key: alleycat-zig-global-${{ runner.os }}-${{ hashFiles('upstream/litter/shared/third_party/ghostty/build.zig.zon') }}
          restore-keys: |
            alleycat-zig-global-${{ runner.os }}-

      - name: Restore rusty_v8 archive cache
        id: rusty_v8_cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/.rusty_v8
          key: rusty-v8-${{ env.RUSTY_V8_VERSION }}-${{ runner.os }}-x86_64-apple-darwin
          restore-keys: |
            rusty-v8-${{ env.RUSTY_V8_VERSION }}-${{ runner.os }}-

      - name: Preload rusty_v8 archive
        id: rusty_v8
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cargo/.rusty_v8"
          ARCHIVE="$CACHE_DIR/$RUSTY_V8_ARCHIVE_NAME"
          URL="https://github.com/denoland/rusty_v8/releases/download/v${RUSTY_V8_VERSION}/${RUSTY_V8_ARCHIVE_NAME}"
          mkdir -p "$CACHE_DIR"
          if [[ ! -s "$ARCHIVE" ]]; then
            rm -f "$ARCHIVE.tmp"
            curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 \
              --connect-timeout 30 --max-time 1800 "$URL" -o "$ARCHIVE.tmp"
            test -s "$ARCHIVE.tmp"
            mv "$ARCHIVE.tmp" "$ARCHIVE"
          fi
          gzip -t "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Restore prebuilt Rust iOS device library
        id: rust_generated_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            upstream/litter/apps/ios/GeneratedRust
            upstream/litter/apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift
          key: ios-testflight-rust-generated-mobile-release-v1-${{ runner.os }}-${{ hashFiles('upstream/litter/apps/ios/scripts/build-rust.sh', 'upstream/litter/apps/ios/scripts/build-ghostty.sh', 'upstream/litter/apps/ios/scripts/sync-ghostty.sh', 'upstream/litter/apps/ios/scripts/sync-codex.sh', 'upstream/litter/shared/rust-bridge/Cargo.lock', 'upstream/litter/shared/rust-bridge/Cargo.toml', 'upstream/litter/shared/rust-bridge/codex-mobile-client/Cargo.toml', 'upstream/litter/shared/rust-bridge/codex-mobile-client/src/**', 'upstream/litter/shared/rust-bridge/codex-slingshot/Cargo.toml', 'upstream/litter/shared/rust-bridge/codex-slingshot/src/**', 'upstream/litter/patches/codex/**', 'upstream/litter/patches/ghostty/**', 'upstream/litter/shared/third_party/codex/**', 'upstream/litter/shared/third_party/ghostty/**') }}
          restore-keys: |
            ios-testflight-rust-generated-mobile-release-v1-${{ runner.os }}-

      - name: Validate generated Rust cache
        id: rust_generated_valid
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "$SOURCE_ROOT/apps/ios/GeneratedRust/ios-device/libcodex_mobile_client.a"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/ios-device/libghostty.a"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/Headers/ghostty.h"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/Headers/codex_mobile_clientFFI.h"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/Headers/codex_mobile_clientFFI.modulemap"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/Headers/module.modulemap"
            "$SOURCE_ROOT/apps/ios/GeneratedRust/.swift-bindings.hash"
            "$SOURCE_ROOT/apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift"
          )
          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "hit=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "hit=true" >> "$GITHUB_OUTPUT"

      - name: Restore Alpine filesystem cache
        uses: actions/cache@v4
        with:
          path: |
            upstream/litter/apps/ios/Resources/fs.tar.gz
            upstream/litter/apps/ios/Resources/fs.version
            upstream/litter/.build-stamps
          key: ios-alpine-fs-v1-${{ runner.os }}-${{ hashFiles('upstream/litter/Makefile', 'upstream/litter/apps/ios/scripts/download-alpine-fs.sh') }}
          restore-keys: |
            ios-alpine-fs-v1-${{ runner.os }}-

      - name: Build Alley Cat runtime
        working-directory: upstream/litter
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/logs"
          export GHOSTTY_ZIG_GLOBAL_CACHE_DIR="$HOME/.cache/darksword-zig-global"
          if [[ "${{ steps.rust_generated_valid.outputs.hit }}" == "true" ]]; then
            echo "Using cached AlleyCat GeneratedRust assets" | tee "$GITHUB_WORKSPACE/build/logs/runtime-build.log"
          else
            ./apps/ios/scripts/sync-codex.sh --preserve-current
            export RUSTY_V8_ARCHIVE="${{ steps.rusty_v8.outputs.archive }}"
            test -s "$RUSTY_V8_ARCHIVE"
            ./apps/ios/scripts/build-rust.sh --preserve-current --device-only 2>&1 | tee "$GITHUB_WORKSPACE/build/logs/runtime-build.log"
          fi
          make RUSTC_WRAPPER= SCCACHE_BUCKET= SCCACHE_ENDPOINT= AWS_ACCESS_KEY_ID= AWS_SECRET_ACCESS_KEY= \
            alpine-fs xcgen IOS_DEPLOYMENT_TARGET="$IOS_MIN"

      - name: Save generated Rust cache
        if: steps.rust_generated_valid.outputs.hit != 'true' && steps.rust_generated_cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            upstream/litter/apps/ios/GeneratedRust
            upstream/litter/apps/ios/Sources/Litter/Bridge/UniFFICodexClient.generated.swift
          key: ${{ steps.rust_generated_cache.outputs.cache-primary-key }}

      - name: Build unsigned Alley Cat app
        working-directory: upstream/litter
        run: |
          set -uo pipefail
          mkdir -p "$DERIVED_DATA_PATH" "$GITHUB_WORKSPACE/build/logs"
          set +e
          xcodebuild \
            -project apps/ios/Litter.xcodeproj \
            -scheme Litter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            LITTER_IOS_BUILD_MODE="$LITTER_IOS_BUILD_MODE" \
            LITTER_NYXIAN_PRIVATE_BUILD="$LITTER_NYXIAN_PRIVATE_BUILD" \
            LITTER_EMBED_PRIVATE_BUILDKIT_ASSETS="$LITTER_EMBED_PRIVATE_BUILDKIT_ASSETS" \
            LITTER_PRESERVE_NYXIAN_LIVEPROCESS="$LITTER_PRESERVE_NYXIAN_LIVEPROCESS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build/logs/xcodebuild.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Record AlleyCat IPA failure
        if: failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics
          {
            echo '# AlleyCat unsigned IPA failure'
            echo
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo '- Workflow: ios-unsigned-ipa.yml'
            echo "- Rust cache hit: ${{ steps.rust_generated_valid.outputs.hit }}"
            for log in runtime-build xcodebuild; do
              echo
              echo "## $log tail"
              echo '```text'
              tail -n 500 "build/logs/$log.log" 2>/dev/null || true
              echo '```'
            done
          } > build-diagnostics/alleycat-ios-last-error.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-diagnostics/alleycat-ios-last-error.md
          git commit -m 'Record AlleyCat IPA failure [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find "$DERIVED_DATA_PATH/Build/Products" -type d -name 'Litter.app' -print -quit)"
          test -d "$APP"
          rm -rf build/unsigned-ipa/Payload
          mkdir -p build/unsigned-ipa/Payload
          cp -R "$APP" build/unsigned-ipa/Payload/AlleyCat.app
          ditto -c -k --sequesterRsrc --keepParent build/unsigned-ipa/Payload build/unsigned-ipa/AlleyCat-unsigned.ipa
          test -s build/unsigned-ipa/AlleyCat-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlleyCat-Unsigned-IPA
          path: build/unsigned-ipa/AlleyCat-unsigned.ipa
          if-no-files-found: error

      - name: Upload IPA build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlleyCat-IPA-Build-Logs-${{ github.run_id }}
          path: |
            build/logs/
            build-diagnostics/
          if-no-files-found: warn
