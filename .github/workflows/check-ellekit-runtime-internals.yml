name: Check ElleKit Runtime Internals

on:
  push:
    branches: [main]
    paths:
      - triggers/check-ellekit-runtime-internals.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name']); raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  check:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Create device script
        run: |
          cat > check-ellekit-internals.sh <<'SH'
          #!/bin/sh
          set +e
          bb=$(pgrep -x backboardd | head -n1)
          sb=$(pgrep -x SpringBoard | head -n1)
          echo "backboardd_pid=$bb"
          echo "springboard_pid=$sb"
          echo '=== AVAILABLE TOOLS ==='
          for tool in vmmap procinfo jtool jtool2 dyld_info lsof; do
            command -v "$tool" 2>/dev/null || true
          done
          ls -l /usr/bin/vmmap /var/jb/usr/bin/vmmap /var/jb/usr/bin/procinfo 2>/dev/null || true
          echo '=== LOADER ENTITLEMENTS ==='
          /var/jb/usr/bin/ldid -e /var/jb/usr/libexec/ellekit/loader 2>&1 || true
          echo '=== PSPAWN ENTITLEMENTS ==='
          /var/jb/usr/bin/ldid -e /var/jb/usr/lib/ellekit/pspawn.dylib 2>&1 || true
          echo '=== PROCESS ENVIRONMENTS ==='
          ps eww -p 1 2>&1 || true
          [ -n "$bb" ] && ps eww -p "$bb" 2>&1 || true
          [ -n "$sb" ] && ps eww -p "$sb" 2>&1 || true
          echo '=== LAUNCHCTL PROCINFO ==='
          /var/jb/usr/bin/launchctl procinfo 1 2>&1 || true
          [ -n "$bb" ] && /var/jb/usr/bin/launchctl procinfo "$bb" 2>&1 || true
          echo '=== VMMAP LAUNCHD ==='
          if command -v vmmap >/dev/null 2>&1; then vmmap 1 2>&1 | grep -Ei 'ellekit|pspawn|TweakInject|substrate' || true; fi
          if [ -x /usr/bin/vmmap ]; then /usr/bin/vmmap 1 2>&1 | grep -Ei 'ellekit|pspawn|TweakInject|substrate' || true; fi
          if [ -x /var/jb/usr/bin/vmmap ]; then /var/jb/usr/bin/vmmap 1 2>&1 | grep -Ei 'ellekit|pspawn|TweakInject|substrate' || true; fi
          echo '=== VMMAP BACKBOARDD ==='
          if [ -n "$bb" ]; then
            if command -v vmmap >/dev/null 2>&1; then vmmap "$bb" 2>&1 | grep -Ei 'ellekit|injector|Gif2Ani|TweakInject|substrate' || true; fi
            if [ -x /usr/bin/vmmap ]; then /usr/bin/vmmap "$bb" 2>&1 | grep -Ei 'ellekit|injector|Gif2Ani|TweakInject|substrate' || true; fi
            if [ -x /var/jb/usr/bin/vmmap ]; then /var/jb/usr/bin/vmmap "$bb" 2>&1 | grep -Ei 'ellekit|injector|Gif2Ani|TweakInject|substrate' || true; fi
          fi
          echo '=== BOOT ARGS / FLAGS ==='
          sysctl kern.bootargs 2>&1 || true
          echo "_MSSafeMode=$(/var/jb/usr/bin/launchctl getenv _MSSafeMode 2>/dev/null || true)"
          echo "_SafeMode=$(/var/jb/usr/bin/launchctl getenv _SafeMode 2>/dev/null || true)"
          [ -e /var/mobile/.eksafemode ] && echo eksafemode_file=present || echo eksafemode_file=absent
          SH
          chmod +x check-ellekit-internals.sh
      - name: Run read-only diagnostic
        id: probe
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 60); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then connected=1; break; fi
            sleep 5
          done
          test "$connected" -eq 1
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null check-ellekit-internals.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=45 -o ServerAliveInterval=10 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/check-ellekit-internals.sh' 2>&1 | tee ellekit-internals.txt
      - name: Publish result
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('ellekit-internals.txt').read_text(errors='replace') if Path('ellekit-internals.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['ElleKit Runtime Internals',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"probe={os.environ.get('PROBE_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-500:]]
          Path('remote/ellekit-runtime-internals.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/ellekit-runtime-internals.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record ElleKit runtime internals [skip ci]"
            git push origin HEAD:main
          fi
