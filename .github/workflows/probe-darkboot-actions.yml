name: Probe Gif2Ani Workflow Status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/probe-darkboot-actions.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query current workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p remote
          curl -fsSL --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50" > runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.load(open('runs.json'))
          out=['Gif2Ani Bridge Actions Probe',f"total_count={data.get('total_count',0)}"]
          runs=list(data.get('workflow_runs',[]))
          runs.sort(key=lambda x:x.get('created_at',''), reverse=True)
          for run in runs[:35]:
              out += [
                '',
                f"name={run.get('name')}",
                f"path={run.get('path')}",
                f"run_id={run.get('id')}",
                f"status={run.get('status')}",
                f"conclusion={run.get('conclusion')}",
                f"event={run.get('event')}",
                f"head_sha={run.get('head_sha')}",
                f"created_at={run.get('created_at')}",
                f"updated_at={run.get('updated_at')}",
                f"attempt={run.get('run_attempt')}",
                f"url={run.get('html_url')}",
              ]
          Path('remote/gif2ani-actions-probe.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
      - name: Commit probe
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add remote/gif2ani-actions-probe.txt
          git commit -m 'Record Gif2Ani Actions probe [skip ci]' || exit 0
          git push origin HEAD:main
