name: ByeTunes 0.3.0 Full App Live Install

on:
  workflow_dispatch:
  push:
    branches: [temp/byetunes-ios16-rootless]
    paths:
      - '.github/workflows/byetunes-full-app-live-install.yml'
      - 'triggers/byetunes-full-app-live-install.txt'

permissions:
  actions: read
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.e.outputs.name }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json
          for e in json.load(open('/tmp/e.json')).get('environments', []):
              if int(e.get('id', -1)) == 18728387881:
                  print('name=' + e['name'])
                  break
          else:
              raise SystemExit('environment not found')
          PY

  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/byetunes-ios16-rootless

      - name: Select Xcode 15
        run: |
          set -euo pipefail
          candidate=''
          for path in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app /Applications/Xcode_15.2.app /Applications/Xcode_15.1.app /Applications/Xcode.app; do
            if [ -d "$path" ]; then candidate="$path"; break; fi
          done
          test -n "$candidate"
          sudo xcode-select --switch "$candidate"
          xcodebuild -version

      - name: Install packaging tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid dpkg findutils coreutils
          cache: true
          cache-path: ~/__cache

      - name: Install Theos and SDK
        run: |
          set -euo pipefail
          rm -rf "$THEOS" /tmp/theos-sdks
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -a /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build full ByeTunes package
        id: compile
        run: |
          set -o pipefail
          python3 byetunes16/scripts/make_icon.py byetunes16/app/Resources
          make -C byetunes16 clean package FINALPACKAGE=1 2>&1 | tee byetunes-full-build.log

      - name: Validate app tweak and helper
        id: validate
        run: |
          set -euo pipefail
          DEB="$(find byetunes16/packages -maxdepth 1 -type f -name '*.deb' -print | head -n1)"
          test -n "$DEB"
          dpkg-deb --info "$DEB" | tee package-info.txt
          dpkg-deb --contents "$DEB" | tee package-contents.txt
          test "$(dpkg-deb --field "$DEB" Package)" = com.nightvibes.byetunes16
          test "$(dpkg-deb --field "$DEB" Version)" = 0.3.0
          test "$(dpkg-deb --field "$DEB" Architecture)" = iphoneos-arm64
          rm -rf package-root
          dpkg-deb -x "$DEB" package-root
          APP=package-root/var/jb/Applications/ByeTunes.app
          test -x "$APP/ByeTunes"
          test -f "$APP/Info.plist"
          test -f "$APP/AppIcon60x60@2x.png"
          test -f "$APP/AppIcon60x60@3x.png"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx com.nightvibes.byetunes
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist" | grep -Fx byetunes
          test -f package-root/var/jb/Library/MobileSubstrate/DynamicLibraries/ByeTunes16.dylib
          test -x package-root/var/jb/usr/libexec/byetunes16d
          file "$APP/ByeTunes" | tee binary-info.txt | grep -q arm64
          file package-root/var/jb/Library/MobileSubstrate/DynamicLibraries/ByeTunes16.dylib | tee -a binary-info.txt | grep -q arm64
          file package-root/var/jb/usr/libexec/byetunes16d | tee -a binary-info.txt | grep -q arm64
          otool -l "$APP/ByeTunes" | tee otool.txt
          grep -Eq 'minos 15\.|version 15\.' otool.txt
          shasum -a 256 "$DEB" | tee sha256.txt
          cp "$DEB" ByeTunes-0.3.0-iOS15-16-rootless.deb
          echo FULL_PACKAGE_VALIDATION_PASS | tee validation.txt

      - name: Upload full ByeTunes DEB
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ByeTunes-0.3.0-Full-App
          path: ByeTunes-0.3.0-iOS15-16-rootless.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ByeTunes-full-build-${{ github.run_id }}
          path: |
            byetunes-full-build.log
            package-info.txt
            package-contents.txt
            binary-info.txt
            otool.txt
            sha256.txt
            validation.txt
          if-no-files-found: ignore
          retention-days: 14

  live:
    needs: [env, build]
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: '100.96.37.124'
      PORT: '22'
      SSHPASS: ${{ secrets.IPAD_PASSWORD }}
      PASS: ${{ secrets.IPAD_PASSWORD }}
    steps:
      - name: Download full package
        uses: actions/download-artifact@v4
        with:
          name: ByeTunes-0.3.0-Full-App
          path: /tmp/a

      - name: Prepare runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass netcat-openbsd
          DEB="$(find /tmp/a -name '*.deb' -type f | head -n1)"
          test -n "$DEB"
          cp "$DEB" /tmp/ByeTunes-0.3.0.deb
          test "$(dpkg-deb --field /tmp/ByeTunes-0.3.0.deb Version)" = 0.3.0
          sha256sum /tmp/ByeTunes-0.3.0.deb | tee local-sha256.txt

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Gate exact iPhone
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          tailscale ping --timeout=5s --c 1 "$HOST" | tee device.txt || true
          timeout 8s ssh-keyscan -T 5 -H -p "$PORT" "$HOST" > "$HOME/.ssh/known_hosts" 2>>device.txt
          test -s "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat >/tmp/gate.sh <<'SH'
          set -eu
          P=/System/Library/CoreServices/SystemVersion.plist
          V="$(sed -n '/<key>ProductVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P" | head -n1)"
          M="$(sysctl -n hw.machine 2>/dev/null || /usr/sbin/sysctl -n hw.machine 2>/dev/null || uname -m)"
          echo "machine=$M version=$V"
          [ "$M" = iPhone8,1 ] || exit 20
          [ "$V" = 15.8.8 ] || exit 21
          [ -d /var/jb ] || exit 22
          echo FULL_APP_GATE_PASS
          SH
          { printf '%s\n' "$PASS"; cat /tmp/gate.sh; } | timeout 35s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' | tee gate.txt
          grep -q FULL_APP_GATE_PASS gate.txt

      - name: Transfer and round-trip verify DEB
        run: |
          set -euo pipefail
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/ByeTunes-0.3.0.deb "mobile@$HOST:/var/mobile/ByeTunes-0.3.0.deb"
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST:/var/mobile/ByeTunes-0.3.0.deb" /tmp/ByeTunes-roundtrip.deb
          sha256sum /tmp/ByeTunes-roundtrip.deb | tee roundtrip-sha256.txt
          cmp /tmp/ByeTunes-0.3.0.deb /tmp/ByeTunes-roundtrip.deb

      - name: Install register and launch ByeTunes app
        run: |
          set -euo pipefail
          cat >/tmp/install.sh <<'SH'
          set -eu
          D=/var/jb/usr/bin/dpkg; [ -x "$D" ] || D="$(command -v dpkg)"
          "$D" -i /var/mobile/ByeTunes-0.3.0.deb
          "$D" -s com.nightvibes.byetunes16 | tee /var/mobile/ByeTunes-install-status.txt
          "$D" -s com.nightvibes.byetunes16 | grep -q '^Version: 0.3.0$'
          APP=/var/jb/Applications/ByeTunes.app
          test -x "$APP/ByeTunes"
          test -f "$APP/Info.plist"
          test -f "$APP/AppIcon60x60@2x.png"
          test -x /var/jb/usr/libexec/byetunes16d
          test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/ByeTunes16.dylib
          if command -v uicache >/dev/null 2>&1; then U="$(command -v uicache)"; else U=/var/jb/usr/bin/uicache; fi
          "$U" -p "$APP" >/dev/null 2>&1 || "$U" -a >/dev/null 2>&1 || true
          launchctl bootout system/com.nightvibes.byetunes16d >/dev/null 2>&1 || true
          launchctl bootstrap system /var/jb/Library/LaunchDaemons/com.nightvibes.byetunes16d.plist >/dev/null 2>&1 || launchctl load /var/jb/Library/LaunchDaemons/com.nightvibes.byetunes16d.plist >/dev/null 2>&1 || true
          launchctl kickstart -k system/com.nightvibes.byetunes16d >/dev/null 2>&1 || true
          sleep 2
          if command -v uiopen >/dev/null 2>&1; then O="$(command -v uiopen)"; else O=/var/jb/usr/bin/uiopen; fi
          "$O" byetunes:// >/dev/null 2>&1 || exit 31
          sleep 6
          echo '=== APP DIRECTORY ==='
          ls -la "$APP"
          echo '=== SPRINGBOARD REGISTRATION ==='
          "$U" -l 2>/dev/null | grep -i 'com.nightvibes.byetunes' || true
          echo '=== LAUNCHD GUI MATCH ==='
          launchctl print gui/501 2>/dev/null | grep -i -A4 -B4 'com.nightvibes.byetunes' || true
          C="$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'ByeTunes-*.ips' -o -name 'ByeTunes-*.crash' \) -mmin -3 -print 2>/dev/null || true)"
          echo "$C"
          test -z "$C"
          echo FULL_BYETUNES_APP_INSTALL_PASS
          SH
          { printf '%s\n' "$PASS"; cat /tmp/install.sh; } | timeout 90s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' | tee install.txt
          grep -q FULL_BYETUNES_APP_INSTALL_PASS install.txt

      - name: Verify helper API after app launch
        run: |
          set -euo pipefail
          sshpass -e ssh -f -N -L 45981:127.0.0.1:45981 -p "$PORT" -o ExitOnForwardFailure=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST"
          sleep 2
          printf '%s\n' '{"op":"probe"}' | nc -w 10 127.0.0.1 45981 | tee probe.json
          grep -q '"ok":true' probe.json
          grep -q '"quickCheck":"ok"' probe.json
          grep -q '"schemaOK":true' probe.json
          echo FULL_BYETUNES_LIVE_PASS

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ByeTunes-full-live-${{ github.run_id }}
          path: |
            local-sha256.txt
            device.txt
            gate.txt
            roundtrip-sha256.txt
            install.txt
            probe.json
          if-no-files-found: ignore
          retention-days: 14
