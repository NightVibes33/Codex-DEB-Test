name: Probe Live iPad Install Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-ipad-install-run.yml
      - triggers/probe-ipad-install-run.txt

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read latest Gif2Ani install runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p remote
          for spec in \
            'ipad-tailscale-ssh.yml:bridge-runs.json' \
            'ipad-tailscale-ssh-direct.yml:direct-runs.json' \
            'build-install-gif2ani-341-final-v2.yml:compact-runs.json'; do
            workflow="${spec%%:*}"
            output="${spec#*:}"
            curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=5" \
              -o "$output"
          done
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          sources=[
              ('ipad_tailscale_bridge','bridge-runs.json'),
              ('ipad_tailscale_direct','direct-runs.json'),
              ('compact_final_v2','compact-runs.json'),
          ]
          lines=['Gif2Ani live install run probe','probed_at_utc='+datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')]
          for label,path in sources:
              data=json.load(open(path))
              lines.extend(['','['+label+']'])
              for run in data.get('workflow_runs',[])[:5]:
                  for key in ['id','name','event','head_sha','status','conclusion','created_at','updated_at','html_url']:
                      output_key='run_id' if key=='id' else ('url' if key=='html_url' else key)
                      lines.append(output_key+'='+str(run.get(key,'')))
                  lines.append('---')
          Path('remote/ipad-install-run-probe.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Commit probe result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add remote/ipad-install-run-probe.txt
          git commit -m 'Record live iPad install workflow probe [skip ci]' || exit 0
          git push origin HEAD:main
