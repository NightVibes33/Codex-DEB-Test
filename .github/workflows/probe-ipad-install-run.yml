name: Probe Live iPad Install Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-ipad-install-run.yml
      - triggers/probe-ipad-install-run.txt

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read latest bridge and compact workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p remote
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ipad-tailscale-ssh.yml/runs?per_page=5" \
            -o bridge-runs.json
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-install-gif2ani-341-final-v2.yml/runs?per_page=5" \
            -o compact-runs.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          lines=['Gif2Ani live install run probe', 'probed_at_utc='+datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')]
          for label,path in [('ipad_tailscale_bridge','bridge-runs.json'),('compact_final_v2','compact-runs.json')]:
              data=json.load(open(path))
              lines.append('')
              lines.append('['+label+']')
              for run in data.get('workflow_runs',[])[:5]:
                  lines.append('run_id='+str(run.get('id','')))
                  lines.append('name='+str(run.get('name','')))
                  lines.append('event='+str(run.get('event','')))
                  lines.append('head_sha='+str(run.get('head_sha','')))
                  lines.append('status='+str(run.get('status','')))
                  lines.append('conclusion='+str(run.get('conclusion','')))
                  lines.append('created_at='+str(run.get('created_at','')))
                  lines.append('updated_at='+str(run.get('updated_at','')))
                  lines.append('url='+str(run.get('html_url','')))
                  lines.append('---')
          Path('remote/ipad-install-run-probe.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Commit probe result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add remote/ipad-install-run-probe.txt
          git commit -m 'Record live iPad install workflow probe [skip ci]' || exit 0
          git push origin HEAD:main
