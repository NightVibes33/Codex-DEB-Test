name: Final Gif2Ani 3.4 Downloadable Gallery Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/final-gif2ani-340-downloadable-proof.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"
  THEME_COMMIT: "b5d5eda04359409865772038895e660d709deb18"
  TEST_THEME: "cyan-pulse-rings.gif"

concurrency:
  group: gif2ani-device-change
  cancel-in-progress: false

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1)) == target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  build-install:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge

      - uses: actions/checkout@v4
        with:
          repository: NightVibes33/Dark-Boot
          ref: main
          path: darkboot

      - name: Install dependencies and Theos
        env:
          THEOS: /opt/theos
          CI: "1"
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl git \
            libxml2 dpkg-dev unzip xz-utils ca-certificates python3 file \
            openssh-client sshpass
          python3 -m pip install --disable-pip-version-check pillow
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Validate final gallery source
        working-directory: darkboot
        run: |
          set -euo pipefail
          test "$(awk '/^Version:/{print $2}' control)" = "3.4.0"
          python3 - <<'PY'
          from pathlib import Path
          p1=Path('gif2aniprefs/G2ThemeGalleryPart1.inc').read_text()
          remote=Path('gif2aniprefs/G2RemoteThemeCatalog.inc').read_text()
          preview=Path('gif2aniprefs/G2RemoteThemePreviewOverride.inc').read_text()
          stage=Path('gif2aniprefs/G2ThemeStageOverride.inc').read_text()
          polish=Path('gif2aniprefs/G2RemoteGalleryPolish.inc').read_text()
          wrapper=Path('gif2aniprefs/G2ThemeGalleryController.m').read_text()
          legacy=p1[p1.index('G2LegacyCatalog'):p1.index('static UIColor *G2RGB')]
          offline=p1[p1.index('G2BuiltInPacks'):p1.index('G2LegacyCatalog')]
          assert offline.count('@"identifier":') == 12
          assert legacy.count('@"name":') == 54
          assert remote.count('@{"name":') == 15
          assert 'packs.count == 54' in remote
          assert '? @"Cyan Pulse Rings"' in remote
          assert 'G2RemoteThemeURLIsAllowed' in remote
          assert 'raw.githubusercontent.com/NightVibes33/Codex-DEB-Test' in remote
          assert 'b5d5eda04359409865772038895e660d709deb18' in remote
          assert '- (void)g2_remoteLoadPreview' in preview
          assert '- (void)g2_remoteStageAnimation' in preview
          assert 'method_exchangeImplementations(originalPreview, remotePreview)' in preview
          assert 'method_exchangeImplementations(originalStage, remoteStage)' in preview
          assert 'Download & Preview' in preview
          assert 'NSURLSessionConfiguration.ephemeralSessionConfiguration' in preview
          assert 'G2ValidateGIFData(data, &error)' in preview
          assert 'userSettingsPreserved' in stage
          assert '@{@"pendingReady":@YES}' in stage
          assert 'method_exchangeImplementations(originalHeader, remoteHeader)' in polish
          assert 'method_exchangeImplementations(originalFooter, remoteFooter)' in polish
          assert '12 Offline + 54 Downloadable' in polish
          assert '#include "G2RemoteThemePreviewOverride.inc"' in wrapper
          print('offline_builtins=12')
          print('downloadable_builtins=54')
          print('builtins_total=66')
          print('legacy_source_catalog=54')
          print('all_gallery_entries=120')
          print('deterministic_method_routing=true')
          print('user_settings_preserved_while_staging=true')
          PY

      - name: Validate all pinned downloadable assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/NightVibes33/Codex-DEB-Test/${THEME_COMMIT}/gif2ani-themes/v1"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 30 "$BASE/manifest.json" -o manifest.json
          python3 - <<'PY'
          import json
          manifest=json.load(open('manifest.json'))
          themes=manifest.get('themes',[])
          assert manifest.get('count') == 54
          assert len(themes) == 54
          assert len({t['id'] for t in themes}) == 54
          assert len({t['file'] for t in themes}) == 54
          for t in themes:
              assert t['license'] == 'CC0-1.0'
              assert t['sourceFrames'] == 24
              assert (t['width'],t['height']) == (360,360)
              assert 0 < t['bytes'] <= 25*1024*1024
              assert len(t['sha256']) == 64
              assert t['file'] == t['id'] + '.gif'
          print('manifest_count=54')
          print('manifest_unique_assets=54')
          print('manifest_license=CC0-1.0')
          PY
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 30 "$BASE/${TEST_THEME}" -o test-theme.gif
          python3 - <<'PY'
          from PIL import Image
          import hashlib,json,os
          manifest=json.load(open('manifest.json'))
          expected=next(t for t in manifest['themes'] if t['file']=='cyan-pulse-rings.gif')
          image=Image.open('test-theme.gif')
          data=open('test-theme.gif','rb').read()
          assert image.format=='GIF'
          assert image.size==(360,360)
          assert image.n_frames==24
          assert len(data)==expected['bytes']
          assert hashlib.sha256(data).hexdigest()==expected['sha256']
          print('sample_asset_hash_verified=true')
          print('sample_asset_frames=24')
          print('sample_asset_dimensions=360x360')
          PY

      - name: Build and inspect rootless package
        working-directory: darkboot
        env:
          THEOS: /opt/theos
        run: |
          set -euo pipefail
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee ../gif2ani-340-final-build.log
          ! grep -q 'overrides method from class' ../gif2ani-340-final-build.log
          DEB="$(find packages -maxdepth 1 -type f -name 'com.nightvibes33.gif2ani_3.4.0_iphoneos-arm64.deb' | head -n1)"
          test -n "$DEB"
          cp "$DEB" ../Gif2Ani-3.4.0-final.deb
          test "$(dpkg-deb --field "$DEB" Package)" = "com.nightvibes33.gif2ani"
          test "$(dpkg-deb --field "$DEB" Version)" = "3.4.0"
          test "$(dpkg-deb --field "$DEB" Architecture)" = "iphoneos-arm64"
          rm -rf ../gif2ani-340-final-root
          dpkg-deb -x "$DEB" ../gif2ani-340-final-root
          BUNDLE=../gif2ani-340-final-root/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle
          test -f "$BUNDLE/Gif2AniPrefs"
          test -f "$BUNDLE/Root.plist"
          grep -a -q 'Download & Preview' "$BUNDLE/Gif2AniPrefs"
          grep -a -q 'Cyan Pulse Rings' "$BUNDLE/Gif2AniPrefs"
          grep -a -q 'Legacy Source Catalog' "$BUNDLE/Gif2AniPrefs"
          grep -a -q 'userSettingsPreserved' "$BUNDLE/Gif2AniPrefs"
          grep -a -q 'method_exchangeImplementations' "$BUNDLE/Gif2AniPrefs"
          grep -q 'GIF2ANI 3.4' "$BUNDLE/Root.plist"
          sha256sum "$DEB" | tee ../gif2ani-340-final-sha256.txt

      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install and prove iPad safety
        id: install
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 45); do
            sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1 && { connected=1; break; }
            sleep 5
          done
          echo "connected=$connected" | tee gif2ani-340-final-device.txt
          test "$connected" -eq 1
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            Gif2Ani-3.4.0-final.deb mobile@"$IPAD_HOST":/var/mobile/Media/Gif2Ani-3.4.0-final.deb

          cat > /tmp/install-gif2ani-340-final.sh <<'SH'
          #!/bin/sh
          set -eu
          media='/var/mobile/Library/Application Support/Gif2Ani'
          prefs='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          active="$media/Active.gif"
          runtime="$media/runtime-status.plist"
          cache="$media/Catalog"
          deb='/var/mobile/Media/Gif2Ani-3.4.0-final.deb'
          marker='/var/mobile/Media/gif2ani-340-final-install.marker'
          sample="$cache/cyan-pulse-rings.gif"
          url='https://raw.githubusercontent.com/NightVibes33/Codex-DEB-Test/b5d5eda04359409865772038895e660d709deb18/gif2ani-themes/v1/cyan-pulse-rings.gif'
          expected='1975aa569fb5ee0002856a7cff3b60bbcde04126514386fbd52b89d9f5349a46'
          sha() { /var/jb/usr/bin/sha256sum "$1" 2>/dev/null | awk '{print $1}'; }

          test -f "$active"
          test -f "$prefs"
          test -f "$runtime"
          active_before=$(sha "$active")
          prefs_before=$(sha "$prefs")
          runtime_before=$(sha "$runtime")
          touch "$marker"

          /var/jb/usr/bin/dpkg -i "$deb"
          version=$(/var/jb/usr/bin/dpkg-query -W -f='${Version}' com.nightvibes33.gif2ani)
          test "$version" = '3.4.0'

          bundle='/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle'
          test -f "$bundle/Gif2AniPrefs"
          test -f "$bundle/Root.plist"
          grep -a -q 'Download & Preview' "$bundle/Gif2AniPrefs"
          grep -a -q 'Cyan Pulse Rings' "$bundle/Gif2AniPrefs"
          grep -a -q 'Legacy Source Catalog' "$bundle/Gif2AniPrefs"
          grep -q 'GIF2ANI 3.4' "$bundle/Root.plist"

          mkdir -p "$cache"
          rm -f "$sample.download"
          /var/jb/usr/bin/curl --fail --location --proto '=https' --max-time 30 "$url" -o "$sample.download"
          test "$(sha "$sample.download")" = "$expected"
          size=$(wc -c < "$sample.download" | tr -d ' ')
          test "$size" = '130275'
          magic=$(dd if="$sample.download" bs=1 count=6 2>/dev/null)
          case "$magic" in GIF87a|GIF89a) ;; *) exit 1 ;; esac
          mv -f "$sample.download" "$sample"
          chown 501:501 "$sample"
          chmod 0644 "$sample"

          test "$active_before" = "$(sha "$active")"
          test "$prefs_before" = "$(sha "$prefs")"
          test "$runtime_before" = "$(sha "$runtime")"

          crashes=$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \
            \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' -o -name 'Preferences-*.ips' \) \
            -newer "$marker" -print 2>/dev/null | wc -l | tr -d ' ')
          test "$crashes" = 0

          echo "installed_version=$version"
          echo "cached_theme=cyan-pulse-rings.gif"
          echo "cached_theme_hash_verified=true"
          echo "active_gif_preserved=true"
          echo "preferences_preserved=true"
          echo "runtime_status_preserved=true"
          echo "new_crash_reports=$crashes"
          echo "gif2ani_340_final_install=success"
          /var/jb/usr/bin/killall -9 Preferences 2>/dev/null || true
          SH

          chmod +x /tmp/install-gif2ani-340-final.sh
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/install-gif2ani-340-final.sh mobile@"$IPAD_HOST":/var/mobile/Media/install-gif2ani-340-final.sh
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=60 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh /var/mobile/Media/install-gif2ani-340-final.sh' 2>&1 | tee -a gif2ani-340-final-device.txt

      - name: Publish final proof
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          cd bridge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          build=Path('../gif2ani-340-final-build.log').read_text(errors='replace') if Path('../gif2ani-340-final-build.log').exists() else 'No build log.'
          device=Path('../gif2ani-340-final-device.txt').read_text(errors='replace') if Path('../gif2ani-340-final-device.txt').exists() else 'No device output.'
          digest=Path('../gif2ani-340-final-sha256.txt').read_text(errors='replace') if Path('../gif2ani-340-final-sha256.txt').exists() else ''
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw:
              build=build.replace(pw,'***REDACTED***')
              device=device.replace(pw,'***REDACTED***')
          out=[
              'Gif2Ani 3.4.0 Final Downloadable Gallery Proof',
              f"run_id={os.environ.get('GITHUB_RUN_ID','')}",
              f"install={os.environ.get('INSTALL_OUTCOME','')}",
              '', 'offline_builtins=12', 'downloadable_builtins=54', 'builtins_total=66',
              'legacy_source_catalog=54', 'all_gallery_entries=120',
              'deterministic_method_routing=true', 'user_settings_preserved_while_staging=true',
              '', '--- digest ---', digest.strip(),
              '', '--- device proof ---', *device.splitlines()[-400:],
              '', '--- build tail ---', *build.splitlines()[-300:]
          ]
          Path('remote/gif2ani-340-final-proof.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/gif2ani-340-final-proof.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record final Gif2Ani 3.4 gallery proof [skip ci]"
            git push origin HEAD:main
          fi
