name: ByeTunes15 Live iPhone 15.8.8 Test

on:
  workflow_dispatch:
  push:
    branches: [temp/byetunes-ios16-rootless]
    paths:
      - '.github/workflows/byetunes16-ios16-live-test.yml'
      - 'triggers/byetunes16-ios16-live-test.txt'

permissions:
  actions: read
  contents: read

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.e.outputs.name }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json
          for e in json.load(open('/tmp/e.json')).get('environments', []):
              if int(e.get('id', -1)) == 18728387881:
                  print('name=' + e['name'])
                  break
          else:
              raise SystemExit('environment not found')
          PY

  test:
    needs: env
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PORT: '22'
      SSHPASS: ${{ secrets.IPAD_PASSWORD }}
      PASS: ${{ secrets.IPAD_PASSWORD }}
    steps:
      - name: Download green ByeTunes15-16 DEB
        uses: actions/download-artifact@v4
        with:
          name: ByeTunes15-16-Dopamine-rootless
          run-id: 33463990612
          github-token: ${{ github.token }}
          path: /tmp/a

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Find exact iPhone8,1 on iOS 15.8.8
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass

          DEB="$(find /tmp/a -name '*.deb' -type f | head -n1)"
          test -n "$DEB"
          cp "$DEB" /tmp/ByeTunes15.deb
          test "$(dpkg-deb --field /tmp/ByeTunes15.deb Package)" = com.nightvibes.byetunes16
          test "$(dpkg-deb --field /tmp/ByeTunes15.deb Architecture)" = iphoneos-arm64
          test "$(dpkg-deb --field /tmp/ByeTunes15.deb Version)" = 0.2.2
          dpkg-deb --field /tmp/ByeTunes15.deb Depends | grep -Fq 'firmware (>= 15.0)'

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          : > device-probes.txt

          tailscale status --json >/tmp/ts.json
          python3 - <<'PY' | tee tailscale-peers.txt
          import json
          d=json.load(open('/tmp/ts.json'))
          for p in d.get('Peer', {}).values():
              print(f"host={p.get('HostName','')} dns={p.get('DNSName','')} online={p.get('Online')} os={p.get('OS','')} ips={','.join(p.get('TailscaleIPs') or [])}")
          PY

          # Do not trust the cached Tailscale Online bit. Probe every IPv4 peer,
          # prioritizing peers whose name looks like an iPhone.
          python3 - <<'PY' >/tmp/candidates.txt
          import json, ipaddress
          d=json.load(open('/tmp/ts.json'))
          rows=[]
          for p in d.get('Peer', {}).values():
              name=((p.get('HostName') or '')+' '+(p.get('DNSName') or '')).strip()
              for ip in p.get('TailscaleIPs') or []:
                  try: addr=ipaddress.ip_address(ip)
                  except ValueError: continue
                  if addr.version == 4:
                      rows.append((0 if 'iphone' in name.lower() else 1, ip, name))
          for _,ip,name in sorted(rows):
              print(f"{ip}|{name}")
          PY

          cat >/tmp/iphone_gate.sh <<'SH'
          set -eu
          P=/System/Library/CoreServices/SystemVersion.plist
          V="$(sed -n '/<key>ProductVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P" | head -n1)"
          B="$(sed -n '/<key>ProductBuildVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P" | head -n1)"
          M="$(sysctl -n hw.machine 2>/dev/null || /usr/sbin/sysctl -n hw.machine 2>/dev/null || uname -m)"
          echo "machine=$M version=$V build=$B"
          [ "$M" = iPhone8,1 ] || { echo 'reject=not_target_iphone'; exit 20; }
          [ "$V" = 15.8.8 ] || { echo 'reject=not_ios_15_8_8'; exit 21; }
          [ -d /var/jb ] || { echo 'reject=no_rootless_jailbreak'; exit 22; }
          Q=/var/jb/usr/bin/dpkg-query
          [ -x "$Q" ] || Q="$(command -v dpkg-query || true)"
          [ -n "$Q" ] || { echo 'reject=no_dpkg_query'; exit 23; }
          E="$($Q -W -f='${Status}' ellekit 2>/dev/null || true)"
          echo "ellekit=$E"
          echo "$E" | grep -q 'install ok installed' || { echo 'reject=no_ellekit'; exit 24; }
          DB=/var/mobile/Media/iTunes_Control/iTunes/MediaLibrary.sqlitedb
          [ -f "$DB" ] || { echo 'reject=no_music_database'; exit 25; }
          echo IPHONE15_GATE_PASS
          SH

          HOST=''
          while IFS='|' read -r ip peer_name; do
              [ -n "$ip" ] || continue
              echo "=== candidate $ip $peer_name ===" | tee -a device-probes.txt
              tailscale ping --timeout=5s --c 1 "$ip" >>device-probes.txt 2>&1 || true
              if ! ssh-keyscan -T 6 -H -p "$PORT" "$ip" >/tmp/candidate_known_hosts 2>>device-probes.txt; then
                  echo 'reject=ssh_port_unreachable' | tee -a device-probes.txt
                  continue
              fi
              [ -s /tmp/candidate_known_hosts ] || { echo 'reject=no_host_key' | tee -a device-probes.txt; continue; }
              set +e
              OUT="$({ printf '%s\n' "$PASS"; cat /tmp/iphone_gate.sh; } | sshpass -e ssh \
                  -p "$PORT" -o BatchMode=no -o ConnectTimeout=10 \
                  -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/candidate_known_hosts \
                  "mobile@$ip" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' 2>&1)"
              rc=$?
              set -e
              printf '%s\n' "$OUT" | tee -a device-probes.txt
              echo "probe_exit=$rc" | tee -a device-probes.txt
              if [ "$rc" -eq 0 ] && printf '%s\n' "$OUT" | grep -q IPHONE15_GATE_PASS; then
                  HOST="$ip"
                  cp /tmp/candidate_known_hosts "$HOME/.ssh/known_hosts"
                  chmod 600 "$HOME/.ssh/known_hosts"
                  printf '%s\n' "$OUT" > gate.txt
                  echo "selected_host=$HOST" | tee -a device-probes.txt
                  break
              fi
          done </tmp/candidates.txt

          [ -n "$HOST" ] || { echo NO_ELIGIBLE_IPHONE8_1_IOS15_8_8 | tee -a device-probes.txt; exit 1; }
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "resolved_iphone=$HOST"

      - name: Install and conservative smoke-test on iPhone
        run: |
          set -euo pipefail
          sshpass -e scp -P "$PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/ByeTunes15.deb "mobile@$HOST:/var/mobile/ByeTunes15.deb"

          cat >/tmp/test.sh <<'SH'
          set -eu
          M="$(sysctl -n hw.machine 2>/dev/null || /usr/sbin/sysctl -n hw.machine 2>/dev/null || uname -m)"
          [ "$M" = iPhone8,1 ] || { echo ABORT_NOT_TARGET_IPHONE; exit 30; }
          P=/System/Library/CoreServices/SystemVersion.plist
          V="$(sed -n '/<key>ProductVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P" | head -n1)"
          [ "$V" = 15.8.8 ] || { echo ABORT_NOT_IOS_15_8_8; exit 31; }
          [ -d /var/jb ] || { echo ABORT_NOT_ROOTLESS; exit 32; }

          D=/var/jb/usr/bin/dpkg
          [ -x "$D" ] || D="$(command -v dpkg)"
          echo '=== INSTALL ==='
          "$D" -i /var/mobile/ByeTunes15.deb
          "$D" -s com.nightvibes.byetunes16 | sed -n '1,28p'
          "$D" -s com.nightvibes.byetunes16 | grep -q '^Version: 0.2.2$'
          test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/ByeTunes16.dylib
          test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/ByeTunes16.plist
          test -x /var/jb/usr/libexec/byetunes16d
          test -f /var/jb/Library/LaunchDaemons/com.nightvibes.byetunes16d.plist

          launchctl bootout system/com.nightvibes.byetunes16d >/dev/null 2>&1 || true
          launchctl bootstrap system /var/jb/Library/LaunchDaemons/com.nightvibes.byetunes16d.plist >/dev/null 2>&1 || true
          sleep 2
          pgrep -fl byetunes16d || true
          pgrep -f byetunes16d >/dev/null

          call() {
            if command -v nc >/dev/null 2>&1; then
              printf '%s\n' "$1" | nc -w 8 127.0.0.1 45981
            elif [ -x /var/jb/usr/bin/nc ]; then
              printf '%s\n' "$1" | /var/jb/usr/bin/nc -w 8 127.0.0.1 45981
            elif command -v curl >/dev/null 2>&1; then
              printf '%s\n' "$1" | curl -sS --max-time 8 --no-buffer telnet://127.0.0.1:45981
            else
              printf '%s\n' "$1" | /var/jb/usr/bin/curl -sS --max-time 8 --no-buffer telnet://127.0.0.1:45981
            fi
          }

          echo '=== PROBE ==='
          R="$(call '{"op":"probe"}')"; echo "$R"
          echo "$R" | grep -q '"ok":true'
          echo "$R" | grep -q '"schemaOK":true'
          echo "$R" | grep -q '"quickCheck":"ok"'

          echo '=== BACKUP BEFORE OTHER REQUESTS ==='
          R="$(call '{"op":"backup"}')"; echo "$R"
          echo "$R" | grep -q '"ok":true'

          echo '=== LIBRARY READ ==='
          R="$(call '{"op":"library","limit":5}')"; echo "$R"
          echo "$R" | grep -q '"ok":true'

          echo '=== PLAYLISTS READ ==='
          R="$(call '{"op":"playlists"}')"; echo "$R"
          echo "$R" | grep -q '"ok":true'

          echo '=== MUSIC RUNTIME ==='
          killall Music >/dev/null 2>&1 || true
          sleep 1
          if command -v uiopen >/dev/null 2>&1; then
            uiopen music:// >/dev/null 2>&1 || true
          elif [ -x /var/jb/usr/bin/uiopen ]; then
            /var/jb/usr/bin/uiopen music:// >/dev/null 2>&1 || true
          fi
          sleep 6
          pgrep -fl Music || true
          pgrep -fl byetunes16d || true
          tail -n 100 /var/mobile/Library/Logs/ByeTunes16-daemon.log 2>/dev/null || true
          C="$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'Music-*.ips' -o -name 'Music-*.crash' \) -mmin -3 -print 2>/dev/null || true)"
          echo "$C"
          test -z "$C"
          echo LIVE_IPHONE15_TEST_PASS
          SH

          { printf '%s\n' "$PASS"; cat /tmp/test.sh; } | sshpass -e ssh \
            -p "$PORT" -o BatchMode=no -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' \
            | tee live-test.txt
          grep -q LIVE_IPHONE15_TEST_PASS live-test.txt

      - name: Upload iPhone diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ByeTunes15-iPhone-live-test-${{ github.run_id }}
          path: |
            tailscale-peers.txt
            device-probes.txt
            gate.txt
            live-test.txt
          if-no-files-found: ignore
          retention-days: 14
