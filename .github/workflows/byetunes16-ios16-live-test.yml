name: ByeTunes16 Live iOS16 Test
on:
  workflow_dispatch:
  push:
    branches: [temp/byetunes-ios16-rootless]
    paths: ['.github/workflows/byetunes16-ios16-live-test.yml','triggers/byetunes16-ios16-live-test.txt']
permissions:
  actions: read
  contents: read
jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.e.outputs.name }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json
          for e in json.load(open('/tmp/e.json')).get('environments',[]):
              if int(e.get('id',-1))==18728387881:
                  print('name='+e['name']); break
          else: raise SystemExit('environment not found')
          PY
  test:
    needs: env
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOST: 100.116.117.65
      PORT: '22'
      SSHPASS: ${{ secrets.IPAD_PASSWORD }}
      PASS: ${{ secrets.IPAD_PASSWORD }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ByeTunes16-iOS16-Dopamine-rootless
          run-id: 33460660067
          github-token: ${{ github.token }}
          path: /tmp/a
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Connect and gate
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-client sshpass
          DEB="$(find /tmp/a -name '*.deb' -type f | head -n1)"; test -n "$DEB"; cp "$DEB" /tmp/ByeTunes16.deb
          test "$(dpkg-deb --field /tmp/ByeTunes16.deb Package)" = com.nightvibes.byetunes16
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          ok=0; for n in $(seq 1 18); do ssh-keyscan -T 8 -H -p "$PORT" "$HOST" >~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && { ok=1; break; }; tailscale ping --timeout=4s --c 1 "$HOST" >/dev/null 2>&1 || true; sleep 5; done; test "$ok" = 1; chmod 600 ~/.ssh/known_hosts
          cat >/tmp/gate <<'SH'
          set -eu
          P=/System/Library/CoreServices/SystemVersion.plist
          V="$(sed -n '/<key>ProductVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P"|head -1)"
          B="$(sed -n '/<key>ProductBuildVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P"|head -1)"
          echo "version=$V build=$B machine=$(uname -m)"
          test "${V%%.*}" = 16; test -d /var/jb
          Q=/var/jb/usr/bin/dpkg-query; [ -x "$Q" ] || Q="$(command -v dpkg-query)"
          "$Q" -W -f='ellekit=${Status} version=${Version}\n' ellekit
          test -f /var/mobile/Media/iTunes_Control/iTunes/MediaLibrary.sqlitedb
          echo GATE_PASS
          SH
          { printf '%s\n' "$PASS"; cat /tmp/gate; } | sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "mobile@$HOST" 'S="$(command -v sh||echo /var/jb/bin/sh)";sudo -k;exec sudo -S -p "" "$S" -s' | tee gate.txt
          grep -q GATE_PASS gate.txt
      - name: Install and fully smoke-test
        run: |
          set -euo pipefail
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/ByeTunes16.deb "mobile@$HOST:/var/mobile/ByeTunes16.deb"
          cat >/tmp/test <<'SH'
          set -eu
          D=/var/jb/usr/bin/dpkg; [ -x "$D" ] || D="$(command -v dpkg)"
          echo '=== INSTALL ==='; "$D" -i /var/mobile/ByeTunes16.deb
          "$D" -s com.nightvibes.byetunes16 | sed -n '1,24p'
          test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/ByeTunes16.dylib
          test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/ByeTunes16.plist
          test -x /var/jb/usr/libexec/byetunes16d
          test -f /var/jb/Library/LaunchDaemons/com.nightvibes.byetunes16d.plist
          launchctl bootout system/com.nightvibes.byetunes16d >/dev/null 2>&1 || true
          launchctl bootstrap system /var/jb/Library/LaunchDaemons/com.nightvibes.byetunes16d.plist >/dev/null 2>&1 || true
          sleep 2; pgrep -fl byetunes16d; pgrep -f byetunes16d >/dev/null
          call(){ if command -v nc >/dev/null 2>&1;then printf '%s\n' "$1"|nc -w 8 127.0.0.1 45981;elif [ -x /var/jb/usr/bin/nc ];then printf '%s\n' "$1"|/var/jb/usr/bin/nc -w 8 127.0.0.1 45981;elif command -v curl >/dev/null 2>&1;then printf '%s\n' "$1"|curl -sS --max-time 8 --no-buffer telnet://127.0.0.1:45981;else printf '%s\n' "$1"|/var/jb/usr/bin/curl -sS --max-time 8 --no-buffer telnet://127.0.0.1:45981;fi; }
          echo '=== PROBE ==='; R="$(call '{"op":"probe"}')"; echo "$R"; echo "$R"|grep -q '"ok":true'; echo "$R"|grep -q '"schemaOK":true'; echo "$R"|grep -q '"quickCheck":"ok"'
          echo '=== LIBRARY ==='; R="$(call '{"op":"library","limit":5}')"; echo "$R"; echo "$R"|grep -q '"ok":true'
          echo '=== PLAYLISTS ==='; R="$(call '{"op":"playlists"}')"; echo "$R"; echo "$R"|grep -q '"ok":true'
          echo '=== BACKUP ==='; R="$(call '{"op":"backup"}')"; echo "$R"; echo "$R"|grep -q '"ok":true'
          echo '=== MUSIC RUNTIME ==='; killall Music >/dev/null 2>&1||true; sleep 1; if command -v uiopen >/dev/null 2>&1;then uiopen music:// >/dev/null 2>&1||true;elif [ -x /var/jb/usr/bin/uiopen ];then /var/jb/usr/bin/uiopen music:// >/dev/null 2>&1||true;fi; sleep 6
          pgrep -fl Music||true; pgrep -fl byetunes16d||true; tail -n 80 /var/mobile/Library/Logs/ByeTunes16-daemon.log 2>/dev/null||true
          C="$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'Music-*.ips' -o -name 'Music-*.crash' \) -mmin -3 -print 2>/dev/null||true)"; echo "$C"; test -z "$C"
          echo LIVE_TEST_PASS
          SH
          { printf '%s\n' "$PASS"; cat /tmp/test; } | sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "mobile@$HOST" 'S="$(command -v sh||echo /var/jb/bin/sh)";sudo -k;exec sudo -S -p "" "$S" -s' | tee live-test.txt
          grep -q LIVE_TEST_PASS live-test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ByeTunes16-live-test-${{ github.run_id }}
          path: |
            gate.txt
            live-test.txt
          if-no-files-found: ignore
