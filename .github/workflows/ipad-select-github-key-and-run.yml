name: iPad use existing GitHub SSH key and run patch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ipad-select-github-key-and-run.yml"

permissions:
  contents: write

concurrency:
  group: ipad-select-github-key-and-run
  cancel-in-progress: true

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          environment_name="$(python3 - "$TARGET_ENVIRONMENT_ID" <<'PY'
          import json, sys
          target = int(sys.argv[1])
          data = json.load(open('environments.json'))
          for item in data.get('environments', []):
              if int(item.get('id', -1)) == target:
                  print(item['name'])
                  break
          PY
          )"
          test -n "$environment_name"
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"

  run:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: 100.116.117.65
          version: latest

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Use existing iPad GitHub key and run patch
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H 100.116.117.65 > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat > /tmp/select-key.sh <<'REMOTE'
          set -eu
          export PATH="/var/jb/usr/bin:/var/jb/usr/sbin:/usr/bin:/usr/sbin:/bin:/sbin:$PATH"
          REPO=/var/mobile/Documents/DarkSword-Workspace/Dopamine
          KEY=/var/root/.ssh/darksword_github_ed25519
          KNOWN_HOSTS=/var/root/.ssh/known_hosts
          WRAPPER=/var/root/.ssh/github-ssh-wrapper

          echo '=== Existing GitHub SSH identity ==='
          test -f "$KEY" || { echo 'existing_key=missing'; exit 40; }
          chmod 700 /var/root/.ssh
          chmod 600 "$KEY"
          ssh-keyscan -T 15 github.com >> "$KNOWN_HOSTS" 2>/dev/null || true
          sort -u "$KNOWN_HOSTS" -o "$KNOWN_HOSTS"
          chmod 600 "$KNOWN_HOSTS"
          printf 'key_name=%s fingerprint=' "$(basename "$KEY")"
          ssh-keygen -lf "$KEY" | awk '{print $2, $4}'

          auth_output="$(ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" -T git@github.com </dev/null 2>&1 || true)"
          if ! printf '%s' "$auth_output" | grep -q 'successfully authenticated'; then
              echo 'github_auth=failure'
              printf '%s\n' "$auth_output"
              exit 41
          fi
          echo 'github_auth=success'

          SSH_BIN="$(command -v ssh)"
          cat > "$WRAPPER" <<EOF
          #!/bin/sh
          exec "$SSH_BIN" -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "\$@"
          EOF
          chmod 700 "$WRAPPER"

          export GIT_SSH_COMMAND="$WRAPPER"
          cd "$REPO"
          git remote set-url origin git@github.com:NightVibes33/Dopamine.git
          git config --unset-all core.sshCommand 2>/dev/null || true
          git config core.sshCommand "$WRAPPER"
          git ls-remote origin HEAD >/dev/null
          printf 'repo_remote='; git remote get-url origin
          printf 'ssh_wrapper=%s\n' "$WRAPPER"
          echo 'git_remote_auth=success'
          REMOTE

          {
            printf '%s\n' "$IPAD_PASSWORD"
            cat /tmp/select-key.sh
            cat remote/ipad-command.sh
          } | sshpass -e ssh \
                -o BatchMode=no \
                -o ConnectTimeout=20 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=3 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                mobile@100.116.117.65 \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee ipad-select-key-output.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-select-key-output-${{ github.run_id }}
          path: ipad-select-key-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized status
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          output = Path('ipad-select-key-output.txt')
          text = output.read_text(errors='replace') if output.exists() else 'No output file was created.'
          password = os.environ.get('IPAD_PASSWORD', '')
          if password:
              text = text.replace(password, '***REDACTED***')
          lines = [
              'iPad GitHub SSH key selection and adaptive patch',
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"run_url=https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              f"source_commit={os.environ.get('GITHUB_SHA', '')}",
              '',
              '--- sanitized output ---',
          ]
          lines.extend(text.splitlines()[-220:])
          Path('remote/ipad-key-patch-status.txt').write_text('\n'.join(lines) + '\n')
          PY
          git add remote/ipad-key-patch-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record iPad GitHub key and patch status [skip ci]"
            git push origin HEAD:main
          fi
