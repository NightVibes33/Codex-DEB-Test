name: Build Install Gif2Ani 3.4.1 Final

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/build-install-gif2ani-341-final.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

concurrency:
  group: gif2ani-final-device-install
  cancel-in-progress: false

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1)) == target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  build-install:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge

      - uses: actions/checkout@v4
        with:
          repository: NightVibes33/Dark-Boot
          ref: main
          path: darkboot

      - name: Install build and SSH dependencies
        env:
          THEOS: /opt/theos
          CI: "1"
          SHELL: /bin/bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash curl sudo build-essential fakeroot rsync perl git \
            libxml2 dpkg-dev unzip xz-utils ca-certificates python3 file \
            openssh-client sshpass
          sudo rm -rf /opt/theos
          sudo mkdir -p /opt
          sudo chown "$USER:$USER" /opt
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -x /opt/theos/toolchain/linux/iphone/bin/clang

      - name: Prepare deterministic 3.4.1 source
        working-directory: darkboot
        run: |
          set -euo pipefail
          mkdir -p gif2aniprefs/Resources
          curl -fsSL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/NightVibes33/Codex-DEB-Test/b5d5eda04359409865772038895e660d709deb18/gif2ani-themes/v1/manifest.json' \
            -o gif2aniprefs/Resources/ThemeCatalog.json
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          manifest=json.loads(Path('gif2aniprefs/Resources/ThemeCatalog.json').read_text())
          assert manifest['version']==1 and manifest['count']==54 and len(manifest['themes'])==54
          ids=set()
          for item in manifest['themes']:
              assert re.fullmatch(r'[a-z0-9-]+',item['id'])
              assert item['id'] not in ids
              ids.add(item['id'])
              assert item['file']==item['id']+'.gif'
              assert re.fullmatch(r'[0-9a-f]{64}',item['sha256'])
              assert 0<int(item['bytes'])<=25*1024*1024
              assert item['sourceFrames']==24
              assert item['width']==360 and item['height']==360
              assert item['license']=='CC0-1.0'

          open_manifest=json.loads(Path('gif2aniprefs/Resources/OpenThemeCatalog.json').read_text())
          assert open_manifest['version']==1
          assert open_manifest['count']==len(open_manifest['themes'])==48
          assert open_manifest['sourceRepository']=='VirenMohindra/CydiaRepo'
          assert open_manifest['sourceLicense']=='MIT'
          assert len({item['package'] for item in open_manifest['themes']})==48
          assert all(re.fullmatch(r'[0-9a-f]{64}',item['sha256']) for item in open_manifest['themes'])

          preview=Path('gif2aniprefs/G2RemoteThemePreviewOverride.inc')
          text=preview.read_text()
          if '#import <CommonCrypto/CommonDigest.h>' not in text:
              text=text.replace('#import <objc/runtime.h>\n','#import <objc/runtime.h>\n#import <CommonCrypto/CommonDigest.h>\n',1)
          marker='static BOOL G2RemoteCachedThemeIsValid(NSDictionary *pack) {'
          helper=r'''static NSString *G2SHA256StringForData(NSData *data) {
    if (!data.length || data.length > UINT32_MAX) return nil;
    unsigned char digest[CC_SHA256_DIGEST_LENGTH];
    CC_SHA256(data.bytes, (CC_LONG)data.length, digest);
    static const char hex[] = "0123456789abcdef";
    char output[CC_SHA256_DIGEST_LENGTH * 2 + 1];
    for (NSUInteger index = 0; index < CC_SHA256_DIGEST_LENGTH; index++) {
        output[index * 2] = hex[(digest[index] >> 4) & 0x0F];
        output[index * 2 + 1] = hex[digest[index] & 0x0F];
    }
    output[CC_SHA256_DIGEST_LENGTH * 2] = '\0';
    return [NSString stringWithUTF8String:output];
}

static BOOL G2RemoteDataMatchesManifest(NSData *data, NSDictionary *pack, NSError **error) {
    NSNumber *expectedBytes = pack[@"expectedBytes"];
    NSString *expectedSHA256 = [pack[@"sha256"] lowercaseString];
    if (![expectedBytes isKindOfClass:NSNumber.class] || ![expectedSHA256 isKindOfClass:NSString.class] || expectedSHA256.length != 64) {
        if (error) *error = [NSError errorWithDomain:@"Gif2AniGallery" code:42 userInfo:@{NSLocalizedDescriptionKey:@"This downloadable theme is missing its pinned manifest metadata."}];
        return NO;
    }
    if (data.length != expectedBytes.unsignedLongLongValue) {
        if (error) *error = [NSError errorWithDomain:@"Gif2AniGallery" code:43 userInfo:@{NSLocalizedDescriptionKey:@"The downloaded theme byte count does not match the pinned manifest."}];
        return NO;
    }
    NSString *actualSHA256 = G2SHA256StringForData(data);
    if (!actualSHA256 || ![actualSHA256 isEqualToString:expectedSHA256]) {
        if (error) *error = [NSError errorWithDomain:@"Gif2AniGallery" code:44 userInfo:@{NSLocalizedDescriptionKey:@"The downloaded theme SHA-256 does not match the pinned manifest."}];
        return NO;
    }
    return YES;
}

'''
          if 'static BOOL G2RemoteDataMatchesManifest' not in text:
              assert marker in text
              text=text.replace(marker,helper+marker,1)
          old='if (!data || !G2ValidateGIFData(data, nil)) {'
          new='if (!data || !G2RemoteDataMatchesManifest(data, pack, nil) || !G2ValidateGIFData(data, nil)) {'
          if old in text:
              text=text.replace(old,new,1)
          old='''        NSDictionary *metadata = nil;
        if (!error) metadata = G2ValidateGIFData(data, &error);
        if (!error && metadata) {'''
          new='''        NSDictionary *metadata = nil;
        if (!error) metadata = G2ValidateGIFData(data, &error);
        if (!error && metadata && !G2RemoteDataMatchesManifest(data, pack, &error)) metadata = nil;
        if (!error && metadata) {'''
          if old in text:
              text=text.replace(old,new,1)
          assert 'G2RemoteDataMatchesManifest(data, pack, nil)' in text
          assert 'G2RemoteDataMatchesManifest(data, pack, &error)' in text
          preview.write_text(text)

          control=Path('control')
          text=control.read_text()
          text=re.sub(r'^Version: .*$', 'Version: 3.4.1', text, flags=re.M)
          text=text.replace('Version 3.4.0 adds','Version 3.4.1 adds')
          control.write_text(text)

          root=Path('gif2aniprefs/Resources/Root.plist')
          text=root.read_text().replace('<string>GIF2ANI 3.4</string>','<string>GIF2ANI 3.4.1</string>')
          root.write_text(text)
          PY

          test "$(awk '/^Version:/{print $2}' control)" = 3.4.1
          grep -q 'G2RemoteDataMatchesManifest' gif2aniprefs/G2RemoteThemePreviewOverride.inc
          grep -q 'CC_SHA256' gif2aniprefs/G2RemoteThemePreviewOverride.inc

      - name: Validate gallery and settings contracts
        working-directory: darkboot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          wrapper=Path('gif2aniprefs/G2ThemeGalleryController.m').read_text()
          stage=Path('gif2aniprefs/G2ThemeStageOverride.inc').read_text()
          openlib=Path('gif2aniprefs/G2OpenThemeLibrary.inc').read_text()
          remote=Path('gif2aniprefs/G2RemoteThemeCatalog.inc').read_text()
          root=Path('gif2aniprefs/Resources/Root.plist').read_text()
          cc0=json.loads(Path('gif2aniprefs/Resources/ThemeCatalog.json').read_text())
          upstream=json.loads(Path('gif2aniprefs/Resources/OpenThemeCatalog.json').read_text())
          assert cc0['count']==54 and upstream['count']==48
          assert 'G2BundledOpenThemeCatalog.inc' in wrapper
          assert 'G2OpenThemeLibrary.inc' in wrapper
          assert 'expectedBytes' in remote and '@"sha256"' in remote
          assert 'G2PreflightArchive' in openlib and 'G2ValidateExtractedTree' in openlib
          assert 'SHA-256 verification failed' in openlib
          assert 'G2WriteGalleryPreferences(@{@"pendingReady":@YES}' in stage
          assert '114 first-class themes' in root
          assert '114-THEME ANIMATION GALLERY' in root
          print('offline_themes=12')
          print('cc0_download_themes=54')
          print('original_springy_themes=48')
          print('first_class_theme_total=114')
          print('staging_preserves_user_settings=true')
          PY

      - name: Build rootless package
        working-directory: darkboot
        env:
          THEOS: /opt/theos
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee ../gif2ani-341-final-build.log
          DEB="$(find packages -maxdepth 1 -type f -name 'com.nightvibes33.gif2ani_3.4.1_iphoneos-arm64.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" ../Gif2Ani-3.4.1-final.deb
          test "$(dpkg-deb --field "$DEB" Package)" = com.nightvibes33.gif2ani
          test "$(dpkg-deb --field "$DEB" Version)" = 3.4.1
          test "$(dpkg-deb --field "$DEB" Architecture)" = iphoneos-arm64
          rm -rf ../gif2ani-341-root
          dpkg-deb -x "$DEB" ../gif2ani-341-root
          BUNDLE="$(find ../gif2ani-341-root -type d -name Gif2AniPrefs.bundle -print -quit)"
          test -n "$BUNDLE"
          test -s "$BUNDLE/Gif2AniPrefs"
          test -f "$BUNDLE/Root.plist"
          test -f "$BUNDLE/ThemeCatalog.json"
          test -f "$BUNDLE/OpenThemeCatalog.json"
          strings "$BUNDLE/Gif2AniPrefs" > ../gif2ani-341-bundle-strings.txt
          grep -Fq 'SHA-256 does not match the pinned manifest' ../gif2ani-341-bundle-strings.txt
          grep -Fq 'Open Source Pack Library' ../gif2ani-341-bundle-strings.txt
          grep -Fq 'Original Springy pack' ../gif2ani-341-bundle-strings.txt
          python3 - "$BUNDLE/ThemeCatalog.json" "$BUNDLE/OpenThemeCatalog.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          assert a['count']==len(a['themes'])==54
          assert b['count']==len(b['themes'])==48
          print('packaged_downloadable_themes=102')
          PY
          sha256sum "$DEB" | tee ../gif2ani-341-final-sha256.txt
          dpkg-deb --contents "$DEB" > ../gif2ani-341-final-contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Gif2Ani-3.4.1-final-rootless-deb
          path: Gif2Ani-3.4.1-final.deb
          if-no-files-found: error
          retention-days: 30

      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install and prove on iPad without changing active state
        id: device
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in $(seq 1 45); do
            sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1 && { connected=1; break; }
            sleep 5
          done
          echo "connected=$connected" | tee gif2ani-341-device-proof.txt
          test "$connected" -eq 1

          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            Gif2Ani-3.4.1-final.deb mobile@"$IPAD_HOST":/var/mobile/Media/Gif2Ani-3.4.1-final.deb

          cat > /tmp/prove-gif2ani-341.sh <<'SH'
          #!/bin/sh
          set -eu
          export PATH="/var/jb/usr/bin:/var/jb/usr/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/bin:/sbin:$PATH"
          media='/var/mobile/Library/Application Support/Gif2Ani'
          prefs='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          active="$media/Active.gif"
          pending="$media/Pending.gif"
          pending_meta="$media/pending-metadata.plist"
          runtime="$media/runtime-status.plist"
          deb='/var/mobile/Media/Gif2Ani-3.4.1-final.deb'
          work='/var/mobile/Library/Caches/Gif2Ani341Proof'
          marker="$work/crash-marker"
          mkdir -p "$work"
          rm -rf "$work"/*
          touch "$marker"

          sha_file() {
            p="$1"
            if [ -f "$p" ]; then
              sha256sum "$p" | awk '{print $1}'
            else
              printf 'MISSING'
            fi
          }

          active_before=$(sha_file "$active")
          prefs_before=$(sha_file "$prefs")
          pending_before=$(sha_file "$pending")
          pending_meta_before=$(sha_file "$pending_meta")
          runtime_before=$(sha_file "$runtime")
          backboard_before=$(pgrep -x backboardd 2>/dev/null | head -n1 || true)

          echo "active_before=$active_before"
          echo "prefs_before=$prefs_before"
          echo "pending_before=$pending_before"
          echo "pending_metadata_before=$pending_meta_before"
          echo "runtime_before=$runtime_before"
          echo "backboard_before=$backboard_before"

          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = com.nightvibes33.gif2ani
          test "$(dpkg-deb -f "$deb" Version)" = 3.4.1
          dpkg -i "$deb"
          test "$(dpkg-query -W -f='${Version}' com.nightvibes33.gif2ani)" = 3.4.1

          bundle='/var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle'
          test -s "$bundle/Gif2AniPrefs"
          test -f "$bundle/ThemeCatalog.json"
          test -f "$bundle/OpenThemeCatalog.json"
          python3 - "$bundle/ThemeCatalog.json" "$bundle/OpenThemeCatalog.json" <<'PY'
          import json,sys
          cc0=json.load(open(sys.argv[1])); original=json.load(open(sys.argv[2]))
          assert cc0['count']==len(cc0['themes'])==54
          assert original['count']==len(original['themes'])==48
          assert len({x['package'] for x in original['themes']})==48
          print('installed_cc0_manifest=54')
          print('installed_original_springy_manifest=48')
          print('installed_downloadable_total=102')
          PY

          cc0_url='https://raw.githubusercontent.com/NightVibes33/Codex-DEB-Test/b5d5eda04359409865772038895e660d709deb18/gif2ani-themes/v1/cyan-pulse-rings.gif'
          cc0_file="$work/cyan-pulse-rings.gif"
          curl -fsSL --retry 3 "$cc0_url" -o "$cc0_file"
          test "$(wc -c < "$cc0_file" | tr -d ' ')" = 130275
          test "$(sha256sum "$cc0_file" | awk '{print $1}')" = 1975aa569fb5ee0002856a7cff3b60bbcde04126514386fbd52b89d9f5349a46
          test "$(dd if="$cc0_file" bs=6 count=1 2>/dev/null)" = GIF89a
          echo 'cc0_sample_download=verified'

          springy_url='https://virenmohindra.github.io/debs/io.github.virenmohindra.a-wave_2.0_iphoneos-arm.deb'
          springy_deb="$work/a-wave.deb"
          curl -fsSL --retry 3 "$springy_url" -o "$springy_deb"
          test "$(wc -c < "$springy_deb" | tr -d ' ')" = 2971666
          test "$(sha256sum "$springy_deb" | awk '{print $1}')" = 93525b61259e64cc0a42ff2393935c337cfbb35d0116fd5af6c48178ec89566e
          test "$(dpkg-deb -f "$springy_deb" Package)" = io.github.virenmohindra.a-wave
          if dpkg-deb -c "$springy_deb" | grep -Eq '^[lhcbps]'; then
            echo 'springy_archive_unsafe=true'
            exit 41
          fi
          mkdir -p "$work/a-wave-root"
          dpkg-deb -x "$springy_deb" "$work/a-wave-root"
          media_count=$(find "$work/a-wave-root" -type f \( -iname '*.gif' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) | wc -l | tr -d ' ')
          test "$media_count" -ge 2
          echo "springy_sample_media_files=$media_count"
          echo 'springy_sample_download=verified'
          echo 'springy_deb_installed=false'

          killall -9 Preferences 2>/dev/null || true
          opened=false
          if command -v uiopen >/dev/null 2>&1; then
            su mobile -c "uiopen 'prefs:root=Gif2Ani'" >/dev/null 2>&1 || true
            opened=true
          elif [ -x /var/jb/usr/bin/uiopen ]; then
            su mobile -c "/var/jb/usr/bin/uiopen 'prefs:root=Gif2Ani'" >/dev/null 2>&1 || true
            opened=true
          fi
          sleep 6
          preferences_pid=$(pgrep -x Preferences 2>/dev/null | head -n1 || true)
          echo "settings_open_attempted=$opened"
          echo "preferences_pid=$preferences_pid"

          active_after=$(sha_file "$active")
          prefs_after=$(sha_file "$prefs")
          pending_after=$(sha_file "$pending")
          pending_meta_after=$(sha_file "$pending_meta")
          runtime_after=$(sha_file "$runtime")
          backboard_after=$(pgrep -x backboardd 2>/dev/null | head -n1 || true)

          test "$active_before" = "$active_after"
          test "$prefs_before" = "$prefs_after"
          test "$pending_before" = "$pending_after"
          test "$pending_meta_before" = "$pending_meta_after"
          test "$runtime_before" = "$runtime_after"
          test -n "$backboard_before"
          test "$backboard_before" = "$backboard_after"

          crashes=$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \
            \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' -o -name 'Preferences-*.ips' \) \
            -newer "$marker" -print 2>/dev/null | wc -l | tr -d ' ')
          test "$crashes" = 0

          echo 'installed_version=3.4.1'
          echo 'active_gif_preserved=true'
          echo 'preferences_preserved=true'
          echo 'pending_state_preserved=true'
          echo 'runtime_status_preserved=true'
          echo 'backboard_pid_preserved=true'
          echo "new_crash_reports=$crashes"
          echo 'gif2ani_341_device_proof=success'
          rm -rf "$work"
          SH
          chmod +x /tmp/prove-gif2ani-341.sh
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/prove-gif2ani-341.sh mobile@"$IPAD_HOST":/var/mobile/Media/prove-gif2ani-341.sh
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=60 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh /var/mobile/Media/prove-gif2ani-341.sh' 2>&1 | tee -a gif2ani-341-device-proof.txt

      - name: Publish final proof
        if: always()
        env:
          DEVICE_OUTCOME: ${{ steps.device.outcome }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          cd bridge
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          def read(path):
              p=Path(path)
              return p.read_text(errors='replace') if p.exists() else ''
          build=read('../gif2ani-341-final-build.log')
          device=read('../gif2ani-341-device-proof.txt')
          digest=read('../gif2ani-341-final-sha256.txt')
          contents=read('../gif2ani-341-final-contents.txt')
          secret=os.environ.get('IPAD_PASSWORD','')
          for value_name in ('build','device','digest','contents'):
              value=locals()[value_name]
              if secret: value=value.replace(secret,'***REDACTED***')
              locals()[value_name]=value
          out=[
            'Gif2Ani 3.4.1 Final Build Install and Device Proof',
            f"run_id={os.environ.get('GITHUB_RUN_ID','')}",
            f"device_step={os.environ.get('DEVICE_OUTCOME','')}",
            '',
            'offline_themes=12',
            'cc0_download_themes=54',
            'original_springy_themes=48',
            'first_class_theme_total=114',
            '', '--- DEB SHA-256 ---', digest.strip(),
            '', '--- DEVICE PROOF ---', *device.splitlines()[-500:],
            '', '--- PACKAGE CONTENTS ---', *contents.splitlines()[-250:],
            '', '--- BUILD LOG TAIL ---', *build.splitlines()[-350:],
          ]
          Path('remote/gif2ani-341-final-proof.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/gif2ani-341-final-proof.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Gif2Ani 3.4.1 final device proof [skip ci]'
            git push origin HEAD:main
          fi
