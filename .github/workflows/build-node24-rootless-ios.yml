name: Build Node 24 Rootless iOS
run-name: Node 24.4.1 for rootless iOS 16.7.11

on:
  push:
    branches: [nodejs-rootless-ios-build]
    paths: ['.github/workflows/build-node24-rootless-ios.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.4.1
  IOS_DEPLOYMENT_TARGET: 16.0
  PACKAGE_ARCH: iphoneos-arm64

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          clang --version
          xcrun --sdk iphoneos --show-sdk-path
          brew install ninja ldid dpkg

      - name: Download Node 24
        run: |
          set -euxo pipefail
          curl --retry 5 --retry-all-errors -fL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}.tar.xz" -o node.tar.xz
          tar -xf node.tar.xz
          mv "node-v${NODE_VERSION}" node-src

      - name: Configure iOS arm64
        working-directory: node-src
        run: |
          set -euxo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"
          export SDKROOT
          export CC="$(xcrun --sdk iphoneos -f clang) -target $TARGET -isysroot $SDKROOT"
          export CXX="$(xcrun --sdk iphoneos -f clang++) -target $TARGET -isysroot $SDKROOT"
          export CC_host="$(xcrun -f clang)"
          export CXX_host="$(xcrun -f clang++)"
          export AR="$(xcrun --sdk iphoneos -f ar)"
          export RANLIB="$(xcrun --sdk iphoneos -f ranlib)"
          export CFLAGS="-target $TARGET -isysroot $SDKROOT -O2"
          export CXXFLAGS="$CFLAGS -std=gnu++20"
          export LDFLAGS="-target $TARGET -isysroot $SDKROOT"
          python3 configure.py --dest-os=mac --dest-cpu=arm64 --cross-compiling --prefix=/var/jb/usr --without-npm --without-corepack --without-snapshot --without-intl --openssl-no-asm --enable-static --ninja

      - name: Build
        working-directory: node-src
        run: |
          set -euxo pipefail
          ninja -C out/Release -j"$(sysctl -n hw.ncpu)" node
          file out/Release/node
          xcrun vtool -show-build out/Release/node

      - name: Package
        run: |
          set -euxo pipefail
          ROOT="$PWD/package-root"
          mkdir -p "$ROOT/var/jb/usr/bin" "$ROOT/DEBIAN"
          cp node-src/out/Release/node "$ROOT/var/jb/usr/bin/node"
          chmod 0755 "$ROOT/var/jb/usr/bin/node"
          ldid -S "$ROOT/var/jb/usr/bin/node"
          printf '%s\n' \
            'Package: nodejs' \
            'Name: Node.js 24 (Rootless)' \
            "Version: ${NODE_VERSION}-2" \
            "Architecture: ${PACKAGE_ARCH}" \
            'Description: Node.js 24 for rootless iOS 16+' \
            'Maintainer: NightVibes33' \
            'Section: Development' \
            'Priority: optional' \
            'Depends: firmware (>= 16.0)' > "$ROOT/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$ROOT" "nodejs_${NODE_VERSION}-2_${PACKAGE_ARCH}.deb"

      - name: Verify
        run: |
          set -euxo pipefail
          DEB="nodejs_${NODE_VERSION}-2_${PACKAGE_ARCH}.deb"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"
          rm -rf verify-root && mkdir verify-root
          dpkg-deb -x "$DEB" verify-root
          BIN=verify-root/var/jb/usr/bin/node
          file "$BIN" | grep -q arm64
          xcrun vtool -show-build "$BIN" | tee build-version.txt
          grep -Eq 'platform IOS|platform 2' build-version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nodejs-24-ios16-rootless-arm64
          path: nodejs_${{ env.NODE_VERSION }}-2_${{ env.PACKAGE_ARCH }}.deb
          if-no-files-found: error
