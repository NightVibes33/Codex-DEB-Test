name: Build Node.js Mobile Rootless iOS
run-name: Real Node.js Mobile CLI for iOS 16.7.11

on:
  push:
    branches: [nodejs-rootless-ios-build]
    paths: ['.github/workflows/build-node24-rootless-ios.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: '16.0'
  PACKAGE_ARCH: iphoneos-arm64
  NODEJS_MOBILE_REF: d9552e0e01ed5bdbe12a31d1ce6c0877a4f39580

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install ldid dpkg

      - name: Clone maintained iOS-patched Node source
        run: |
          set -euxo pipefail
          git clone https://github.com/nodejs-mobile/nodejs-mobile.git node-src
          cd node-src
          git checkout "$NODEJS_MOBILE_REF"
          git submodule update --init --recursive
          grep -E '^#define NODE_(MAJOR|MINOR|PATCH)_VERSION' src/node_version.h

      - name: Configure real iOS arm64 target
        working-directory: node-src
        run: |
          set -euxo pipefail
          export GYP_DEFINES="target_arch=arm64 host_os=mac target_os=ios"
          ./configure \
            --dest-os=ios \
            --dest-cpu=arm64 \
            --with-intl=none \
            --cross-compiling \
            --enable-static \
            --openssl-no-asm \
            --v8-options=--jitless \
            --without-node-code-cache \
            --without-node-snapshot \
            --prefix=/var/jb/usr

      - name: Build iOS static libraries
        working-directory: node-src
        run: |
          set -euxo pipefail
          make -j"$(getconf _NPROCESSORS_ONLN)"
          REQUIRED_LIBS=(
            libada.a
            libbase64.a
            libbase64_neon64.a
            libbrotli.a
            libcares.a
            libhistogram.a
            libllhttp.a
            libnghttp2.a
            libnghttp3.a
            libngtcp2.a
            libnode.a
            libopenssl.a
            libsimdutf.a
            libuv.a
            libuvwasi.a
            libv8_base_without_compiler.a
            libv8_compiler.a
            libv8_initializers.a
            libv8_libbase.a
            libv8_libplatform.a
            libv8_snapshot.a
            libv8_zlib.a
            libzlib.a
            libzlib_inflate_chunk_simd.a
          )
          for lib in "${REQUIRED_LIBS[@]}"; do
            test -f "out/Release/$lib"
          done
          file out/Release/libnode.a

      - name: Link jailbroken iOS CLI executable
        working-directory: node-src
        run: |
          set -euxo pipefail
          cat > ios_cli_main.cc <<'EOF'
          #include "node.h"

          int main(int argc, char** argv) {
            return node::Start(argc, argv);
          }
          EOF

          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          TARGET="arm64-apple-ios${IOS_DEPLOYMENT_TARGET}"
          LIBS=(
            out/Release/libnode.a
            out/Release/libada.a
            out/Release/libbase64.a
            out/Release/libbase64_neon64.a
            out/Release/libbrotli.a
            out/Release/libcares.a
            out/Release/libhistogram.a
            out/Release/libllhttp.a
            out/Release/libnghttp2.a
            out/Release/libnghttp3.a
            out/Release/libngtcp2.a
            out/Release/libopenssl.a
            out/Release/libsimdutf.a
            out/Release/libuv.a
            out/Release/libuvwasi.a
            out/Release/libv8_initializers.a
            out/Release/libv8_compiler.a
            out/Release/libv8_base_without_compiler.a
            out/Release/libv8_libplatform.a
            out/Release/libv8_libbase.a
            out/Release/libv8_snapshot.a
            out/Release/libv8_zlib.a
            out/Release/libzlib.a
            out/Release/libzlib_inflate_chunk_simd.a
          )

          xcrun --sdk iphoneos clang++ \
            -target "$TARGET" \
            -isysroot "$SDKROOT" \
            -std=gnu++17 \
            -O2 \
            -I./src \
            -I./deps/v8/include \
            ios_cli_main.cc \
            -Wl,-all_load \
            "${LIBS[@]}" \
            -Wl,-noall_load \
            -framework Foundation \
            -framework CoreFoundation \
            -framework Security \
            -framework SystemConfiguration \
            -framework Network \
            -lc++ -lz -liconv -lresolv \
            -o out/Release/node

          file out/Release/node
          xcrun vtool -show-build out/Release/node | tee ../build-version.txt
          grep -Eq 'platform IOS|platform 2' ../build-version.txt

      - name: Read built version
        id: version
        working-directory: node-src
        run: |
          set -euxo pipefail
          MAJOR=$(awk '/NODE_MAJOR_VERSION/{print $3; exit}' src/node_version.h)
          MINOR=$(awk '/NODE_MINOR_VERSION/{print $3; exit}' src/node_version.h)
          PATCH=$(awk '/NODE_PATCH_VERSION/{print $3; exit}' src/node_version.h)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package rootless DEB
        env:
          BUILT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euxo pipefail
          ROOT="$PWD/package-root"
          BIN="$ROOT/var/jb/usr/bin/node"
          mkdir -p "$(dirname "$BIN")" "$ROOT/DEBIAN"
          cp node-src/out/Release/node "$BIN"
          chmod 0755 "$BIN"
          ldid -S "$BIN"

          printf '%s\n' \
            'Package: nodejs-mobile' \
            'Name: Node.js Mobile CLI (Rootless)' \
            "Version: ${BUILT_VERSION}-3" \
            "Architecture: ${PACKAGE_ARCH}" \
            'Description: Real iOS-patched Node.js CLI for rootless iOS 16+' \
            'Maintainer: NightVibes33' \
            'Section: Development' \
            'Priority: optional' \
            'Depends: firmware (>= 16.0)' > "$ROOT/DEBIAN/control"

          DEB="nodejs-mobile_${BUILT_VERSION}-3_${PACKAGE_ARCH}.deb"
          dpkg-deb --root-owner-group --build "$ROOT" "$DEB"
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Verify package
        run: |
          set -euxo pipefail
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"
          rm -rf verify-root
          mkdir verify-root
          dpkg-deb -x "$DEB" verify-root
          BIN=verify-root/var/jb/usr/bin/node
          test -x "$BIN"
          file "$BIN" | grep -q arm64
          xcrun vtool -show-build "$BIN" | tee packaged-build-version.txt
          grep -Eq 'platform IOS|platform 2' packaged-build-version.txt
          ldid -e "$BIN" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: nodejs-mobile-ios16-rootless-arm64
          path: ${{ env.DEB }}
          if-no-files-found: error
          retention-days: 30
