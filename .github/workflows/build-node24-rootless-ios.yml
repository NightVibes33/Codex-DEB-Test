name: Build Node.js Mobile Rootless iOS
run-name: Real Node.js Mobile CLI for iOS 16.7.11

on:
  push:
    branches: [nodejs-rootless-ios-build]
    paths: ['.github/workflows/build-node24-rootless-ios.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_DEPLOYMENT_TARGET: '16.0'
  PACKAGE_ARCH: iphoneos-arm64
  NODEJS_MOBILE_REF: d9552e0e01ed5bdbe12a31d1ce6c0877a4f39580

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install ldid dpkg python@3.11
          PY311="$(brew --prefix python@3.11)/bin/python3.11"
          "$PY311" -m venv "$RUNNER_TEMP/node-python"
          "$RUNNER_TEMP/node-python/bin/python" -m pip install --upgrade pip setuptools
          echo "$RUNNER_TEMP/node-python/bin" >> "$GITHUB_PATH"
          echo "PYTHON=$RUNNER_TEMP/node-python/bin/python" >> "$GITHUB_ENV"

      - name: Verify compatible Python
        run: |
          set -euxo pipefail
          "$PYTHON" --version
          "$PYTHON" - <<'PY'
          import distutils
          from distutils.version import StrictVersion
          print(distutils.__file__)
          print(StrictVersion('1.0'))
          PY

      - name: Clone pinned iOS-patched Node source
        run: |
          set -euxo pipefail
          git clone https://github.com/nodejs-mobile/nodejs-mobile.git node-src
          cd node-src
          git checkout --detach "$NODEJS_MOBILE_REF"
          test "$(git rev-parse HEAD)" = "$NODEJS_MOBILE_REF"
          git submodule update --init --recursive
          grep -E '^#define NODE_(MAJOR|MINOR|PATCH)_VERSION' src/node_version.h

      - name: Configure native Node iOS executable target
        working-directory: node-src
        run: |
          set -euxo pipefail
          export GYP_DEFINES="target_arch=arm64 host_os=mac target_os=ios"
          export IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET"
          "$PYTHON" ./configure \
            --dest-os=ios \
            --dest-cpu=arm64 \
            --with-intl=none \
            --cross-compiling \
            --enable-static \
            --openssl-no-asm \
            --v8-options=--jitless \
            --without-node-code-cache \
            --without-node-snapshot

          "$PYTHON" - <<'PY'
          import ast
          from pathlib import Path
          text = Path('config.gypi').read_text()
          data = ast.literal_eval('\n'.join(line for line in text.splitlines() if not line.lstrip().startswith('#')))
          variables = data['variables']
          assert variables['target_arch'] == 'arm64', variables['target_arch']
          assert variables['node_use_node_snapshot'] == 'false'
          assert variables['node_use_node_code_cache'] == 'false'
          assert '--jitless' in variables.get('node_v8_options', '')
          print('config.gypi assertions passed')
          PY

          grep -q "'target_name': '<(node_core_target_name)'" node.gyp
          grep -q "'type': 'executable'" node.gyp
          grep -q "'src/node_main.cc'" node.gyp
          grep -q "return node::Start(argc, argv);" src/node_main.cc

      - name: Build Node's native iOS CLI target
        working-directory: node-src
        run: |
          set -euxo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET"
          make -j"$(sysctl -n hw.ncpu)" node
          test -x out/Release/node

      - name: Verify native iOS binary
        working-directory: node-src
        run: |
          set -euxo pipefail
          BIN=out/Release/node
          file "$BIN" | tee ../node-file.txt
          file "$BIN" | grep -q 'Mach-O 64-bit executable arm64'
          xcrun vtool -show-build "$BIN" | tee ../build-version.txt
          grep -Eq 'platform IOS|platform 2' ../build-version.txt
          xcrun otool -L "$BIN" | tee ../linked-libraries.txt
          ! grep -q '/usr/local/' ../linked-libraries.txt
          ! grep -q '/opt/homebrew/' ../linked-libraries.txt
          ! grep -q '/Library/Developer/' ../linked-libraries.txt

      - name: Read built version
        id: version
        working-directory: node-src
        run: |
          set -euxo pipefail
          MAJOR=$(awk '/NODE_MAJOR_VERSION/{print $3; exit}' src/node_version.h)
          MINOR=$(awk '/NODE_MINOR_VERSION/{print $3; exit}' src/node_version.h)
          PATCH=$(awk '/NODE_PATCH_VERSION/{print $3; exit}' src/node_version.h)
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package rootless DEB
        env:
          BUILT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euxo pipefail
          ROOT="$PWD/package-root"
          BIN="$ROOT/var/jb/usr/bin/node"
          rm -rf "$ROOT"
          mkdir -p "$(dirname "$BIN")" "$ROOT/DEBIAN"
          install -m 0755 node-src/out/Release/node "$BIN"
          ldid -S "$BIN"
          ldid -e "$BIN" >/dev/null
          printf '%s\n' \
            'Package: nodejs-mobile' \
            'Name: Node.js Mobile CLI (Rootless)' \
            "Version: ${BUILT_VERSION}-10" \
            "Architecture: ${PACKAGE_ARCH}" \
            'Description: Native Node.js Mobile CLI for rootless iOS 16+' \
            'Maintainer: NightVibes33' \
            'Section: Development' \
            'Priority: optional' \
            'Depends: firmware (>= 16.0)' > "$ROOT/DEBIAN/control"
          DEB="nodejs-mobile_${BUILT_VERSION}-10_${PACKAGE_ARCH}.deb"
          dpkg-deb --root-owner-group --build "$ROOT" "$DEB"
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Verify packaged DEB
        run: |
          set -euxo pipefail
          test -s "$DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"
          rm -rf verify-root
          mkdir verify-root
          dpkg-deb -x "$DEB" verify-root
          BIN=verify-root/var/jb/usr/bin/node
          test -x "$BIN"
          file "$BIN" | grep -q 'Mach-O 64-bit executable arm64'
          xcrun vtool -show-build "$BIN" | tee packaged-build-version.txt
          grep -Eq 'platform IOS|platform 2' packaged-build-version.txt
          ldid -e "$BIN" >/dev/null
          dpkg-deb -f "$DEB" Architecture | grep -qx "$PACKAGE_ARCH"
          dpkg-deb -f "$DEB" Version | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-10$'

      - uses: actions/upload-artifact@v4
        with:
          name: nodejs-mobile-ios16-rootless-arm64
          path: ${{ env.DEB }}
          if-no-files-found: error
          retention-days: 30
