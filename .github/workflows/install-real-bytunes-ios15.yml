name: Install REAL ByeTunes on iPhone iOS15

on:
  workflow_dispatch:
  push:
    branches: [temp/byetunes-ios16-rootless]
    paths:
      - '.github/workflows/install-real-bytunes-ios15.yml'
      - 'triggers/install-real-bytunes-ios15.txt'

permissions:
  actions: read
  contents: read

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.e.outputs.name }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json
          for e in json.load(open('/tmp/e.json')).get('environments', []):
              if int(e.get('id', -1)) == 18728387881:
                  print('name=' + e['name']); break
          else:
              raise SystemExit('environment not found')
          PY

  install:
    needs: env
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORT: '22'
      SSHPASS: ${{ secrets.IPAD_PASSWORD }}
      PASS: ${{ secrets.IPAD_PASSWORD }}
      IPA_URL: https://github.com/NightVibes33/ByeTunes/releases/download/ios15-real-test/ByeTunes-REAL-iOS15-unsigned.ipa
      SHA_URL: https://github.com/NightVibes33/ByeTunes/releases/download/ios15-real-test/ByeTunes-REAL-iOS15-unsigned.ipa.sha256
    steps:
      - name: Download and authenticate exact real ByeTunes IPA
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass unzip
          curl -fL --retry 3 "$IPA_URL" -o /tmp/ByeTunes-REAL-iOS15-unsigned.ipa
          curl -fL --retry 3 "$SHA_URL" -o /tmp/expected.sha256
          EXPECTED="$(cut -d' ' -f1 /tmp/expected.sha256 | tr -d '\r\n')"
          ACTUAL="$(sha256sum /tmp/ByeTunes-REAL-iOS15-unsigned.ipa | cut -d' ' -f1)"
          echo "expected=$EXPECTED" | tee ipa-hash.txt
          echo "actual=$ACTUAL" | tee -a ipa-hash.txt
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf /tmp/ipa
          unzip -q /tmp/ByeTunes-REAL-iOS15-unsigned.ipa -d /tmp/ipa
          python3 - <<'PY' | tee ipa-identity.txt
          import glob, plistlib
          p=glob.glob('/tmp/ipa/Payload/*.app/Info.plist')
          assert len(p)==1, p
          d=plistlib.load(open(p[0],'rb'))
          print('bundle='+str(d.get('CFBundleIdentifier')))
          print('display='+str(d.get('CFBundleDisplayName')))
          print('executable='+str(d.get('CFBundleExecutable')))
          assert d.get('CFBundleIdentifier')=='com.EduAlexxis.MusicManager'
          assert d.get('CFBundleDisplayName')=='ByeTunes'
          PY

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Discover exact iPhone8,1 iOS 15.8.8
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          : > peer-probes.txt
          cat >/tmp/gate.sh <<'SH'
          set -eu
          P=/System/Library/CoreServices/SystemVersion.plist
          V="$(sed -n '/<key>ProductVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P" | head -n1)"
          M="$(sysctl -n hw.machine 2>/dev/null || /usr/sbin/sysctl -n hw.machine 2>/dev/null || uname -m)"
          echo "machine=$M version=$V"
          [ "$M" = iPhone8,1 ] || exit 20
          [ "$V" = 15.8.8 ] || exit 21
          [ -d /var/jb ] || exit 22
          echo REAL_BYETUNES_DEVICE_PASS
          SH
          HOST=''
          for round in 1 2 3; do
            tailscale status --json >/tmp/ts.json
            python3 - <<'PY' >/tmp/candidates.txt
          import json,ipaddress
          d=json.load(open('/tmp/ts.json')); rows=[]
          for p in d.get('Peer',{}).values():
              name=((p.get('HostName') or '')+' '+(p.get('DNSName') or '')).strip(); online=bool(p.get('Online'))
              for ip in p.get('TailscaleIPs') or []:
                  try:a=ipaddress.ip_address(ip)
                  except ValueError:continue
                  if a.version==4: rows.append((0 if 'iphone' in name.lower() else 1,0 if online else 1,ip,name,online))
          for _,_,ip,name,online in sorted(rows): print(f'{ip}|{name}|{online}')
          PY
            cat /tmp/candidates.txt | tee -a peer-probes.txt
            while IFS='|' read -r ip peer_name online; do
              [ -n "$ip" ] || continue
              echo "--- probing $ip $peer_name online=$online ---" | tee -a peer-probes.txt
              tailscale ping --timeout=4s --c 1 "$ip" >>peer-probes.txt 2>&1 || true
              timeout 7s ssh-keyscan -T 5 -H -p "$PORT" "$ip" >/tmp/kh 2>>peer-probes.txt || continue
              [ -s /tmp/kh ] || continue
              set +e
              OUT="$({ printf '%s\n' "$PASS"; cat /tmp/gate.sh; } | timeout 30s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/kh "mobile@$ip" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' 2>&1)"; RC=$?
              set -e
              printf '%s\n' "$OUT" | tee -a peer-probes.txt
              if [ "$RC" -eq 0 ] && printf '%s\n' "$OUT" | grep -q REAL_BYETUNES_DEVICE_PASS; then
                HOST="$ip"; cp /tmp/kh "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"; printf '%s\n' "$OUT" > gate.txt; break
              fi
            done </tmp/candidates.txt
            [ -z "$HOST" ] || break
            sleep 8
          done
          test -n "$HOST"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "selected_host=$HOST" | tee selected.txt

      - name: Transfer and byte-verify genuine IPA
        run: |
          set -euo pipefail
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/ByeTunes-REAL-iOS15-unsigned.ipa "mobile@$HOST:/var/mobile/ByeTunes-REAL-iOS15-unsigned.ipa"
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST:/var/mobile/ByeTunes-REAL-iOS15-unsigned.ipa" /tmp/roundtrip.ipa
          cmp /tmp/ByeTunes-REAL-iOS15-unsigned.ipa /tmp/roundtrip.ipa
          sha256sum /tmp/roundtrip.ipa | tee roundtrip-sha256.txt

      - name: Install genuine app with TrollStore helper or appinst
        run: |
          set -euo pipefail
          cat >/tmp/install-real.sh <<'SH'
          set -eu
          IPA=/var/mobile/ByeTunes-REAL-iOS15-unsigned.ipa
          test -f "$IPA"
          echo '=== CURRENT REGISTRATION ==='
          U="$(command -v uicache || true)"; [ -n "$U" ] || U=/var/jb/usr/bin/uicache
          "$U" -l 2>/dev/null | grep -E 'com\.EduAlexxis\.MusicManager|com\.nightvibes\.byetunes' || true

          echo '=== INSTALLER DISCOVERY ==='
          TSH=''
          for p in /usr/local/bin/trollstorehelper /var/jb/usr/local/bin/trollstorehelper /var/jb/usr/bin/trollstorehelper; do
            if [ -x "$p" ]; then TSH="$p"; break; fi
          done
          if [ -z "$TSH" ]; then
            TSH="$(find /var/containers/Bundle/Application /Applications /var/jb/Applications -maxdepth 5 -type f -name trollstorehelper -perm -111 -print 2>/dev/null | head -n1 || true)"
          fi
          AI="$(command -v appinst || true)"; [ -n "$AI" ] || { [ -x /var/jb/usr/bin/appinst ] && AI=/var/jb/usr/bin/appinst || true; }
          echo "trollstorehelper=$TSH"
          echo "appinst=$AI"
          DQ=/var/jb/usr/bin/dpkg-query; [ -x "$DQ" ] || DQ="$(command -v dpkg-query || true)"
          if [ -n "$DQ" ]; then "$DQ" -l 2>/dev/null | grep -Ei 'trollstore|appsync|appinst' || true; fi

          if [ -n "$TSH" ] && [ -x "$TSH" ]; then
            echo 'installer=TrollStoreRootHelper'
            "$TSH" install force "$IPA"
          elif [ -n "$AI" ] && [ -x "$AI" ]; then
            echo 'installer=appinst'
            "$AI" "$IPA"
          else
            echo NO_SUPPORTED_UNSIGNED_INSTALLER
            exit 40
          fi

          sleep 4
          "$U" -a >/dev/null 2>&1 || true
          ROW="$($U -l 2>/dev/null | grep '^com\.EduAlexxis\.MusicManager :' | head -n1 || true)"
          echo "real_registration=$ROW"
          [ -n "$ROW" ] || exit 41
          REAL_PATH="${ROW#* : }"
          test -d "$REAL_PATH"
          test -f "$REAL_PATH/Info.plist"

          echo '=== LAUNCH GENUINE BYETUNES ==='
          O="$(command -v uiopen || true)"; [ -n "$O" ] || O=/var/jb/usr/bin/uiopen
          test -x "$O"
          "$O" --bundleid com.EduAlexxis.MusicManager >/dev/null 2>&1 || "$O" com.EduAlexxis.MusicManager >/dev/null 2>&1
          sleep 10
          echo '=== REAL APP GUI STATE ==='
          launchctl print gui/501 2>/dev/null | grep -i -A6 -B6 'com.EduAlexxis.MusicManager' || true
          echo '=== REAL APP PROCESS ==='
          ps -A -o pid=,comm= 2>/dev/null | grep -Ei 'MusicManager|ByeTunes' || true
          CRASHES="$(find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -iname 'MusicManager-*.ips' -o -iname 'MusicManager-*.crash' -o -iname 'ByeTunes-*.ips' -o -iname 'ByeTunes-*.crash' \) -mmin -3 -print 2>/dev/null || true)"
          printf 'new_real_app_crashes=%s\n' "$CRASHES"
          test -z "$CRASHES" || exit 42
          echo REAL_BYETUNES_INSTALLED_AND_LAUNCHED
          SH
          { printf '%s\n' "$PASS"; cat /tmp/install-real.sh; } | timeout 150s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' | tee real-install.txt
          grep -q REAL_BYETUNES_INSTALLED_AND_LAUNCHED real-install.txt

      - name: Remove reconstructed package only after real app passes
        run: |
          set -euo pipefail
          cat >/tmp/remove-fake.sh <<'SH'
          set -eu
          U="$(command -v uicache || true)"; [ -n "$U" ] || U=/var/jb/usr/bin/uicache
          REAL="$($U -l 2>/dev/null | grep '^com\.EduAlexxis\.MusicManager :' | head -n1 || true)"
          [ -n "$REAL" ] || exit 50
          D=/var/jb/usr/bin/dpkg; [ -x "$D" ] || D="$(command -v dpkg || true)"
          if [ -n "$D" ] && "$D" -s com.nightvibes.byetunes16 >/dev/null 2>&1; then
            echo 'removing_reconstructed_package=com.nightvibes.byetunes16'
            "$D" -r com.nightvibes.byetunes16
          fi
          "$U" -a >/dev/null 2>&1 || true
          echo '=== FINAL REGISTRATION ==='
          "$U" -l 2>/dev/null | grep -E 'com\.EduAlexxis\.MusicManager|com\.nightvibes\.byetunes' || true
          "$U" -l 2>/dev/null | grep -q '^com\.EduAlexxis\.MusicManager :'
          if "$U" -l 2>/dev/null | grep -q '^com\.nightvibes\.byetunes :'; then exit 51; fi
          echo GENUINE_BYETUNES_ONLY_PASS
          SH
          { printf '%s\n' "$PASS"; cat /tmp/remove-fake.sh; } | timeout 100s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' | tee remove-fake.txt
          grep -q GENUINE_BYETUNES_ONLY_PASS remove-fake.txt

      - name: Upload installation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REAL-ByeTunes-iPhone-${{ github.run_id }}
          path: |
            ipa-hash.txt
            ipa-identity.txt
            peer-probes.txt
            selected.txt
            gate.txt
            roundtrip-sha256.txt
            real-install.txt
            remove-fake.txt
          if-no-files-found: ignore
          retention-days: 14
