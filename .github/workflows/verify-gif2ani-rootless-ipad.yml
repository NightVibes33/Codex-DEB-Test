name: Verify Gif2Ani Rootless on iPad

on:
  push:
    branches: [main]
    paths:
      - triggers/verify-gif2ani.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-gif2ani-rootless-ipad
  cancel-in-progress: false

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve bridge environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          target = int(sys.argv[1])
          for env in json.load(open('environments.json', encoding='utf-8')).get('environments', []):
              if int(env.get('id', -1)) == target:
                  print('environment_name=' + env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  verify:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ env.IPAD_HOST }}
          version: latest

      - name: Prepare SSH
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 20 -H -p 22 "$IPAD_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect package, files, and backboardd runtime
        id: runtime
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh -c '\''
              set -u
              echo "=== PACKAGE STATUS ==="
              dpkg-query -s com.nightvibes33.gif2ani 2>/dev/null | grep -E "^(Package|Status|Version|Architecture):" || true
              echo "old_package_status=$(dpkg-query -s com.nightvibes33.darkboot 2>/dev/null | grep "^Status:" || echo absent)"
              new_version=$(dpkg-query -W com.nightvibes33.gif2ani 2>/dev/null | cut -f2 || true)
              echo "new_version=$new_version"

              echo "=== FILE STATUS ==="
              for path in \
                /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib \
                /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist \
                /var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle/Gif2AniPrefs \
                /var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle/Root.plist \
                /var/jb/Library/PreferenceLoader/Preferences/Gif2Ani.plist; do
                if [ -e "$path" ]; then echo "present=$path"; else echo "missing=$path"; fi
              done
              for path in \
                /var/jb/Library/MobileSubstrate/DynamicLibraries/DarkBoot.dylib \
                /var/jb/Library/MobileSubstrate/DynamicLibraries/DarkBoot.plist \
                /var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle \
                /var/jb/Library/PreferenceLoader/Preferences/DarkBoot.plist; do
                if [ -e "$path" ]; then echo "stale=$path"; else echo "removed=$path"; fi
              done

              echo "=== FILTER ==="
              plutil -p /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist 2>/dev/null || cat /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist || true

              echo "=== PROCESSES ==="
              echo "backboardd_pid=$(pgrep -x backboardd | head -n1 || true)"
              echo "springboard_pid=$(pgrep -f SpringBoard.app/SpringBoard | head -n1 || true)"

              echo "=== RUNTIME MARKER ==="
              status_path="/var/mobile/Library/Application Support/Gif2Ani/runtime-status.plist"
              ls -la "/var/mobile/Library/Application Support/Gif2Ani" 2>/dev/null || true
              if [ -f "$status_path" ]; then
                echo "runtime_marker=present"
                plutil -p "$status_path" 2>/dev/null || cat "$status_path"
                marker=1
              else
                echo "runtime_marker=missing"
                marker=0
              fi

              echo "=== RECENT CRASHES / LOG CLUES ==="
              find /var/mobile/Library/Logs/CrashReporter /var/mobile/Library/Logs/DiagnosticLogs -type f -mmin -20 2>/dev/null | grep -E "backboardd|Gif2Ani" | tail -n 30 || true

              test "$new_version" = "3.0.0"
              if dpkg-query -s com.nightvibes33.darkboot 2>/dev/null | grep -q "^Status: install ok installed$"; then exit 41; fi
              test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib
              test -x /var/jb/Library/PreferenceBundles/Gif2AniPrefs.bundle/Gif2AniPrefs
              test ! -e /var/jb/Library/MobileSubstrate/DynamicLibraries/DarkBoot.dylib
              test "$marker" -eq 1
              echo "verification_result=old-removed-new-installed-runtime-marker-present"
            '\''' 2>&1 | tee gif2ani-verify.txt
          code=${PIPESTATUS[1]}
          set -e
          echo "verify_ssh_exit=$code" | tee -a gif2ani-verify.txt
          exit "$code"

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif2ani-runtime-verification-${{ github.run_id }}
          path: gif2ani-verify.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish sanitized verification status
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('gif2ani-verify.txt').read_text(errors='replace') if Path('gif2ani-verify.txt').exists() else 'No verification output was produced.'
          password = os.environ.get('IPAD_PASSWORD', '')
          if password:
              text = text.replace(password, '***REDACTED***')
          lines = [
              'Gif2Ani 3.0.0 Runtime Verification',
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"run_url=https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              f"tailscale={os.environ.get('TAILSCALE_OUTCOME', '')}",
              f"runtime={os.environ.get('RUNTIME_OUTCOME', '')}",
              '',
              '--- sanitized output ---',
              *text.splitlines()[-260:],
          ]
          Path('remote/gif2ani-verify-status.txt').write_text('\n'.join(lines) + '\n')
          PY
          git add remote/gif2ani-verify-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani runtime verification [skip ci]"
            git push origin HEAD:main
          fi
