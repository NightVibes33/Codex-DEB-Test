name: Smoke Root Approval Gate

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/smoke-root-approval.yml
      - darksword-overlay/rootd/main.c
      - darksword-overlay/app/DarkSwordResearchViews.swift

permissions:
  contents: read

concurrency:
  group: root-approval-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Type-check AlleyCat approval UI
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc \
            -typecheck \
            -parse-as-library \
            -sdk "$SDK" \
            -target arm64-apple-ios16.1 \
            darksword-overlay/app/DarkSwordResearchViews.swift

      - name: Compile root daemon approval protocol
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=16.1 \
            -Wall -Wextra -Werror \
            -fsyntax-only \
            darksword-overlay/rootd/main.c

      - name: Verify exact approval markers
        run: |
          set -euo pipefail
          grep -q 'Approve This Exact Command Once' darksword-overlay/app/DarkSwordResearchViews.swift
          grep -q 'APPROVE_MAGIC "DSA1"' darksword-overlay/rootd/main.c
          grep -q 'DENY_MAGIC "DSD1"' darksword-overlay/rootd/main.c
          grep -q 'STATUS_MAGIC "DSS1"' darksword-overlay/rootd/main.c
          grep -q 'approved command has unrestricted filesystem' darksword-overlay/rootd/main.c
