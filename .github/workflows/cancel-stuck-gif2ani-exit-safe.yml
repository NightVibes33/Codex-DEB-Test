name: Cancel Stuck Gif2Ani Exit-Safe Run

on:
  push:
    branches: [main]
    paths:
      - triggers/cancel-stuck-gif2ani-exit-safe.txt

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cancel stuck run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "30167308257"
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error -o cancel-response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel")
          {
            echo "Gif2Ani Stuck Run Cancellation"
            echo "target_run_id=${RUN_ID}"
            echo "http_code=${code}"
            if [ -s cancel-response.txt ]; then cat cancel-response.txt; fi
          } > remote/gif2ani-311-cancel-stuck-status.txt
          test "$code" = "202" -o "$code" = "409"
      - name: Publish cancellation status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add remote/gif2ani-311-cancel-stuck-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record cancellation of stuck Gif2Ani runtime run [skip ci]"
            git push origin HEAD:main
          fi
