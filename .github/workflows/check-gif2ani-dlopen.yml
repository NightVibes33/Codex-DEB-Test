name: Inspect ElleKit APT Origin

on:
  push:
    branches: [main]
    paths:
      - triggers/check-gif2ani-dlopen.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  inspect:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Create read-only APT script
        run: |
          cat > inspect-ellekit-apt.sh <<'SH'
          #!/bin/sh
          set +e
          echo '=== INSTALLED ==='
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\t${Status}\n' ellekit 2>&1
          echo '=== APT SOURCES ==='
          for f in /var/jb/etc/apt/sources.list /var/jb/etc/apt/sources.list.d/*.list /var/jb/etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            echo "--- $f"
            sed -n '/^[[:space:]]*#/d;/^[[:space:]]*$/d;p' "$f"
          done
          echo '=== APT POLICY ==='
          apt-cache policy ellekit 2>&1
          echo '=== APT SHOW ==='
          apt-cache show ellekit 2>&1 | sed -n '1,120p'
          echo '=== CACHED INDEX FILES ==='
          find /var/jb/var/lib/apt/lists -maxdepth 1 -type f -print 2>/dev/null | sort
          echo '=== CACHED ELLEKIT STANZAS ==='
          for f in /var/jb/var/lib/apt/lists/*Packages*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.lz4)
                if command -v lz4 >/dev/null 2>&1; then
                  lz4 -dc "$f" 2>/dev/null | awk 'BEGIN{RS=""} $0 ~ /^Package: ellekit$/m {print "--- source=" FILENAME "\n" $0 "\n"}' FILENAME="$f"
                fi
                ;;
              *.gz)
                gzip -dc "$f" 2>/dev/null | awk 'BEGIN{RS=""} $0 ~ /^Package: ellekit$/m {print "--- source=" FILENAME "\n" $0 "\n"}' FILENAME="$f"
                ;;
              *)
                awk 'BEGIN{RS=""} $0 ~ /^Package: ellekit$/m {print "--- source=" FILENAME "\n" $0 "\n"}' "$f"
                ;;
            esac
          done
          echo '=== PACKAGE STATUS FILE STANZA ==='
          awk 'BEGIN{RS=""} $0 ~ /^Package: ellekit$/m {print $0}' /var/jb/Library/dpkg/status 2>/dev/null
          SH
          chmod +x inspect-ellekit-apt.sh
      - name: Run read-only inspection
        id: probe
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          timeout 60 sshpass -e scp -P 22 -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null inspect-ellekit-apt.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          copy_code=$?
          if [ "$copy_code" -eq 0 ]; then
            printf '%s\n' "$IPAD_PASSWORD" | timeout 90 sshpass -e ssh -p 22 -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/inspect-ellekit-apt.sh' 2>&1 | tee ellekit-apt.txt
            code=${PIPESTATUS[1]}
          else
            code=$copy_code
            echo "scp_exit=$copy_code" | tee ellekit-apt.txt
          fi
          set -e
          echo "probe_exit=$code" | tee -a ellekit-apt.txt
          exit "$code"
      - name: Publish result
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('ellekit-apt.txt').read_text(errors='replace') if Path('ellekit-apt.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['ElleKit APT Origin Inspection',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"probe={os.environ.get('PROBE_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-420:]]
          Path('remote/ellekit-apt-origin.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/ellekit-apt-origin.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record ElleKit APT origin [skip ci]"
            git push origin HEAD:main
          fi
