name: Check Gif2Ani Injection Metadata

on:
  push:
    branches: [main]
    paths:
      - triggers/check-gif2ani-dlopen.txt

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  check:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Create device diagnostic
        run: |
          cat > check-gif2ani-metadata.sh <<'SH'
          #!/bin/sh
          set +e
          ms="/var/jb/Library/MobileSubstrate/DynamicLibraries"
          ti="/var/jb/usr/lib/TweakInject"
          echo '=== DIRECTORY MAPPING ==='
          ls -lid "$ms" "$ti" 2>&1
          readlink "$ms" 2>/dev/null || true
          readlink "$ti" 2>/dev/null || true
          echo '=== GIF2ANI METADATA ==='
          ls -li "$ms"/Gif2Ani.* "$ti"/Gif2Ani.* 2>&1
          echo '=== FILTER CONTENTS ==='
          echo '-- MobileSubstrate filter --'
          cat "$ms/Gif2Ani.plist" 2>&1
          echo '-- TweakInject filter --'
          cat "$ti/Gif2Ani.plist" 2>&1
          echo '=== DLOPEN ==='
          /var/jb/usr/bin/python3 - <<'PY'
          import ctypes
          path='/var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib'
          try:
              ctypes.CDLL(path, mode=ctypes.RTLD_LOCAL)
              print('dlopen_success=yes')
          except Exception as exc:
              print('dlopen_success=no')
              print('dlopen_error=%r' % (exc,))
          PY
          echo '=== CURRENT MARKER ==='
          cat '/var/mobile/Library/Application Support/Gif2Ani/runtime-status.plist' 2>/dev/null || echo runtime_status=missing
          SH
          chmod +x check-gif2ani-metadata.sh
      - name: Run read-only diagnostic
        id: probe
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          timeout 60 sshpass -e scp -P 22 -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null check-gif2ani-metadata.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          copy_code=$?
          if [ "$copy_code" -eq 0 ]; then
            printf '%s\n' "$IPAD_PASSWORD" | timeout 60 sshpass -e ssh -p 22 -o ConnectTimeout=12 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/check-gif2ani-metadata.sh' 2>&1 | tee gif2ani-metadata.txt
            code=${PIPESTATUS[1]}
          else
            code=$copy_code
            echo "scp_exit=$copy_code" | tee gif2ani-metadata.txt
          fi
          set -e
          echo "probe_exit=$code" | tee -a gif2ani-metadata.txt
          exit "$code"
      - name: Publish result
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('gif2ani-metadata.txt').read_text(errors='replace') if Path('gif2ani-metadata.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['Gif2Ani Injection Metadata Diagnostic',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"probe={os.environ.get('PROBE_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-180:]]
          Path('remote/gif2ani-injection-metadata.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/gif2ani-injection-metadata.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani injection metadata [skip ci]"
            git push origin HEAD:main
          fi
