name: Build Current DarkSword iOS 16 IPA and DEB

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-darksword-ios16-current.yml
      - darksword-overlay/build-current/**

permissions:
  contents: write

concurrency:
  group: darksword-ios16-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_HTTP_MULTIPLEXING: "false"
      IOS_RUST_PROFILE: mobile-release
      RUSTC_WRAPPER: ""
      IOS_MIN: "16.1"
      ARTIFACT_ROOT: current-ios16-artifacts

    steps:
      - name: Checkout newest imported source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Apple toolchain
        id: toolchain
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$ARTIFACT_ROOT"
          {
            set -euo pipefail
            echo "source_sha=$GITHUB_SHA"
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            swift --version
            clang --version
          } 2>&1 | tee "$ARTIFACT_ROOT/toolchain.log"

      - name: Install native build dependencies
        id: dependencies
        if: steps.toolchain.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            # Ghostty installs and validates its own exact Zig 0.15.2 toolchain.
            # Do not install Homebrew Zig 0.16 into this lane.
            brew install meson ninja xcodegen dpkg cmake pkgconf llvm autoconf automake libtool || true
            if ! command -v ldid >/dev/null 2>&1; then
              brew tap ProcursusTeam/Procursus || true
              brew install ldid || true
            fi
            rustup target add aarch64-apple-ios i686-unknown-linux-musl
            command -v xcodegen
            command -v dpkg-deb
            cargo --version
            rustc --version
          } 2>&1 | tee "$ARTIFACT_ROOT/dependencies.log"

      - name: Restore pinned Codex and Ghostty revisions
        id: restore
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            LOCK=upstream/litter/SUBMODULES.lock
            test -f "$LOCK"
            CODEX_SHA="$(awk -F= '$1=="codex" {print $2}' "$LOCK")"
            GHOSTTY_SHA="$(awk -F= '$1=="ghostty" {print $2}' "$LOCK")"
            test -n "$CODEX_SHA"
            test -n "$GHOSTTY_SHA"

            restore_repo() {
              local url="$1"
              local path="$2"
              local sha="$3"
              rm -rf "$path"
              mkdir -p "$path"
              git -C "$path" init
              git -C "$path" remote add origin "$url"
              git -C "$path" fetch --depth 1 origin "$sha"
              git -C "$path" checkout --detach FETCH_HEAD
            }

            restore_repo https://github.com/NightVibes33/codex.git \
              upstream/litter/shared/third_party/codex "$CODEX_SHA"
            restore_repo https://github.com/ghostty-org/ghostty.git \
              upstream/litter/shared/third_party/ghostty "$GHOSTTY_SHA"

            test "$(git -C upstream/litter/shared/third_party/codex rev-parse HEAD)" = "$CODEX_SHA"
            test "$(git -C upstream/litter/shared/third_party/ghostty rev-parse HEAD)" = "$GHOSTTY_SHA"
          } 2>&1 | tee "$ARTIFACT_ROOT/restore.log"

      - name: Apply complete DarkSword iOS 16 overlay
        id: overlay
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            chmod +x darksword-overlay/apply.sh
            ./darksword-overlay/apply.sh upstream/litter

            grep -q 'DarkSwordRootView()' upstream/litter/apps/ios/Sources/Litter/LitterApp.swift
            grep -q 'loginLocalChatGPTAccount' upstream/litter/apps/ios/Sources/Litter/DarkSword/DarkSwordRootView.swift
            grep -q '@Perceptible' upstream/litter/apps/ios/Sources/Litter/Models/AppState.swift
            grep -q 'WithPerceptionTracking' upstream/litter/apps/ios/Sources/Litter/LitterApp.swift
            grep -q 'revision: de219a1cf34e958134e75a9ebb134cf09bf52fc6' upstream/litter/apps/ios/project.yml
            grep -q 'REQUIRED_ZIG_VERSION="0.15.2"' upstream/litter/apps/ios/scripts/build-ghostty.sh
            grep -q 'aarch64-ios.16.1' upstream/litter/apps/ios/scripts/build-ghostty.sh
            grep -q 'darksword_host_runtime::is_available' upstream/litter/shared/rust-bridge/codex-mobile-client/src/ish_runtime.rs
            test -f upstream/litter/apps/ios/Sources/Litter/Resources/JailbreakLab/schema/experiment.schema.json
          } 2>&1 | tee "$ARTIFACT_ROOT/overlay.log"

      - name: Verify complete advanced source integrations
        id: source_verify
        if: steps.overlay.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cd upstream/litter
            tools/scripts/verify-nyxian-source-import.sh
            tools/scripts/verify-kittystore-integration.sh
          } 2>&1 | tee "$ARTIFACT_ROOT/source-verify.log"

      - name: Build Codex bridge, Ghostty, Alpine runtime and Xcode project
        id: rust_build
        if: steps.overlay.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make -C upstream/litter \
            rust-ios-device-fast alpine-fs xcgen \
            IOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            2>&1 | tee "$ARTIFACT_ROOT/rust-and-project.log"

      - name: Build complete iOS application and embedded targets
        id: app_build
        if: steps.rust_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$ARTIFACT_ROOT/DerivedData"
          xcodebuild \
            -project upstream/litter/apps/ios/Litter.xcodeproj \
            -scheme Litter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/$ARTIFACT_ROOT/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_MIN" \
            LITTER_IOS_BUILD_MODE=full-sideload \
            LITTER_NYXIAN_PRIVATE_BUILD=1 \
            LITTER_PRESERVE_NYXIAN_LIVEPROCESS=1 \
            LITTER_EMBED_UPSTREAM_SOURCE_TREES=1 \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$ARTIFACT_ROOT/xcodebuild.log"

      - name: Compile rootless host daemon
        id: rootd_build
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min="$IOS_MIN" \
            -O2 -Wall -Wextra \
            darksword-overlay/rootd/main.c \
            -o "$ARTIFACT_ROOT/darksword-rootd" \
            2>&1 | tee "$ARTIFACT_ROOT/rootd-build.log"
          codesign --force --sign - "$ARTIFACT_ROOT/darksword-rootd"

      - name: Package full unsigned IPA and rootless DEB
        id: package
        if: steps.app_build.outcome == 'success' && steps.rootd_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$ARTIFACT_ROOT/DerivedData/Build/Products" -type d -name 'DarkSwordAI.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            APP="$(find "$ARTIFACT_ROOT/DerivedData/Build/Products" -type d -name 'Litter.app' -print -quit)"
          fi
          test -n "$APP"

          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          if command -v ldid >/dev/null 2>&1; then
            while IFS= read -r binary; do
              ldid -S "$binary" || true
            done < <(find "$APP" -type f -perm -111)
            ldid -S"$PWD/darksword-overlay/package/app-entitlements.plist" "$APP/$MAIN_EXECUTABLE"
            ldid -S "$ARTIFACT_ROOT/darksword-rootd"
          else
            codesign --force --deep --sign - "$APP"
          fi

          rm -rf "$ARTIFACT_ROOT/Payload"
          mkdir -p "$ARTIFACT_ROOT/Payload"
          cp -R "$APP" "$ARTIFACT_ROOT/Payload/DarkSwordAI.app"
          (cd "$ARTIFACT_ROOT" && zip -qry DarkSwordAI-iOS16-current-unsigned.ipa Payload)

          chmod +x darksword-overlay/package/build-deb.sh
          darksword-overlay/package/build-deb.sh \
            "$APP" \
            "$ARTIFACT_ROOT/darksword-rootd" \
            "$ARTIFACT_ROOT/com.nightvibes.darkswordai_0.2.0_iphoneos-arm64.deb"

          dpkg-deb --contents "$ARTIFACT_ROOT/com.nightvibes.darkswordai_0.2.0_iphoneos-arm64.deb" \
            | tee "$ARTIFACT_ROOT/deb-contents.log"
          grep -q 'usr/libexec/darksword-rootd' "$ARTIFACT_ROOT/deb-contents.log"
          grep -q 'usr/bin/darksword-poc-run' "$ARTIFACT_ROOT/deb-contents.log"
          grep -q 'usr/bin/darksword-crash-classify' "$ARTIFACT_ROOT/deb-contents.log"

      - name: Write and commit current build diagnostics
        if: always()
        shell: bash
        run: |
          STATUS="$RUNNER_TEMP/IOS16_CURRENT_BUILD_STATUS.md"
          {
            echo '# Current DarkSword iOS 16 build status'
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Toolchain: ${{ steps.toolchain.outcome }}"
            echo "- Dependencies: ${{ steps.dependencies.outcome }}"
            echo "- Codex/Ghostty restore: ${{ steps.restore.outcome }}"
            echo "- DarkSword overlay: ${{ steps.overlay.outcome }}"
            echo "- Full-source verification: ${{ steps.source_verify.outcome }}"
            echo "- Rust/Codex/Ghostty build: ${{ steps.rust_build.outcome }}"
            echo "- iOS app and embedded targets: ${{ steps.app_build.outcome }}"
            echo "- Root daemon: ${{ steps.rootd_build.outcome }}"
            echo "- IPA/DEB package: ${{ steps.package.outcome }}"
            for log in toolchain dependencies restore overlay source-verify rust-and-project xcodebuild rootd-build; do
              echo
              echo "## ${log} errors"
              echo '```text'
              grep -E -i '(^|[ :])(error|fatal error|failed|failure)([ :]|$)' "$ARTIFACT_ROOT/${log}.log" 2>/dev/null | tail -n 120 || true
              echo '```'
              echo
              echo "## ${log} log tail"
              echo '```text'
              tail -n 140 "$ARTIFACT_ROOT/${log}.log" 2>/dev/null || true
              echo '```'
            done
          } > "$STATUS"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard HEAD
          git pull --rebase origin main || true
          cp "$STATUS" IOS16_CURRENT_BUILD_STATUS.md
          git add IOS16_CURRENT_BUILD_STATUS.md
          git commit -m 'Record current DarkSword iOS 16 build diagnostics' || true
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Upload current IPA, DEB and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkSwordAI-iOS16-current-build
          path: |
            current-ios16-artifacts/*.ipa
            current-ios16-artifacts/*.deb
            current-ios16-artifacts/*.log
            IOS16_CURRENT_BUILD_STATUS.md
          if-no-files-found: warn
