name: Dispatch Gif2Ani Safe Install

on:
  push:
    branches: [main]
    paths:
      - triggers/install-gif2ani-3.1.0-safe.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch safe installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/install-gif2ani-3.1.0-safe.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "safe_installer_dispatched=yes"
