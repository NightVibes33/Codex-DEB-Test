name: Cancel Redundant p1ctl Probe

on:
  push:
    branches: [main]
    paths:
      - triggers/dispatch-current-official-exit-v4.txt

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cancel redundant p1ctl run
        id: cancel
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "30170707166"
        run: |
          set -uo pipefail
          set +e
          http_code=$(curl --silent --show-error \
            -o cancel-response.txt \
            -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel")
          code=$?
          set -e
          echo "curl_exit=$code" | tee cancel-status.txt
          echo "http_code=$http_code" | tee -a cancel-status.txt
          if [ -s cancel-response.txt ]; then cat cancel-response.txt | tee -a cancel-status.txt; fi
          test "$code" -eq 0
          test "$http_code" = "202" -o "$http_code" = "409"
          echo "target_run_id=$TARGET_RUN_ID" | tee -a cancel-status.txt
      - name: Publish cancellation status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p remote
          {
            echo "Redundant p1ctl Probe Cancellation"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "outcome=${{ steps.cancel.outcome }}"
            echo
            if [ -f cancel-status.txt ]; then cat cancel-status.txt; else echo "No cancellation output."; fi
          } > remote/redundant-p1ctl-probe-cancellation.txt
          git add remote/redundant-p1ctl-probe-cancellation.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record redundant p1ctl probe cancellation [skip ci]"
            git push origin HEAD:main
          fi
