name: Import NightVibes Litter

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-litter.yml

permissions:
  contents: write

concurrency:
  group: import-nightvibes-litter
  cancel-in-progress: true

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone complete advanced Litter source
        run: |
          git clone --depth 1 https://github.com/NightVibes33/litter.git /tmp/litter
          git -C /tmp/litter rev-parse HEAD > /tmp/litter-commit.txt
          git -C /tmp/litter ls-tree HEAD shared/third_party/codex | awk '{print $3}' > /tmp/codex-commit.txt
          git -C /tmp/litter ls-tree HEAD shared/third_party/ghostty | awk '{print $3}' > /tmp/ghostty-commit.txt
          test -s /tmp/litter-commit.txt
          test -s /tmp/codex-commit.txt
          test -s /tmp/ghostty-commit.txt

      - name: Replace vendored app with the real advanced tree
        run: |
          rm -rf upstream/litter
          mkdir -p upstream/litter
          rsync -a --exclude .git /tmp/litter/ upstream/litter/
          cp /tmp/litter-commit.txt upstream/litter/LITTER_UPSTREAM_COMMIT.txt
          printf '%s\n' 'source=https://github.com/NightVibes33/litter' > upstream/litter/LITTER_UPSTREAM_SOURCE.txt
          {
            printf 'codex='
            cat /tmp/codex-commit.txt
            printf 'ghostty='
            cat /tmp/ghostty-commit.txt
          } > upstream/litter/SUBMODULES.lock

      - name: Apply jailbreak iPad adaptation
        run: |
          chmod +x darksword-overlay/apply.sh
          ./darksword-overlay/apply.sh upstream/litter

      - name: Commit canonical source snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A upstream/litter darksword-overlay
          git commit -m "Sync full NightVibes Litter and apply iPad rootless overlay" || true
          git push origin HEAD:main

      - name: Upload source revision marker
        uses: actions/upload-artifact@v4
        with:
          name: nightvibes-litter-source
          path: |
            upstream/litter/LITTER_UPSTREAM_COMMIT.txt
            upstream/litter/LITTER_UPSTREAM_SOURCE.txt
            upstream/litter/SUBMODULES.lock
