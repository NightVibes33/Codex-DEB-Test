name: Quick Gif2Ani Status on iPad

on:
  push:
    branches: [main]
    paths:
      - triggers/quick-gif2ani-status-ipad.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  quick-status:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Collect bounded read-only status
        id: collect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          cat > quick-gif2ani-status.sh <<'SH'
          #!/bin/sh
          set +e
          media='/var/mobile/Library/Application Support/Gif2Ani'
          prefs='/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist'
          runtime="$media/runtime-status.plist"
          echo '=== DEVICE ==='
          uname -a
          sw_vers 2>/dev/null || true
          echo '=== PACKAGE STATUS ==='
          dpkg-query -W -f='${Package}\t${Version}\t${Status}\n' ellekit com.nightvibes33.gif2ani 2>&1
          echo '=== SAFE MODE GATES ==='
          printf '_MSSafeMode='; /bin/launchctl getenv _MSSafeMode 2>/dev/null || true
          printf '_SafeMode='; /bin/launchctl getenv _SafeMode 2>/dev/null || true
          if [ -e /var/mobile/Library/Preferences/com.ex.substitute.safemode.plist ]; then echo safemode_file=present; else echo safemode_file=absent; fi
          echo '=== PROCESSES ==='
          ps axww | grep -E '[b]ackboardd|[S]pringBoard|[e]llekit' || true
          echo '=== GIF2ANI FILES ==='
          ls -la "$media" 2>&1 || true
          echo '=== PREFERENCES ==='
          cat "$prefs" 2>&1 || true
          echo '=== RUNTIME MARKER ==='
          cat "$runtime" 2>&1 || echo runtime_status=missing
          echo '=== DYLIB / FILTER ==='
          ls -l /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist 2>&1 || true
          cat /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist 2>&1 || true
          echo '=== RECENT CRASHES ==='
          find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' \) -mmin -30 -print 2>/dev/null | head -20
          echo '=== QUICK STATUS COMPLETE ==='
          SH
          chmod +x quick-gif2ani-status.sh
          connected=0
          for attempt in $(seq 1 24); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then connected=1; break; fi
            sleep 5
          done
          echo "ssh_connected=$connected" | tee quick-gif2ani-status.txt
          test "$connected" -eq 1
          sshpass -e scp -P 22 -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null quick-gif2ani-status.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh /var/mobile/Media/quick-gif2ani-status.sh' 2>&1 | tee -a quick-gif2ani-status.txt
      - name: Publish sanitized result
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('quick-gif2ani-status.txt').read_text(errors='replace') if Path('quick-gif2ani-status.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['Quick Gif2Ani Status',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"collect={os.environ.get('COLLECT_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-240:]]
          Path('remote/quick-gif2ani-status.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/quick-gif2ani-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record quick Gif2Ani status [skip ci]"
            git push origin HEAD:main
          fi
