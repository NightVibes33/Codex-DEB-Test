name: Chromecast Tailscale Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/chromecast-tailscale-probe.yml

permissions:
  contents: read

concurrency:
  group: chromecast-tailscale-probe
  cancel-in-progress: true

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            -o environments.json
          python3 scripts/resolve-github-environment.py environments.json "$TARGET_ENVIRONMENT_ID" >> "$GITHUB_OUTPUT"

  probe:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Join existing Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install probe tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends netcat-openbsd

      - name: Probe Chromecast
        env:
          TARGET: "100.81.33.70"
        run: |
          set -o pipefail
          {
            echo "target=$TARGET"
            echo "=== tailscale status ==="
            tailscale status || true
            echo
            echo "=== tailscale whois ==="
            tailscale whois "$TARGET" || true
            echo
            echo "=== tailscale ping ==="
            tailscale ping -c 5 "$TARGET" || true
            echo
            echo "=== ICMP ping ==="
            ping -c 4 -W 2 "$TARGET" || true
            echo
            echo "=== selected TCP ports ==="
            for port in 22 5555 5037 80 443 8008 8009 8443; do
              if nc -z -v -w 3 "$TARGET" "$port" 2>&1; then
                echo "OPEN tcp/$port"
              else
                echo "closed-or-filtered tcp/$port"
              fi
            done
          } | tee chromecast-probe.txt

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromecast-tailscale-probe-${{ github.run_id }}
          path: chromecast-probe.txt
          if-no-files-found: warn
          retention-days: 1
