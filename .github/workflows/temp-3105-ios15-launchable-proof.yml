name: Temp 3105 iOS15 launchable proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-3105-ios15-launchable-proof.yml"

permissions:
  actions: read
  contents: read

env:
  BASE_ARTIFACT_ID: "9707500776"
  BASE_IPA_SHA256: "21dd62c7f11133be0cf12a72d63a1344bf74f94861b9f17972456048d9dac6d9"
  BUNDLE_ID: "com.nightvibes.app.threeoneosfive1"

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.r.outputs.name }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          n="$(python3 - <<'PY'
          import json
          for e in json.load(open('/tmp/e.json')).get('environments',[]):
              if int(e.get('id',-1))==18728387881: print(e['name']); break
          PY
          )"
          test -n "$n"
          echo "name=$n" >> "$GITHUB_OUTPUT"

  prove:
    needs: env
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remote/3105-ios15-textro.b64
            remote/patch-3105-ios15-launchable.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Produce launchable Dopamine IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/a /tmp/w /tmp/a.zip /tmp/3105-dopamine-launchable.ipa
          mkdir -p /tmp/a /tmp/w
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$BASE_ARTIFACT_ID/zip" \
            -o /tmp/a.zip
          unzip -q /tmp/a.zip -d /tmp/a
          BASE=/tmp/a/3105-2.0-build8-unsigned.ipa
          echo "$BASE_IPA_SHA256  $BASE" | sha256sum -c -
          unzip -q "$BASE" -d /tmp/w
          base64 -d remote/3105-ios15-textro.b64 >/tmp/textro.bin
          python3 remote/patch-3105-ios15-launchable.py /tmp/w/Payload/3105.app /tmp/textro.bin | tee /tmp/patch.log
          grep -Fq LAUNCHABLE_PATCHED_BINARY=1 /tmp/patch.log
          python3 - <<'PY'
          import plistlib
          p=plistlib.load(open('/tmp/w/Payload/3105.app/Info.plist','rb'))
          assert p['MinimumOSVersion']=='15.0'
          assert p['CFBundleIdentifier']=='com.nightvibes.app.threeoneosfive1'
          assert p['ThreeOneOSFiveJBCompatibility']=='Dopamine iOS 15 UIKit fallback'
          print('LAUNCHABLE_PLIST_VERIFIED=1')
          PY
          cd /tmp/w
          zip -qry /tmp/3105-dopamine-launchable.ipa Payload
          sha256sum /tmp/3105-dopamine-launchable.ipa | tee /tmp/ipa.sha256

      - name: Prepare bridge
        run: |
          set -euo pipefail
          sudo install -d -m0755 /usr/share/keyrings
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tailscale openssh-client sshpass
          sudo systemctl enable --now tailscaled

      - name: Install launch and prove same PID for 90 seconds
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          HOST: "100.96.37.124"
        run: |
          set -euo pipefail
          LOCAL=/tmp/3105-dopamine-launchable.ipa
          SHA="$(sha256sum "$LOCAL" | cut -d' ' -f1)"
          sudo tailscale up --auth-key="$TAILSCALE_AUTHKEY" --hostname="gh-3105-launch-${GITHUB_RUN_ID}" --accept-dns=false --accept-routes=false --reset
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ready=0
          for n in $(seq 1 18); do
            rm -f ~/.ssh/known_hosts
            if ssh-keyscan -T8 -H "$HOST" >~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then ready=1; break; fi
            sudo tailscale ping --timeout=5s --c 1 "$HOST" || true
            sleep 8
          done
          test "$ready" = 1
          chmod 600 ~/.ssh/known_hosts
          REMOTE=/var/mobile/Media/3105-dopamine-launchable.ipa
          sshpass -e scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$LOCAL" "mobile@$HOST:$REMOTE"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<EOS
          set -e
          export PATH="/var/jb/usr/bin:/var/jb/bin:/var/jb/usr/sbin:/var/jb/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:\$PATH"
          IPA='$REMOTE'
          EXPECT='$SHA'
          BUNDLE='$BUNDLE_ID'
          echo "device_time=\$(date 2>/dev/null)"
          uname -a || true

          if command -v sha256sum >/dev/null 2>&1; then set -- \$(sha256sum "\$IPA"); else set -- \$(shasum -a 256 "\$IPA"); fi
          GOT="\$1"
          echo "runner_ipa_sha=\$EXPECT"
          echo "device_ipa_sha=\$GOT"
          [ "\$EXPECT" = "\$GOT" ]
          echo TRANSFER_HASH_MATCH=1

          H=''
          for p in /var/jb/usr/bin/trollstorehelper /var/jb/Applications/TrollStore.app/trollstorehelper /Applications/TrollStore.app/trollstorehelper; do
            [ -x "\$p" ] && H="\$p" && break
          done
          if [ -z "\$H" ]; then
            for p in /var/containers/Bundle/Application/*/*.app/trollstorehelper; do
              [ -x "\$p" ] && H="\$p" && break
            done
          fi
          [ -n "\$H" ] || { echo NO_TROLLSTORE_HELPER; exit 51; }
          echo "helper=\$H"

          killall 3105 2>/dev/null || true
          sleep 2
          set +e
          "\$H" install force "\$IPA"
          irc=\$?
          set -e
          [ "\$irc" -eq 0 ] || "\$H" install force installd "\$IPA"
          "\$H" refresh || true
          sleep 5

          APP=''
          for p in /var/containers/Bundle/Application/*/3105.app; do
            [ -d "\$p" ] || continue
            ID="\$(plutil -extract CFBundleIdentifier raw "\$p/Info.plist" 2>/dev/null || true)"
            if [ "\$ID" = "\$BUNDLE" ]; then APP="\$p"; break; fi
          done
          [ -n "\$APP" ] || { echo LAUNCHABLE_APP_NOT_INSTALLED; exit 52; }
          echo "installed_app=\$APP"
          echo "installed_bundle_id=\$(plutil -extract CFBundleIdentifier raw "\$APP/Info.plist" 2>/dev/null || true)"
          echo "installed_min_os=\$(plutil -extract MinimumOSVersion raw "\$APP/Info.plist" 2>/dev/null || true)"

          C=''
          for p in /var/jb/usr/bin/uicache /usr/bin/uicache; do [ -x "\$p" ] && C="\$p" && break; done
          if [ -n "\$C" ]; then
            "\$C" -p "\$APP" 2>/dev/null || "\$C" -a 2>/dev/null || true
            sleep 3
          fi

          U=''
          for p in /var/jb/usr/bin/uiopen /usr/bin/uiopen /bin/uiopen; do [ -x "\$p" ] && U="\$p" && break; done
          [ -n "\$U" ] || U="\$(command -v uiopen 2>/dev/null || true)"
          [ -n "\$U" ] || { echo UIOPEN_NOT_FOUND; exit 53; }
          echo "uiopen=\$U"

          find_pid() {
            if command -v pidof >/dev/null 2>&1; then
              P="\$(pidof 3105 2>/dev/null || true)"
              set -- \$P
              [ -n "\${1:-}" ] && { echo "\$1"; return; }
            fi
            ps ax 2>/dev/null | while read pid rest; do
              case "\$rest" in
                *'/3105.app/3105'*) echo "\$pid"; break ;;
              esac
            done
          }

          echo '=== LAUNCHING THROUGH SPRINGBOARD ==='
          set +e
          "\$U" --bundleid "\$BUNDLE"
          urc=\$?
          set -e
          echo "uiopen_rc=\$urc"

          PID=''
          n=0
          while [ "\$n" -lt 20 ]; do
            PID="\$(find_pid)"
            [ -n "\$PID" ] && break
            n=\$((n+1))
            sleep 1
          done
          if [ -z "\$PID" ]; then
            echo NO_PROCESS_AFTER_SPRINGBOARD_LAUNCH
            ps ax 2>/dev/null | while read pid rest; do case "\$pid \$rest" in *3105*|*threeoneosfive*) echo "PS_MATCH \$pid \$rest";; esac; done
            exit 54
          fi
          echo "launch_pid=\$PID"

          n=0
          while [ "\$n" -lt 18 ]; do
            kill -0 "\$PID" 2>/dev/null || { echo "PROCESS_DIED_CHECK=\$n"; exit 55; }
            n=\$((n+1))
            echo "ALIVE_\$n pid=\$PID"
            sleep 5
          done
          PID2="\$(find_pid)"
          echo "final_pid=\$PID2"
          [ "\$PID2" = "\$PID" ] || { echo "PID_CHANGED old=\$PID new=\$PID2"; exit 56; }
          echo alive_after_90_seconds=1
          echo "stable_pid=\$PID"
          echo RUNTIME_PROOF_SUCCESS=1
          rm -f "\$IPA"
          EOS
          } | sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh||true)"; [ -n "$S" ] || S=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$S" -s' | tee /tmp/proof.log
          grep -Fq RUNTIME_PROOF_SUCCESS=1 /tmp/proof.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3105-ios15-launchable-${{ github.run_id }}
          path: |
            /tmp/proof.log
            /tmp/ipa.sha256
            /tmp/3105-dopamine-launchable.ipa
            /tmp/patch.log
          if-no-files-found: warn
          retention-days: 7
