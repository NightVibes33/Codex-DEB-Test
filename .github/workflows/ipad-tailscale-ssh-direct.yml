name: iPad Tailscale SSH Direct

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/ipad-tailscale-ssh-direct.txt

permissions:
  contents: write

concurrency:
  group: ipad-tailscale-ssh
  cancel-in-progress: true

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            -o environments.json
          python3 scripts/resolve-github-environment.py environments.json "$TARGET_ENVIRONMENT_ID" >> "$GITHUB_OUTPUT"

  run-command:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install SSH client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Run current iPad command
        id: ssh
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/run-ipad-command-over-tailscale.sh
          scripts/run-ipad-command-over-tailscale.sh \
            100.116.117.65 \
            remote/ipad-command.sh \
            ipad-output.txt

      - name: Upload SSH output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif2ani-341-ipad-output-${{ github.run_id }}
          path: ipad-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish direct bridge status
        if: always()
        env:
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p remote
          {
            echo 'Gif2Ani 3.4.1 Direct iPad Bridge'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "ssh=${SSH_OUTCOME}"
            echo
            echo '--- sanitized SSH output ---'
            if [ -f ipad-output.txt ]; then
              sed "s/${IPAD_PASSWORD}/***REDACTED***/g" ipad-output.txt | tail -n 600
            else
              echo 'No SSH output was created.'
            fi
          } > remote/gif2ani-341-direct-ipad-status.txt
          git add remote/gif2ani-341-direct-ipad-status.txt
          git commit -m 'Record Gif2Ani 3.4.1 direct iPad status [skip ci]' || exit 0
          git push origin HEAD:main
