name: Check Gif2Ani 3.1.1 Injection

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  diagnose:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Join Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Create loader diagnostic script
        run: |
          cat > gif2ani-loader-check.sh <<'SH'
          #!/bin/sh
          set +e
          echo "=== DEVICE / PROCESSES ==="
          uname -a
          sw_vers 2>/dev/null || true
          ps ax | grep -Ei '[b]ackboardd|[S]pringBoard|[e]llekit|[s]ubstrate|[s]ubstitute|[l]ibhooker|[s]afe' || true

          echo "=== INJECTION PACKAGES ==="
          dpkg-query -W 2>/dev/null | grep -Ei 'ellekit|substrate|substitute|libhooker|safemode|palera1n' || true

          echo "=== ELLEKIT / LOADER FILES ==="
          find /var/jb -maxdepth 6 \( -iname '*ellekit*' -o -iname '*substrate*' -o -iname '*substitute*' -o -iname '*libhooker*' \) -print 2>/dev/null | head -n 300

          echo "=== SAFE MODE FILES ==="
          find /var/mobile /var/jb -maxdepth 6 \( -iname '*safemode*' -o -iname '*safe-mode*' -o -iname '*.disabled' \) -print 2>/dev/null | head -n 300

          echo "=== GIF2ANI BINARY ==="
          file /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib 2>&1 || true
          if command -v otool >/dev/null 2>&1; then otool -L /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib; fi
          if [ -x /var/jb/usr/bin/otool ]; then /var/jb/usr/bin/otool -L /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib; fi
          if command -v ldid >/dev/null 2>&1; then ldid -e /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.dylib 2>&1 || true; fi
          cat /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.plist 2>&1 || true

          echo "=== OTHER BACKBOARDD FILTERS ==="
          for plist in /var/jb/Library/MobileSubstrate/DynamicLibraries/*.plist; do
            [ -f "$plist" ] || continue
            if grep -a -q 'backboardd' "$plist" 2>/dev/null; then
              echo "--- $plist"
              cat "$plist"
            fi
          done

          echo "=== LOADED IMAGE CHECKS ==="
          pid=$(ps ax | awk '/[b]ackboardd/{print $1; exit}')
          echo "backboardd_pid=$pid"
          if command -v lsof >/dev/null 2>&1; then lsof -p "$pid" 2>&1 | grep -Ei 'Gif2Ani|ElleKit|substrate|substitute|libhooker' || true; fi
          if command -v vmmap >/dev/null 2>&1; then vmmap "$pid" 2>&1 | grep -Ei 'Gif2Ani|ElleKit|substrate|substitute|libhooker' || true; fi

          echo "=== LAUNCHD LOADER SERVICES ==="
          launchctl print system 2>/dev/null | grep -Ei -C 3 'ellekit|substrate|substitute|libhooker' | head -n 400 || true

          echo "=== AVAILABLE CONTROL TOOLS ==="
          for tool in ellekitctl ellekitd sbreload notifyutil launchctl; do
            command -v "$tool" 2>/dev/null || true
            [ -x "/var/jb/usr/bin/$tool" ] && echo "/var/jb/usr/bin/$tool"
          done
          for tool in /var/jb/usr/bin/*elle* /var/jb/usr/sbin/*elle*; do [ -e "$tool" ] && ls -l "$tool"; done

          echo "=== RECENT LOADER LOGS ==="
          if command -v log >/dev/null 2>&1; then
            log show --last 15m --style compact --predicate 'eventMessage CONTAINS[c] "Gif2Ani" OR eventMessage CONTAINS[c] "ElleKit" OR eventMessage CONTAINS[c] "substrate" OR process == "backboardd"' 2>/dev/null | tail -n 500 || true
          fi

          echo "=== RUNTIME STATUS ==="
          status="/var/mobile/Library/Application Support/Gif2Ani/runtime-status.plist"
          if [ -f "$status" ]; then cat "$status"; else echo "runtime_status=missing"; fi
          SH
          chmod +x gif2ani-loader-check.sh
      - name: Upload and execute diagnostic
        id: collect
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then break; fi
            sleep 5
          done
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null gif2ani-loader-check.sh mobile@"$IPAD_HOST":/var/mobile/Media/
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/gif2ani-loader-check.sh' 2>&1 | tee gif2ani-loader-diagnostic.txt
      - name: Publish loader diagnostic
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('gif2ani-loader-diagnostic.txt').read_text(errors='replace') if Path('gif2ani-loader-diagnostic.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['Gif2Ani 3.1.1 Loader Diagnostic',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"collect={os.environ.get('COLLECT_OUTCOME','')}",'','--- sanitized output ---',*text.splitlines()[-900:]]
          Path('remote/gif2ani-311-loader-diagnostic.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/gif2ani-311-loader-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 3.1.1 loader diagnostic [skip ci]"
            git push origin HEAD:main
          fi
