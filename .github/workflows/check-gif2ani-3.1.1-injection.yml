name: Check Gif2Ani 3.1.1 Injection

on:
  push:
    branches: [main]
    paths:
      - triggers/check-gif2ani-3.1.1-injection.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          target=int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments',[]):
              if int(env.get('id',-1))==target:
                  print('environment_name='+env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  diagnose:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Join Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
      - name: Create diagnostic script
        run: |
          cat > gif2ani-injection-check.sh <<'SH'
          #!/bin/sh
          set -u
          media="/var/mobile/Library/Application Support/Gif2Ani"
          prefs="/var/mobile/Library/Preferences/com.nightvibes33.gif2ani.plist"
          echo "=== PACKAGE ==="
          dpkg-query -W com.nightvibes33.gif2ani 2>&1 || true
          ls -l /var/jb/Library/MobileSubstrate/DynamicLibraries/Gif2Ani.* 2>&1 || true
          echo "=== DISABLED CLEAN STATE ==="
          mkdir -p "$media"
          rm -f "$media/Pending.gif" "$media/Active.gif" "$media/Rejected.gif" "$media/load-in-progress"
          if [ -f "$prefs" ]; then sed -i 's#<key>isEnabled</key><true/>#<key>isEnabled</key><false/>#' "$prefs" 2>/dev/null || true; fi
          echo "=== PROCESSES ==="
          ps ax | grep -Ei '[b]ackboardd|[S]pringBoard|[s]afe|[e]llekit|[s]ubstrate' || true
          echo "=== SAFE MODE MARKERS ==="
          find /var/mobile /var/jb -maxdepth 5 \( -iname '*safemode*' -o -iname '*safe-mode*' -o -iname '*.disabled' \) -print 2>/dev/null | head -n 200
          echo "=== CURRENT RUNTIME STATUS ==="
          if [ -f "$media/runtime-status.plist" ]; then cat "$media/runtime-status.plist"; else echo "runtime_status=missing"; fi
          echo "=== CRASH COUNT LAST 10 MINUTES ==="
          find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f \( -name 'backboardd-*.ips' -o -name 'SpringBoard-*.ips' \) -mmin -10 -print 2>/dev/null | tee /tmp/gif2ani-recent-crashes.txt
          echo "recent_crash_count=$(wc -l < /tmp/gif2ani-recent-crashes.txt | tr -d ' ')"
          SH
          chmod +x gif2ani-injection-check.sh
      - name: Wait for SSH and upload script
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then break; fi
            sleep 5
          done
          sshpass -e scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null gif2ani-injection-check.sh mobile@"$IPAD_HOST":/var/mobile/Media/
      - name: Inspect current state
        id: inspect_before
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/gif2ani-injection-check.sh' 2>&1 | tee gif2ani-injection.txt
      - name: Controlled normal respring
        id: respring
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh -c '\''if [ -x /var/jb/usr/bin/sbreload ]; then /var/jb/usr/bin/sbreload; elif [ -x /usr/bin/sbreload ]; then /usr/bin/sbreload; else killall -9 SpringBoard; fi'\''' 2>&1 | tee -a gif2ani-injection.txt
          code=${PIPESTATUS[1]}
          set -e
          echo "respring_exit=$code" | tee -a gif2ani-injection.txt
          sleep 20
      - name: Restart BackBoard after respring
        id: restart_backboard
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 24); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then break; fi
            sleep 5
          done
          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" killall -9 backboardd' 2>&1 | tee -a gif2ani-injection.txt
          code=${PIPESTATUS[1]}
          set -e
          echo "backboard_restart_exit=$code" | tee -a gif2ani-injection.txt
          sleep 20
      - name: Inspect post-respring state
        id: inspect_after
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if sshpass -e ssh -p 22 -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" true >/dev/null 2>&1; then break; fi
            sleep 5
          done
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 -o ConnectTimeout=20 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null mobile@"$IPAD_HOST" 'sudo -S -p "" sh /var/mobile/Media/gif2ani-injection-check.sh' 2>&1 | tee -a gif2ani-injection.txt
          if grep -q 'tweak-loaded-no-media-decode' gif2ani-injection.txt; then echo 'normal_injection_detected=yes' | tee -a gif2ani-injection.txt; else echo 'normal_injection_detected=no' | tee -a gif2ani-injection.txt; exit 42; fi
      - name: Publish diagnostic status
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          INSPECT_AFTER: ${{ steps.inspect_after.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path('gif2ani-injection.txt').read_text(errors='replace') if Path('gif2ani-injection.txt').exists() else 'No output.'
          pw=os.environ.get('IPAD_PASSWORD','')
          if pw: text=text.replace(pw,'***REDACTED***')
          out=['Gif2Ani 3.1.1 Injection Diagnostic',f"run_id={os.environ.get('GITHUB_RUN_ID','')}",f"post_respring_injection={os.environ.get('INSPECT_AFTER','')}",'','--- sanitized output ---',*text.splitlines()[-420:]]
          Path('remote/gif2ani-311-injection-status.txt').write_text('\n'.join(out)+'\n')
          PY
          git add remote/gif2ani-311-injection-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 3.1.1 injection diagnostic [skip ci]"
            git push origin HEAD:main
          fi
