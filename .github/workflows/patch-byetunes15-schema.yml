name: Patch ByeTunes iOS15 Schema Compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - temp/byetunes-ios16-rootless
    paths:
      - 'triggers/byetunes15-schema-patch.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: temp/byetunes-ios16-rootless
          fetch-depth: 0

      - name: Apply schema patch
        run: python3 scripts/patch_byetunes15_schema.py

      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'BOOL hasUUID=BTColumn(db,@"container_item",@"uuid")' byetunes16/daemon/BTImporter.m
          grep -F 'BOOL hasUUID = BTFullColumn(db, @"container_item", @"uuid")' byetunes16/daemon/BTImporter+Full.m

      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add byetunes16/daemon/BTImporter.m byetunes16/daemon/BTImporter+Full.m
          git commit -m 'Fix iOS 15 playlist schema compatibility' || exit 0
          git push origin HEAD:temp/byetunes-ios16-rootless
