name: iPad Owner-Only Read-Only Verification

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write

concurrency:
  group: ipad-owner-only-verification
  cancel-in-progress: true

jobs:
  resolve-environment:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'NightVibes33' && github.event.issue.title == '[iPad Bridge Verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve environment ID
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          target = int(sys.argv[1])
          data = json.load(open('environments.json', encoding='utf-8'))
          for env in data.get('environments', []):
              if int(env.get('id', -1)) == target:
                  print('environment_name=' + env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  verify-ipad:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'NightVibes33' && github.event.issue.title == '[iPad Bridge Verify]')
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate bridge secrets
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY"
          test -n "$IPAD_PASSWORD"

      - name: Join Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: 100.116.117.65
          version: latest

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Run read-only verification on iPad
        id: ssh
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          : > ipad-owner-verify-output.txt
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H -p 22 100.116.117.65 > "$HOME/.ssh/known_hosts" 2>>ipad-owner-verify-output.txt
          chmod 600 "$HOME/.ssh/known_hosts"
          set +e
          {
            printf '%s\n' "$IPAD_PASSWORD"
            cat remote/ipad-command.sh
          } | sshpass -e ssh \
                -p 22 \
                -o BatchMode=no \
                -o ConnectTimeout=20 \
                -o ConnectionAttempts=2 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=2 \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                mobile@100.116.117.65 \
                'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' \
                2>&1 | tee -a ipad-owner-verify-output.txt
          status=${PIPESTATUS[1]}
          set -e
          echo "ssh_exit_code=$status" | tee -a ipad-owner-verify-output.txt
          exit "$status"

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-owner-verify-${{ github.run_id }}
          path: ipad-owner-verify-output.txt
          retention-days: 7

      - name: Publish sanitized verification status
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          output = Path('ipad-owner-verify-output.txt')
          text = output.read_text(errors='replace') if output.exists() else 'No SSH output file was created.'
          password = os.environ.get('IPAD_PASSWORD', '')
          if password:
              text = text.replace(password, '***REDACTED***')
          lines = [
              'iPad Owner-Only Read-Only Verification',
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"run_url=https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              f"commit={os.environ.get('GITHUB_SHA', '')}",
              f"tailscale={os.environ.get('TAILSCALE_OUTCOME', '')}",
              f"ssh={os.environ.get('SSH_OUTCOME', '')}",
              '',
              '--- sanitized output ---',
              *text.splitlines()[-150:],
          ]
          Path('remote/ipad-owner-verify-status.txt').write_text('\n'.join(lines) + '\n')
          PY
          git add remote/ipad-owner-verify-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record owner-only iPad verification [skip ci]"
            git push origin HEAD:main
          fi
