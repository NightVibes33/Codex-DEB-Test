name: Resolve iPad Secret Environment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ipad-environment-resolve.yml"
      - ".github/workflows/ipad-tailscale-ssh.yml"

permissions:
  actions: read
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment and publish status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            > environments.json

          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          target = int(sys.argv[1])
          payload = json.loads(Path("environments.json").read_text())
          found = None
          environments = payload.get("environments", [])
          for environment in environments:
              if int(environment.get("id", -1)) == target:
                  found = environment
                  break

          lines = [
              "iPad GitHub environment resolution",
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"run_url=https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              f"target_environment_id={target}",
              f"environment_count={len(environments)}",
          ]
          if found:
              lines.extend([
                  "resolved=true",
                  f"environment_name={found.get('name', '')}",
                  f"environment_id={found.get('id', '')}",
              ])
          else:
              lines.append("resolved=false")
              lines.append("available=" + ",".join(f"{item.get('id')}:{item.get('name')}" for item in environments))

          Path("remote/ipad-environment-status.txt").write_text("\n".join(lines) + "\n")
          if not found:
              raise SystemExit(1)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add remote/ipad-environment-status.txt
          git commit -m "Record iPad environment resolution [skip ci]"
          git push origin HEAD:main
