name: Verify Dark-Boot 2.0 on iPad

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: verify-dark-boot-ipad
  cancel-in-progress: true

env:
  IPAD_HOST: "100.116.117.65"

jobs:
  resolve-environment:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'NightVibes33' && github.event.issue.title == '[Verify Dark-Boot 2.0]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - name: Resolve bridge environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: "18728387881"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" \
            > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          target = int(sys.argv[1])
          data = json.load(open('environments.json', encoding='utf-8'))
          for env in data.get('environments', []):
              if int(env.get('id', -1)) == target:
                  print('environment_name=' + env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'NightVibes33' && github.event.issue.title == '[Verify Dark-Boot 2.0]')
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ env.IPAD_HOST }}
          version: latest

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass

      - name: Prepare SSH
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 20 -H -p 22 "$IPAD_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify installed package and Settings pane
        id: verify_before
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          : > dark-boot-verify.txt
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh -c '\''
              set -eu
              echo "=== BEFORE EXPLICIT RESPRING ==="
              echo "device=$(uname -m)"
              version=$(dpkg-query -W com.nightvibes33.darkboot | cut -f2)
              echo "installed_version=$version"
              test "$version" = "2.0.0"
              test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/DarkBoot.dylib
              test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/DarkBoot.plist
              test -x /var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle/DarkBootPrefs
              test -f /var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle/Info.plist
              test -f /var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle/Root.plist
              test -f /var/jb/Library/PreferenceLoader/Preferences/DarkBoot.plist
              grep -q "DarkBootPrefs" /var/jb/Library/PreferenceLoader/Preferences/DarkBoot.plist
              grep -q "Dark Boot" /var/jb/Library/PreferenceLoader/Preferences/DarkBoot.plist
              test -d "/var/mobile/Library/Application Support/DarkBoot"
              echo "tweak_dylib=present"
              echo "settings_bundle=present"
              echo "preference_loader_entry=present"
              echo "settings_label=Dark Boot"
              echo "media_directory=present"
              echo "springboard_pid_before=$(pgrep -f SpringBoard.app/SpringBoard | head -n1 || true)"
            '\''' 2>&1 | tee dark-boot-verify.txt

      - name: Explicitly refresh Settings and respring
        id: respring
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -uo pipefail
          set +e
          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh -c '\''killall -9 Preferences 2>/dev/null || true; if [ -x /var/jb/usr/bin/sbreload ]; then /var/jb/usr/bin/sbreload; elif [ -x /usr/bin/sbreload ]; then /usr/bin/sbreload; else killall -9 SpringBoard; fi'\''' \
            2>&1 | tee -a dark-boot-verify.txt
          code=${PIPESTATUS[1]}
          set -e
          echo "respring_ssh_exit=$code" | tee -a dark-boot-verify.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 255 ]; then
            exit "$code"
          fi
          sleep 20

      - name: Reconnect and verify after respring
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          connected=0
          for attempt in 1 2 3 4 5; do
            if sshpass -e ssh -p 22 \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              mobile@"$IPAD_HOST" 'true'; then
              connected=1
              break
            fi
            sleep 8
          done
          test "$connected" -eq 1

          printf '%s\n' "$IPAD_PASSWORD" | sshpass -e ssh -p 22 \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            mobile@"$IPAD_HOST" \
            'sudo -S -p "" sh -c '\''
              set -eu
              echo "=== AFTER EXPLICIT RESPRING ==="
              version=$(dpkg-query -W com.nightvibes33.darkboot | cut -f2)
              echo "installed_version=$version"
              test "$version" = "2.0.0"
              test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/DarkBoot.dylib
              test -x /var/jb/Library/PreferenceBundles/DarkBootPrefs.bundle/DarkBootPrefs
              test -f /var/jb/Library/PreferenceLoader/Preferences/DarkBoot.plist
              echo "tweak_dylib=present"
              echo "settings_bundle=present"
              echo "preference_loader_entry=present"
              echo "springboard_pid_after=$(pgrep -f SpringBoard.app/SpringBoard | head -n1 || true)"
              echo "verification_result=installed-settings-registered-respring-completed"
            '\''' 2>&1 | tee -a dark-boot-verify.txt

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-boot-ipad-verification-${{ github.run_id }}
          path: dark-boot-verify.txt
          retention-days: 7

      - name: Publish sanitized verification status
        if: always()
        env:
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_before.outcome }}
          RESPRING_OUTCOME: ${{ steps.respring.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('dark-boot-verify.txt').read_text(errors='replace') if Path('dark-boot-verify.txt').exists() else 'No verification output was produced.'
          password = os.environ.get('IPAD_PASSWORD', '')
          if password:
              text = text.replace(password, '***REDACTED***')
          lines = [
              'Dark-Boot 2.0 iPad Verification',
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}",
              f"run_url=https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              f"tailscale={os.environ.get('TAILSCALE_OUTCOME', '')}",
              f"verify_before={os.environ.get('VERIFY_OUTCOME', '')}",
              f"respring={os.environ.get('RESPRING_OUTCOME', '')}",
              '',
              '--- sanitized output ---',
              *text.splitlines()[-180:],
          ]
          Path('remote/dark-boot-verify-status.txt').write_text('\n'.join(lines) + '\n')
          PY
          git add remote/dark-boot-verify-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Dark-Boot iPad verification [skip ci]"
            git push origin HEAD:main
          fi
