name: Dispatch Gif2Ani 3.1.3 Safe Install

on:
  push:
    branches: [main]
    paths:
      - 'triggers/dispatch-install-gif2ani-313-*'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch installer
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          http_code=$(curl --silent --show-error \
            -o dispatch-response.txt \
            -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/install-gif2ani-3.1.3-safe.yml/dispatches" \
            -d '{"ref":"main"}')
          code=$?
          set -e
          echo "curl_exit=$code" | tee dispatch-status.txt
          echo "http_code=$http_code" | tee -a dispatch-status.txt
          if [ -s dispatch-response.txt ]; then cat dispatch-response.txt | tee -a dispatch-status.txt; fi
          test "$code" -eq 0
          test "$http_code" = "204"
      - name: Publish dispatch status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          {
            echo "Gif2Ani 3.1.3 Safe Install Dispatch"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "outcome=${{ steps.dispatch.outcome }}"
            echo
            cat dispatch-status.txt 2>/dev/null || echo "No dispatch output."
          } > remote/gif2ani-313-install-dispatch.txt
          git add remote/gif2ani-313-install-dispatch.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Gif2Ani 3.1.3 install dispatch [skip ci]"
            git push origin HEAD:main
          fi
