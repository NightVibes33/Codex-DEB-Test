name: Check Gif2Ani 3.1.3 Race Fix V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - triggers/check-gif2ani-3.1.3-racefix-v2.txt

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest validation run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/test-gif2ani-3.1.3-racefix-v2.yml/runs?per_page=5" > runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          runs=json.load(open('runs.json')).get('workflow_runs',[])
          lines=['Gif2Ani 3.1.3 Race-Fix V2 Workflow Status']
          for run in runs:
              lines.extend([
                  f"run_id={run.get('id','')}",
                  f"status={run.get('status','')}",
                  f"conclusion={run.get('conclusion','')}",
                  f"head_sha={run.get('head_sha','')}",
                  f"created_at={run.get('created_at','')}",
                  f"updated_at={run.get('updated_at','')}",
                  '---',
              ])
          Path('/tmp/gif2ani-313-racefix-v2-workflow-status.txt').write_text('\n'.join(lines)+'\n')
          PY
      - name: Publish status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git reset --hard HEAD
            git pull --rebase origin main
            mkdir -p remote
            cp /tmp/gif2ani-313-racefix-v2-workflow-status.txt remote/gif2ani-313-racefix-v2-workflow-status.txt
            git add remote/gif2ani-313-racefix-v2-workflow-status.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Gif2Ani 3.1.3 race-fix V2 workflow status [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
