name: ByeTunes15 Exact SQLite Set Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - temp/byetunes-ios16-rootless
    paths:
      - 'triggers/byetunes15-recover-exact-sqlite-set.txt'

permissions:
  actions: read
  contents: read

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.e.outputs.name }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json
          for e in json.load(open('/tmp/e.json')).get('environments', []):
              if int(e.get('id', -1)) == 18728387881:
                  print('name=' + e['name']); break
          else: raise SystemExit('environment not found')
          PY

  recover:
    needs: env
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: '100.96.37.124'
      PORT: '22'
      SSHPASS: ${{ secrets.IPAD_PASSWORD }}
      PASS: ${{ secrets.IPAD_PASSWORD }}
    steps:
      - name: Download exact pre-write safety snapshot
        uses: actions/download-artifact@v4
        with:
          name: ByeTunes15-reversible-write-33469197344
          run-id: 33469197344
          github-token: ${{ github.token }}
          path: /tmp/recovery

      - name: Verify exact snapshot set on runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass sqlite3 netcat-openbsd
          SRC="$(find /tmp/recovery -type d -path '*/prewrite-db' -print | head -n1)"
          test -n "$SRC"
          test -f "$SRC/MediaLibrary.sqlitedb"
          mkdir -p /tmp/exact
          cp "$SRC/MediaLibrary.sqlitedb" /tmp/exact/
          [ ! -f "$SRC/MediaLibrary.sqlitedb-wal" ] || cp "$SRC/MediaLibrary.sqlitedb-wal" /tmp/exact/
          [ ! -f "$SRC/MediaLibrary.sqlitedb-shm" ] || cp "$SRC/MediaLibrary.sqlitedb-shm" /tmp/exact/
          ls -la /tmp/exact | tee exact-files.txt
          (cd /tmp/exact && sha256sum MediaLibrary.sqlitedb*) | tee exact-sha256.txt
          QC="$(sqlite3 /tmp/exact/MediaLibrary.sqlitedb 'PRAGMA quick_check;')"
          UV="$(sqlite3 /tmp/exact/MediaLibrary.sqlitedb 'PRAGMA user_version;')"
          T="$(sqlite3 /tmp/exact/MediaLibrary.sqlitedb "SELECT count(*) FROM item_extra WHERE title='ByeTunes15 Synthetic Smoke';")"
          P="$(sqlite3 /tmp/exact/MediaLibrary.sqlitedb "SELECT count(*) FROM container WHERE name='ByeTunes15 Synthetic Playlist';")"
          printf 'quick_check=%s\nuser_version=%s\ntest_track=%s\ntest_playlist=%s\n' "$QC" "$UV" "$T" "$P" | tee exact-source-check.txt
          test "$QC" = ok
          test "$T" = 0
          test "$P" = 0

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Gate exact iPhone
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          tailscale ping --timeout=5s --c 1 "$HOST" | tee device.txt || true
          timeout 8s ssh-keyscan -T 5 -H -p "$PORT" "$HOST" > "$HOME/.ssh/known_hosts" 2>>device.txt
          test -s "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat >/tmp/gate.sh <<'SH'
          set -eu
          P=/System/Library/CoreServices/SystemVersion.plist
          V="$(sed -n '/<key>ProductVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P" | head -n1)"
          M="$(sysctl -n hw.machine 2>/dev/null || /usr/sbin/sysctl -n hw.machine 2>/dev/null || uname -m)"
          echo "machine=$M version=$V"
          [ "$M" = iPhone8,1 ] || exit 20
          [ "$V" = 15.8.8 ] || exit 21
          echo EXACT_RECOVERY_GATE_PASS
          SH
          { printf '%s\n' "$PASS"; cat /tmp/gate.sh; } | timeout 35s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' | tee gate.txt
          grep -q EXACT_RECOVERY_GATE_PASS gate.txt

      - name: Upload exact SQLite set to staging
        run: |
          set -euo pipefail
          { printf '%s\n' "$PASS"; echo 'rm -rf /var/mobile/ByeTunesExactRecoveryStage; mkdir -p /var/mobile/ByeTunesExactRecoveryStage; chown mobile:mobile /var/mobile/ByeTunesExactRecoveryStage; chmod 700 /var/mobile/ByeTunesExactRecoveryStage'; } | sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s'
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/exact/MediaLibrary.sqlitedb* "mobile@$HOST:/var/mobile/ByeTunesExactRecoveryStage/"
          rm -rf /tmp/roundtrip; mkdir -p /tmp/roundtrip
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST:/var/mobile/ByeTunesExactRecoveryStage/MediaLibrary.sqlitedb*" /tmp/roundtrip/
          (cd /tmp/roundtrip && sha256sum MediaLibrary.sqlitedb*) | sort > /tmp/roundtrip.sha
          (cd /tmp/exact && sha256sum MediaLibrary.sqlitedb*) | sort > /tmp/original.sha
          cat /tmp/roundtrip.sha | tee roundtrip-sha256.txt
          diff -u /tmp/original.sha /tmp/roundtrip.sha
          echo EXACT_SET_TRANSFER_VERIFIED

      - name: Restore exact DB WAL SHM set
        run: |
          set -euo pipefail
          cat >/tmp/restore.sh <<'SH'
          set -eu
          DB=/var/mobile/Media/iTunes_Control/iTunes/MediaLibrary.sqlitedb
          DIR=/var/mobile/Media/iTunes_Control/iTunes
          ST=/var/mobile/ByeTunesExactRecoveryStage
          SAFE=/var/mobile/Library/ByeTunes16/EmergencyRecovery2
          LABEL=com.nightvibes.byetunes16d
          PLIST=/var/jb/Library/LaunchDaemons/com.nightvibes.byetunes16d.plist
          test -f "$ST/MediaLibrary.sqlitedb"
          killall Music >/dev/null 2>&1 || true
          launchctl bootout "system/$LABEL" >/dev/null 2>&1 || true
          sleep 1
          rm -rf "$SAFE"; mkdir -p "$SAFE"
          cp "$DB" "$SAFE/MediaLibrary-current.sqlitedb" 2>/dev/null || true
          [ ! -f "$DB-wal" ] || cp "$DB-wal" "$SAFE/MediaLibrary-current.sqlitedb-wal"
          [ ! -f "$DB-shm" ] || cp "$DB-shm" "$SAFE/MediaLibrary-current.sqlitedb-shm"
          chown -R mobile:mobile "$SAFE" 2>/dev/null || true
          chmod 700 "$SAFE"; chmod 600 "$SAFE"/* 2>/dev/null || true

          rm -f "$DB" "$DB-wal" "$DB-shm"
          cp "$ST/MediaLibrary.sqlitedb" "$DB"
          [ ! -f "$ST/MediaLibrary.sqlitedb-wal" ] || cp "$ST/MediaLibrary.sqlitedb-wal" "$DB-wal"
          [ ! -f "$ST/MediaLibrary.sqlitedb-shm" ] || cp "$ST/MediaLibrary.sqlitedb-shm" "$DB-shm"
          chown mobile:mobile "$DB" 2>/dev/null || true
          chmod 0644 "$DB"
          [ ! -f "$DB-wal" ] || { chown mobile:mobile "$DB-wal" 2>/dev/null || true; chmod 0644 "$DB-wal"; }
          [ ! -f "$DB-shm" ] || { chown mobile:mobile "$DB-shm" 2>/dev/null || true; chmod 0644 "$DB-shm"; }
          rm -f /var/mobile/ByeTunes15Synthetic.wav
          rm -f /var/mobile/Media/iTunes_Control/Music/F00/ARTNA3NB3A66.wav
          rmdir /var/mobile/Media/iTunes_Control/Music/F00 2>/dev/null || true
          rmdir /var/mobile/Media/iTunes_Control/Music 2>/dev/null || true
          rm -rf "$ST"
          launchctl bootstrap system "$PLIST" >/dev/null 2>&1 || launchctl load "$PLIST" >/dev/null 2>&1 || true
          launchctl kickstart -k "system/$LABEL" >/dev/null 2>&1 || true
          sleep 3
          echo EXACT_SQLITE_SET_RESTORED
          SH
          { printf '%s\n' "$PASS"; cat /tmp/restore.sh; } | timeout 60s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' | tee restore.txt
          grep -q EXACT_SQLITE_SET_RESTORED restore.txt

      - name: Verify daemon recovered library
        run: |
          set -euo pipefail
          sshpass -e ssh -f -N -L 45981:127.0.0.1:45981 -p "$PORT" -o ExitOnForwardFailure=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST"
          sleep 2
          printf '%s\n' '{"op":"probe"}' | nc -w 10 127.0.0.1 45981 | tee probe.json
          grep -q '"ok":true' probe.json
          grep -q '"quickCheck":"ok"' probe.json
          grep -q '"schemaOK":true' probe.json
          printf '%s\n' '{"op":"library","limit":1000}' | nc -w 15 127.0.0.1 45981 > library.json
          printf '%s\n' '{"op":"playlists"}' | nc -w 15 127.0.0.1 45981 > playlists.json
          python3 - <<'PY'
          import json
          lib=json.load(open('library.json')); pls=json.load(open('playlists.json'))
          assert lib.get('ok') is True, lib
          assert pls.get('ok') is True, pls
          assert not any(x.get('title')=='ByeTunes15 Synthetic Smoke' for x in lib.get('songs',[])), 'synthetic track remains'
          assert not any(x.get('name')=='ByeTunes15 Synthetic Playlist' for x in pls.get('playlists',[])), 'synthetic playlist remains'
          print('EXACT_RECOVERED_API_CLEAN')
          PY

      - name: Verify exact recovered DB off-device
        run: |
          set -euo pipefail
          cat >/tmp/snapshot.sh <<'SH'
          set -eu
          DB=/var/mobile/Media/iTunes_Control/iTunes/MediaLibrary.sqlitedb
          TMP=/var/mobile/ByeTunesExactRecoveredCheck
          rm -rf "$TMP"; mkdir -p "$TMP"
          cp "$DB" "$TMP/MediaLibrary.sqlitedb"
          [ ! -f "$DB-wal" ] || cp "$DB-wal" "$TMP/MediaLibrary.sqlitedb-wal"
          [ ! -f "$DB-shm" ] || cp "$DB-shm" "$TMP/MediaLibrary.sqlitedb-shm"
          chown -R mobile:mobile "$TMP" 2>/dev/null || true
          chmod 700 "$TMP"; chmod 600 "$TMP"/*
          SH
          { printf '%s\n' "$PASS"; cat /tmp/snapshot.sh; } | sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s'
          rm -rf /tmp/final; mkdir -p /tmp/final
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST:/var/mobile/ByeTunesExactRecoveredCheck/MediaLibrary.sqlitedb*" /tmp/final/
          QC="$(sqlite3 /tmp/final/MediaLibrary.sqlitedb 'PRAGMA quick_check;')"
          UV="$(sqlite3 /tmp/final/MediaLibrary.sqlitedb 'PRAGMA user_version;')"
          T="$(sqlite3 /tmp/final/MediaLibrary.sqlitedb "SELECT count(*) FROM item_extra WHERE title='ByeTunes15 Synthetic Smoke';")"
          P="$(sqlite3 /tmp/final/MediaLibrary.sqlitedb "SELECT count(*) FROM container WHERE name='ByeTunes15 Synthetic Playlist';")"
          printf 'quick_check=%s\nuser_version=%s\ntest_track=%s\ntest_playlist=%s\n' "$QC" "$UV" "$T" "$P" | tee final-integrity.txt
          test "$QC" = ok
          test "$T" = 0
          test "$P" = 0
          { printf '%s\n' "$PASS"; echo 'rm -rf /var/mobile/ByeTunesExactRecoveredCheck'; } | sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s'
          echo EXACT_RECOVERY_PASS

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ByeTunes15-exact-recovery-${{ github.run_id }}
          path: |
            exact-files.txt
            exact-sha256.txt
            exact-source-check.txt
            device.txt
            gate.txt
            roundtrip-sha256.txt
            restore.txt
            probe.json
            library.json
            playlists.json
            final-integrity.txt
          if-no-files-found: ignore
          retention-days: 14
