name: Misaka 15.8.8 Compatibility Build Install

on:
  workflow_dispatch:
  push:
    branches: [temp/byetunes-ios16-rootless]
    paths:
      - 'misaka15compat/**'
      - '.github/workflows/misaka15compat-build-install.yml'
      - 'triggers/misaka15compat-build-install.txt'

permissions:
  actions: read
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.e.outputs.name }}
    steps:
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" >/tmp/e.json
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json
          for e in json.load(open('/tmp/e.json')).get('environments', []):
              if int(e.get('id', -1)) == 18728387881:
                  print('name=' + e['name']); break
          else: raise SystemExit('environment not found')
          PY

  build:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/byetunes-ios16-rootless

      - name: Select Xcode 15
        run: |
          set -euo pipefail
          candidate=''
          for path in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app /Applications/Xcode_15.2.app /Applications/Xcode_15.1.app /Applications/Xcode.app; do
            if [ -d "$path" ]; then candidate="$path"; break; fi
          done
          test -n "$candidate"
          sudo xcode-select --switch "$candidate"
          xcodebuild -version

      - name: Install packaging tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid dpkg findutils coreutils
          cache: true
          cache-path: ~/__cache

      - name: Install Theos and SDK
        run: |
          set -euo pipefail
          rm -rf "$THEOS" /tmp/theos-sdks
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -a /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build compatibility DEB
        run: |
          set -o pipefail
          make -C misaka15compat clean package FINALPACKAGE=1 2>&1 | tee misaka15compat-build.log

      - name: Validate compatibility DEB
        run: |
          set -euo pipefail
          DEB="$(find misaka15compat/packages -maxdepth 1 -type f -name '*.deb' -print | head -n1)"
          test -n "$DEB"
          test "$(dpkg-deb --field "$DEB" Package)" = com.nightvibes.misaka15compat
          test "$(dpkg-deb --field "$DEB" Version)" = 0.1.0
          dpkg-deb --contents "$DEB" | tee misaka15compat-contents.txt
          grep -Fq 'Library/MobileSubstrate/DynamicLibraries/Misaka15Compat.dylib' misaka15compat-contents.txt
          grep -Fq 'usr/bin/misaka15launch' misaka15compat-contents.txt
          rm -rf /tmp/misaka15compat-root
          dpkg-deb -x "$DEB" /tmp/misaka15compat-root
          DYLIB=/tmp/misaka15compat-root/var/jb/Library/MobileSubstrate/DynamicLibraries/Misaka15Compat.dylib
          TOOL=/tmp/misaka15compat-root/var/jb/usr/bin/misaka15launch
          test -f "$DYLIB" && test -x "$TOOL"
          file "$DYLIB" "$TOOL" | tee misaka15compat-binary.txt
          otool -l "$DYLIB" "$TOOL" | tee misaka15compat-otool.txt
          shasum -a 256 "$DEB" | tee misaka15compat-sha256.txt
          cp "$DEB" Misaka15Compat-0.1.0-rootless.deb
          echo BUILD_VALIDATE_PASS | tee misaka15compat-validation.txt

      - name: Upload compatibility DEB
        uses: actions/upload-artifact@v4
        with:
          name: Misaka15Compat-0.1.0-rootless
          path: Misaka15Compat-0.1.0-rootless.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Misaka15Compat-build-${{ github.run_id }}
          path: |
            misaka15compat-build.log
            misaka15compat-contents.txt
            misaka15compat-binary.txt
            misaka15compat-otool.txt
            misaka15compat-sha256.txt
            misaka15compat-validation.txt
          if-no-files-found: ignore
          retention-days: 14

  install:
    needs: [env, build]
    environment:
      name: ${{ needs.env.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PORT: '22'
      SSHPASS: ${{ secrets.IPAD_PASSWORD }}
      PASS: ${{ secrets.IPAD_PASSWORD }}
    steps:
      - name: Download compatibility DEB
        uses: actions/download-artifact@v4
        with:
          name: Misaka15Compat-0.1.0-rootless
          path: /tmp/a

      - name: Prepare runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client sshpass
          DEB="$(find /tmp/a -name '*.deb' -type f | head -n1)"
          test -n "$DEB"
          cp "$DEB" /tmp/Misaka15Compat.deb
          sha256sum /tmp/Misaka15Compat.deb | tee local-sha256.txt

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Discover exact target iPhone
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          tailscale status --json >/tmp/ts.json
          python3 - <<'PY' >/tmp/candidates.txt
          import json,ipaddress
          d=json.load(open('/tmp/ts.json')); rows=[]
          for p in d.get('Peer',{}).values():
              name=((p.get('HostName') or '')+' '+(p.get('DNSName') or '')).strip(); online=bool(p.get('Online'))
              for ip in p.get('TailscaleIPs') or []:
                  try:a=ipaddress.ip_address(ip)
                  except ValueError:continue
                  if a.version==4: rows.append((0 if 'iphone' in name.lower() else 1,0 if online else 1,ip,name,online))
          for _,_,ip,name,online in sorted(rows): print(f'{ip}|{name}|{online}')
          PY
          : > peer-probes.txt
          cat >/tmp/gate.sh <<'SH'
          set -eu
          P=/System/Library/CoreServices/SystemVersion.plist
          V="$(sed -n '/<key>ProductVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$P" | head -n1)"
          M="$(sysctl -n hw.machine 2>/dev/null || /usr/sbin/sysctl -n hw.machine 2>/dev/null || uname -m)"
          [ "$M" = iPhone8,1 ] || exit 20
          [ "$V" = 15.8.8 ] || exit 21
          [ -d /var/jb ] || exit 22
          U="$(command -v uicache || true)"; [ -n "$U" ] || U=/var/jb/usr/bin/uicache
          "$U" -l 2>/dev/null | grep -q '^com\.straight-tamago\.misakaRS ' || exit 23
          echo TARGET_GATE_PASS
          SH
          HOST=''
          for round in 1 2 3; do
            while IFS='|' read -r ip name online; do
              echo "--- $ip $name online=$online ---" | tee -a peer-probes.txt
              timeout 7s ssh-keyscan -T 5 -H -p "$PORT" "$ip" >/tmp/kh 2>>peer-probes.txt || continue
              [ -s /tmp/kh ] || continue
              set +e
              OUT="$({ printf '%s\n' "$PASS"; cat /tmp/gate.sh; } | timeout 30s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/kh "mobile@$ip" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' 2>&1)"; RC=$?
              set -e
              printf '%s\n' "$OUT" | tee -a peer-probes.txt
              if [ "$RC" -eq 0 ] && printf '%s\n' "$OUT" | grep -q TARGET_GATE_PASS; then HOST="$ip"; cp /tmp/kh "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"; break; fi
            done </tmp/candidates.txt
            [ -n "$HOST" ] && break
            sleep 7
          done
          test -n "$HOST"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "selected_host=$HOST" | tee selected.txt

      - name: Transfer and install shim
        run: |
          set -euo pipefail
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" /tmp/Misaka15Compat.deb "mobile@$HOST:/var/mobile/Misaka15Compat.deb"
          cat >/tmp/install.sh <<'SH'
          set -eu
          D=/var/jb/usr/bin/dpkg; [ -x "$D" ] || D="$(command -v dpkg)"
          killall misaka >/dev/null 2>&1 || true
          "$D" -i /var/mobile/Misaka15Compat.deb
          "$D" -s com.nightvibes.misaka15compat
          test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/Misaka15Compat.dylib
          test -f /var/jb/Library/MobileSubstrate/DynamicLibraries/Misaka15Compat.plist
          test -x /var/jb/usr/bin/misaka15launch
          echo SHIM_INSTALL_PASS
          SH
          { printf '%s\n' "$PASS"; cat /tmp/install.sh; } | timeout 60s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' | tee install.txt
          grep -q SHIM_INSTALL_PASS install.txt

      - name: Launch Misaka and verify compatibility
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'rm -f /tmp/misaka-crashes-before.txt; find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f -iname "*misaka*.ips" -print 2>/dev/null | sort > /tmp/misaka-crashes-before.txt; /var/jb/usr/bin/misaka15launch' | tee launch.txt
          sleep 12
          cat >/tmp/verify.sh <<'SH'
          set -eu
          echo '=== PROCESS ==='
          pgrep -fl misaka || true
          pgrep -x misaka >/dev/null
          echo '=== PREF MARKERS ==='
          PREF="$(find /var/mobile/Containers/Data/Application -path '*/Library/Preferences/com.straight-tamago.misakaRS.plist' -print 2>/dev/null | head -n1)"
          echo "pref=$PREF"
          [ -n "$PREF" ]
          plutil -p "$PREF" 2>/dev/null | grep -q 'NightVibesMisaka15CompatLoaded.*true'
          plutil -p "$PREF" 2>/dev/null | grep -q 'NightVibesMisaka15CompatInterceptedKFD.*true'
          echo '=== CRASH DELTA ==='
          find /var/mobile/Library/Logs/CrashReporter -maxdepth 1 -type f -iname '*misaka*.ips' -print 2>/dev/null | sort > /tmp/misaka-crashes-after.txt
          NEW="$(comm -13 /tmp/misaka-crashes-before.txt /tmp/misaka-crashes-after.txt || true)"
          printf '%s\n' "$NEW"
          [ -z "$NEW" ]
          echo MISAKA_15_8_8_COMPAT_PASS
          SH
          { printf '%s\n' "$PASS"; cat /tmp/verify.sh; } | timeout 60s sshpass -e ssh -p "$PORT" -o BatchMode=no -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "mobile@$HOST" 'S="$(command -v sh || echo /var/jb/bin/sh)"; sudo -k; exec sudo -S -p "" "$S" -s' | tee verify.txt
          grep -q MISAKA_15_8_8_COMPAT_PASS verify.txt

      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Misaka15Compat-live-${{ github.run_id }}
          path: |
            local-sha256.txt
            peer-probes.txt
            selected.txt
            install.txt
            launch.txt
            verify.txt
          if-no-files-found: ignore
          retention-days: 14
