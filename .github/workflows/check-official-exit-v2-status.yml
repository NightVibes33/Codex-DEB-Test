name: Check launchd Flag Sync Status

on:
  push:
    branches: [main]
    paths:
      - triggers/check-official-exit-v2-status.txt

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query latest launchd flag sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/sync-launchd-palera1n-flags.yml/runs?per_page=5" > runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          runs=json.load(open('runs.json')).get('workflow_runs',[])
          out=['launchd Flag Sync Workflow Status']
          if not runs:
              out.append('no_runs_found=yes')
          else:
              run=runs[0]
              out += [f"run_id={run['id']}",f"status={run['status']}",f"conclusion={run.get('conclusion')}",f"event={run['event']}",f"head_sha={run['head_sha']}",f"created_at={run['created_at']}",f"updated_at={run['updated_at']}"]
          Path('remote/launchd-flag-sync-workflow-status.txt').write_text('\n'.join(out)+'\n')
          PY
          run_id=$(grep '^run_id=' remote/launchd-flag-sync-workflow-status.txt | cut -d= -f2 || true)
          if [ -n "$run_id" ]; then
            curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > jobs.json
            python3 - <<'PY' >> remote/launchd-flag-sync-workflow-status.txt
          import json
          for job in json.load(open('jobs.json')).get('jobs',[]):
              print(f"job={job['name']} status={job['status']} conclusion={job.get('conclusion')} id={job['id']}")
              for step in job.get('steps',[]):
                  print(f"  step={step['number']} {step['name']} status={step['status']} conclusion={step.get('conclusion')}")
          PY
          fi
      - name: Publish status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add remote/launchd-flag-sync-workflow-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record launchd flag sync workflow status [skip ci]"
            git push origin HEAD:main
          fi
