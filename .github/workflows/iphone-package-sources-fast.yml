name: iPhone Sileo Zebra Source Repair

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-package-sources-fast.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-package-sources-fast
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null
      - name: Repair Sileo cache and Zebra filters without deleting sources
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set -eu
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="/var/mobile/Documents/CodexPackageManagerBackups/$TS/EmptySourceRepair"
          SILEO_CACHE='/var/jb/var/mobile/Library/Caches/Sileo'
          SILEO_HTTP='/var/mobile/Library/Caches/org.coolstar.SileoStore'
          ZPREF='/var/jb/var/mobile/Library/Preferences/xyz.willy.Zebra.plist'
          SPREF='/var/jb/var/mobile/Library/Preferences/org.coolstar.SileoStore.plist'
          ZDIR='/var/mobile/Library/Application Support/xyz.willy.Zebra'
          ZDB="$ZDIR/zebra.db"
          ZSRC="$ZDIR/sources.list"

          echo '=== SILEO + ZEBRA EMPTY SOURCE REPAIR ==='
          echo 'DELETE_COMMANDS_USED=0'
          echo 'PACKAGES_REMOVED=0'
          echo 'TWEAKS_REMOVED=0'
          echo 'SOURCE_ENTRIES_REMOVED=0'
          echo 'APT_PACKAGE_INDEXES_REMOVED=0'
          echo "backup_dir=$BACKUP"
          mkdir -p "$BACKUP"
          chmod 700 "$BACKUP" 2>/dev/null || true
          chown mobile:mobile "$BACKUP" 2>/dev/null || true

          echo '--- immutable-data fingerprints before ---'
          APT_SRC_HASH_BEFORE="$(find /var/jb/etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -print 2>/dev/null | sort | while IFS= read -r f; do sha256sum "$f"; done | sha256sum | awk '{print $1}')"
          ZSRC_HASH_BEFORE="$(sha256sum "$ZSRC" | awk '{print $1}')"
          ZDB_HASH_BEFORE="$(sha256sum "$ZDB" | awk '{print $1}')"
          APT_RECORDS_BEFORE="$(grep -ah '^Package:' /var/jb/var/lib/apt/lists/*Packages* 2>/dev/null | wc -l | tr -d ' ')"
          echo "apt_source_set_sha256_before=$APT_SRC_HASH_BEFORE"
          echo "zebra_sources_sha256_before=$ZSRC_HASH_BEFORE"
          echo "zebra_db_sha256_before=$ZDB_HASH_BEFORE"
          echo "apt_package_records_before=$APT_RECORDS_BEFORE"

          echo '--- preserve exactly what will be changed ---'
          [ -f "$ZPREF" ] && { cp -p "$ZPREF" "$BACKUP/xyz.willy.Zebra.plist"; echo "zebra_prefs_backup=$BACKUP/xyz.willy.Zebra.plist"; }
          [ -f "$SPREF" ] && { cp -p "$SPREF" "$BACKUP/org.coolstar.SileoStore.plist"; echo "sileo_prefs_backup=$BACKUP/org.coolstar.SileoStore.plist"; }

          # Stop only the two package managers before moving their derived cache / changing defaults.
          killall Sileo 2>/dev/null || true
          killall Zebra 2>/dev/null || true

          echo '--- Sileo: preserve stale derived cache, create clean cache root ---'
          if [ -d "$SILEO_CACHE" ]; then
            SILEO_CACHE_OLD="$SILEO_CACHE.before-source-fix-$TS"
            mv "$SILEO_CACHE" "$SILEO_CACHE_OLD"
            echo "sileo_cache_preserved=$SILEO_CACHE_OLD"
          fi
          mkdir -p "$SILEO_CACHE"
          chown mobile:mobile "$SILEO_CACHE" 2>/dev/null || true
          chmod 755 "$SILEO_CACHE" 2>/dev/null || true

          if [ -d "$SILEO_HTTP" ]; then
            SILEO_HTTP_OLD="$SILEO_HTTP.before-source-fix-$TS"
            mv "$SILEO_HTTP" "$SILEO_HTTP_OLD"
            echo "sileo_http_cache_preserved=$SILEO_HTTP_OLD"
          fi
          mkdir -p "$SILEO_HTTP"
          chown mobile:mobile "$SILEO_HTTP" 2>/dev/null || true
          chmod 755 "$SILEO_HTTP" 2>/dev/null || true

          # Explicitly keep automatic source refresh enabled. No source definition is modified.
          if command -v defaults >/dev/null 2>&1; then
            sudo -u mobile defaults write org.coolstar.SileoStore AutoRefreshSources -bool true
          fi

          echo '--- Zebra: clear only package-hiding filters and restore sane refresh timeout ---'
          if command -v defaults >/dev/null 2>&1; then
            for key in FilteredSources FilteredSections BlockedAuthors FeaturedSourceBlacklist; do
              sudo -u mobile defaults delete xyz.willy.Zebra "$key" 2>/dev/null || true
            done
            sudo -u mobile defaults write xyz.willy.Zebra FilterIncompatibleArchitectures -bool false
            sudo -u mobile defaults write xyz.willy.Zebra Role -int 3
            sudo -u mobile defaults write xyz.willy.Zebra SourceTimeout -int 60
            sudo -u mobile defaults write xyz.willy.Zebra AutoRefresh -bool true
          else
            echo 'ERROR=defaults tool missing; refusing partial Zebra preference repair'
            exit 31
          fi

          echo '--- repaired preference verification ---'
          echo -n 'zebra_FilteredSources='; sudo -u mobile defaults read xyz.willy.Zebra FilteredSources 2>&1 || echo '<absent>'
          echo -n 'zebra_FilteredSections='; sudo -u mobile defaults read xyz.willy.Zebra FilteredSections 2>&1 || echo '<absent>'
          echo -n 'zebra_BlockedAuthors='; sudo -u mobile defaults read xyz.willy.Zebra BlockedAuthors 2>&1 || echo '<absent>'
          echo -n 'zebra_FilterIncompatibleArchitectures='; sudo -u mobile defaults read xyz.willy.Zebra FilterIncompatibleArchitectures 2>&1 || true
          echo -n 'zebra_Role='; sudo -u mobile defaults read xyz.willy.Zebra Role 2>&1 || true
          echo -n 'zebra_SourceTimeout='; sudo -u mobile defaults read xyz.willy.Zebra SourceTimeout 2>&1 || true
          echo -n 'zebra_AutoRefresh='; sudo -u mobile defaults read xyz.willy.Zebra AutoRefresh 2>&1 || true
          echo -n 'sileo_AutoRefreshSources='; sudo -u mobile defaults read org.coolstar.SileoStore AutoRefreshSources 2>&1 || true

          echo '--- immutable-data fingerprints after ---'
          APT_SRC_HASH_AFTER="$(find /var/jb/etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -print 2>/dev/null | sort | while IFS= read -r f; do sha256sum "$f"; done | sha256sum | awk '{print $1}')"
          ZSRC_HASH_AFTER="$(sha256sum "$ZSRC" | awk '{print $1}')"
          ZDB_HASH_AFTER="$(sha256sum "$ZDB" | awk '{print $1}')"
          APT_RECORDS_AFTER="$(grep -ah '^Package:' /var/jb/var/lib/apt/lists/*Packages* 2>/dev/null | wc -l | tr -d ' ')"
          echo "apt_source_set_sha256_after=$APT_SRC_HASH_AFTER"
          echo "zebra_sources_sha256_after=$ZSRC_HASH_AFTER"
          echo "zebra_db_sha256_after=$ZDB_HASH_AFTER"
          echo "apt_package_records_after=$APT_RECORDS_AFTER"

          [ "$APT_SRC_HASH_BEFORE" = "$APT_SRC_HASH_AFTER" ] || { echo 'ERROR=APT source definitions changed unexpectedly'; exit 41; }
          [ "$ZSRC_HASH_BEFORE" = "$ZSRC_HASH_AFTER" ] || { echo 'ERROR=Zebra sources.list changed unexpectedly'; exit 42; }
          [ "$ZDB_HASH_BEFORE" = "$ZDB_HASH_AFTER" ] || { echo 'ERROR=Zebra DB changed unexpectedly'; exit 43; }
          [ "$APT_RECORDS_AFTER" -gt 1000 ] || { echo 'ERROR=APT package indexes are unexpectedly empty'; exit 44; }

          echo 'APT_SOURCES_UNCHANGED=1'
          echo 'ZEBRA_SOURCES_UNCHANGED=1'
          echo 'ZEBRA_DATABASE_UNCHANGED=1'
          echo 'SILEO_DERIVED_CACHE_RESET=1'
          echo 'ZEBRA_FILTER_STATE_REPAIRED=1'
          echo 'ORIGINAL_CHANGED_FILES_PRESERVED=1'
          echo 'RESULT=Both package managers are staged to reload healthy source/package data on next real GUI launch.'
          EOS
          } | timeout 120 sshpass -e ssh -o BatchMode=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" mobile@"$IPHONE_HOST" 'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' 2>&1 | tee source-repair.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-source-repair-${{ github.run_id }}
          path: source-repair.txt
          retention-days: 7
