name: iPhone A9 CPU GPU DVFS Probe

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-package-sources-fast.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-a9-dvfs-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null
      - name: Read A9 CPU GPU power-management state
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set +e
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          echo '=== READ-ONLY A9 CPU/GPU DVFS PROBE ==='
          echo 'DEVICE_WRITES=0'
          echo 'KERNEL_WRITES=0'
          echo 'PMGR_WRITES=0'
          echo 'THERMAL_CHANGES=0'

          echo '=== BASIC HARDWARE ==='
          uname -a 2>&1 || true
          for k in hw.machine hw.model hw.ncpu hw.physicalcpu hw.logicalcpu hw.cpufrequency hw.cpufrequency_max hw.cpufrequency_min hw.busfrequency hw.memsize kern.osversion; do
            printf '%s=' "$k"; sysctl -n "$k" 2>/dev/null || echo '<unavailable>'
          done

          echo '=== SOC VARIANT / DEVICE TREE ID ==='
          if command -v ioreg >/dev/null 2>&1; then
            ioreg -p IODeviceTree -l -w0 2>/dev/null | grep -Eai 's8000|s8003|APL0898|APL1022|chip-id|board-id|product-name|compatible' | head -n 120 || true
          else
            echo 'ioreg_unavailable=1'
          fi

          echo '=== CPU / PMGR / CLPC MATCHES ==='
          if command -v ioreg >/dev/null 2>&1; then
            ioreg -p IODeviceTree -l -w0 2>/dev/null | grep -Eai 'cpu[0-9]|pmgr|clpc|dvfs|voltage-state|perf-state|frequency|pll|clock' | head -n 260 || true
            echo '--- service classes ---'
            ioreg -l -w0 2>/dev/null | grep -Eai 'ApplePMGR|AppleCLPC|Apple.*CPU|cpufreq|DVFS' | head -n 180 || true
          fi

          echo '=== GPU / POWERVR MATCHES ==='
          if command -v ioreg >/dev/null 2>&1; then
            ioreg -p IODeviceTree -l -w0 2>/dev/null | grep -Eai 'gpu|sgx|powervr|pvr|gfx|graphics|voltage-state|perf-state|frequency|clock' | head -n 300 || true
            echo '--- GPU service classes ---'
            ioreg -l -w0 2>/dev/null | grep -Eai 'gpu|sgx|powervr|pvr|gfx|graphics' | head -n 220 || true
          fi

          echo '=== SYSCTL CPU/GPU/THERMAL MATCHES ==='
          sysctl -a 2>/dev/null | grep -Eai 'cpu.*freq|freq.*cpu|gpu|thermal|thrott|perflevel|power' | head -n 220 || true

          echo '=== AVAILABLE LOW-LEVEL TOOLS ==='
          for x in ioreg sysctl nvram kmem kread kwrite memtool devmem jbctl; do
            printf '%s=' "$x"; command -v "$x" 2>/dev/null || echo '<missing>'
          done

          echo 'RESULT=read-only probe complete'
          EOS
          } | timeout 100 sshpass -e ssh -o BatchMode=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" mobile@"$IPHONE_HOST" 'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' 2>&1 | tee a9-dvfs-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-a9-dvfs-probe-${{ github.run_id }}
          path: a9-dvfs-probe.txt
          retention-days: 7
