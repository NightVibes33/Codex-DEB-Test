name: iPhone Source UI State Inspect

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-package-sources-fast.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-package-sources-fast
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null
      - name: Inspect only UI/filter state
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set -u
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          echo '=== SILEO ACTIVE ROOTLESS CACHE ==='
          SDIR='/var/jb/var/mobile/Library/Caches/Sileo'
          if [ -d "$SDIR" ]; then
            ls -la "$SDIR" || true
            [ -d "$SDIR/Database" ] && { echo '--- SILEO DATABASE ---'; ls -la "$SDIR/Database" || true; }
            [ -f "$SDIR/Database/sileo.sqlite3" ] && echo "ACTIVE_SILEO_DB_BYTES=$(wc -c < "$SDIR/Database/sileo.sqlite3" | tr -d ' ')"
            [ -f "$SDIR/RepoHashCache.json" ] && { echo '--- RepoHashCache ---'; wc -c "$SDIR/RepoHashCache.json"; sed -n '1,80p' "$SDIR/RepoHashCache.json"; }
          else
            echo 'SILEO_ACTIVE_CACHE_ABSENT=1'
          fi

          echo '=== SILEO PREFS ==='
          for p in '/var/jb/var/mobile/Library/Preferences/org.coolstar.SileoStore.plist' '/var/mobile/Library/Preferences/org.coolstar.SileoStore.plist'; do
            [ -f "$p" ] || continue
            echo "PREF=$p"; ls -l "$p"
            if command -v plutil >/dev/null 2>&1; then plutil -p "$p" 2>&1 || true; else strings "$p" 2>/dev/null | head -n 160 || true; fi
          done

          echo '=== ZEBRA PREFS ==='
          for p in '/var/mobile/Library/Preferences/xyz.willy.Zebra.plist' '/var/jb/var/mobile/Library/Preferences/xyz.willy.Zebra.plist' '/var/mobile/Library/Preferences/xyz.willy.zebra.plist'; do
            [ -f "$p" ] || continue
            echo "PREF=$p"; ls -l "$p"
            if command -v plutil >/dev/null 2>&1; then plutil -p "$p" 2>&1 || true; else strings "$p" 2>/dev/null | head -n 200 || true; fi
          done

          echo '=== ZEBRA FILTER KEYS via defaults if available ==='
          if command -v defaults >/dev/null 2>&1; then
            sudo -u mobile defaults read xyz.willy.Zebra 2>&1 || true
            sudo -u mobile defaults read org.coolstar.SileoStore 2>&1 || true
          fi
          EOS
          } | timeout 60 sshpass -e ssh -o BatchMode=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" mobile@"$IPHONE_HOST" 'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' 2>&1 | tee ui-state.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-source-ui-state-${{ github.run_id }}
          path: ui-state.txt
          retention-days: 7
