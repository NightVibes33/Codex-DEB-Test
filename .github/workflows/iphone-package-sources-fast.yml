name: iPhone Sources Fast Diagnose

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-package-sources-fast.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-package-sources-fast
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null
      - name: Snapshot package manager state
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -H "$IPHONE_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            printf '%s\n' "$IPHONE_PASSWORD"
            cat <<'EOS'
          set -u
          export PATH=/var/jb/usr/bin:/var/jb/usr/sbin:/var/jb/bin:/var/jb/sbin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH
          ZDIR='/var/mobile/Library/Application Support/xyz.willy.Zebra'
          echo '=== SOURCE SNAPSHOT ==='
          dpkg-query -W -f='SILEO_VERSION=${Version}\n' org.coolstar.sileo 2>/dev/null || true
          dpkg-query -W -f='ZEBRA_VERSION=${Version}\n' xyz.willy.zebra 2>/dev/null || true
          echo '--- APT SOURCES ---'
          find /var/jb/etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -print 2>/dev/null | while IFS= read -r f; do echo "SOURCE_FILE=$f"; ls -l "$f"; sed -n '1,100p' "$f"; done
          echo '--- APT INDEX COUNTS ---'
          TOTAL=0; FILES=0
          for f in /var/jb/var/lib/apt/lists/*Packages*; do [ -f "$f" ] || continue; FILES=$((FILES+1)); c=$(grep -a '^Package:' "$f" 2>/dev/null | wc -l | tr -d ' '); TOTAL=$((TOTAL+c)); echo "APT_INDEX=$f PKGS=$c BYTES=$(wc -c < "$f" | tr -d ' ') MODE=$(stat -f %Sp "$f" 2>/dev/null || true)"; done
          echo "APT_INDEX_FILES=$FILES"
          echo "APT_PACKAGE_RECORDS=$TOTAL"
          echo "MOBILE_APT_RECORDS=$(sudo -u mobile sh -c 'grep -ah "^Package:" /var/jb/var/lib/apt/lists/*Packages* 2>/dev/null | wc -l | tr -d " "' 2>/dev/null || echo 0)"
          echo '--- SILEO FILES ---'
          find /var/mobile/Library -maxdepth 5 \( -iname '*sileo*' -o -iname '*coolstar*' \) -print 2>/dev/null | head -n 160 || true
          echo '--- ZEBRA STATE ---'
          ls -la "$ZDIR" 2>/dev/null || true
          echo 'ZEBRA_SOURCES_BEGIN'; sed -n '1,220p' "$ZDIR/sources.list" 2>/dev/null || true; echo 'ZEBRA_SOURCES_END'
          echo "ZEBRA_SOURCE_LINES=$(grep -Ec '^[[:space:]]*deb[[:space:]]+' "$ZDIR/sources.list" 2>/dev/null || true)"
          echo "ZEBRA_SOURCES_BYTES=$(wc -c < "$ZDIR/sources.list" 2>/dev/null | tr -d ' ')"
          echo "ZEBRA_LIST_FILES=$(find "$ZDIR/lists" -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')"
          ZTOTAL=0
          for f in "$ZDIR"/lists/*; do [ -f "$f" ] || continue; c=$(grep -a '^Package:' "$f" 2>/dev/null | wc -l | tr -d ' '); ZTOTAL=$((ZTOTAL+c)); echo "ZEBRA_INDEX=$(basename "$f") PKGS=$c BYTES=$(wc -c < "$f" | tr -d ' ')"; done
          echo "ZEBRA_PACKAGE_RECORDS=$ZTOTAL"
          [ -f "$ZDIR/zebra.db" ] && echo "ZEBRA_DB_BYTES=$(wc -c < "$ZDIR/zebra.db" | tr -d ' ')" || echo 'ZEBRA_DB=ABSENT'
          echo '--- RECENT PACKAGE MANAGER LOGS/CRASHES ---'
          ls -1t /var/mobile/Library/Logs/CrashReporter/*Zebra* /var/mobile/Library/Logs/CrashReporter/*Sileo* 2>/dev/null | head -n 20 || true
          EOS
          } | timeout 100 sshpass -e ssh -o BatchMode=no -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" mobile@"$IPHONE_HOST" 'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' 2>&1 | tee iphone-sources-fast.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-sources-fast-${{ github.run_id }}
          path: iphone-sources-fast.txt
          retention-days: 7
