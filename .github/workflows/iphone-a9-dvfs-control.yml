name: iPhone A9 DVFS Control Validation

on:
  push:
    branches: [main]
    paths:
      - triggers/iphone-a9-dvfs-control.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-a9-dvfs-control
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS 15 helper
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -Os -Wall -Wextra \
            tools/a9krw/a9krw.c \
            -o a9krw
          codesign --force --sign - a9krw
          file a9krw
          codesign -dvvv a9krw 2>&1 | tee codesign.txt
          CDHASH="$(sed -n 's/^CDHash=//p' codesign.txt | head -n1 | tr -d '[:space:]')"
          [[ "$CDHASH" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo "Invalid CDHash: $CDHASH"; exit 1; }
          printf '%s\n' "$CDHASH" > a9krw.cdhash
          echo "CDHASH_READY=1"
      - uses: actions/upload-artifact@v4
        with:
          name: a9krw-helper
          path: |
            a9krw
            a9krw.cdhash
          retention-days: 3

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: TAILSCALE_AUTHKEY-
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: a9krw-helper
          path: helper
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-client sshpass >/dev/null
      - name: Read, same-state write, then 250ms stock-P8 pulse
        env:
          IPHONE_HOST: 100.96.37.124
          IPHONE_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 helper/a9krw
          CDHASH="$(tr -d '[:space:]' < helper/a9krw.cdhash)"
          [[ "$CDHASH" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo 'RESULT=INVALID_CDHASH'; exit 22; }
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          reachable=0
          for n in 1 2 3 4 5 6; do
            if tailscale ping --timeout=5s "$IPHONE_HOST" >/dev/null 2>&1; then reachable=1; break; fi
            sleep 5
          done
          [ "$reachable" = 1 ] || { echo 'RESULT=PHONE_OFFLINE'; exit 20; }
          : > "$HOME/.ssh/known_hosts"
          for n in 1 2 3 4; do
            ssh-keyscan -T 8 -H "$IPHONE_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            [ -s "$HOME/.ssh/known_hosts" ] && break
            sleep 3
          done
          [ -s "$HOME/.ssh/known_hosts" ] || { echo 'RESULT=SSH_PORT_UNREACHABLE'; exit 21; }
          chmod 600 "$HOME/.ssh/known_hosts"

          SCP=(sshpass -e scp -o BatchMode=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          SSH=(sshpass -e ssh -o BatchMode=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" mobile@"$IPHONE_HOST")
          "${SCP[@]}" helper/a9krw mobile@"$IPHONE_HOST":/var/mobile/Documents/a9krw

          rootrun() {
            local cmd="$1"
            { printf '%s\n' "$IPHONE_PASSWORD"; printf '%s\n' "$cmd"; } \
              | "${SSH[@]}" 'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s'
          }

          rootrun "set -e; chmod 755 /var/mobile/Documents/a9krw; /var/jb/usr/bin/jbctl trustcache add '$CDHASH'; echo HELPER_TRUSTED=1"

          rootrun 'sysctl hw.model hw.machine kern.osversion; uname -a; /var/mobile/Documents/a9krw probe' | tee a9-readonly.txt
          grep -q 'hw.machine: iPhone8,1' a9-readonly.txt
          grep -q 'RELEASE_ARM64_S8000' a9-readonly.txt
          grep -q 'KRW_PLUGIN=' a9-readonly.txt
          grep -q 'cmd_rc=0' a9-readonly.txt
          grep -q 'status_rc=0' a9-readonly.txt

          python3 - <<'PY'
          import re
          s=open('a9-readonly.txt').read()
          rows=re.findall(r'PROBE .*?ps1=(\d+) ps2=(\d+).*?cur=(\d+) tgt=(\d+)',s)
          if not rows:
              raise SystemExit('NO_DVFS_ROWS')
          vals=[tuple(map(int,r)) for r in rows]
          print('PROBE_STATES=',vals)
          if any(max(v)>8 for v in vals):
              raise SystemExit('REFUSE_UNEXPECTED_PSTATE')
          PY

          rootrun '/var/mobile/Documents/a9krw same-state-write' | tee a9-same-state.txt
          grep -q 'PHYSWRITE_RC=0' a9-same-state.txt
          grep -q 'AFTER_SAME .*cmd_rc=0' a9-same-state.txt

          rootrun '/var/mobile/Documents/a9krw pulse-stock-max 250' | tee a9-stock-pulse.txt
          grep -q 'MAX_WRITE_RC=0' a9-stock-pulse.txt
          grep -q 'ROLLBACK_WRITE_RC=0' a9-stock-pulse.txt
          grep -q 'AFTER_ROLLBACK .*cmd_rc=0' a9-stock-pulse.txt
          echo 'RESULT=STOCK_DVFS_CONTROL_VALIDATED' | tee a9-result.txt
      - name: Publish sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/report reports
          {
            echo '# A9 DVFS stock control validation'
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            for f in a9-readonly.txt a9-same-state.txt a9-stock-pulse.txt a9-result.txt; do
              [ -f "$f" ] || continue
              echo "## $f"
              cat "$f"
              echo
            done
          } > /tmp/report/a9-dvfs-control-latest.txt
          sed -Ei '/(serial|unique.?chip|ecid|imei|mac.?address|wifi.?address|bluetooth.?address|CDHash)/Id' /tmp/report/a9-dvfs-control-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/report/a9-dvfs-control-latest.txt reports/a9-dvfs-control-latest.txt
          git add reports/a9-dvfs-control-latest.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update A9 DVFS control report'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a9-dvfs-control-${{ github.run_id }}
          path: |
            a9-readonly.txt
            a9-same-state.txt
            a9-stock-pulse.txt
            a9-result.txt
          if-no-files-found: ignore
          retention-days: 7
