name: Extract WallPics App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remote/extract-wallpics.sh'
      - '.github/workflows/extract-wallpics.yml'

permissions:
  contents: read

env:
  IPAD_HOST: '100.116.117.65'

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.resolve.outputs.environment_name }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT_ID: '18728387881'
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments?per_page=100" > environments.json
          python3 - "$TARGET_ENVIRONMENT_ID" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          target = int(sys.argv[1])
          for env in json.load(open('environments.json')).get('environments', []):
              if int(env.get('id', -1)) == target:
                  print('environment_name=' + env['name'])
                  raise SystemExit(0)
          raise SystemExit('environment-not-found')
          PY

  extract:
    needs: resolve-environment
    environment:
      name: ${{ needs.resolve-environment.outputs.environment_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Run WallPics extractor on iPad
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
          IPAD_PASSWORD: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_OPTS='-p 22 -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          connected=0
          for attempt in $(seq 1 40); do
            if sshpass -e ssh $SSH_OPTS mobile@"$IPAD_HOST" true >/dev/null 2>&1; then connected=1; break; fi
            sleep 3
          done
          [ "$connected" -eq 1 ]
          {
            printf '%s\n' "$IPAD_PASSWORD"
            cat remote/extract-wallpics.sh
          } | sshpass -e ssh $SSH_OPTS mobile@"$IPAD_HOST" 'SHELL_PATH="$(command -v sh || true)"; [ -n "$SHELL_PATH" ] || SHELL_PATH=/var/jb/bin/sh; sudo -k; exec sudo -S -p "" "$SHELL_PATH" -s' 2>&1 | tee wallpics-export.log
          grep -q 'WALLPICS_EXPORT=SUCCESS' wallpics-export.log

      - name: Copy archive from iPad
        env:
          SSHPASS: ${{ secrets.IPAD_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_OPTS='-P 22 -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          sshpass -e scp $SSH_OPTS mobile@"$IPAD_HOST":/var/mobile/Media/WallPics-full-app.zip ./WallPics-full-app.zip
          sshpass -e scp $SSH_OPTS mobile@"$IPAD_HOST":/var/mobile/Media/WallPics-export-info.txt ./WallPics-export-info.txt
          test -s WallPics-full-app.zip
          sha256sum WallPics-full-app.zip | tee WallPics-full-app.sha256
          ls -lh WallPics-full-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WallPics-full-app
          path: |
            WallPics-full-app.zip
            WallPics-export-info.txt
            WallPics-full-app.sha256
            wallpics-export.log
          if-no-files-found: error
          retention-days: 7
